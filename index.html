<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#030303"><title>Axilort Engine</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303}body{background:#030303;font-family:Arial,sans-serif}.screen{position:fixed;inset:0;background:#030303;display:flex;align-items:center;justify-content:center}.skeleton{width:42%;height:4px;border-radius:8px;background:#151515;overflow:hidden;box-shadow:0 0 10px rgba(229,9,20,.08)}.skeleton:after{content:"";display:block;width:35%;height:100%;background:#e50914;box-shadow:0 0 9px #e50914;animation:load .1s linear forwards}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(285%)}}#go{position:fixed;inset:0;border:0;background:transparent;cursor:pointer;z-index:2}.hide{opacity:0;pointer-events:none;transition:opacity .02s}</style></head><body><div class="screen" id="screen"><div class="skeleton"></div></div><button id="go" aria-label="Open Axilort Engine"></button><script>const target='https://axilort-engine.pages.dev/home',screenEl=document.getElementById('screen');setTimeout(()=>screenEl.classList.add('hide'),100);document.getElementById('go').onclick=async()=>{try{const el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape').catch(()=>{})}catch(e){}location.replace(target)};</script></body></html>
