<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Axilort Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050505;color:#fff;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:-40%;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.075),transparent 20%),radial-gradient(circle at 12% 90%,rgba(255,25,25,.09),transparent 25%),radial-gradient(circle at 92% 8%,rgba(255,255,255,.045),transparent 23%);filter:blur(55px);pointer-events:none}
.grid{position:fixed;inset:0;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(circle at center,#000,transparent 78%);-webkit-mask-image:radial-gradient(circle at center,#000,transparent 78%);pointer-events:none}
.shell{position:relative;width:min(92vw,760px);height:min(82vh,680px);margin:auto;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;text-align:center;padding:42px 28px;border:1px solid rgba(255,255,255,.11);border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 35px 110px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);overflow:hidden}
.shell:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;left:50%;top:30%;transform:translate(-50%,-50%);background:rgba(255,35,35,.045);filter:blur(80px);pointer-events:none}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.logo{width:112px;height:112px;object-fit:contain;border-radius:26px;margin-bottom:30px;filter:drop-shadow(0 20px 42px rgba(0,0,0,.55));animation:float 4s ease-in-out infinite}
.badge{height:27px;padding:0 12px;display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.045);color:rgba(255,255,255,.48);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:17px}.live{width:6px;height:6px;border-radius:50%;background:#55d98b;box-shadow:0 0 12px rgba(85,217,139,.8)}
h1{font-size:clamp(38px,8vw,64px);line-height:.98;font-weight:850;letter-spacing:-.055em;margin-bottom:17px;background:linear-gradient(180deg,#fff 5%,#c2c2c2 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:510px;color:rgba(255,255,255,.52);font-size:15px;line-height:1.65;margin-bottom:36px}
.open{display:flex;align-items:center;justify-content:center;gap:11px;min-width:225px;height:54px;padding:0 27px;border:1px solid rgba(255,255,255,.75);border-radius:15px;background:#fff;color:#080808;font-size:14px;font-weight:800;letter-spacing:.01em;cursor:pointer;box-shadow:0 14px 40px rgba(0,0,0,.38),0 0 0 1px rgba(255,255,255,.08);transition:transform .2s,box-shadow .2s,background .2s;-webkit-tap-highlight-color:transparent}.open svg{width:17px;height:17px}.open:hover{transform:translateY(-2px);box-shadow:0 20px 48px rgba(0,0,0,.5)}.open:active{transform:scale(.98)}
.footer{margin-top:22px;color:rgba(255,255,255,.25);font-size:10px;letter-spacing:.08em}
.loader{position:fixed;inset:0;z-index:100;background:#050505;display:grid;place-items:center;transition:opacity .4s ease,visibility .4s}.loader.hide{opacity:0;visibility:hidden}.loader img{width:72px;height:72px;object-fit:contain;animation:pulse 1.1s ease-in-out infinite}
#engine{position:fixed;inset:0;width:100%;height:100%;display:none;border:0;background:#050505;z-index:200}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pulse{0%,100%{transform:scale(.94);opacity:.62}50%{transform:scale(1);opacity:1}}
@media(max-width:520px){.shell{width:calc(100vw - 28px);height:calc(100vh - 70px);min-height:480px;border-radius:28px;padding:28px 20px}.logo{width:82px;height:82px;margin-bottom:23px}.badge{margin-bottom:14px}h1{font-size:clamp(34px,11vw,48px)}.sub{font-size:13px;max-width:330px;margin-bottom:28px}.open{width:100%;max-width:290px}.footer{margin-top:17px}}
</style>
</head>
<body>
<div class="grid"></div>
<div class="loader" id="loader"><img src="images/logo.png" alt=""></div>
<main class="shell" id="launcher">
<div class="content">
<img class="logo" src="images/logo.png" alt="Axilort Engine">
<div class="badge"><span class="live"></span>Ready to launch</div>
<h1>Axilort Engine</h1>
<p class="sub">Your creative workspace for building games, interactive experiences, and ambitious worlds.</p>
<button class="open" id="openEngine" type="button"><span>Open Engine</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m13 6 6 6-6 6"/></svg></button>
<div class="footer">AXILORT STUDIOS</div>
</div>
</main>
<iframe id="engine" src="about:blank" allow="fullscreen; autoplay; clipboard-read; clipboard-write" allowfullscreen></iframe>
<script>
const loader=document.getElementById('loader');
const launcher=document.getElementById('launcher');
const button=document.getElementById('openEngine');
const engine=document.getElementById('engine');
setTimeout(()=>loader.classList.add('hide'),550);
async function openEngine(){
 const target='https://axilort-engine.pages.dev/home';
 launcher.style.display='none';
 engine.src=target;
 engine.style.display='block';
 try{
   if(engine.requestFullscreen){await engine.requestFullscreen();}
   else if(engine.webkitRequestFullscreen){engine.webkitRequestFullscreen();}
   else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}
 }catch(e){
   try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();}catch(ignore){}
 }
}
button.addEventListener('click',openEngine);
</script>
</body>
</html>
