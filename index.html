<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
    }

    .skeleton {
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        #080808 25%,
        #151515 50%,
        #080808 75%
      );
      background-size: 200% 100%;
      animation: loading 0.25s linear infinite;
    }

    @keyframes loading {
      from {
        background-position: 200% 0;
      }
      to {
        background-position: -200% 0;
      }
    }
  </style>
</head>

<body>

  <div class="skeleton"></div>

  <script>
    const target = "https://axilort-engine.pages.dev/home";

    setTimeout(() => {
      // Try browser fullscreen
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      // Open the engine
      window.location.replace(target);
    }, 100);
  </script>

</body>
</html>
