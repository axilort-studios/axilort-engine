<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030303">
<title>Axilort Engine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#030303;color:#fff;-webkit-font-smoothing:antialiased}body:before{content:"";position:fixed;inset:-15%;background:radial-gradient(circle at 72% 48%,rgba(220,0,20,.2),transparent 29%),radial-gradient(circle at 25% 80%,rgba(170,0,10,.12),transparent 28%),linear-gradient(120deg,#020202,#090909 50%,#030303);filter:blur(35px)}.bg{position:fixed;inset:0;background:url("https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=2400&q=90") center/cover no-repeat;opacity:.24;filter:grayscale(1) contrast(1.25);transform:scale(1.04)}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#030303 0%,rgba(3,3,3,.78) 38%,rgba(3,3,3,.52) 68%,#030303 100%),linear-gradient(0deg,rgba(3,3,3,.72),transparent 45%,rgba(3,3,3,.55))}.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:56px 56px;opacity:.55}.vignette{position:fixed;inset:0;box-shadow:inset 0 0 180px #000}.page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.card{position:relative;width:min(900px,88vw);min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 30px 45px;border:1px solid rgba(255,255,255,.1);border-radius:30px;background:linear-gradient(145deg,rgba(10,10,10,.78),rgba(5,5,5,.54));box-shadow:0 45px 130px rgba(0,0,0,.72),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden}.card:before{content:"";position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,#e50914,transparent);box-shadow:0 0 25px #e50914}.red-orb{position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(229,9,20,.1);filter:blur(90px);top:-170px;right:-90px}.logo{width:76px;height:76px;object-fit:contain;border-radius:18px;margin-bottom:24px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.7)) drop-shadow(0 0 20px rgba(229,9,20,.15))}.tiny{font-size:8px;line-height:1;letter-spacing:.38em;text-transform:uppercase;color:#737377;font-weight:800;margin-bottom:15px}h1{font-size:clamp(44px,7vw,78px);font-weight:900;letter-spacing:-.07em;line-height:.9;margin-bottom:20px;background:linear-gradient(180deg,#fff,#c9c9c9);-webkit-background-clip:text;background-clip:text;color:transparent}h1 span{color:#e50914;-webkit-text-fill-color:#e50914}.copy{max-width:570px;color:#89898d;font-size:13px;line-height:1.75;margin-bottom:27px}.details{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:31px;color:#5f5f63;font-size:8px;letter-spacing:.18em;text-transform:uppercase}.details b{color:#a2a2a5;font-weight:700}.sep{width:3px;height:3px;background:#e50914;border-radius:50%;box-shadow:0 0 7px #e50914}.open{position:relative;width:245px;height:54px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:#e50914;color:#fff;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 17px 45px rgba(229,9,20,.2);overflow:hidden;transition:.2s}.open:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.3) 50%,transparent 75%);transform:translateX(-130%);transition:.7s}.open:hover:before{transform:translateX(130%)}.open:hover{transform:translateY(-2px);box-shadow:0 23px 55px rgba(229,9,20,.3);background:#f00f1b}.open:active{transform:scale(.98)}.footer{position:absolute;bottom:25px;left:35px;right:35px;display:flex;justify-content:space-between;color:#414145;font-size:7px;letter-spacing:.18em;text-transform:uppercase}.footer b{color:#77777b}.loader{position:fixed;z-index:10;inset:0;background:#030303;display:grid;place-items:center;transition:.45s}.loader.hide{opacity:0;visibility:hidden}.loader img{width:60px;height:60px;object-fit:contain;animation:pulse 1s infinite;filter:drop-shadow(0 0 25px rgba(229,9,20,.35))}@keyframes pulse{50%{transform:scale(1.07);opacity:1}}@media(max-width:700px){.bg{opacity:.18}.card{width:94vw;min-height:520px;padding:45px 22px 40px;border-radius:24px}.logo{width:64px;height:64px;margin-bottom:20px}.tiny{font-size:7px}h1{font-size:clamp(40px,12vw,58px)}.copy{font-size:11px;max-width:350px;margin-bottom:22px}.details{font-size:7px;gap:10px;margin-bottom:25px}.open{width:min(270px,90vw);height:52px;font-size:10px}.footer{left:20px;right:20px;bottom:17px;font-size:6px}}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div><div class="vignette"></div><div class="loader" id="loader"><img src="images/logo.png" alt=""></div>
<main class="page"><section class="card"><div class="red-orb"></div><img class="logo" src="images/logo.png" alt="Axilort Engine"><div class="tiny">Axilort Studios</div><h1>Axilort <span>Engine</span></h1><p class="copy">A complete creative environment for building ambitious games, interactive experiences, and living worlds. Create freely, shape every detail, and turn your ideas into something playable.</p><div class="details"><b>Create</b><i class="sep"></i><b>Design</b><i class="sep"></i><b>Script</b><i class="sep"></i><b>Build</b><i class="sep"></i><b>Play</b></div><button class="open" id="open">Open Axilort Engine</button><div class="footer"><span>AXILORT ENGINE</span><span><b>READY</b> · 2026</span></div></section></main>
<script>const loader=document.getElementById('loader'),open=document.getElementById('open');setTimeout(()=>loader.classList.add('hide'),550);open.addEventListener('click',async()=>{try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.documentElement.webkitRequestFullscreen)document.documentElement.webkitRequestFullscreen()}catch(e){}window.location.replace('https://axilort-engine.pages.dev/home')});</script>
</body>
</html>
