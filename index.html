<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axilort Engine</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #fullscreenBtn {
      position: fixed;
      inset: 0;
      margin: auto;
      width: 220px;
      height: 55px;
      border: 0;
      border-radius: 14px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 0 30px rgba(255,255,255,.12);
    }

    #fullscreenBtn.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <iframe
    id="engine"
    src="https://axilort-engine.pages.dev"
    allow="fullscreen; autoplay"
    allowfullscreen>
  </iframe>

  <button id="fullscreenBtn" onclick="openFullscreen()">
    Open Axilort Engine
  </button>

  <script>
    const iframe = document.getElementById("engine");
    const button = document.getElementById("fullscreenBtn");

    function openFullscreen() {
      button.classList.add("hidden");

      if (iframe.requestFullscreen) {
        iframe.requestFullscreen().catch(() => {});
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      iframe.focus();
    }

    // Try automatically
    window.addEventListener("load", () => {
      setTimeout(() => {
        openFullscreen();
      }, 300);
    });

    // Hide button when fullscreen succeeds
    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement) {
        button.classList.add("hidden");
      } else {
        button.classList.remove("hidden");
      }
    });
  </script>

</body>
</html>
