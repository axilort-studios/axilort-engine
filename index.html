<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#030303"><title>Axilort Engine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#030303;color:#fff;-webkit-font-smoothing:antialiased}.bg{position:fixed;inset:0;background:url("https://axilort-studios.pages.dev/images/background.webp") center/cover no-repeat}.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.04)}.red{position:fixed;inset:0;background:radial-gradient(circle at 50% 55%,rgba(229,9,20,.025),transparent 52%);pointer-events:none}.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.006) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.006) 1px,transparent 1px);background-size:64px 64px;opacity:.12}.vignette{position:fixed;inset:0;box-shadow:inset 0 0 55px rgba(0,0,0,.2)}.page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}.panel{position:relative;width:min(650px,78vw);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(255,255,255,.08);border-radius:21px;background:rgba(5,5,5,.08);box-shadow:0 20px 55px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);overflow:hidden}.panel:before{content:"";position:absolute;top:0;left:25%;right:25%;height:1px;background:linear-gradient(90deg,transparent,#e50914,transparent);box-shadow:0 0 9px rgba(229,9,20,.35)}.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;padding:25px}.mark{width:47px;height:47px;object-fit:contain;border-radius:10px;margin-bottom:12px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.38))}.studio{font-size:8px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:#aaa;margin-bottom:9px}.studio b{color:#e50914}h1{font-size:clamp(40px,6vw,60px);line-height:.95;letter-spacing:-.06em;font-weight:900;margin-bottom:12px;color:#fff}h1 span{color:#e50914}.copy{font-size:10.5px;line-height:1.65;color:rgba(255,255,255,.8);max-width:455px;margin-bottom:16px}.details{display:flex;gap:11px;align-items:center;color:rgba(255,255,255,.58);font-size:7px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}.details i{width:2px;height:2px;border-radius:50%;background:#e50914}.open{height:42px;width:200px;border:1px solid rgba(255,255,255,.17);border-radius:9px;background:#e50914;color:#fff;font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 24px rgba(229,9,20,.14);transition:.18s}.open:hover{transform:translateY(-1px);background:#ed101b;box-shadow:0 13px 29px rgba(229,9,20,.21)}.open:active{transform:scale(.98)}.status{margin-top:9px;font-size:6px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.44)}.status:before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:#e50914;box-shadow:0 0 5px #e50914;margin-right:5px}.loader{position:fixed;z-index:20;inset:0;background:#030303;display:grid;place-items:center;transition:.4s}.loader.hide{opacity:0;visibility:hidden}.loader img{width:45px;height:45px;object-fit:contain;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.04);opacity:1}}@media(max-width:700px){.panel{width:92vw;border-radius:17px}.content{padding:15px}.mark{width:37px;height:37px;margin-bottom:8px}.studio{font-size:5.5px;margin-bottom:6px}h1{font-size:clamp(34px,9.7vw,47px);margin-bottom:8px}.copy{font-size:8.2px;max-width:330px;margin-bottom:10px}.details{font-size:6px;gap:7px;margin-bottom:11px}.open{width:168px;height:35px;font-size:7.2px}.status{font-size:4.7px;margin-top:7px}}@media(orientation:portrait) and (max-width:700px){.page{width:100vh;height:100vw;left:50%;top:50%;inset:auto;transform:translate(-50%,-50%) rotate(90deg)}.panel{width:92vh;aspect-ratio:16/9}.bg{width:100vh;height:100vw;inset:50% auto auto 50%;transform:translate(-50%,-50%) rotate(90deg)}.red,.grid,.vignette{width:100vh;height:100vw;inset:50% auto auto 50%;transform:translate(-50%,-50%) rotate(90deg)}}
</style>
</head>
<body><div class="bg"></div><div class="red"></div><div class="grid"></div><div class="vignette"></div><div class="loader" id="loader"><img src="images/logo.png" alt=""></div><main class="page"><section class="panel"><div class="content"><img class="mark" src="images/logo.png" alt="Axilort Engine"><div class="studio">Axilort <b>Studios</b></div><h1>Axilort <span>Engine</span></h1><p class="copy">Create powerful games, shape immersive worlds, and bring your ideas to life with Axilort Engine.</p><div class="details"><b>Create</b><i></i><b>Design</b><i></i><b>Script</b><i></i><b>Build</b><i></i><b>Play</b></div><button class="open" id="open">Open Axilort Engine</button><div class="status">Ready</div></div></section></main><script>const loader=document.getElementById('loader'),open=document.getElementById('open');setTimeout(()=>loader.classList.add('hide'),500);open.addEventListener('click',async()=>{try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.documentElement.webkitRequestFullscreen)document.documentElement.webkitRequestFullscreen();if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape').catch(()=>{})}catch(e){}setTimeout(()=>window.location.replace('https://axilort-engine.pages.dev/home'),50)});</script></body></html>
