<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#030303"><title>Axilort Engine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#030303;color:#fff;-webkit-font-smoothing:antialiased}.bg{position:fixed;inset:0;background:url("https://axilort-studios.pages.dev/images/background.webp") center/cover no-repeat}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.48),rgba(0,0,0,.06) 50%,rgba(0,0,0,.36)),linear-gradient(0deg,rgba(0,0,0,.3),transparent 50%,rgba(0,0,0,.18))}.red{position:fixed;inset:0;background:radial-gradient(circle at 50% 58%,rgba(229,9,20,.07),transparent 42%);pointer-events:none}.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);background-size:64px 64px;opacity:.22;pointer-events:none}.vignette{position:fixed;inset:0;box-shadow:inset 0 0 105px rgba(0,0,0,.38);pointer-events:none}.page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}.panel{position:relative;width:min(620px,78vw);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(255,255,255,.11);border-radius:20px;background:rgba(3,3,4,.16);box-shadow:0 25px 75px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow:hidden}.panel:before{content:"";position:absolute;top:0;left:28%;right:28%;height:1px;background:linear-gradient(90deg,transparent,#e50914,transparent);box-shadow:0 0 13px rgba(229,9,20,.5)}.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;padding:20px}.mark{width:35px;height:35px;object-fit:contain;border-radius:8px;margin-bottom:9px;filter:drop-shadow(0 7px 15px rgba(0,0,0,.5))}.studio{font-size:5px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:#a5a5a8;margin-bottom:7px}.studio b{color:#e50914}h1{font-size:clamp(28px,4.5vw,45px);line-height:.95;letter-spacing:-.06em;font-weight:900;margin-bottom:8px;background:linear-gradient(180deg,#fff,#d4d4d4);-webkit-background-clip:text;background-clip:text;color:transparent}h1 span{color:#e50914;-webkit-text-fill-color:#e50914}.copy{font-size:6.5px;line-height:1.65;color:rgba(255,255,255,.78);max-width:380px;margin-bottom:11px}.details{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.68);font-size:5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin-bottom:14px}.details i{width:2px;height:2px;border-radius:50%;background:#e50914;box-shadow:0 0 5px #e50914}.open{height:35px;width:165px;border:1px solid rgba(255,255,255,.24);border-radius:8px;background:#e50914;color:#fff;font-size:7px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 24px rgba(229,9,20,.15);transition:.2s}.open:hover{transform:translateY(-1px);background:#f00e19;box-shadow:0 14px 30px rgba(229,9,20,.22)}.open:active{transform:scale(.98)}.status{margin-top:7px;font-size:4.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55)}.status:before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:#e50914;box-shadow:0 0 5px #e50914;margin-right:4px}.loader{position:fixed;z-index:20;inset:0;background:#030303;display:grid;place-items:center;transition:.4s}.loader.hide{opacity:0;visibility:hidden}.loader img{width:44px;height:44px;object-fit:contain;animation:pulse 1s infinite;filter:drop-shadow(0 0 16px rgba(229,9,20,.25))}@keyframes pulse{50%{transform:scale(1.04);opacity:1}}@media(max-width:700px){.panel{width:94vw;border-radius:17px}.content{padding:13px}.mark{width:29px;height:29px;margin-bottom:6px}.studio{font-size:4px;margin-bottom:5px}h1{font-size:clamp(24px,8vw,36px);margin-bottom:5px}.copy{font-size:5.5px;max-width:310px;margin-bottom:7px}.details{font-size:4px;gap:6px;margin-bottom:9px}.open{width:145px;height:30px;font-size:6px}.status{font-size:3.7px;margin-top:5px}}
</style>
</head>
<body>
<div class="bg"></div><div class="red"></div><div class="grid"></div><div class="vignette"></div><div class="loader" id="loader"><img src="images/logo.png" alt=""></div>
<main class="page"><section class="panel"><div class="content"><img class="mark" src="images/logo.png" alt="Axilort Engine"><div class="studio">Axilort <b>Studios</b></div><h1>Axilort <span>Engine</span></h1><p class="copy">Create powerful games, shape immersive worlds, and bring your ideas to life with Axilort Engine.</p><div class="details"><b>Create</b><i></i><b>Design</b><i></i><b>Script</b><i></i><b>Build</b><i></i><b>Play</b></div><button class="open" id="open">Open Axilort Engine</button><div class="status">Ready</div></div></section></main>
<script>const loader=document.getElementById('loader'),open=document.getElementById('open');setTimeout(()=>loader.classList.add('hide'),550);open.addEventListener('click',async()=>{try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.documentElement.webkitRequestFullscreen)document.documentElement.webkitRequestFullscreen()}catch(e){}window.location.replace('https://axilort-engine.pages.dev/home')});</script>
</body>
</html>
