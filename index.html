<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#030303"><title>Axilort Engine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#030303;color:#fff;-webkit-font-smoothing:antialiased}.bg{position:fixed;inset:0;background:url("https://axilort-studios.pages.dev/images/background.webp") center/cover no-repeat}.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.12)}.red{position:fixed;inset:0;background:radial-gradient(circle at 50% 55%,rgba(229,9,20,.06),transparent 48%);pointer-events:none}.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:64px 64px;opacity:.3}.vignette{position:fixed;inset:0;box-shadow:inset 0 0 100px rgba(0,0,0,.45)}.page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}.panel{position:relative;width:min(650px,78vw);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(255,255,255,.09);border-radius:21px;background:rgba(5,5,5,.24);box-shadow:0 25px 75px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:hidden}.panel:before{content:"";position:absolute;top:0;left:25%;right:25%;height:1px;background:linear-gradient(90deg,transparent,#e50914,transparent);box-shadow:0 0 14px rgba(229,9,20,.55)}.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;padding:25px}.mark{width:42px;height:42px;object-fit:contain;border-radius:10px;margin-bottom:12px;filter:drop-shadow(0 7px 18px rgba(0,0,0,.5))}.studio{font-size:6px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:#a0a0a3;margin-bottom:9px}.studio b{color:#e50914}h1{font-size:clamp(32px,5.2vw,52px);line-height:.95;letter-spacing:-.06em;font-weight:900;margin-bottom:11px;color:#fff}h1 span{color:#e50914}.copy{font-size:8px;line-height:1.6;color:rgba(255,255,255,.68);max-width:430px;margin-bottom:15px}.details{display:flex;gap:10px;align-items:center;color:rgba(255,255,255,.48);font-size:6px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:17px}.details i{width:2px;height:2px;border-radius:50%;background:#e50914}.open{height:39px;width:190px;border:1px solid rgba(255,255,255,.16);border-radius:9px;background:#e50914;color:#fff;font-size:8px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 28px rgba(229,9,20,.18);transition:.18s}.open:hover{transform:translateY(-1px);background:#ed101b;box-shadow:0 14px 32px rgba(229,9,20,.25)}.open:active{transform:scale(.98)}.status{margin-top:10px;font-size:5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.38)}.status:before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:#e50914;box-shadow:0 0 6px #e50914;margin-right:5px}.loader{position:fixed;z-index:20;inset:0;background:#030303;display:grid;place-items:center;transition:.4s}.loader.hide{opacity:0;visibility:hidden}.loader img{width:45px;height:45px;object-fit:contain;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.04);opacity:1}}@media(max-width:700px){.panel{width:92vw;border-radius:17px}.content{padding:15px}.mark{width:31px;height:31px;margin-bottom:8px}.studio{font-size:4.5px;margin-bottom:6px}h1{font-size:clamp(27px,8.5vw,40px);margin-bottom:7px}.copy{font-size:6.5px;max-width:330px;margin-bottom:9px}.details{font-size:4.5px;gap:7px;margin-bottom:10px}.open{width:155px;height:33px;font-size:6.5px}.status{font-size:4px;margin-top:7px}}
</style>
</head>
<body><div class="bg"></div><div class="red"></div><div class="grid"></div><div class="vignette"></div><div class="loader" id="loader"><img src="images/logo.png" alt=""></div><main class="page"><section class="panel"><div class="content"><img class="mark" src="images/logo.png" alt="Axilort Engine"><div class="studio">Axilort <b>Studios</b></div><h1>Axilort <span>Engine</span></h1><p class="copy">Create powerful games, shape immersive worlds, and bring your ideas to life with Axilort Engine.</p><div class="details"><b>Create</b><i></i><b>Design</b><i></i><b>Script</b><i></i><b>Build</b><i></i><b>Play</b></div><button class="open" id="open">Open Axilort Engine</button><div class="status">Ready</div></div></section></main><script>const loader=document.getElementById('loader'),open=document.getElementById('open');setTimeout(()=>loader.classList.add('hide'),500);open.addEventListener('click',async()=>{try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.documentElement.webkitRequestFullscreen)document.documentElement.webkitRequestFullscreen()}catch(e){}setTimeout(()=>window.location.replace('https://axilort-engine.pages.dev/home'),50)});</script></body></html>
