<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#030303"><title>Axilort</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303}#loader{position:fixed;inset:0;background:#030303;display:flex;align-items:center;justify-content:center;z-index:10}.bar{width:42px;height:3px;background:#141414;border-radius:9px;overflow:hidden}.bar:after{content:"";display:block;width:100%;height:100%;background:#e50914;transform:translateX(-100%);animation:load .1s linear forwards;box-shadow:0 0 7px #e50914}@keyframes load{to{transform:translateX(0)}}@media(orientation:portrait){body{width:100vh;height:100vw;position:absolute;top:100vh;left:0;transform:rotate(90deg);transform-origin:top left}}</style></head><body><div id="loader"><div class="bar"></div></div><script>const target='https://axilort-engine.pages.dev/home';async function launch(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch(e){}location.replace(target)}setTimeout(launch,100);</script></body></html>
