<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#030303"><title>Axilort Engine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#030303;color:#fff;-webkit-font-smoothing:antialiased}.bg{position:fixed;inset:0;background:url("https://axilort-studios.pages.dev/images/background.webp") center center/cover no-repeat;transform:scale(1.02);filter:saturate(.82) contrast(1.08)}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.5) 50%,rgba(0,0,0,.78)),linear-gradient(0deg,rgba(0,0,0,.72),transparent 48%,rgba(0,0,0,.48));}.red{position:fixed;inset:0;background:radial-gradient(circle at 50% 56%,transparent 0,rgba(150,0,12,.09) 30%,transparent 62%);pointer-events:none}.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:64px 64px;opacity:.45;mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}.vignette{position:fixed;inset:0;box-shadow:inset 0 0 170px #000}.page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}.panel{position:relative;width:min(700px,82vw);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(255,255,255,.1);border-radius:25px;background:rgba(4,4,5,.42);box-shadow:0 35px 110px rgba(0,0,0,.65),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);overflow:hidden}.panel:before{content:"";position:absolute;top:0;left:22%;right:22%;height:1px;background:linear-gradient(90deg,transparent,#e50914,transparent);box-shadow:0 0 20px rgba(229,9,20,.7)}.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;padding:30px}.mark{width:49px;height:49px;object-fit:contain;border-radius:12px;margin-bottom:16px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.65))}.studio{font-size:7px;font-weight:800;letter-spacing:.38em;text-transform:uppercase;color:#858589;margin-bottom:12px}.studio b{color:#e50914}h1{font-size:clamp(38px,6vw,62px);line-height:.95;letter-spacing:-.065em;font-weight:900;margin-bottom:14px;background:linear-gradient(180deg,#fff,#c8c8c8);-webkit-background-clip:text;background-clip:text;color:transparent}h1 span{color:#e50914;-webkit-text-fill-color:#e50914}.copy{font-size:10px;line-height:1.7;color:rgba(255,255,255,.5);max-width:480px;margin-bottom:19px}.details{display:flex;gap:13px;align-items:center;color:#77777b;font-size:7px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;margin-bottom:22px}.details i{width:3px;height:3px;border-radius:50%;background:#e50914;box-shadow:0 0 7px #e50914}.open{height:45px;width:205px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#e50914;color:#fff;font-size:9px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;box-shadow:0 14px 34px rgba(229,9,20,.22);transition:.2s;position:relative;overflow:hidden}.open:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 28%,rgba(255,255,255,.3),transparent 72%);transform:translateX(-130%);transition:.65s}.open:hover:after{transform:translateX(130%)}.open:hover{transform:translateY(-2px);background:#f00e19;box-shadow:0 18px 42px rgba(229,9,20,.32)}.open:active{transform:scale(.98)}.status{margin-top:13px;font-size:6px;letter-spacing:.2em;text-transform:uppercase;color:#515155}.status:before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:#e50914;box-shadow:0 0 8px #e50914;margin-right:6px}.loader{position:fixed;z-index:20;inset:0;background:#030303;display:grid;place-items:center;transition:.45s}.loader.hide{opacity:0;visibility:hidden}.loader img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 0 22px rgba(229,9,20,.35));animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.06);opacity:1}}@media(max-width:700px){.page{padding:12px}.panel{width:94vw;aspect-ratio:16/9;min-height:0;border-radius:20px}.content{padding:18px}.mark{width:38px;height:38px;margin-bottom:11px}.studio{font-size:5.5px;margin-bottom:8px}h1{font-size:clamp(31px,10vw,47px);margin-bottom:10px}.copy{font-size:8px;max-width:350px;margin-bottom:12px}.details{font-size:5.5px;gap:8px;margin-bottom:14px}.open{width:175px;height:38px;font-size:7.5px}.status{font-size:5px;margin-top:9px}}
</style>
</head>
<body>
<div class="bg"></div><div class="red"></div><div class="grid"></div><div class="vignette"></div><div class="loader" id="loader"><img src="images/logo.png" alt=""></div>
<main class="page"><section class="panel"><div class="content"><img class="mark" src="images/logo.png" alt="Axilort Engine"><div class="studio">Axilort <b>Studios</b></div><h1>Axilort <span>Engine</span></h1><p class="copy">Create powerful games, shape immersive worlds, and bring your ideas to life with Axilort Engine. Everything begins with your imagination.</p><div class="details"><b>Create</b><i></i><b>Design</b><i></i><b>Script</b><i></i><b>Build</b><i></i><b>Play</b></div><button class="open" id="open">Open Axilort Engine</button><div class="status">Ready</div></div></section></main>
<script>const loader=document.getElementById('loader'),open=document.getElementById('open');setTimeout(()=>loader.classList.add('hide'),550);open.addEventListener('click',async()=>{try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.documentElement.webkitRequestFullscreen)document.documentElement.webkitRequestFullscreen()}catch(e){}window.location.replace('https://axilort-engine.pages.dev/home')});</script>
</body>
</html>
