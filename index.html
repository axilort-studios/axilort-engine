<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Axilort Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050505;color:#fff;display:grid;place-items:center}
body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.08),transparent 24%),radial-gradient(circle at 18% 85%,rgba(255,40,40,.08),transparent 25%),radial-gradient(circle at 85% 15%,rgba(255,255,255,.045),transparent 22%);filter:blur(30px);pointer-events:none}
.page{position:relative;width:min(92vw,720px);min-height:min(78vh,620px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 22px;border:1px solid rgba(255,255,255,.1);border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));box-shadow:0 30px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);overflow:hidden}
.page:after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(255,35,35,.055);filter:blur(70px);top:-170px;right:-120px;pointer-events:none}
.logo{width:104px;height:104px;object-fit:contain;border-radius:24px;margin-bottom:28px;filter:drop-shadow(0 18px 35px rgba(0,0,0,.5));animation:float 4s ease-in-out infinite}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.48);font-weight:700;margin-bottom:13px}
h1{font-size:clamp(34px,8vw,58px);line-height:1;font-weight:800;letter-spacing:-.045em;margin-bottom:14px;background:linear-gradient(180deg,#fff,#bdbdbd);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:480px;color:rgba(255,255,255,.55);font-size:15px;line-height:1.6;margin-bottom:34px}
.open{position:relative;border:0;min-width:210px;padding:15px 25px;border-radius:14px;background:#fff;color:#070707;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 12px 35px rgba(0,0,0,.35);transition:transform .2s ease,box-shadow .2s ease,background .2s ease;-webkit-tap-highlight-color:transparent}
.open:hover{transform:translateY(-2px);box-shadow:0 18px 42px rgba(0,0,0,.5);background:#f2f2f2}.open:active{transform:translateY(0) scale(.98)}
.status{display:flex;align-items:center;gap:8px;margin-top:20px;color:rgba(255,255,255,.34);font-size:11px}.dot{width:6px;height:6px;border-radius:50%;background:#55d98b;box-shadow:0 0 10px rgba(85,217,139,.7)}
.loader{position:fixed;inset:0;background:#050505;z-index:10;display:grid;place-items:center;transition:opacity .35s ease,visibility .35s ease}.loader.hide{opacity:0;visibility:hidden}.loader-logo{width:74px;height:74px;object-fit:contain;animation:pulse 1.1s ease-in-out infinite}
#engine{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#050505;z-index:20}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{transform:scale(.94);opacity:.65}50%{transform:scale(1);opacity:1}}
@media(max-width:520px){.page{min-height:70vh;border-radius:26px;padding:30px 20px}.logo{width:82px;height:82px;margin-bottom:22px}.sub{font-size:14px;margin-bottom:28px}.open{width:100%;max-width:280px}}
</style>
</head>
<body>
<div class="loader" id="loader"><img class="loader-logo" src="images/logo.png" alt=""></div>
<main class="page">
<img class="logo" src="images/logo.png" alt="Axilort Engine">
<div class="eyebrow">Game Development Platform</div>
<h1>Axilort Engine</h1>
<p class="sub">A professional workspace for creating, building, and bringing your games to life.</p>
<button class="open" id="openEngine" type="button">Open Engine</button>
<div class="status"><span class="dot"></span>Engine ready</div>
</main>
<iframe id="engine" src="about:blank" allow="fullscreen; autoplay; clipboard-read; clipboard-write" allowfullscreen></iframe>
<script>
const loader=document.getElementById('loader');
const button=document.getElementById('openEngine');
const engine=document.getElementById('engine');
setTimeout(()=>loader.classList.add('hide'),450);
button.addEventListener('click',async()=>{
  const target='https://axilort-engine.pages.dev/home';
  engine.src=target;
  engine.style.display='block';
  document.querySelector('.page').style.display='none';
  try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();}catch(e){}
});
</script>
</body>
</html>
