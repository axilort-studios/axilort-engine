<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<title>Axilort Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#030303;color:#fff;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.055),transparent 22%),radial-gradient(circle at 8% 100%,rgba(235,15,15,.16),transparent 28%),radial-gradient(circle at 100% 0,rgba(255,35,35,.07),transparent 24%);filter:blur(55px);pointer-events:none}
.grid{position:fixed;inset:0;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(circle,#000 0,transparent 76%);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 76%);pointer-events:none}
.vignette{position:fixed;inset:0;box-shadow:inset 0 0 180px rgba(0,0,0,.85);pointer-events:none}
.shell{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(91vw,760px);min-height:min(76vh,650px);display:flex;align-items:center;justify-content:center;padding:42px 28px;border:1px solid rgba(255,255,255,.11);border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.018));box-shadow:0 40px 120px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);overflow:hidden}
.shell:before{content:"";position:absolute;width:440px;height:440px;left:50%;top:30%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(220,15,15,.08);filter:blur(85px);pointer-events:none}
.edge{position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,45,45,.8),transparent);box-shadow:0 0 22px rgba(255,25,25,.3)}
.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo-wrap{position:relative;margin-bottom:27px}.logo-wrap:after{content:"";position:absolute;inset:14px;border-radius:50%;background:rgba(230,20,20,.18);filter:blur(22px);z-index:-1}
.logo{width:108px;height:108px;object-fit:contain;border-radius:25px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6));animation:float 4s ease-in-out infinite}
.brand{font-size:10px;font-weight:800;letter-spacing:.28em;color:rgba(255,255,255,.42);text-transform:uppercase;margin-bottom:13px}
h1{font-size:clamp(39px,8vw,64px);line-height:.96;font-weight:850;letter-spacing:-.055em;margin-bottom:18px;background:linear-gradient(180deg,#fff 5%,#c7c7c7 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:500px;color:rgba(255,255,255,.52);font-size:15px;line-height:1.65;margin-bottom:35px}
.launch{position:relative;width:235px;height:56px;border:1px solid rgba(255,255,255,.86);border-radius:15px;background:linear-gradient(135deg,#fff,#e9e9e9);color:#050505;font-size:14px;font-weight:850;letter-spacing:.01em;cursor:pointer;box-shadow:0 18px 45px rgba(0,0,0,.45),0 0 0 4px rgba(255,30,30,.055);transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;-webkit-tap-highlight-color:transparent;overflow:hidden}
.launch:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.8) 50%,transparent 75%);transform:translateX(-120%);transition:transform .65s ease}.launch:hover:before{transform:translateX(120%)}.launch:hover{transform:translateY(-2px);box-shadow:0 22px 55px rgba(0,0,0,.55),0 0 30px rgba(255,25,25,.12)}.launch:active{transform:scale(.98)}
.launch span{position:relative;z-index:1}
.meta{display:flex;align-items:center;gap:8px;margin-top:19px;color:rgba(255,255,255,.27);font-size:10px;letter-spacing:.1em;text-transform:uppercase}.dot{width:6px;height:6px;border-radius:50%;background:#ff3030;box-shadow:0 0 12px rgba(255,30,30,.75)}
.loader{position:fixed;inset:0;z-index:20;background:#030303;display:grid;place-items:center;transition:opacity .45s ease,visibility .45s ease}.loader.hide{opacity:0;visibility:hidden}.loader img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 0 24px rgba(255,25,25,.22));animation:pulse 1.05s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pulse{0%,100%{transform:scale(.93);opacity:.62}50%{transform:scale(1);opacity:1}}
@media(max-width:520px){.shell{width:calc(100vw - 26px);min-height:calc(100vh - 90px);border-radius:28px;padding:30px 20px}.logo{width:82px;height:82px}.logo-wrap{margin-bottom:21px}h1{font-size:clamp(35px,11vw,49px)}.sub{font-size:13px;max-width:330px;margin-bottom:28px}.launch{width:min(280px,100%);height:54px}.meta{margin-top:17px}}
</style>
</head>
<body>
<div class="grid"></div><div class="vignette"></div>
<div class="loader" id="loader"><img src="images/logo.png" alt=""></div>
<main class="shell" id="launcher">
<div class="edge"></div>
<div class="content">
<div class="logo-wrap"><img class="logo" src="images/logo.png" alt="Axilort Engine"></div>
<div class="brand">Axilort Studios</div>
<h1>Axilort Engine</h1>
<p class="sub">A focused game creation environment built to turn ideas into playable worlds.</p>
<button class="launch" id="launch" type="button"><span>Launch Engine</span></button>
<div class="meta"><span class="dot"></span><span>Ready</span></div>
</div>
</main>
<script>
const loader=document.getElementById('loader');
const launch=document.getElementById('launch');
setTimeout(()=>loader.classList.add('hide'),550);
launch.addEventListener('click',async()=>{
  const url='https://axilort-engine.pages.dev/home';
  launch.disabled=true;
  try{
    if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    else if(document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
  }catch(e){}
  window.location.replace(url);
});
</script>
</body>
</html>
