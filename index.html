<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axilort Engine</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{background:url('https://axilort-studios.pages.dev/images/background.webp') center/cover no-repeat;font-family:Arial,sans-serif}#go{position:fixed;inset:0;border:0;background:transparent;cursor:pointer}#load{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:5;transition:opacity .05s}#load img{width:45px;height:45px;object-fit:contain}</style></head><body><div id="load"><img src="images/logo.png" alt=""></div><button id="go" aria-label="Open Axilort Engine"></button><script>const target='https://axilort-engine.pages.dev/home';setTimeout(()=>{document.getElementById('load').style.opacity='0';setTimeout(()=>document.getElementById('load').remove(),50)},100);document.getElementById('go').onclick=async()=>{try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape').catch(()=>{})}catch(e){}location.href=target};</script></body></html>
