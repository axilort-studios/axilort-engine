<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Axilort Engine</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{background:url('https://axilort-studios.pages.dev/images/background.webp') center/cover no-repeat;font-family:Arial,sans-serif}#go{position:fixed;inset:0;border:0;background:transparent;cursor:pointer}#load{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:5;transition:opacity .05s}#load:after{content:"";position:absolute;width:72px;height:72px;border:2px solid rgba(255,255,255,.08);border-top-color:#e50914;border-radius:50%;animation:spin .5s linear infinite}#load img{width:45px;height:45px;object-fit:contain;position:relative;z-index:1}@keyframes spin{to{transform:rotate(360deg)}}@media(orientation:portrait){body{width:100vh;height:100vw;transform:rotate(90deg);transform-origin:top left;position:absolute;top:100vh;left:0}}</style></head><body><div id="load"><img src="images/logo.png" alt=""></div><button id="go" aria-label="Open Axilort Engine"></button><script>const target='https://axilort-engine.pages.dev/home',load=document.getElementById('load');setTimeout(()=>{load.style.opacity='0';setTimeout(()=>load.remove(),50)},100);document.getElementById('go').onclick=async()=>{try{const el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape').catch(()=>{})}catch(e){}location.href=target};</script></body></html>
