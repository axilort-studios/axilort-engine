<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Axilort Engine Editor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#f2f2f3;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-columns:58px 245px 1fr;grid-template-rows:48px 1fr}.sidebar{grid-row:1/3;border-right:1px solid #242426;background:#080809;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:8px}.logo{width:36px;height:36px;border:1px solid #2b2b2e;border-radius:10px;display:grid;place-items:center;font-weight:900;color:#ff2028;margin-bottom:12px}.nav{width:38px;height:38px;border:1px solid transparent;border-radius:9px;background:transparent;color:#85858b}.nav:hover,.nav.active{background:#151517;border-color:#29292c;color:#fff}.nav.active{box-shadow:inset 2px 0 #ff2028}.explorer{border-right:1px solid #242426;background:#0b0b0c;overflow:auto}.explorer-head{height:48px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #242426;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.tree{padding:9px}.row{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:7px;color:#c5c5c8;font-size:13px}.row:hover,.row.selected{background:#151517}.row.selected{color:#fff}.indent{padding-left:27px}.dot{margin-left:auto;color:#555}.top{border-bottom:1px solid #242426;background:#09090a;display:flex;align-items:center;padding:0 14px;gap:10px}.crumb{font-size:12px;color:#929297}.crumb b{color:#eee}.spacer{flex:1}.top button,.toolbar button{background:#111113;border:1px solid #29292c;color:#ddd;border-radius:7px;padding:7px 10px;font-size:12px}.top button:hover,.toolbar button:hover{border-color:#444;color:#fff}.main{min-width:0;display:grid;grid-template-rows:42px 1fr}.tabs{display:flex;background:#0b0b0c;border-bottom:1px solid #242426;overflow:auto}.tab{height:100%;padding:0 13px;display:flex;align-items:center;gap:9px;border-right:1px solid #202023;color:#8e8e93;font-size:12px;white-space:nowrap}.tab.active{color:#fff;background:#111113;border-top:2px solid #ff2028}.editor-area{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px}.code-wrap{min-width:0;display:grid;grid-template-rows:38px 1fr;background:#070708}.toolbar{display:flex;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid #202023}.status{margin-left:auto;color:#666;font-size:11px}textarea{width:100%;height:100%;resize:none;border:0;outline:0;background:#070708;color:#ddd;padding:16px 18px;font:13px/1.65 "SFMono-Regular",Consolas,monospace;tab-size:2}.preview{border-left:1px solid #242426;background:#0a0a0b;display:grid;grid-template-rows:38px 1fr;min-width:0}.preview-head{display:flex;align-items:center;padding:0 11px;border-bottom:1px solid #202023;font-size:12px;font-weight:700}.preview iframe{width:100%;height:100%;border:0;background:white}.empty{height:100%;display:grid;place-items:center;color:#666;font-size:13px}.menu{position:fixed;display:none;z-index:20;background:#111113;border:1px solid #303034;border-radius:9px;padding:5px;box-shadow:0 14px 40px #000b;min-width:150px}.menu button{display:block;width:100%;border:0;background:transparent;color:#ddd;text-align:left;padding:8px 10px;border-radius:6px;font-size:12px}.menu button:hover{background:#1d1d20}.toast{position:fixed;bottom:18px;right:18px;background:#171719;border:1px solid #303034;border-radius:9px;padding:9px 12px;font-size:12px;display:none}@media(max-width:850px){.app{grid-template-columns:52px 190px 1fr}.editor-area{grid-template-columns:1fr}.preview{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="logo">A</div><button class="nav active" title="Editor">⌘</button><button class="nav" title="Projects">▦</button><button class="nav" title="Assets">◫</button><button class="nav" title="Settings">⚙</button></aside>
<section class="explorer"><div class="explorer-head"><span>Explorer</span><span id="count">0 files</span></div><div class="tree" id="tree"></div></section>
<header class="top"><span class="crumb">Axilort Engine / <b id="projectName">Default Project</b></span><span class="spacer"></span><button id="newBtn">+ New</button><button id="saveBtn">Save</button><button id="runBtn">▶ Run</button></header>
<main class="main"><div class="tabs" id="tabs"></div><div class="editor-area"><section class="code-wrap"><div class="toolbar"><button id="addFile">+ File</button><button id="addFolder">+ Folder</button><button id="upload">Upload</button><span class="status" id="status">Ready</span></div><textarea id="code" spellcheck="false" placeholder="Select a file to edit..."></textarea></section><section class="preview"><div class="preview-head">LIVE PREVIEW</div><iframe id="frame" sandbox="allow-scripts allow-forms"></iframe></section></div></main>
</div>
<div class="menu" id="menu"><button data-act="open">Open</button><button data-act="rename">Rename</button><button data-act="duplicate">Duplicate</button><button data-act="delete">Delete</button></div><div class="toast" id="toast"></div><input id="fileInput" type="file" multiple hidden>
<script>
const DB="axilort-engine-data",STORE="editorFiles";let db,files=[],current=null,currentProject="Default Project";const $=id=>document.getElementById(id);
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1800)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"id",autoIncrement:true})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function all(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(x){return new Promise((res,rej)=>{let r=db.transaction(STORE,"readwrite").objectStore(STORE).put(x);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function del(id){return new Promise((res,rej)=>{let r=db.transaction(STORE,"readwrite").objectStore(STORE).delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function renderTree(){let t=$("tree");t.innerHTML="";let n=0;for(let f of files){n++;let d=document.createElement("div");d.className="row "+(current===f.id?"selected":"");d.innerHTML=`<span>${f.kind==="folder"?"▾":"•"}</span><span>${esc(f.name)}</span><span class="dot">⋮</span>`;d.onclick=()=>f.kind==="file"&&select(f);d.oncontextmenu=e=>{e.preventDefault();showMenu(e.clientX,e.clientY,f)};t.appendChild(d)}$("count").textContent=n+" items"}
function select(f){current=f.id;$("code").value=f.content||"";$("status").textContent=f.name;renderTree();$("tabs").innerHTML=`<div class="tab active">${esc(f.name)}</div>`;$("frame").srcdoc=f.name.toLowerCase().endsWith(".html")?f.content||"":""}
async function refresh(){files=(await all()).filter(x=>x.project===currentProject);if(!files.length){let html='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#080808;color:#fff;font-family:system-ui;display:grid;place-items:center;height:100vh}p{color:#999}</style></head><body><div><h1>My Axilort Game</h1><p>Edit main.html and press Run.</p></div></body></html>';await put({project:currentProject,name:"main.html",kind:"file",content:html,parent:null});await put({project:currentProject,name:"main.js",kind:"file",content:'console.log("Axilort Engine");',parent:null});files=(await all()).filter(x=>x.project===currentProject)}renderTree()}
$("saveBtn").onclick=async()=>{if(!current)return;let f=files.find(x=>x.id===current);f.content=$("code").value;await put(f);$("status").textContent="Saved";toast("Saved to axilort-engine-data")};$("runBtn").onclick=()=>{if(current){let f=files.find(x=>x.id===current);if(f&&f.name.toLowerCase().endsWith(".html")){$("frame").srcdoc=$("code").value;toast("Preview running")}}};$("code").oninput=()=>$("status").textContent="Unsaved changes";
$("addFile").onclick=async()=>{let name=prompt("File name","script.js");if(name){await put({project:currentProject,name,kind:"file",content:"",parent:null});await refresh();toast("File created")}};$("addFolder").onclick=async()=>{let name=prompt("Folder name","assets");if(name){await put({project:currentProject,name,kind:"folder",content:"",parent:null});await refresh();toast("Folder created")}};$("upload").onclick=()=>$("fileInput").click();$("fileInput").onchange=async e=>{for(let x of e.target.files){let content="";if(x.type.startsWith("text/")||/\.(html?|css|js|json|txt|xml|svg)$/i.test(x.name))content=await x.text();await put({project:currentProject,name:x.name,kind:"file",content,size:x.size,type:x.type,parent:null})}e.target.value="";await refresh();toast("Files uploaded")};$("newBtn").onclick=async()=>{current=null;currentProject=prompt("Project name","My Project")||"Default Project";$("projectName").textContent=currentProject;await refresh();toast("Project opened")};
let menuFile=null;function showMenu(x,y,f){menuFile=f;$("menu").style.display="block";$("menu").style.left=x+"px";$("menu").style.top=y+"px"}document.onclick=e=>{if(!e.target.closest("#menu"))$("menu").style.display="none"};$("menu").onclick=async e=>{let a=e.target.dataset.act,f=menuFile;if(!f)return;if(a==="open"&&f.kind==="file")select(f);if(a==="rename"){let n=prompt("New name",f.name);if(n){f.name=n;await put(f);renderTree()}}if(a==="duplicate"){let c={...f};delete c.id;c.name=f.name.replace(/(\.[^.]+)?$/," Copy$1");await put(c);await refresh()}if(a==="delete"&&confirm("Delete "+f.name+"?")){await del(f.id);await refresh()}$("menu").style.display="none"};openDB().then(refresh).catch(()=>toast("Storage unavailable"));
</script>
</body></html>
