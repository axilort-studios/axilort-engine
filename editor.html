<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Axilort Engine Editor</title><style>

:6px;padding:3px 5px;border:1px solid #555a60;border-radius:3px;background:#15171acc;font-size:7px;color:#c5c8cc;pointer-events:none}.status{position:absolute;right:6px;bottom:5px;font-size:7px;color:#eee9;pointer-events:none}.inspector{grid-column:3;grid-row:2;border-left:1px solid var(--line);display:flex;flex-direction:column}.inshead{height:28px;display:flex;align-items:center;border-bottom:1px solid var(--line);padding-left:5px}.inshead button{height:28px;border:0;background:transparent;color:#777c83;padding:0 7px;font-size:8px}.inshead .active{color:#fff;box-shadow:inset 0 -2px var(--accent)}.selected{display:flex;align-items:center;gap:6px;padding:6px;border-bottom:1px solid var(--line)}.elementIcon{width:26px;height:26px;border:1px solid var(--line);background:#292b2f;border-radius:4px;display:grid;place-items:center}.selected strong{display:block;font-size:9px}.selected small{font-size:7px;color:#81868d}.section{border-bottom:1px solid var(--line)}.sectionHead{height:25px;padding:0 7px;display:flex;align-items:center;font-weight:700;font-size:8px}.sectionBody{padding:2px 6px 6px}.prop{margin:4px 0}.prop label{display:block;color:#858a91;font-size:7px;margin-bottom:2px}.field,.select{height:22px;background:#191a1d;border:1px solid var(--line);border-radius:3px;color:#ddd}.select{width:100%;padding:0 5px}.vec{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.field{display:flex;align-items:center}.field span{width:13px;text-align:center;color:#d65a61;font-size:7px}.field.y span{color:#72c66c}.field.z span{color:#659fe0}.field input{width:100%;border:0;outline:0;background:transparent;color:#ddd;font-size:7px}.check{display:flex;gap:4px;align-items:center;color:#aaa;font-size:8px}.bottom{grid-column:1/4;grid-row:3;background:#191a1d;border-top:1px solid var(--line);display:grid;grid-template-rows:27px minmax(0,1fr);min-height:0}.bottomTabs{display:flex;align-items:center;gap:2px;padding:0 5px;border-bottom:1px solid var(--line);overflow:auto}.bottomTabs button{height:23px;padding:0 8px;border:0;background:transparent;color:#7f848c;border-radius:3px;font-size:8px}.bottomTabs button:hover,.bottomTabs button.active{background:#2b2d31;color:#fff}.bottomBody{min-height:0;overflow:auto;padding:6px;color:#8d9299;font:9px ui-monospace,SFMono-Regular,monospace}.bottomBody .line{padding:2px 0}.bottomBody .ok{color:#a8b0b8}.dock{position:absolute;z-index:30;display:none}.app.left-closed .leftdock,.app.right-closed .rightdock{display:block}.leftdock{left:3px;top:42px}.rightdock{right:3px;top:42px}.dock button{width:22px;height:22px;padding:0;border:1px solid var(--line);border-radius:3px;background:#232529;color:#aaa;font-size:10px}.dock button:hover{background:#34373b;color:#fff}.bottomClosedHandle{display:none;position:absolute;left:50%;bottom:3px;transform:translateX(-50%);z-index:35}.app.bottom-closed .bottomClosedHandle{display:block}.bottomClosedHandle button{height:20px;border:1px solid var(--line);background:#232529;border-radius:3px;color:#aaa;font-size:9px;padding:0 9px}@media(max-width:760px){:root{--left:150px;--right:175px;--bottom:145px}.app{grid-template-rows:35px minmax(0,1fr) var(--bottom)}.top{padding:0 3px;gap:2px}.brand img{width:20px;height:20px}.brand b,.menus{display:none}.groupBtns button{min-width:22px;height:22px;padding:0}.save{width:24px;height:22px;font-size:0;padding:0}.save:after{content:'▣';font-size:9px}.left,.inspector{position:relative;width:auto;top:auto;bottom:auto;z-index:1;box-shadow:none}.center{grid-column:2}.bottom{font-size:9px}.head{height:26px}.search{height:21px;margin:3px}.row,.file{height:21px}.vtools{height:25px}.tool{min-width:21px;height:21px}.tool:nth-child(5),.tool:nth-child(6){display:none}.persp{font-size:7px;padding:0 4px}.info{font-size:7px}.status{font-size:6px}.selected{padding:5px}.sectionHead{height:23px}.field,.select{height:20px}}
</style></head><body><div class="app" id="app"><header class="top"><div class="brand"><img src="images/logo.png" alt="Axilort"><b>AXILORT</b></div><nav class="menus"><button>File</button><button>Edit</button><button>Project</button><button>Scene</button><button>Tools</button><button>Help</button></nav><button class="tool" id="editor">▣</button><button class="tool" id="script">⌘</button><button class="tool" id="assets">▱</button><div class="grow"></div><div class="groupBtns"><button id="undo">↶</button><button id="redo">↷</button></div><div class="groupBtns"><button id="topPlay">▶</button><button id="pause">Ⅱ</button><button id="stop">■</button></div><div class="groupBtns"><button id="mode3d" class="active">3D</button><button id="mode2d">2D</button></div><button class="save" id="topSave">Save</button></header><section class="left"><div class="panel"><div class="head">Scene <div><button class="mini" id="add">＋</button><button class="mini" id="leftCollapse">‹</button></div></div><div class="search">⌕<input id="filter" placeholder="Filter"></div><div class="tree" id="tree"></div></div><div class="panel"><div class="head">FileSystem</div><div class="search">⌕<input id="fileFilter" placeholder="Search"></div><div class="fs" id="fs"></div></div></section><main class="center"><div class="tabs"><button class="tab">◇ Main Scene ×</button><button class="tabadd">＋</button></div><div class="vtools"><button class="tool" id="selectTool">⌁</button><button class="tool active" id="moveTool">✣</button><button class="tool" id="rotateTool">↻</button><button class="tool" id="scaleTool">⌗</button><button class="tool" id="frameAll">⊞</button><button class="tool" id="frameSelected">✥</button><button class="tool" id="toggleLeft">◧</button><button class="tool" id="toggleInspector">▥</button><button class="tool" id="toggleBottom">▾</button><div class="persp" id="viewLabel">3D • Perspective</div></div><div class="viewport mode3d" id="viewport"><canvas class="gl" id="gl"></canvas><div class="inf const $=id=>document.getElementById(id),app=$("app");let scene=[],selected=null,view='3d';const groups={Core:['Node','Node2D','Node3D','SceneInstance','SubViewport','Marker2D','Marker3D'],Rendering2D:['Sprite2D','AnimatedSprite2D','Polygon2D','Line2D','TileMap','TileMapLayer','LightOccluder2D','PointLight2D','GPUParticles2D','CanvasGroup'],Rendering3D:['MeshInstance3D','MultiMeshInstance3D','CSGBox3D','CSGSphere3D','CSGCylinder3D','CSGTorus3D','Decal','FogVolume','VoxelGI','LightmapGI','ReflectionProbe','GPUParticles3D','GridMap','WorldEnvironment'],CamerasLighting:['Camera2D','Camera3D','DirectionalLight3D','OmniLight3D','SpotLight3D','AreaLight3D','AudioListener3D'],Physics2D:['StaticBody2D','RigidBody2D','CharacterBody2D','Area2D','CollisionShape2D','CollisionPolygon2D','RayCast2D','ShapeCast2D','PinJoint2D'],Physics3D:['StaticBody3D','RigidBody3D','CharacterBody3D','Area3D','CollisionShape3D','RayCast3D','ShapeCast3D','HingeJoint3D','VehicleBody3D','VehicleWheel3D'],Navigation:['NavigationRegion2D','NavigationAgent2D','NavigationRegion3D','NavigationAgent3D','NavigationLink3D'],Animation:['AnimationPlayer','AnimationTree','Skeleton2D','Bone2D','Skeleton3D','BoneAttachment3D','BlendSpace1D','StateMachine'],Audio:['AudioStreamPlayer','AudioStreamPlayer2D','AudioStreamPlayer3D','AudioEffectReverb','AudioEffectDelay','AudioEffectChorus'],UI:['Control','Panel','PanelContainer','HBoxContainer','VBoxContainer','GridContainer','CenterContainer','ScrollContainer','TextureRect','ColorRect','TextureButton','Button','CheckBox','CheckButton','OptionButton','MenuButton','Slider','ProgressBar','LineEdit','CodeEdit','ItemList','Tree','TabBar','Separator','ColorPicker','FileDialog','Window','GraphEdit','GraphNode'],Gameplay:['Timer','Path2D','Path3D','PathFollow3D','SpringArm3D','TriggerVolume','DamageVolume','SpawnPoint','Checkpoint','InteractionArea','Interactable','Collectible','Trigger','EventEmitter'],DataLogic:['Expression','Variable','ArrayStore','DictionaryStore','State','Condition','Branch','Sequence','Parallel','Delay','Loop','Counter','Randomizer','DataBinding','PropertyBinding'],Networking:['MultiplayerSpawner','MultiplayerSynchronizer','WebSocketPeer','HTTPRequest','TCPServer','PacketPeerUDP','NetworkManager'],Media:['VideoStreamPlayer','CameraFeed','AudioCapture','MovieWriter'],AI:['BehaviorTree','BehaviorTask','BehaviorSelector','BehaviorSequence','Blackboard','PathPlanner','SteeringAgent','VisionSensor','HearingSensor'],World:['World3D','World2D','Terrain3D','TerrainChunk','Water3D','Ocean3D','River3D','CloudLayer3D','TimeOfDay','WorldStreamer','LevelStreamer','ObjectPool']};const types=[...new Set(Object.values(groups).flat())];const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('axilort.scene.v6',JSON.stringify(scene))}function load(){try{scene=JSON.parse(localStorage.getItem('axilort.scene.v6')||'[]')}catch{scene=[]}scene.forEach(n=>{n.id=n.id||uid();n.p=n.p||[0,0,0];n.r=n.r||[0,0,0];n.s=n.s||[1,1,1];n.visible=n.visible!==false});selected=scene[0]?.id||null}function icon(t){return /Camera|Light/.test(t)?'☼':/Physics|Collision|Body/.test(t)?'◈':/Audio/.test(t)?'♫':/Mesh|Sprite|Polygon/.test(t)?'◇':'◆'}function renderTree(){let q=$("filter").value.toLowerCase(),b=$("tree");b.innerHTML='';let a=scene.filter(n=>(n.name+' '+n.type).toLowerCase().includes(q));if(!a.length){b.innerHTML='<div style="padding:12px;color:#777;text-align:center">Empty Scene</div>';return}a.forEach(n=>{let r=document.createElement('div');r.className='row'+(n.id===selected?' selected':'');r.innerHTML=`<span>${icon(n.type)}</span><span class=name>${esc(n.name)}</span><span>${n.visible?'●':'○'}</span>`;r.onclick=()=>{selected=n.id;renderAll()};r.ondblclick=()=>{let v=prompt('Element name',n.name);if(v){n.name=v;save();renderAll()}};b.appendChild(r)})}function renderFS(){let q=$("fileFilter").value.toLowerCase();$("fs").innerHTML=['scenes/','scripts/','assets/','textures/','models/','materials/','project.axilort'].filter(x=>x.includes(q)).map(x=>`<div class=file>▸ ${x}</div>`).join('')||'<div style="padding:12px;color:#777;text-align:center">No files</div>'}function vec(label,k,v){return `<div class=prop><label>${label}</label><div class=vec><div class=field><span>X</span><input id=in${k}x type=number value=${v[0]}></div><div class="field y"><span>Y</span><input id=in${k}y type=number value=${v[1]}></div><div class="field z"><span>Z</span><input id=in${k}z type=number value=${v[2]}></div></div></div>`}function renderInspector(){let b=$("insbody"),n=scene.find(x=>x.id===selected);if(!n){b.innerHTML='<div style="padding:15px;color:#777;text-align:center">Select an element</div>';return}b.innerHTML=`<div class=selected><div class=elementIcon>${icon(n.type)}</div><div><strong>${esc(n.name)}</strong><small>${esc(n.type)}</small></div></div><div class=section><div class=sectionHead>Element</div><div class=sectionBody><div class=prop><label>Name</label><input class=select id=inName value="${esc(n.name)}"></div><label class=check><input id=vis type=checkbox ${n.visible?'checked':''}> Visible</label></div></div><div class=section><div class=sectionHead>Transform</div><div class=sectionBody>${vec('Position','p',n.p)}${vec('Rotation','r',n.r)}${vec('Scale','s',n.s)}</div></div>`;$("inName").onchange=e=>{n.name=e.target.value||n.name;save();renderAll()};$("vis").onchange=e=>{n.visible=e.target.checked;save();renderAll()};['p','r','s'].forEach(k=>'xyz'.split('').forEach((a,i)=>{$('in'+k+a).onchange=e=>{n[k][i]=Number(e.target.value)||0;save();draw()}}))}function renderAll(){renderTree();renderFS();renderInspector();$("objCount").textContent='Objects: '+scene.length;draw()}function panel(k,open){app.classList.toggle(k+'-closed',!open);localStorage.setItem('axilort.panel.'+k,open?'1':'0');setTimeout(draw,20)}function initPanels(){panel('left',localStorage.getItem('axilort.panel.left')!=='0');panel('right',localStorage.getItem('axilort.panel.right')!=='0');panel('bottom',localStorage.getItem('axilort.panel.bottom')!=='0')}function add(t){let n={id:uid(),name:t.replace(/(2D|3D)$/,''),type:t,parent:selected,p:[0,0,0],r:[0,0,0],s:[1,1,1],visible:true};scene.push(n);selected=n.id;save();closeModal();renderAll()}function renderNodes(){let q=$("nodeFilter").value.toLowerCase(),b=$("nodeList");b.innerHTML='';for(let[g,a]of Object.entries(groups)){let m=a.filter(t=>t.toLowerCase().includes(q));if(!m.length)continue;b.innerHTML+=`<div class=group>${g}</div>`;m.forEach(t=>b.innerHTML+=`<div class=option data-type="${t}">${icon(t)} ${t}</div>`)}b.querySelectorAll('.option').forEach(x=>x.onclick=()=>{b.dataset.type=x.dataset.type;b.querySelectorAll('.option').forEach(y=>y.classList.remove('sel'));x.classList.add('sel')})}function openModal(){$("modal").style.display='grid';renderNodes()}function closeModal(){$("modal").style.display='none'}function setView(v){view=v;$("viewport").classList.toggle('mode3d',v==='3d');$("mode3d").classList.toggle('active',v==='3d');$("mode2d").classList.toggle('active',v==='2d');$("viewLabel").textContent=v==='3d'?'3D • Perspective':'2D • Orthographic';$("viewportInfo").textContent=$("viewLabel").textContent;draw()}function draw(){let c=$("gl"),r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);if(view==='2d'){x.strokeStyle='rgba(255,255,255,.08)';for(let i=0;i<r.width;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,r.height);x.stroke()}for(let i=0;i<r.height;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(r.width,i);x.stroke()}return}x.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<11;i++)x.fillRect(r.width/2-200+i*40,r.height*.55,1,100)}function renderBottom(kind='console'){let b=$("bottomBody");if(kind==='script')b.innerHTML='<div class=line>Script workspace ready.</div><div class=line>Use the top Script button to open script tools.</div>';else if(kind==='animation')b.innerHTML='<div class=line>Animation panel</div><div class=line>AnimationPlayer and AnimationTree controls appear here.</div>';else if(kind==='debugger')b.innerHTML='<div class=line>Debugger</div><div class=line class=ok>No errors.</div>';else if(kind==='audio')b.innerHTML='<div class=line>Audio</div><div class=line>Audio monitor ready.</div>';else b.innerHTML='<div class=line>[Output] Axilort Engine ready.</div><div class=line class=ok>[Console] No messages.</div>'}$("add").onclick=openModal;$("close").onclick=closeModal;$("cancel").onclick=closeModal;$("confirm").onclick=()=>add($("nodeList").dataset.type||types[0]);$("nodeFilter").oninput=renderNodes;$("filter").oninput=renderTree;$("fileFilter").oninput=renderFS;$("leftCollapse").onclick=()=>panel('left',false);$("openLeft").onclick=()=>panel('left',true);$("insCollapse").onclick=()=>panel('right',false);$("openRight").onclick=()=>panel('right',true);$("toggleLeft").onclick=()=>panel('left',app.classList.contains('left-closed'));$("toggleInspector").onclick=()=>panel('right',app.classList.contains('right-closed'));$("toggleBottom").onclick=()=>panel('bottom',app.classList.contains('bottom-closed'));$("bottomCollapse").onclick=()=>panel('bottom',false);$("openBottom").onclick=()=>panel('bottom',true);$("save").onclick=save;$("topSave").onclick=save;$("mode3d").onclick=()=>setView('3d');$("mode2d").onclick=()=>setView('2d');$("assets").onclick=()=>location.href='assets.html';$("play").onclick=$("topPlay").onclick=()=>{};[...document.querySelectorAll('[data-output]')].forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-output]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderBottom(b.dataset.output)});load();initPanels();renderBottom();renderAll();
</script></body></html>
