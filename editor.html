<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Axilort Engine Editor</title>
<style>
:root{--bg:#111214;--bar:#191a1d;--panel:#1b1c20;--panel2:#202226;--line:#303238;--line2:#3b3e45;--text:#e8e9ec;--muted:#858a93;--accent:#d62d35;--accent2:#ef4149;--left:235px;--right:255px;--bottom:175px}

.app.left-closed{--left:0px}.app.right-closed{--right:0px}.app.bottom-open{--bottom:175px}.app.bottom-closed{--bottom:0px}
.top{grid-column:1/6;grid-row:1;display:flex;align-items:center;gap:4px;min-width:0;padding:0 8px;background:linear-gradient(#1b1c1f,#18191c);border-bottom:1px solid var(--line);z-index:20;box-shadow:0 1px 10px #0005}
.brand{height:32px;display:flex;align-items:center;gap:7px;padding:0 8px 0 3px;flex:none}.brand img{width:29px;height:29px;object-fit:contain}.brandText{line-height:10px}.brandText b{display:block;font-size:11px;letter-spacing:.16em}.brandText span{display:block;font-size:6px;letter-spacing:.25em;color:#969aa2;margin-top:2px}
.menu{height:27px;padding:0 7px;background:transparent;border-radius:4px;color:#a8abb2}.menu:hover{background:#292b30;color:#fff}.divider{width:1px;height:21px;background:var(--line);margin:0 2px;flex:none}.spacer{flex:1;min-width:5px}
.toolbarGroup{display:flex;align-items:center;border:1px solid var(--line);border-radius:5px;background:#151619;overflow:hidden;flex:none}.topBtn{height:28px;min-width:29px;padding:0 7px;background:transparent;color:#a3a7ae;display:flex;align-items:center;justify-content:center;gap:5px}.topBtn:hover{background:#292b30;color:#fff}.topBtn.active{background:#332022;color:#fff;box-shadow:inset 0 -2px var(--accent)}.topBtn .label{font-size:9px}.icon{width:15px;height:15px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.compact{min-width:30px;padding:0 7px}.saveBtn{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:5px;background:#24262a;display:flex;align-items:center;gap:5px}.saveBtn:hover{background:#303238}.statusDot{width:6px;height:6px;border-radius:50%;background:#61b96a;box-shadow:0 0 7px #61b96a88;margin-right:2px}

.resizeHandle{grid-row:2/4;width:5px;background:#17181b;cursor:col-resize;z-index:10;border-left:1px solid #26282d;border-right:1px solid #26282d}.resizeHandle:hover{background:#303238}.leftResize{grid-column:2}.rightResize{grid-column:4}
.center{grid-column:3;grid-row:2;min-width:0;min-height:0;display:grid;grid-template-rows:34px 34px minmax(0,1fr);background:#101113}.sceneTabs{display:flex;align-items:end;gap:2px;padding:0 6px;background:#17181b;border-bottom:1px solid var(--line);overflow:hidden}.sceneTab{height:31px;max-width:220px;padding:0 10px;border:1px solid var(--line);border-bottom:0;border-radius:5px 5px 0 0;background:#23252a;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sceneAdd{height:29px;width:29px;background:transparent;color:#858a92}.sceneAdd:hover{color:#fff;background:#282a2e}.viewportTools{display:flex;align-items:center;gap:2px;padding:0 6px;background:#1c1e21;border-bottom:1px solid var(--line);overflow:hidden}.vbtn{width:28px;height:27px;background:transparent;border-radius:4px;color:#858a92;display:grid;place-items:center;flex:none}.vbtn:hover,.vbtn.active{background:#2b2d32;color:#fff}.vbtn.active{box-shadow:inset 0 -2px var(--accent)}.viewMode{margin-left:auto;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:#151619;color:#a4a8ae;font-size:9px;white-space:nowrap}.viewport{position:relative;min-width:0;min-height:0;overflow:hidden;background:#0d0f11;touch-action:none}.viewport.mode3d{background:radial-gradient(circle at 72% 18%,#5b5d61 0,#25282c 19%,#101214 54%,#0b0c0e 100%)}.viewport.mode2d{background-color:#111316;background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:40px 40px}.gridPlane{position:absolute;left:8%;right:8%;bottom:14%;height:48%;opacity:.38;background:linear-gradient(90deg,transparent 49.7%,#8d929955 50%,transparent 50.3%),linear-gradient(0deg,transparent 49.7%,#8d929955 50%,transparent 50.3%);background-size:80px 80px;transform:perspective(500px) rotateX(55deg);transform-origin:center bottom}.cube{position:absolute;left:50%;top:52%;width:130px;height:130px;transform:translate(-50%,-50%) rotateX(-12deg) rotateY(25deg) rotateZ(-3deg);background:linear-gradient(135deg,#ef454d,#9e171d 72%);border:2px solid #ff6b70aa;border-radius:9px;box-shadow:0 22px 45px #000b,0 0 35px #d92e3530}.cube:before,.cube:after{content:"";position:absolute;inset:10px;border:1px solid #fff4;border-radius:5px}.cube:after{inset:auto 18px 18px auto;width:35px;height:35px;background:#ffffff10;border-radius:50%;filter:blur(5px)}.sun{position:absolute;right:12%;top:12%;width:26px;height:26px;border-radius:50%;background:#fff6c9;box-shadow:0 0 18px 7px #fff3a955,0 0 60px 18px #fff5}.axis{position:absolute;right:16px;top:14px;width:62px;height:62px;border:1px solid #ffffff20;border-radius:50%;display:grid;place-items:center;color:#aaa;font-size:9px;background:#0003}.axis:after{content:"X  Y  Z";letter-spacing:5px}.viewportInfo{position:absolute;left:9px;top:9px;padding:6px 8px;border:1px solid #ffffff20;border-radius:4px;background:#101215cc;color:#c3c6cc;font-size:9px;backdrop-filter:blur(6px)}.viewportStatus{position:absolute;right:9px;bottom:8px;color:#b6bac1aa;font-size:9px}
.insHead{height:35px;min-height:35px;display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 4px;background:#1e2024}.insTab{height:35px;padding:0 9px;background:transparent;color:#777c84}.insTab.active{color:#fff;box-shadow:inset 0 -2px var(--accent)}.insContent{min-height:0;overflow:auto}.selectedElement{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.elementGlyph{width:30px;height:30px;border:1px solid var(--line2);border-radius:5px;display:grid;place-items:center;background:#25272b;color:#d84950}.selectedElement b{display:block;font-size:10px}.selectedElement small{display:block;color:#7e838b;font-size:8px;margin-top:2px}.section{border-bottom:1px solid var(--line)}.sectionTitle{height:29px;display:flex;align-items:center;padding:0 9px;color:#bfc2c8;font-size:9px;font-weight:700}.sectionTitle:before{content:"⌄";margin-right:5px;color:#858a92}.sectionBody{padding:2px 9px 9px}.prop{margin:6px 0}.prop label{display:block;color:#7f848c;font-size:8px;margin-bottom:3px}.field{width:100%;height:25px;border:1px solid var(--line);border-radius:4px;background:#141518;color:#ddd;padding:0 7px}.vec{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.vfield{height:25px;display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:#141518}.vfield span{width:16px;text-align:center;color:#d65a61;font-size:8px}.vfield.y span{color:#73bd69}.vfield.z span{color:#6698d2}.vfield input{width:100%;border:0;outline:0;background:transparent;color:#ddd;font-size:8px}.check{display:flex;align-items:center;gap:6px;color:#aaa;font-size:9px}.check input{accent-color:var(--accent)}
.bottomRail{grid-column:1/6;grid-row:3;background:#17181b;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 6px;gap:3px;z-index:12;min-width:0}.bottomTab{height:25px;padding:0 9px;border-radius:4px;background:transparent;color:#858a92;display:flex;align-items:center;gap:5px;font-size:9px}.bottomTab:hover{background:#292b30;color:#fff}.bottomTab.active{color:#fff;background:#2b2022}.bottomTab.active:after{content:"";position:absolute}.bottomSpacer{flex:1}.closeBottom{width:27px;height:25px;border-radius:4px;background:transparent;color:#888d95}.closeBottom:hover{background:#2b2d31;color:#fff}.bottomPanel{grid-column:1/6;grid-row:4;min-height:0;background:#111214;border-top:1px solid var(--line);display:grid;grid-template-rows:35px minmax(0,1fr);overflow:hidden}.app.bottom-closed .bottomPanel{display:none}.bottomPanelHead{display:flex;align-items:center;padding:0 7px;border-bottom:1px solid var(--line);background:#1b1c20}.bottomPanelHead b{font-size:9px}.bottomPanelActions{margin-left:auto;display:flex;gap:2px}.outputText{min-height:0;overflow:auto;padding:8px 10px;color:#8e949d;font:9px ui-monospace,SFMono-Regular,Consolas,monospace}.log{padding:2px 0}.log.ok{color:#aeb5bd}.log.warn{color:#c8ad73}.log.err{color:#d8666d}
.closedDockButton{position:absolute;top:51px;width:30px;height:32px;border:1px solid var(--line);background:#1b1d20;border-radius:0 5px 5px 0;color:#999;z-index:30;display:none}.leftOpen{left:0}.rightOpen{right:0;border-radius:5px 0 0 5px}.app.left-closed .leftOpen,.app.right-closed .rightOpen{display:block}.bottomOpenButton{display:none;height:25px;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:#23252a;color:#aaa}.app.bottom-closed .bottomOpenButton{display:block}

@media(max-width:650px){:root{--left:145px;--right:165px}.app{grid-template-rows:38px minmax(0,1fr) 27px var(--bottom)}.brand{padding-left:1px}.brand img{width:25px;height:25px}.divider{display:none}.toolbarGroup:nth-of-type(2){display:none}.top{padding:0 4px}.topBtn{min-width:27px;height:26px}.menu{display:none}.sceneTabs{height:30px}.sceneTab{height:27px}.viewportTools{height:30px}.vbtn{width:24px;height:25px}.vbtn:nth-child(5),.vbtn:nth-child(6){display:none}.cube{width:92px;height:92px}.gridPlane{background-size:55px 55px}.sun{right:12%;top:10%}.bottomTab{padding:0 6px;font-size:8px}.bottomTab:nth-child(5){display:none}.leftDock{grid-template-rows:minmax(0,58%) 4px minmax(0,42%)}}
</style>
</head>
<body>
<div class="app bottom-closed" id="app">
<header class="top">
  <div class="brand"><img src="images/logo.png" alt="Axilort"><div class="brandText"><b>AXILORT</b><span>ENGINE</span></div></div>
  <button class="menu">File</button><button class="menu">Edit</button><button class="menu">Project</button><button class="menu">Scene</button><button class="menu">Tools</button><button class="menu">Help</button>
  <div class="divider"></div>
  <div class="toolbarGroup">
    <button class="topBtn compact" id="undo" title="Undo"><svg class="icon"><path d="M9 5 4 9l5 4"/><path d="M4 9h7a4 4 0 0 1 0 8H8"/></svg></button>
    <button class="topBtn compact" id="redo" title="Redo"><svg class="icon"><path d="m6 5 5 4-5 4"/><path d="M11 9H6a4 4 0 0 0 0 8h3"/></svg></button>
  </div>
  <div class="toolbarGroup">
    <button class="topBtn compact" id="run" title="Run Project"><svg class="icon"><path d="m6 4 10 8-10 8z"/></svg></button>
    <button class="topBtn compact" id="pause" title="Pause"><svg class="icon"><path d="M7 5v14M13 5v14"/></svg></button>
    <button class="topBtn compact" id="stop" title="Stop"><svg class="icon"><rect x="5" y="5" width="10" height="10" rx="1"/></svg></button>
  </div>
  <div class="toolbarGroup">
    <button class="topBtn active" id="editorMode" title="Editor"><svg class="icon"><path d="m5 15 2.5-2.5 5 5L10 20H5z"/><path d="m11 6 3-3 4 4-3 3"/><path d="m9 8 7 7"/></svg><span class="label">Editor</span></button>
    <button class="topBtn" id="mode2d" title="2D Workspace"><svg class="icon"><rect x="4" y="5" width="12" height="10" rx="1"/><path d="M7 19h6M10 15v4"/></svg><span class="label">2D</span></button>
    <button class="topBtn" id="mode3d" title="3D Workspace"><svg class="icon"><path d="m10 3 7 4v8l-7 4-7-4V7z"/><path d="m3 7 7 4 7-4M10 11v8"/></svg><span class="label">3D</span></button>
    <button class="topBtn" id="scriptMode" title="Script Workspace"><svg class="icon"><path d="m6 6-4 6 4 6M14 6l4 6-4 6M12 4l-2 16"/></svg><span class="label">Script</span></button>
  </div>
  <div class="spacer"></div>
  <div class="toolbarGroup">
    <button class="topBtn compact" id="toggleLeft" title="Scene & FileSystem"><svg class="icon"><rect x="3" y="4" width="7" height="12" rx="1"/><rect x="12" y="4" width="5" height="12" rx="1"/></svg></button>
    <button class="topBtn compact" id="toggleRight" title="Inspector"><svg class="icon"><rect x="4" y="3" width="12" height="16" rx="1"/><path d="M7 7h6M7 11h6M7 15h4"/></svg></button>
    <button class="topBtn compact" id="toggleBottom" title="Output"><svg class="icon"><path d="M4 5h12v9H4z"/><path d="m7 17 3-2 3 2"/></svg></button>
  </div>
  <button class="saveBtn" id="save" title="Save Scene"><svg class="icon"><path d="M4 3h11l2 2v14H4z"/><path d="M7 3v5h7V3M7 19v-6h6v6"/></svg><span>Save</span></button>
  <button class="topBtn compact" title="More"><svg class="icon"><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="10" cy="12" r="1" fill="currentColor"/><circle cx="16" cy="12" r="1" fill="currentColor"/></svg></button>
</header>

<section class="leftDock" id="leftDock">
  <div class="panel"><div class="panelHead"><span class="panelTitle">Elements 3D</span><div class="panelActions"><button class="mini" id="add" title="Add Element">＋</button><button class="mini" id="leftClose" title="Hide Dock">‹</button></div></div><div class="search">⌕<input id="filter" placeholder="Filter elements"></div><div class="scroll" id="tree"></div></div>
  <div class="splitV" id="leftSplit"></div>
  <div class="panel"><div class="panelHead"><span class="panelTitle">FileSystem</span><div class="panelActions"><button class="mini" title="Options">⋮</button></div></div><div class="search">⌕<input id="fileFilter" placeholder="Search files"></div><div class="scroll" id="fs"></div></div>
</section>
<div class="resizeHandle leftResize" id="leftResize"></div>

<main class="center">
  <div class="sceneTabs"><button class="sceneTab">◇ Main Scene <span style="color:#777">×</span></button><button class="sceneAdd" title="New Scene">＋</button></div>
  <div class="viewportTools">
    <button class="vbtn active" title="Select">⌁</button><button class="vbtn" title="Move">✣</button><button class="vbtn" title="Rotate">↻</button><button class="vbtn" title="Scale">⌗</button><button class="vbtn" title="Frame All">⊞</button><button class="vbtn" title="Focus Selected">✥</button><div class="spacer"></div><button class="viewMode" id="viewMode">3D · Perspective</button>
  </div>
  <div class="viewport mode3d" id="viewport"><div class="gridPlane"></div><div class="cube"></div><div class="sun"></div><div class="axis"></div><div class="viewportInfo" id="viewportInfo">3D · Perspective</div><div class="viewportStatus"><span id="fps">60 FPS</span> · <span id="objCount">Objects: 0</span></div></div>
</main>

<aside class="rightDock" id="rightDock"><div class="insHead"><button class="insTab active">Inspector</button><button class="insTab">Element</button><div class="spacer"></div><button class="mini" id="rightClose">›</button></div><div class="search">⌕<input placeholder="Filter properties"></div><div class="insContent" id="insContent"></div></aside>
<div class="resizeHandle rightResize" id="rightResize"></div>

<button class="closedDockButton leftOpen" id="leftOpen" title="Open Scene Dock">›</button><button class="closedDockButton rightOpen" id="rightOpen" title="Open Inspector">‹</button>

<nav class="bottomRail">
  <button class="bottomTab active" data-panel="output">▤ <span>Output</span></button><button class="bottomTab" data-panel="debugger">⚙ <span>Debugger</span></button><button class="bottomTab" data-panel="animation">◫ <span>Animation</span></button><button class="bottomTab" data-panel="audio">♫ <span>Audio</span></button><button class="bottomTab" data-panel="script">⌘ <span>Script</span></button><div class="bottomSpacer"></div><button class="bottomOpenButton" id="bottomOpen">▲ Open</button><button class="closeBottom" id="bottomClose" title="Close Bottom Panel">⌄</button>
</nav>
<section class="bottomPanel" id="bottomPanel"><div class="bottomPanelHead"><b id="bottomTitle">Output</b><div class="bottomPanelActions"><button class="mini" id="clearOutput" title="Clear">Clear</button><button class="mini" id="bottomClose2" title="Close">⌄</button></div></div><div class="outputText" id="outputText"></div></section>

<div id="modal" style="display:none;position:fixed;inset:0;z-index:100;background:#0009;place-items:center"><div style="width:min(430px,92vw);max-height:80vh;display:flex;flex-direction:column;background:#1b1d21;border:1px solid #3a3d44;border-radius:8px;box-shadow:0 20px 60px #000b"><div style="height:40px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #303238;font-weight:700">Add Element <button id="close" style="margin-left:auto;background:transparent;color:#999;font-size:18px">×</button></div><div class="search" style="margin:8px"><input id="nodeFilter" placeholder="Search elements"></div><div id="nodeList" class="scroll" style="padding:0 6px 8px"></div><div style="display:flex;justify-content:flex-end;gap:6px;padding:8px;border-top:1px solid #303238"><button id="cancel" class="saveBtn">Cancel</button><button id="confirm" class="saveBtn">Add</button></div></div></div>

<script>
const $=id=>document.getElementById(id),app=$("app");
let scene=[],selected=null,view='3d';
const groups={Core:['Element','Element2D','Element3D','SceneInstance','SubViewport','Marker2D','Marker3D'],Rendering2D:['Sprite2D','AnimatedSprite2D','Polygon2D','Line2D','TileMap','TileMapLayer','LightOccluder2D','PointLight2D','GPUParticles2D','CanvasGroup'],Rendering3D:['MeshInstance3D','MultiMeshInstance3D','CSGBox3D','CSGSphere3D','CSGCylinder3D','CSGTorus3D','Decal','FogVolume','VoxelGI','LightmapGI','ReflectionProbe','GPUParticles3D','GridMap','WorldEnvironment'],CamerasLighting:['Camera2D','Camera3D','DirectionalLight3D','OmniLight3D','SpotLight3D','AudioListener3D'],Physics2D:['StaticBody2D','RigidBody2D','CharacterBody2D','Area2D','CollisionShape2D','CollisionPolygon2D','RayCast2D','ShapeCast2D','PinJoint2D'],Physics3D:['StaticBody3D','RigidBody3D','CharacterBody3D','Area3D','CollisionShape3D','RayCast3D','ShapeCast3D','HingeJoint3D','VehicleBody3D','VehicleWheel3D'],Navigation:['NavigationRegion2D','NavigationAgent2D','NavigationRegion3D','NavigationAgent3D','NavigationLink3D'],Animation:['AnimationPlayer','AnimationTree','Skeleton2D','Bone2D','Skeleton3D','BoneAttachment3D','BlendSpace1D','StateMachine'],Audio:['AudioStreamPlayer','AudioStreamPlayer2D','AudioStreamPlayer3D','AudioEffectReverb','AudioEffectDelay','AudioEffectChorus'],UI:['Control','Panel','PanelContainer','HBoxContainer','VBoxContainer','GridContainer','CenterContainer','ScrollContainer','TextureRect','ColorRect','TextureButton','Button','CheckBox','CheckButton','OptionButton','MenuButton','Slider','ProgressBar','LineEdit','CodeEdit','ItemList','Tree','TabBar','Separator','ColorPicker','FileDialog','Window','GraphEdit','GraphNode'],Gameplay:['Timer','Path2D','Path3D','PathFollow3D','SpringArm3D','TriggerVolume','DamageVolume','SpawnPoint','Checkpoint','InteractionArea','Interactable','Collectible','Trigger','EventEmitter'],DataLogic:['Expression','Variable','ArrayStore','DictionaryStore','State','Condition','Branch','Sequence','Parallel','Delay','Loop','Counter','Randomizer','DataBinding','PropertyBinding'],Networking:['MultiplayerSpawner','MultiplayerSynchronizer','WebSocketPeer','HTTPRequest','TCPServer','PacketPeerUDP','NetworkManager'],Media:['VideoStreamPlayer','CameraFeed','AudioCapture','MovieWriter'],AI:['BehaviorTree','BehaviorTask','BehaviorSelector','BehaviorSequence','Blackboard','PathPlanner','SteeringAgent','VisionSensor','HearingSensor'],World:['World3D','World2D','Terrain3D','TerrainChunk','Water3D','Ocean3D','River3D','CloudLayer3D','TimeOfDay','WorldStreamer','LevelStreamer','ObjectPool']};
const types=[...new Set(Object.values(groups).flat())];
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('axilort.scene.v7',JSON.stringify(scene));log('Scene saved successfully.','ok')}
function load(){try{scene=JSON.parse(localStorage.getItem('axilort.scene.v7')||'[]')}catch{scene=[]}scene.forEach(n=>{n.id=n.id||uid();n.p=n.p||[0,0,0];n.r=n.r||[0,0,0];n.s=n.s||[1,1,1];n.visible=n.visible!==false});selected=scene[0]?.id||null}
function icon(t){if(/Camera|Light/.test(t))return'☼';if(/Physics|Collision|Body|Joint/.test(t))return'◈';if(/Audio/.test(t))return'♫';if(/Mesh|Sprite|Polygon|CSG/.test(t))return'◇';if(/Animation/.test(t))return'◫';return'◆'}
function renderTree(){let q=$("filter").value.toLowerCase(),b=$("tree");b.innerHTML='';let a=scene.filter(n=>(n.name+' '+n.type).toLowerCase().includes(q));if(!a.length){b.innerHTML='<div class="empty">No elements in this scene</div>';return}a.forEach(n=>{let r=document.createElement('div');r.className='treeRow'+(n.id===selected?' selected':'');r.innerHTML=`<span class="rowIcon">${icon(n.type)}</span><span class="rowName">${esc(n.name)}</span><span class="eye">${n.visible?'●':'○'}</span>`;r.onclick=()=>{selected=n.id;renderAll()};r.ondblclick=()=>{let v=prompt('Element name',n.name);if(v){n.name=v;save();renderAll()}};b.appendChild(r)})}
function renderFS(){let q=$("fileFilter").value.toLowerCase();$("fs").innerHTML=['scenes/','scripts/','assets/','textures/','models/','materials/','icon.png','project.axilort'].filter(x=>x.toLowerCase().includes(q)).map(x=>`<div class="fileRow"><span class="rowIcon ${x.endsWith('/')?'folder':''}">${x.endsWith('/')?'▰':'◆'}</span><span class="rowName">${x}</span></div>`).join('')||'<div class="empty">No files</div>'}
function vec(label,k,v){return `<div class="prop"><label>${label}</label><div class="vec"><div class="vfield"><span>X</span><input id="in${k}x" type="number" value="${v[0]}"></div><div class="vfield y"><span>Y</span><input id="in${k}y" type="number" value="${v[1]}"></div><div class="vfield z"><span>Z</span><input id="in${k}z" type="number" value="${v[2]}"></div></div></div>`}
function renderInspector(){let b=$("insContent"),n=scene.find(x=>x.id===selected);if(!n){b.innerHTML='<div class="empty">Select an element to inspect</div>';return}b.innerHTML=`<div class="selectedElement"><div class="elementGlyph">${icon(n.type)}</div><div><b>${esc(n.name)}</b><small>${esc(n.type)}</small></div></div><div class="section"><div class="sectionTitle">Element</div><div class="sectionBody"><div class="prop"><label>Name</label><input class="field" id="inName" value="${esc(n.name)}"></div><label class="check"><input id="vis" type="checkbox" ${n.visible?'checked':''}> Visible</label></div></div><div class="section"><div class="sectionTitle">Transform</div><div class="sectionBody">${vec('Position','p',n.p)}${vec('Rotation','r',n.r)}${vec('Scale','s',n.s)}</div></div><div class="section"><div class="sectionTitle">Rendering</div><div class="sectionBody"><label class="check"><input type="checkbox" checked> Cast Shadow</label><br><label class="check"><input type="checkbox" checked> Receive Shadow</label></div></div>`;$("inName").onchange=e=>{n.name=e.target.value||n.name;save();renderAll()};$("vis").onchange=e=>{n.visible=e.target.checked;save();renderAll()};['p','r','s'].forEach(k=>'xyz'.split('').forEach((a,i)=>$("in"+k+a).onchange=e=>{n[k][i]=Number(e.target.value)||0;save()}))}
function renderAll(){renderTree();renderFS();renderInspector();$("objCount").textContent='Objects: '+scene.length}
function add(t){let n={id:uid(),name:t.replace(/(2D|3D)$/,''),type:t,parent:selected,p:[0,0,0],r:[0,0,0],s:[1,1,1],visible:true};scene.push(n);selected=n.id;save();closeModal();renderAll();log('Added '+t+'.','ok')}
function renderNodes(){let q=$("nodeFilter").value.toLowerCase(),b=$("nodeList");b.innerHTML='';for(const[g,a]of Object.entries(groups)){let m=a.filter(t=>t.toLowerCase().includes(q));if(!m.length)continue;let h=document.createElement('div');h.style.cssText='padding:8px 6px 4px;color:#777c84;font-size:8px;font-weight:700;text-transform:uppercase';h.textContent=g;b.appendChild(h);m.forEach(t=>{let x=document.createElement('button');x.className='fileRow';x.dataset.type=t;x.innerHTML=`<span class="rowIcon">${icon(t)}</span><span class="rowName">${t}</span>`;x.onclick=()=>{b.dataset.type=t;b.querySelectorAll('.fileRow').forEach(y=>y.style.background='');x.style.background='#382023'};b.appendChild(x)})}}
function openModal(){$("modal").style.display='grid';renderNodes()}function closeModal(){$("modal").style.display='none'}
function setView(v){view=v;$("viewport").classList.toggle('mode3d',v==='3d');$("viewport").classList.toggle('mode2d',v==='2d');$("mode3d").classList.toggle('active',v==='3d');$("mode2d").classList.toggle('active',v==='2d');$("viewMode").textContent=v==='3d'?'3D · Perspective':'2D · Orthographic';$("viewportInfo").textContent=$("viewMode").textContent;$("editorMode").classList.toggle('active',v!=='script');$("scriptMode").classList.toggle('active',v==='script')}
function panel(k,open){app.classList.toggle(k+'-closed',!open);if(k==='bottom')app.classList.toggle('bottom-open',open);localStorage.setItem('axilort.panel.'+k,open?'1':'0')}
function bottomOpen(name){app.classList.add('bottom-open');app.classList.remove('bottom-closed');document.querySelectorAll('.bottomTab').forEach(x=>x.classList.toggle('active',x.dataset.panel===name));let title=name[0].toUpperCase()+name.slice(1);$("bottomTitle").textContent=title;const b=$("outputText");if(name==='debugger')b.innerHTML='<div class="log ok">Debugger ready · No errors or warnings.</div>';else if(name==='animation')b.innerHTML='<div class="log">Animation workspace ready.</div><div class="log">AnimationPlayer and AnimationTree controls will appear here.</div>';else if(name==='audio')b.innerHTML='<div class="log">Audio monitor ready.</div>';else if(name==='script')b.innerHTML='<div class="log">Script output ready.</div><div class="log">Open the Script workspace from the top toolbar.</div>';else b.innerHTML='<div class="log">[Output] Axilort Engine ready.</div><div class="log ok">[Console] No messages.</div>';localStorage.setItem('axilort.panel.bottom','1')}
function log(text,kind=''){let b=$("outputText");b.innerHTML+=`<div class="log ${kind}">[${new Date().toLocaleTimeString([], {hour12:false})}] ${esc(text)}</div>`;b.scrollTop=b.scrollHeight}
function makeResizable(el,cssVar,min,max,axis){let down=false,start=0,startVal=0;el.addEventListener('pointerdown',e=>{down=true;start=axis==='x'?e.clientX:e.clientY;startVal=parseInt(getComputedStyle(document.documentElement).getPropertyValue(cssVar))||0;el.setPointerCapture(e.pointerId);document.body.style.cursor=axis==='x'?'col-resize':'row-resize';e.preventDefault()});el.addEventListener('pointermove',e=>{if(!down)return;let delta=(axis==='x'?e.clientX:e.clientY)-start;let v=Math.max(min,Math.min(max,startVal+(axis==='x'?delta:-delta)));document.documentElement.style.setProperty(cssVar,v+'px')});el.addEventListener('pointerup',()=>{down=false;document.body.style.cursor='';localStorage.setItem('axilort.size.'+cssVar, getComputedStyle(document.documentElement).getPropertyValue(cssVar).trim())})}
$("add").onclick=openModal;$("close").onclick=closeModal;$("cancel").onclick=closeModal;$("confirm").onclick=()=>add($("nodeList").dataset.type||types[0]);$("nodeFilter").oninput=renderNodes;$("filter").oninput=renderTree;$("fileFilter").oninput=renderFS;$("leftClose").onclick=()=>panel('left',false);$("leftOpen").onclick=()=>panel('left',true);$("rightClose").onclick=()=>panel('right',false);$("rightOpen").onclick=()=>panel('right',true);$("toggleLeft").onclick=()=>panel('left',app.classList.contains('left-closed'));$("toggleRight").onclick=()=>panel('right',app.classList.contains('right-closed'));$("toggleBottom").onclick=()=>app.classList.contains('bottom-closed')?bottomOpen('output'):panel('bottom',false);$("bottomOpen").onclick=()=>bottomOpen('output');$("bottomClose").onclick=()=>panel('bottom',false);$("bottomClose2").onclick=()=>panel('bottom',false);$("clearOutput").onclick=()=>$("outputText").innerHTML='';$("save").onclick=save;$("mode3d").onclick=()=>setView('3d');$("mode2d").onclick=()=>setView('2d');$("scriptMode").onclick=()=>bottomOpen('script');$("run").onclick=()=>log('Project run requested.','ok');$("pause").onclick=()=>log('Project paused.');$("stop").onclick=()=>log('Project stopped.');$("undo").onclick=()=>log('Undo is ready for scene history.');$("redo").onclick=()=>log('Redo is ready for scene history.');document.querySelectorAll('.bottomTab').forEach(x=>x.onclick=()=>bottomOpen(x.dataset.panel));
load();renderAll();log('Axilort Engine editor ready.','ok');
try{const l=localStorage.getItem('axilort.size.--left');if(l)document.documentElement.style.setProperty('--left',l);const r=localStorage.getItem('axilort.size.--right');if(r)document.documentElement.style.setProperty('--right',r)}catch{}
makeResizable($("leftResize"),'--left',130,340,'x');makeResizable($("rightResize"),'--right',140,360,'x');makeResizable($("leftSplit"),'--left',130,340,'y');
// Bottom panel deliberately starts closed on the v7 editor layout. Its rail remains visible so it can always be reopened.
app.classList.remove('bottom-open');app.classList.add('bottom-closed');
</script>
</body>
</html>
