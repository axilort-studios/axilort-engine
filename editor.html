<style>

action:none}.scene-object.selected{border-color:#ff2028;box-shadow:0 0 0 1px #ff202833,0 8px 25px #0007}.scene-object .handle{position:absolute;width:7px;height:7px;background:#ff2028;border-radius:50%;right:-4px;bottom:-4px}.script-editor,.game-preview{position:absolute;inset:0;display:none}.script-editor textarea{width:100%;height:100%;border:0;outline:0;resize:none;background:#070708;color:#ddd;padding:16px;font:12px/1.7 "SFMono-Regular",Consolas,monospace}.game-preview iframe{width:100%;height:100%;border:0;background:#fff}.inspector{grid-column:4;border-left:1px solid #242426;background:#0b0b0c;min-width:0;display:flex;flex-direction:column}.inspector-head{height:40px;display:flex;align-items:center;padding:0 11px;border-bottom:1px solid #202023;text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:800}.selected-info{padding:10px 11px;border-bottom:1px solid #202023;display:flex;gap:9px;align-items:center}.bigicon{width:32px;height:32px;border:1px solid #303034;border-radius:7px;display:grid;place-items:center;background:#151517}.selname{font-size:12px;font-weight:700}.seltype{font-size:10px;color:#777;margin-top:2px}.inspector-body{overflow:auto}.section{border-bottom:1px solid #202023}.section-title{height:32px;padding:0 11px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700}.props{padding:0 10px 10px}.prop{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:7px;margin:5px 0}.prop label{font-size:10px;color:#888}.prop input,.prop select{width:100%;min-width:0;background:#111113;border:1px solid #29292c;color:#ddd;border-radius:5px;padding:5px 6px;font-size:10px;outline:0}.vec3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.check{display:flex;align-items:center;gap:7px;font-size:10px;color:#aaa}.check input{accent-color:#ff2028}.empty-inspector{padding:24px 12px;text-align:center;color:#666;font-size:11px}.menu{position:fixed;display:none;z-index:50;background:#111113;border:1px solid #303034;border-radius:8px;padding:5px;box-shadow:0 14px 40px #000b;min-width:165px}.menu button{display:block;width:100%;border:0;background:transparent;color:#ddd;text-align:left;padding:8px 9px;border-radius:5px;font-size:11px}.menu button:hover{background:#1d1d20}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:60}.dialog{width:min(380px,92vw);background:#111113;border:1px solid #303034;border-radius:10px;padding:15px;box-shadow:0 25px 80px #000}.dialog h3{margin:0 0 12px;font-size:14px}.dialog input,.dialog select{width:100%;background:#09090a;border:1px solid #303034;color:#fff;border-radius:6px;padding:9px;outline:0;margin-bottom:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:7px}.dialog-actions button{background:#18181a;border:1px solid #303034;color:#ddd;border-radius:6px;padding:7px 11px;font-size:11px}.dialog-actions .primary{border-color:#ff2028;background:#b9151c;color:#fff}.toast{position:fixed;bottom:15px;right:15px;background:#171719;border:1px solid #303034;border-radius:8px;padding:8px 11px;font-size:11px;display:none;z-index:80}.hidden{display:none!important}@media(max-width:900px){.app{grid-template-columns:46px 205px minmax(260px,1fr);grid-template-rows:44px 1fr}.top{grid-column:2/4}.inspector{position:fixed;right:0;top:44px;bottom:0;width:290px;z-index:30;display:none;box-shadow:-15px 0 35px #0009}.inspector.mobile-show{display:flex}}@media(max-width:600px){.app{grid-template-columns:44px 1fr}.top{grid-column:2}.left{position:fixed;left:44px;top:44px;bottom:0;width:210px;z-index:25;display:none;box-shadow:15px 0 35px #0009}.left.mobile-show{display:grid}.center{grid-column:2}.brand,.crumb{display:none}}

<body>
<div class="app">
<aside class="sidebar"><div class="logo">A</div><button class="nav active" title="Editor">▣</button><button class="nav" id="sceneNav" title="Scene">⌘</button><button class="nav" title="Projects" onclick="location.href='projects.html'">▦</button><button class="nav" title="Assets" onclick="location.href='assets.html'">◫</button><button class="nav" title="Settings" onclick="location.href='settings.html'">⚙</button></aside>
<header class="top"><span class="brand">AXILORT ENGINE</span><span class="crumb"> / Editor / <b id="projectName">Default Project</b></span><span class="spacer"></span><button id="sceneBtn">Scene</button><button id="saveBtn">Save</button><button class="run" id="runBtn">▶ Run</button></header>
<section class="left" id="leftPanel">
<div class="panel"><div class="panel-head"><span>Scene</span><button id="addNodeBtn">+</button></div><div class="tree" id="nodeTree"></div></div>
<div class="panel"><div class="panel-head"><span>FileSystem</span><button id="fileBtn">+</button></div><div class="fs" id="fs"></div></div>
</section>
<main class="center"><div class="modes"><button class="mode active" data-mode="2d">2D</button><button class="mode" data-mode="3d">3D</button><button class="mode" data-mode="script">Script</button><button class="mode" data-mode="game">Game</button></div><div class="toolbar"><button id="addNodeToolbar">+ Add Node</button><button id="saveScene">Save Scene</button><button id="focusBtn">Focus</button><span class="hint" id="status">Ready</span></div><div class="viewport" id="viewport"><div class="grid" id="grid"></div><div class="cross"></div><div class="scene-canvas" id="sceneCanvas"></div><div class="script-editor" id="scriptEditor"><textarea id="scriptCode" spellcheck="false"></textarea></div><div class="game-preview" id="gamePreview"><iframe id="gameFrame" sandbox="allow-scripts allow-forms"></iframe></div></div></main>

</div>
<div class="menu" id="menu"><button data-act="add-child">Add Child Node</button><button data-act="rename">Rename</button><button data-act="duplicate">Duplicate</button><button data-act="delete">Delete</button></div>
<div class="modal" id="modal"><div class="dialog"><h3 id="dialogTitle">Add Node</h3><select id="nodeType"></select><input id="nodeName" placeholder="Node name"><div class="dialog-actions"><button id="cancelDialog">Cancel</button><button class="primary" id="confirmDialog">Add Node</button></div></div></div>
<div class="toast" id="toast"></div>
<input id="fileInput" type="file" multiple hidden>
<script>
const DB="axilort-engine-data",SCENE_STORE="editorScenes",FILE_STORE="editorFiles";let db,nodes=[],files=[],selectedId=null,menuNode=null,mode="2d",project="Default Project",editingFile=null,dirty=false;const $=id=>document.getElementById(id);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const ELEMENT_GROUPS={
Core:["Node","Node2D","Node3D","SceneInstance","SubViewport","ViewportContainer","ResourceContainer","TransformGizmo","Marker2D","Marker3D"],
Rendering2D:["Sprite2D","AnimatedSprite2D","Sprite2DRegion","Polygon2D","Line2D","MultiMeshInstance2D","Parallax2D","ParallaxLayer","TileMap","TileMapLayer","TileSet","LightOccluder2D","PointLight2D","DirectionalLight2D","CanvasModulate","CanvasGroup","VisibleOnScreenNotifier2D","VisibleOnScreenEnabler2D","GPUParticles2D","CPUParticles2D","ParticleEmitter2D","Trail2D","Decal2D","MeshInstance2D","NinePatchRect"],
Rendering3D:["MeshInstance3D","MultiMeshInstance3D","CSGBox3D","CSGSphere3D","CSGCylinder3D","CSGTorus3D","CSGPolygon3D","CSGMesh3D","CSGCombiner3D","Decal","FogVolume","VoxelGI","LightmapGI","LightmapProbe","ReflectionProbe","OccluderInstance3D","GPUParticles3D","GPUParticlesCollisionBox3D","GPUParticlesCollisionSphere3D","GPUParticlesCollision3D","CPUParticles3D","RibbonTrail3D","TubeTrail3D","GridMap","WorldEnvironment","SkyEnvironment","PhysicalSky","ProceduralSky","PanoramaSky","EnvironmentVolume","ReflectionCapture3D"],
CamerasLighting:["Camera2D","Camera3D","OrthographicCamera3D","PerspectiveCamera3D","DirectionalLight3D","OmniLight3D","SpotLight3D","AreaLight3D","LightProbe3D","ShadowCaster3D","AudioListener2D","AudioListener3D","Listener3D"],
Physics2D:["StaticBody2D","RigidBody2D","CharacterBody2D","AnimatableBody2D","Area2D","CollisionShape2D","CollisionPolygon2D","RayCast2D","ShapeCast2D","PointQuery2D","PhysicsJoint2D","PinJoint2D","GrooveJoint2D","DampedSpringJoint2D","CharacterController2D","NavigationObstacle2D"],
Physics3D:["StaticBody3D","RigidBody3D","CharacterBody3D","AnimatableBody3D","Area3D","CollisionShape3D","CollisionPolygon3D","RayCast3D","ShapeCast3D","PhysicalBone3D","PhysicalBoneSimulator3D","Generic6DOFJoint3D","HingeJoint3D","SliderJoint3D","ConeTwistJoint3D","PinJoint3D","VehicleBody3D","VehicleWheel3D","SoftBody3D","NavigationObstacle3D"],
Navigation:["NavigationRegion2D","NavigationAgent2D","NavigationLink2D","NavigationObstacle2D","NavigationPolygon","NavigationRegion3D","NavigationAgent3D","NavigationLink3D","NavigationObstacle3D","NavigationMesh","NavigationPath","NavigationServerProxy"],
Animation:["AnimationPlayer","AnimationTree","AnimationMixer","AnimatedMeshInstance3D","Skeleton2D","Bone2D","Skeleton3D","BoneAttachment3D","LookAtModifier3D","AimModifier3D","SpringBoneSimulator3D","PhysicalBoneSimulator3D","BlendSpace1D","BlendSpace2D","StateMachine","AnimationState","AnimationLibrary"],
Audio:["AudioStreamPlayer","AudioStreamPlayer2D","AudioStreamPlayer3D","AudioListener2D","AudioListener3D","AudioEffectController","AudioEffectReverb","AudioEffectDelay","AudioEffectChorus","AudioEffectDistortion","AudioEffectEQ","AudioEffectFilter","AudioEffectCompressor","AudioEffectLimiter","AudioEffectPhaser","AudioEffectPitchShift","AudioEffectAmplify","AudioEffectPanner"],
UI:["Control","Panel","PanelContainer","MarginContainer","HBoxContainer","VBoxContainer","GridContainer","CenterContainer","ScrollContainer","TabContainer","SplitContainer","HSplitContainer","VSplitContainer","AspectRatioContainer","FlowContainer","TextureRect","ColorRect","TextureButton","Button","CheckBox","CheckButton","OptionButton","MenuButton","LinkButton","ToolButton","SpinBox","HSlider","VSlider","ProgressBar","TextureProgressBar","LineEdit","CodeEdit","ItemList","Tree","TabBar","Separator","HSeparator","VSeparator","ColorPicker","ColorPickerButton","FileDialog","AcceptDialog","ConfirmationDialog","Popup","PopupPanel","Window","GraphEdit","GraphNode"],
ParticlesEffects:["GPUParticlesCollisionBox3D","GPUParticlesCollisionSphere3D","GPUParticlesCollisionSDF3D","GPUParticlesCollisionHeightField3D","ParticleAttractorBox3D","ParticleAttractorSphere3D","ParticleAttractorVectorField3D","ParticleCollision2D","ParticleAttractor2D","ParticleProcessMaterial","ParticleMaterial","TrailRenderer","RibbonRenderer"],
Gameplay:["Timer","TimeSource","TweenController","Path2D","PathFollow2D","Path3D","PathFollow3D","RemoteTransform2D","RemoteTransform3D","SpringArm3D","Marker2D","Marker3D","WindZone3D","TriggerVolume","DamageVolume","SpawnPoint","Checkpoint","RespawnPoint","InteractionArea","Interactable","Collectible","Trigger","LogicGate","EventEmitter","EventReceiver"],
DataLogic:["Expression","Variable","ArrayStore","DictionaryStore","State","StateMachineController","SignalEmitter","SignalReceiver","Condition","Branch","Sequence","Parallel","Delay","Loop","Counter","Randomizer","DataBinding","PropertyBinding","ResourceLoader","ResourceSaver","SceneLoader","SceneSpawner"],
Networking:["MultiplayerSpawner","MultiplayerSynchronizer","ENetPeer","WebSocketPeer","WebRTCPeerConnection","WebRTCDataChannel","HTTPRequest","HTTPClient","TCPServer","PacketPeerUDP","PacketPeerTCP","NetworkManager"],
Media:["VideoStreamPlayer","CameraFeed","CameraServer","ImageTextureSource","AudioCapture","AudioStreamMicrophone","AudioStreamGenerator","MovieWriter"],
AI:["NavigationAgent2D","NavigationAgent3D","BehaviorTree","BehaviorTask","BehaviorSelector","BehaviorSequence","BehaviorParallel","Blackboard","AStarGrid2DController","AStar3DController","PathPlanner","SteeringAgent","TargetTracker","VisionSensor","HearingSensor"],
World:["World3D","World2D","Terrain3D","TerrainChunk","Water3D","Ocean3D","River3D","CloudLayer3D","WindField3D","TimeOfDay","DayNightCycle","WorldStreamer","LevelStreamer","SceneTransition","SpawnManager","ObjectPool"]
};
const ELEMENT_TYPES=Object.entries(ELEMENT_GROUPS).flatMap(([group,types])=>types.map(type=>({group,type})));
function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").style.display="none",1700)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,3);r.onupgradeneeded=()=>{db=r.result;if(!db.objectStoreNames.contains(SCENE_STORE))db.createObjectStore(SCENE_STORE,{keyPath:"project"});if(!db.objectStoreNames.contains(FILE_STORE))db.createObjectStore(FILE_STORE,{keyPath:"id",autoIncrement:true})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function getAll(store){return new Promise((res,rej)=>{let r=db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(store,obj){return new Promise((res,rej)=>{let r=db.transaction(store,"readwrite").objectStore(store).put(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function del(store,key){return new Promise((res,rej)=>{let r=db.transaction(store,"readwrite").objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function children(id){return nodes.filter(n=>n.parent===id)}function icon(type){return ({Node:"◆",Node2D:"◇",Node3D:"◇",Sprite2D:"▧",AnimatedSprite2D:"▧",MeshInstance3D:"◇",Camera2D:"◉",Camera3D:"◉",DirectionalLight3D:"☀",OmniLight3D:"✦",SpotLight3D:"✦",StaticBody2D:"◈",StaticBody3D:"◈",RigidBody2D:"●",RigidBody3D:"●",CharacterBody2D:"●",CharacterBody3D:"●",Area2D:"◎",Area3D:"◎",CollisionShape2D:"△",CollisionShape3D:"△",AudioStreamPlayer:"♫",AudioStreamPlayer2D:"♫",AudioStreamPlayer3D:"♫",AnimationPlayer:"◆",GPUParticles2D:"✹",GPUParticles3D:"✹",Control:"□",Panel:"□",Button:"▣",Timer:"◷",Path2D:"⌁",Path3D:"⌁",WorldEnvironment:"☼",NavigationRegion2D:"⌂",NavigationRegion3D:"⌂"})[type]||"◆"}
function populateNodeTypes(){const sel=$("nodeType");sel.innerHTML="";const seen=new Set;ELEMENT_TYPES.forEach(({group,type})=>{if(seen.has(type))return;seen.add(type);let og=[...sel.children].find(x=>x.label===group);if(!og){og=document.createElement("optgroup");og.label=group;sel.appendChild(og)}let o=document.createElement("option");o.value=type;o.textContent=type;og.appendChild(o)});if(sel.options.length)sel.selectedIndex=0}
async function load(){const saved=(await getAll(SCENE_STORE)).find(x=>x.project===project);if(saved?.nodes?.length)nodes=saved.nodes;else{nodes=[{id:uid(),name:"Main",type:"Node2D",parent:null,position:{x:0,y:0,z:0},rotation:{x:0,y:0,z:0},scale:{x:1,y:1,z:1},visible:true}];await saveScene(false)}nodes.forEach(normalizeNode);selectedId=nodes[0]?.id||null;files=(await getAll(FILE_STORE)).filter(f=>f.project===project);if(!files.length){await put(FILE_STORE,{project,name:"main.html",kind:"file",content:'<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#111;color:white;font-family:system-ui;display:grid;place-items:center;height:100vh}h1{font-size:28px}</style></head><body><h1>My Axilort Game</h1></body></html>'});await put(FILE_STORE,{project,name:"main.js",kind:"file",content:'console.log("Axilort Engine");'});files=await getAll(FILE_STORE);files=files.filter(f=>f.project===project)}populateNodeTypes();render()}
async function saveScene(show=true){await put(SCENE_STORE,{project,nodes,updatedAt:Date.now()});dirty=false;$("status").textContent="Scene saved";if(show)toast("Scene saved")}
function renderTree(){let root=$("nodeTree");root.innerHTML="";function branch(parent,depth){children(parent).forEach(n=>{let row=document.createElement("div");row.className="node"+(selectedId===n.id?" selected":"");row.style.paddingLeft=(5+depth*14)+"px";let kids=children(n.id);row.innerHTML=`<span class="arrow">${kids.length?"▾":""}</span><span class="icon">${icon(n.type)}</span><span class="name">${esc(n.name)}</span><span class="more">⋮</span>`;row.onclick=e=>{e.stopPropagation();selectNode(n.id)};row.ondblclick=e=>{e.stopPropagation();selectNode(n.id)};row.oncontextmenu=e=>{e.preventDefault();showMenu(e.clientX,e.clientY,n)};root.appendChild(row);branch(n.id,depth+1)})}branch(null,0)}
function renderFS(){let box=$("fs");box.innerHTML="";files.forEach(f=>{let d=document.createElement("div");d.className="file"+(editingFile===f.id?" active":"");d.innerHTML=`<span class="ficon">${f.kind==="folder"?"▾":"•"}</span><span>${esc(f.name)}</span>`;d.onclick=()=>openFile(f);d.oncontextmenu=e=>{e.preventDefault();toast("Use + to create files")};box.appendChild(d)})}
function normalizeNode(n){n.position=n.position||{x:0,y:0,z:0};if(n.position.z==null)n.position.z=0;n.rotation=n.rotation||{x:0,y:0,z:0};if(typeof n.rotation==="number")n.rotation={x:0,y:0,z:n.rotation};if(n.rotation.x==null)n.rotation.x=0;if(n.rotation.y==null)n.rotation.y=0;if(n.rotation.z==null)n.rotation.z=0;n.scale=n.scale||{x:1,y:1,z:1};if(n.scale.z==null)n.scale.z=1;return n}
function renderInspector(){let n=nodes.find(x=>x.id===selectedId),box=$("inspectorContent");if(!n){box.innerHTML='<div class="empty-inspector">Select a node to inspect its properties.</div>';return}normalizeNode(n);box.innerHTML=`<div class="selected-info"><div class="bigicon">${icon(n.type)}</div><div><div class="selname">${esc(n.name)}</div><div class="seltype">${esc(n.type)}</div></div></div><div class="section"><div class="section-title">Node</div><div class="props"><div class="prop"><label>Name</label><input id="pName" value="${esc(n.name)}"></div><div class="prop"><label>Type</label><input value="${esc(n.type)}" disabled></div><label class="check"><input id="pVisible" type="checkbox" ${n.visible!==false?"checked":""}> Visible</label></div></div><div class="section"><div class="section-title">Transform</div><div class="props"><div class="prop"><label>Position</label><div class="vec3"><input id="px" type="number" value="${n.position.x}"><input id="py" type="number" value="${n.position.y}"><input id="pz" type="number" value="${n.position.z}"></div></div><div class="prop"><label>Rotation</label><div class="vec3"><input id="rx" type="number" value="${n.rotation.x}"><input id="ry" type="number" value="${n.rotation.y}"><input id="rz" type="number" value="${n.rotation.z}"></div></div><div class="prop"><label>Scale</label><div class="vec3"><input id="sx" type="number" step="0.1" value="${n.scale.x}"><input id="sy" type="number" step="0.1" value="${n.scale.y}"><input id="sz" type="number" step="0.1" value="${n.scale.z}"></div></div></div></div><div class="section"><div class="section-title">Hierarchy</div><div class="props"><div class="prop"><label>Parent</label><select id="parentSelect"><option value="">Root</option>${nodes.filter(x=>x.id!==n.id&&!isDescendant(x.id,n.id)).map(x=>`<option value="${x.id}" ${n.parent===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div></div></div>`;
$("pName").onchange=e=>{n.name=e.target.value.trim()||n.name;changed();renderTree();renderCanvas()};$("pVisible").onchange=e=>{n.visible=e.target.checked;changed();renderCanvas()};["px","py","pz","rx","ry","rz","sx","sy","sz"].forEach(id=>$(id).onchange=e=>{let v=Number(e.target.value);if(!Number.isFinite(v))v=0;if(id==="px")n.position.x=v;if(id==="py")n.position.y=v;if(id==="pz")n.position.z=v;if(id==="rx")n.rotation.x=v;if(id==="ry")n.rotation.y=v;if(id==="rz")n.rotation.z=v;if(id==="sx")n.scale.x=v;if(id==="sy")n.scale.y=v;if(id==="sz")n.scale.z=v;changed();renderCanvas()});$("parentSelect").onchange=e=>{n.parent=e.target.value||null;changed();renderTree();renderCanvas()}}
function isDescendant(id,ancestor){let x=nodes.find(n=>n.id===id);while(x?.parent){if(x.parent===ancestor)return true;x=nodes.find(n=>n.id===x.parent)}return false}
function changed(){dirty=true;$("status").textContent="Unsaved changes"}
function renderCanvas(){let c=$("sceneCanvas");c.innerHTML="";function draw(n){if(n.visible===false)return;normalizeNode(n);let el=document.createElement("div");el.className="scene-object"+(selectedId===n.id?" selected":"");let p=n.position,s=n.scale,z=p.z||0,depth=(mode==="3d"?Math.max(.2,1-(z/1000)):1);el.style.left=`calc(50% + ${p.x}px)`;el.style.top=`calc(50% + ${p.y}px)`;el.style.transform=`translate(-50%,-50%) rotate(${n.rotation.z||0}deg) scale(${(s.x||1)*depth},${(s.y||1)*depth})`;el.style.opacity=mode==="3d"?String(Math.max(.35,Math.min(1,1-Math.abs(z)/2500))):"1";el.dataset.id=n.id;el.innerHTML=`${esc(n.name)}<div class="handle"></div>`;el.onpointerdown=e=>startDrag(e,n);el.onclick=e=>{e.stopPropagation();selectNode(n.id)};c.appendChild(el);children(n.id).forEach(draw)}nodes.filter(n=>!n.parent).forEach(draw)}
let drag=null;function startDrag(e,n){if(mode!=="2d"&&mode!=="3d")return;e.preventDefault();e.stopPropagation();selectNode(n.id);drag={n,x:e.clientX,y:e.clientY,ox:n.position.x,oy:n.position.y};e.currentTarget.setPointerCapture?.(e.pointerId)}$("viewport").onpointermove=e=>{if(!drag)return;drag.n.position.x=drag.ox+(e.clientX-drag.x);drag.n.position.y=drag.oy+(e.clientY-drag.y);changed();renderInspector();renderCanvas()};$("viewport").onpointerup=()=>drag=null;$("viewport").onclick=()=>{selectedId=null;renderTree();renderInspector();renderCanvas()};
function selectNode(id){selectedId=id;renderTree();renderInspector();renderCanvas()}
function openModal(parent=null){populateNodeTypes();$("modal").style.display="grid";$("nodeName").value="";$("modal").dataset.parent=parent||"";setTimeout(()=>$("nodeName").focus(),0)}function closeModal(){$("modal").style.display="none"}
function addNode(parent=null){let type=$("nodeType").value||"Node",name=$("nodeName").value.trim()||type,n=normalizeNode({id:uid(),name,type,parent:parent||null,position:{x:0,y:0,z:0},rotation:{x:0,y:0,z:0},scale:{x:1,y:1,z:1},visible:true});nodes.push(n);selectedId=n.id;changed();closeModal();render();toast("Element added")}
function removeNode(id){let remove=new Set([id]),again=true;while(again){again=false;nodes.forEach(n=>{if(n.parent&&remove.has(n.parent)&&!remove.has(n.id)){remove.add(n.id);again=true}})}nodes=nodes.filter(n=>!remove.has(n.id));selectedId=nodes.find(n=>!n.parent)?.id||null;changed();render()}
function duplicateNode(id){let source=nodes.find(n=>n.id===id);if(!source)return;let last=null;function clone(old,parent){let nn={...structuredClone(normalizeNode(old)),id:uid(),name:old.name+" Copy",parent};nodes.push(nn);last=nn;children(old.id).forEach(ch=>clone(ch,nn.id))}clone(source,source.parent);selectedId=last?.id||source.id;changed();render();toast("Element duplicated")}
function showMenu(x,y,n){menuNode=n;let m=$("menu");m.style.display="block";m.style.left=Math.min(x,innerWidth-175)+"px";m.style.top=Math.min(y,innerHeight-150)+"px"}document.addEventListener("click",e=>{if(!e.target.closest("#menu"))$("menu").style.display="none"});$("menu").onclick=e=>{let a=e.target.dataset.act,n=menuNode;if(!n)return;if(a==="add-child")openModal(n.id);if(a==="rename"){let v=prompt("New name",n.name);if(v?.trim()){n.name=v.trim();changed();render()}}if(a==="duplicate")duplicateNode(n.id);if(a==="delete"&&confirm(`Delete ${n.name} and its children?`))removeNode(n.id);$("menu").style.display="none"};
$("addNodeBtn").onclick=()=>openModal(selectedId);$("addNodeToolbar").onclick=()=>openModal(selectedId);$("cancelDialog").onclick=closeModal;$("confirmDialog").onclick=()=>addNode($("modal").dataset.parent||null);$("nodeName").onkeydown=e=>{if(e.key==="Enter")$("confirmDialog").click();if(e.key==="Escape")closeModal()};
$("saveBtn").onclick=()=>saveScene(true);$("saveScene").onclick=()=>saveScene(true);$("focusBtn").onclick=()=>{let n=nodes.find(x=>x.id===selectedId);if(n){normalizeNode(n);$("grid").style.transform=`translate(${-n.position.x}px,${-n.position.y}px)`;toast("Focused on "+n.name)}};$("sceneBtn").onclick=()=>$("leftPanel").classList.toggle("mobile-show");$("sceneNav").onclick=()=>$("leftPanel").classList.toggle("mobile-show");
function setMode(m){mode=m;document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));$("scriptEditor").style.display=m==="script"?"block":"none";$("gamePreview").style.display=m==="game"?"block":"none";$("sceneCanvas").style.display=(m==="2d"||m==="3d")?"block":"none";$("grid").style.display=m==="2d"?"block":"none";$("status").textContent=m==="3d"?"3D workspace":"Ready";if(m==="game")runGame();renderCanvas()}document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
async function openFile(f){if(f.kind==="folder")return;editingFile=f.id;renderFS();if(/\.(html?|css|js|json|txt|xml|svg|glsl|gd)$/i.test(f.name)){let code=f.content||"";$("scriptCode").value=code;setMode("script");toast("Opened "+f.name)}else toast("Binary file selected")}
$("fileBtn").onclick=()=>{let name=prompt("File name","script.js");if(!name)return;put(FILE_STORE,{project,name:name.trim(),kind:"file",content:""}).then(async()=>{files=(await getAll(FILE_STORE)).filter(f=>f.project===project);renderFS();toast("File created")})};function runGame(){let f=files.find(x=>x.name.toLowerCase()==="main.html")||files.find(x=>x.name.toLowerCase().endsWith(".html"));if(!f){toast("No HTML scene found");return}$("gameFrame").srcdoc=f.content||""}$("runBtn").onclick=()=>{setMode("game");runGame();toast("Game running")};$("scriptCode").oninput=()=>{if(editingFile){let f=files.find(x=>x.id===editingFile);if(f){f.content=$("scriptCode").value;put(FILE_STORE,f);$("status").textContent="Unsaved file changes"}}};window.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();saveScene(true)}if(e.key==="Delete"&&!e.target.matches("input,textarea,select")&&selectedId){if(confirm("Delete selected node?"))removeNode(selectedId)}if(e.key==="Escape"){$("menu").style.display="none";closeModal()}});function render(){renderTree();renderFS();renderInspector();renderCanvas();$("projectName").textContent=project}openDB().then(load).catch(e=>{console.error(e);toast("Storage unavailable")});
</script>
</body>
