<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Axilort Engine Editor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070708;color:#f2f2f3;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-columns:52px 240px minmax(320px,1fr) 285px;grid-template-rows:46px 1fr}.sidebar{grid-row:1/3;border-right:1px solid #242426;background:#080809;display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:7px}.logo{width:34px;height:34px;border:1px solid #2b2b2e;border-radius:9px;display:grid;place-items:center;font-weight:900;color:#ff2028;margin-bottom:10px}.nav{width:36px;height:36px;border:1px solid transparent;border-radius:8px;background:transparent;color:#888}.nav:hover,.nav.active{background:#151517;border-color:#29292c;color:#fff}.nav.active{box-shadow:inset 2px 0 #ff2028}.top{grid-column:2/5;border-bottom:1px solid #242426;background:#09090a;display:flex;align-items:center;padding:0 11px;gap:7px}.brand{font-size:12px;font-weight:800;white-space:nowrap}.crumb{color:#777;font-size:11px}.spacer{flex:1}.top button,.toolbar button{background:#111113;border:1px solid #29292c;color:#ddd;border-radius:6px;padding:6px 9px;font-size:11px}.top button:hover,.toolbar button:hover{border-color:#555;color:#fff}.run{background:#161719!important}.run:hover{border-color:#ff2028!important}.left{grid-column:2;border-right:1px solid #242426;background:#0b0b0c;min-width:0;display:grid;grid-template-rows:45% 1fr}.panel{min-height:0;display:flex;flex-direction:column}.panel+.panel{border-top:1px solid #242426}.panel-head{height:35px;flex:none;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #202023;text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:800;color:#aaa}.panel-head button{border:0;background:transparent;color:#999;font-size:16px}.panel-head button:hover{color:#fff}.tree,.fs{padding:6px;overflow:auto}.node{min-height:27px;display:flex;align-items:center;gap:6px;padding:0 6px;border-radius:5px;font-size:12px;color:#c5c5c8;user-select:none}.node:hover,.node.selected{background:#171719}.node.selected{color:#fff}.node .arrow{width:12px;color:#777;text-align:center}.node .icon{width:15px;text-align:center}.node .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node .more{opacity:0;color:#777}.node:hover .more{opacity:1}.children{margin-left:18px}.file{display:flex;align-items:center;gap:7px;height:27px;padding:0 7px;border-radius:5px;color:#bbb;font-size:11px}.file:hover{background:#171719;color:#fff}.file .ficon{width:14px;text-align:center}.center{grid-column:3;min-width:0;display:grid;grid-template-rows:38px 35px 1fr}.modes{display:flex;border-bottom:1px solid #242426;background:#0b0b0c}.mode{border:0;border-right:1px solid #202023;background:transparent;color:#888;padding:0 15px;font-size:11px}.mode:hover,.mode.active{color:#fff;background:#151517}.mode.active{box-shadow:inset 0 -2px #ff2028}.toolbar{display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid #202023;background:#09090a}.toolbar .hint{font-size:10px;color:#666;margin-left:4px}.viewport{position:relative;min-height:0;background:#0d0e10;overflow:hidden}.grid{position:absolute;inset:0;background-image:linear-gradient(#17191c 1px,transparent 1px),linear-gradient(90deg,#17191c 1px,transparent 1px);background-size:32px 32px;opacity:.55}.cross{position:absolute;left:50%;top:50%;width:1px;height:100%;background:#22252a}.cross:after{content:"";position:absolute;left:-50vw;top:50%;width:100vw;height:1px;background:#22252a}.scene-object{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:110px;padding:13px 18px;border:1px solid #555;border-radius:7px;background:#141518;text-align:center;font-size:12px;box-shadow:0 8px 25px #0007;user-select:none}.scene-object.selected{border-color:#ff2028;box-shadow:0 0 0 1px #ff202833,0 8px 25px #0007}.scene-object .handle{position:absolute;width:7px;height:7px;background:#ff2028;border-radius:50%;right:-4px;bottom:-4px}.script-editor{position:absolute;inset:0;display:none}.script-editor textarea{width:100%;height:100%;border:0;outline:0;resize:none;background:#070708;color:#ddd;padding:16px;font:12px/1.7 "SFMono-Regular",Consolas,monospace}.game-preview{position:absolute;inset:0;display:none}.game-preview iframe{width:100%;height:100%;border:0;background:#fff}.inspector{grid-column:4;border-left:1px solid #242426;background:#0b0b0c;min-width:0;display:flex;flex-direction:column}.inspector-head{height:40px;display:flex;align-items:center;padding:0 11px;border-bottom:1px solid #202023;text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:800}.selected-info{padding:11px;border-bottom:1px solid #202023;display:flex;gap:9px;align-items:center}.bigicon{width:32px;height:32px;border:1px solid #303034;border-radius:7px;display:grid;place-items:center;background:#151517}.selname{font-size:12px;font-weight:700}.seltype{font-size:10px;color:#777;margin-top:2px}.inspector-body{overflow:auto}.section{border-bottom:1px solid #202023}.section-title{height:32px;padding:0 11px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700}.props{padding:0 10px 10px}.prop{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:7px;margin:5px 0}.prop label{font-size:10px;color:#888}.prop input,.prop select{width:100%;min-width:0;background:#111113;border:1px solid #29292c;color:#ddd;border-radius:5px;padding:5px 6px;font-size:10px;outline:0}.vec{display:grid;grid-template-columns:1fr 1fr;gap:4px}.empty-inspector{padding:24px 12px;text-align:center;color:#666;font-size:11px}.menu{position:fixed;display:none;z-index:50;background:#111113;border:1px solid #303034;border-radius:8px;padding:5px;box-shadow:0 14px 40px #000b;min-width:155px}.menu button{display:block;width:100%;border:0;background:transparent;color:#ddd;text-align:left;padding:8px 9px;border-radius:5px;font-size:11px}.menu button:hover{background:#1d1d20}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:60}.dialog{width:min(360px,90vw);background:#111113;border:1px solid #303034;border-radius:10px;padding:15px;box-shadow:0 25px 80px #000}.dialog h3{margin:0 0 12px;font-size:14px}.dialog input,.dialog select{width:100%;background:#09090a;border:1px solid #303034;color:#fff;border-radius:6px;padding:9px;outline:0;margin-bottom:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:7px}.dialog-actions button{background:#18181a;border:1px solid #303034;color:#ddd;border-radius:6px;padding:7px 11px;font-size:11px}.dialog-actions .primary{border-color:#ff2028;background:#b9151c;color:#fff}.toast{position:fixed;bottom:15px;right:15px;background:#171719;border:1px solid #303034;border-radius:8px;padding:8px 11px;font-size:11px;display:none;z-index:80}.hidden-input{display:none}@media(max-width:900px){.app{grid-template-columns:46px 205px 1fr;grid-template-rows:44px 1fr}.top{grid-column:2/4}.inspector{position:fixed;right:0;top:44px;bottom:0;width:285px;z-index:30;display:none;box-shadow:-15px 0 35px #0009}.inspector.mobile-show{display:flex}.left{grid-column:2}.center{grid-column:3}}@media(max-width:600px){.app{grid-template-columns:44px 1fr}.top{grid-column:2}.left{position:fixed;left:44px;top:44px;bottom:0;width:205px;z-index:25;display:none;box-shadow:15px 0 35px #0009}.left.mobile-show{display:grid}.center{grid-column:2}.brand{display:none}.crumb{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="logo">A</div><button class="nav active" title="Editor">▣</button><button class="nav" title="Scene">⌘</button><button class="nav" title="Projects" onclick="location.href='projects.html'">▦</button><button class="nav" title="Assets" onclick="location.href='assets.html'">◫</button><button class="nav" title="Settings" onclick="location.href='settings.html'">⚙</button></aside>
<header class="top"><span class="brand">AXILORT ENGINE</span><span class="crumb"> / Editor / <b id="projectName">Default Project</b></span><span class="spacer"></span><button id="sceneBtn">Scene</button><button id="saveBtn">Save</button><button class="run" id="runBtn">▶ Run</button></header>
<section class="left" id="leftPanel">
<div class="panel"><div class="panel-head"><span>Scene</span><button id="addNodeBtn">+</button></div><div class="tree" id="nodeTree"></div></div>
<div class="panel"><div class="panel-head"><span>FileSystem</span><button id="fileBtn">+</button></div><div class="fs" id="fs"></div></div>
</section>
<main class="center"><div class="modes"><button class="mode active" data-mode="2d">2D</button><button class="mode" data-mode="3d">3D</button><button class="mode" data-mode="script">Script</button><button class="mode" data-mode="game">Game</button></div><div class="toolbar"><button id="addNodeToolbar">+ Add Node</button><button id="saveScene">Save Scene</button><button id="focusBtn">Focus</button><span class="hint" id="status">Ready</span></div><div class="viewport" id="viewport"><div class="grid"></div><div class="cross"></div><div class="scene-object" id="sceneObject">Main Scene<div class="handle"></div></div><div class="script-editor"><textarea id="scriptCode" spellcheck="false">// Axilort Script
// Select a node and edit its properties.</n></textarea></div><div class="game-preview"><iframe id="gameFrame" sandbox="allow-scripts allow-forms"></iframe></div></div></main>
<aside class="inspector" id="inspector"><div class="inspector-head">Inspector</div><div id="inspectorContent" class="inspector-body"><div class="empty-inspector">Select a node to inspect its properties.</div></div></aside>
</div>
<div class="menu" id="menu"><button data-act="add-child">Add Child Node</button><button data-act="rename">Rename</button><button data-act="duplicate">Duplicate</button><button data-act="delete">Delete</button></div>
<div class="modal" id="modal"><div class="dialog"><h3 id="dialogTitle">Add Node</h3><select id="nodeType"><option value="Node">Node</option><option value="Node2D">Node2D</option><option value="Node3D">Node3D</option><option value="Sprite2D">Sprite2D</option><option value="Camera2D">Camera2D</option><option value="CharacterBody2D">CharacterBody2D</option><option value="Area2D">Area2D</option><option value="Label">Label</option><option value="Button">Button</option><option value="AudioStreamPlayer">AudioStreamPlayer</option></select><input id="nodeName" placeholder="Node name"><div class="dialog-actions"><button id="cancelDialog">Cancel</button><button class="primary" id="confirmDialog">Add Node</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const DB="axilort-engine-data",STORE="editorFiles",SCENE_STORE="editorScenes";let db,nodes=[],selectedId=null,menuNode=null,mode="2d";const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").style.display="none",1700)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});if(!db.objectStoreNames.contains(SCENE_STORE))db.createObjectStore(SCENE_STORE,{keyPath:"project"})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(store,op,val){return new Promise((res,rej)=>{const t=db.transaction(store,op);const s=t.objectStore(store);const r=val===undefined?s.getAll():s.put(val);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadScene(){let all=await tx(SCENE_STORE,"readonly");let saved=all.find(x=>x.project==="Default Project");if(saved&&saved.nodes){nodes=saved.nodes}else{nodes=[{id:uid(),name:"Main",type:"Node2D",parent:null,position:{x:0,y:0},rotation:0,scale:{x:1,y:1},visible:true}];await saveScene(false)}selectedId=nodes[0]?.id||null;render()}
async function saveScene(show=true){await tx(SCENE_STORE,"readwrite",{project:"Default Project",nodes});$("status").textContent="Scene saved";if(show)toast("Scene saved")}
function children(parent){return nodes.filter(n=>n.parent===parent)}
function icon(type){return ({Node:"◆",Node2D:"◇",Node3D:"◇",Sprite2D:"▧",Camera2D:"◉",CharacterBody2D:"●",Area2D:"◎",Label:"T",Button:"▣",AudioStreamPlayer:"♫"})[type]||"◆"}
function render(){renderTree();renderInspector();renderObject();renderFS()}
function renderTree(){const root=$("nodeTree");root.innerHTML="";function branch(parent,box,depth){children(parent).forEach(n=>{let row=document.createElement("div");row.className="node "+(selectedId===n.id?"selected":"");row.style.paddingLeft=(6+depth*14)+"px";let kids=children(n.id);row.innerHTML=`<span class="arrow">${kids.length?"▾":""}</span><span class="icon">${icon(n.type)}</span><span class="name">${escapeHtml(n.name)}</span><span class="more">⋮</span>`;row.onclick=e=>{e.stopPropagation();selectNode(n.id)};row.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();showMenu(e.clientX,e.clientY,n)};box.appendChild(row);if(kids.length){let c=document.createElement("div");c.className="children";box.appendChild(c);branch(n.id,c,depth+1)}}}branch(null,root,0);$("status").textContent=nodes.length+" nodes"}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function selectNode(id){selectedId=id;render();if(window.innerWidth<=900)$("inspector").classList.add("mobile-show")}
function renderObject(){let o=$("sceneObject"),n=nodes.find(x=>x.id===selectedId);if(!n){o.style.display="none";return}o.style.display=mode==="2d"||mode==="3d"?"block":"none";o.textContent=n.name;o.classList.toggle("selected",true);let x=50+(n.position?.x||0)/8,y=50+(n.position?.y||0)/8;o.style.left=Math.max(10,Math.min(90,x))+"%";o.style.top=Math.max(10,Math.min(90,y))+"%"}
function propInput(label,value,cb){let d=document.createElement("div");d.className="prop";let l=document.createElement("label");l.textContent=label;let i=document.createElement("input");i.value=value;i.onchange=()=>cb(i.value);d.append(l,i);return d}
function renderInspector(){let box=$("inspectorContent"),n=nodes.find(x=>x.id===selectedId);box.innerHTML="";if(!n){box.innerHTML='<div class="empty-inspector">Select a node to inspect its properties.</div>';return}box.innerHTML=`<div class="selected-info"><div class="bigicon">${icon(n.type)}</div><div><div class="selname">${escapeHtml(n.name)}</div><div class="seltype">${escapeHtml(n.type)}</div></div></div>`;let general=document.createElement("div");general.className="section";general.innerHTML='<div class="section-title">▾ Node</div>';let gp=document.createElement("div");gp.className="props";gp.appendChild(propInput("Name",n.name,v=>{n.name=v;render();}));let type=propInput("Type",n.type,()=>{});gp.appendChild(type);general.appendChild(gp);box.appendChild(general);let trans=document.createElement("div");trans.className="section";trans.innerHTML='<div class="section-title">▾ Transform</div>';let p=document.createElement("div");p.className="props";let pos=document.createElement("div");pos.className="prop";pos.innerHTML='<label>Position</label>';let pv=document.createElement("div");pv.className="vec";let px=document.createElement("input");let py=document.createElement("input");px.value=n.position?.x||0;py.value=n.position?.y||0;px.onchange=()=>{n.position.x=Number(px.value)||0;renderObject()};py.onchange=()=>{n.position.y=Number(py.value)||0;renderObject()};pv.append(px,py);pos.appendChild(pv);p.appendChild(pos);p.appendChild(propInput("Rotation",n.rotation||0,v=>{n.rotation=Number(v)||0;renderObject()}));let sc=document.createElement("div");sc.className="prop";sc.innerHTML='<label>Scale</label>';let sv=document.createElement("div");sv.className="vec";let sx=document.createElement("input"),sy=document.createElement("input");sx.value=n.scale?.x||1;sy.value=n.scale?.y||1;sx.onchange=()=>{n.scale.x=Number(sx.value)||1;renderObject()};sy.onchange=()=>{n.scale.y=Number(sy.value)||1;renderObject()};sv.append(sx,sy);sc.appendChild(sv);p.appendChild(sc);let vis=propInput("Visible",n.visible!==false?"true":"false",v=>{n.visible=v!=="false";renderObject()});p.appendChild(vis);trans.appendChild(p);box.appendChild(trans)}
function renderFS(){let fs=$("fs");fs.innerHTML='<div class="file"><span class="ficon">▰</span><span>res://</span></div><div class="file"><span class="ficon">◈</span><span>main.scene</span></div><div class="file"><span class="ficon">◈</span><span>main.js</span></div><div class="file"><span class="ficon">◈</span><span>assets/</span></div>'}
function openAdd(parent=null){$("nodeType").value="Node2D";$("nodeName").value="NewNode";$("modal").style.display="grid";$("modal").dataset.parent=parent||"";setTimeout(()=>$("nodeName").focus(),30)}
$("addNodeBtn").onclick=()=>openAdd(null);$("addNodeToolbar").onclick=()=>openAdd(selectedId);$("cancelDialog").onclick=()=>$("modal").style.display="none";$("confirmDialog").onclick=()=>{let name=$("nodeName").value.trim()||"Node";let n={id:uid(),name,type:$("nodeType").value,parent:$("modal").dataset.parent||null,position:{x:0,y:0},rotation:0,scale:{x:1,y:1},visible:true};nodes.push(n);selectedId=n.id;$("modal").style.display="none";render();toast("Node added")};$("nodeName").onkeydown=e=>{if(e.key==="Enter")$("confirmDialog").click()};
function showMenu(x,y,n){menuNode=n;$("menu").style.display="block";$("menu").style.left=x+"px";$("menu").style.top=y+"px"}document.onclick=e=>{if(!e.target.closest("#menu"))$("menu").style.display="none"};$("menu").onclick=e=>{let a=e.target.dataset.act,n=menuNode;if(!n)return;if(a==="add-child")openAdd(n.id);if(a==="rename"){let v=prompt("Node name",n.name);if(v){n.name=v;render()}}if(a==="duplicate"){let copy={...n,id:uid(),name:n.name+" Copy",position:{...n.position},scale:{...n.scale}};copy.parent=n.parent;nodes.push(copy);selectedId=copy.id;render();toast("Node duplicated")}if(a==="delete"){if(n.parent===null&&nodes.length===1){toast("Root node cannot be deleted")}else{let ids=[n.id];for(let i=0;i<ids.length;i++)nodes.filter(x=>x.parent===ids[i]).forEach(x=>ids.push(x.id));nodes=nodes.filter(x=>!ids.includes(x.id));selectedId=nodes[0]?.id||null;render();toast("Node deleted")}}$("menu").style.display="none"};
$("saveBtn").onclick=()=>saveScene(true);$("saveScene").onclick=()=>saveScene(true);$("focusBtn").onclick=()=>{let o=$("sceneObject");o.animate([{transform:"translate(-50%,-50%) scale(1)"},{transform:"translate(-50%,-50%) scale(1.08)"},{transform:"translate(-50%,-50%) scale(1)"}],{duration:350});toast("Focused selected node")};
$("runBtn").onclick=()=>{let n=nodes.find(x=>x.id===selectedId)||nodes[0];let html=`<!doctype html><html><body style="margin:0;background:#111;color:#fff;font-family:system-ui;display:grid;place-items:center;height:100vh"><div style="text-align:center"><h1>${escapeHtml(n?.name||"Axilort Scene")}</h1><p>Axilort Engine scene running</p></div></body></html>`;$("gameFrame").srcdoc=html;setMode("game");toast("Game running")};
function setMode(m){mode=m;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x.dataset.mode===m));$("viewport").querySelector(".script-editor").style.display=m==="script"?"block":"none";$("viewport").querySelector(".game-preview").style.display=m==="game"?"block":"none";renderObject();if(m==="script"){$("scriptCode").focus()}}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$("sceneBtn").onclick=()=>$("leftPanel").classList.toggle("mobile-show");$("fileBtn").onclick=()=>toast("File creation is available from Assets");
$("sceneObject").onpointerdown=e=>{let n=nodes.find(x=>x.id===selectedId);if(!n)return;let sx=e.clientX,sy=e.clientY,ox=n.position.x,oy=n.position.y;const move=ev=>{n.position.x=Math.round(ox+(ev.clientX-sx)*8);n.position.y=Math.round(oy+(ev.clientY-sy)*8);renderObject();renderInspector()};const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up)};window.addEventListener("pointermove",move);window.addEventListener("pointerup",up)};
openDB().then(loadScene).catch(()=>toast("Storage unavailable"));
</script>
</body>
</html>
