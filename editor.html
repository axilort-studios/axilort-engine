<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Axilort Engine Editor</title>
<style>
:root{--bg:#101114;--bar:#17181b;--panel:#1b1d20;--panel2:#202226;--line:#303238;--text:#e8e9ec;--muted:#858a92;--accent:#d52d35;--left:190px;--right:205px;--bottom:150px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:10px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:1px solid var(--accent)}
.app{position:relative;width:100%;height:100%;display:grid;grid-template-columns:var(--left) 4px minmax(0,1fr) 4px var(--right);grid-template-rows:36px minmax(0,1fr) 25px var(--bottom)}
.app.left-closed{--left:0px}.app.right-closed{--right:0px}.app.bottom-closed{--bottom:0px}
.top{grid-column:1/6;display:flex;align-items:center;gap:2px;padding:0 5px;background:#18191c;border-bottom:1px solid var(--line);z-index:20;min-width:0}.brand{display:flex;align-items:center;gap:5px;padding-right:6px;flex:none}.brand img{width:25px;height:25px;object-fit:contain}.brand b{font-size:9px;letter-spacing:.13em}.menus{display:flex;gap:1px}.menu{height:24px;padding:0 5px;background:transparent;border-radius:3px;color:#92969e;font-size:9px}.menu:hover{background:#292b30;color:#fff}.spacer{flex:1;min-width:3px}
.iconBtn{position:relative;width:27px;height:27px;min-width:27px;padding:0;background:transparent;border-radius:4px;color:#999da5;display:grid;place-items:center}.iconBtn:hover{background:#2a2c31;color:#fff}.iconBtn.active{background:#332023;color:#fff;box-shadow:inset 0 -2px var(--accent)}.iconBtn[data-tip]:hover:after{content:attr(data-tip);position:absolute;top:31px;left:50%;transform:translateX(-50%);z-index:1000;white-space:nowrap;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:#111317;color:#e5e6e9;font-size:8px;box-shadow:0 5px 15px #0009;pointer-events:none}.svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.group{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:#121316;overflow:visible}.group .iconBtn{border-radius:0}.save{width:27px;height:27px;border:1px solid var(--line);border-radius:4px;background:#24262a;display:grid;place-items:center;color:#bfc2c8}.save:hover{background:#303238;color:#fff}

.panel{min-height:0;display:flex;flex-direction:column;overflow:hidden}.head{height:29px;min-height:29px;display:flex;align-items:center;padding:0 6px;border-bottom:1px solid var(--line);background:#1e2024}.head b{font-size:9px;letter-spacing:.04em}.actions{margin-left:auto;display:flex}.mini{width:22px;height:22px;background:transparent;border-radius:3px;color:#858a92}.mini:hover{background:#303238;color:#fff}.search{height:23px;min-height:23px;margin:4px;display:flex;align-items:center;gap:4px;padding:0 5px;background:#131518;border:1px solid var(--line);border-radius:3px;color:#777c84}.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#ddd;font-size:9px}.scroll{min-height:0;overflow:auto}.row{height:23px;display:flex;align-items:center;gap:5px;padding:0 6px;margin:1px 3px;color:#b8bbc2;border-radius:3px}.row:hover{background:#292b30}.row.selected{background:#382023;color:#fff;box-shadow:inset 2px 0 var(--accent)}.rowIcon{width:14px;text-align:center;color:#a0a4ac}.rowName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.eye{color:#747981;font-size:9px}.empty{padding:15px 7px;text-align:center;color:#70757d;font-size:9px}
.center{grid-column:3;grid-row:2;min-width:0;min-height:0;display:grid;grid-template-rows:30px 29px minmax(0,1fr);background:#0e1012}.tabs{display:flex;align-items:end;gap:2px;padding:0 4px;background:#17181b;border-bottom:1px solid var(--line);overflow:hidden}.tab{height:27px;max-width:190px;padding:0 8px;border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;background:#23252a;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px}.tabAdd{width:27px;height:27px;background:transparent;color:#777c84}.tabAdd:hover{background:#292b30;color:#fff}.viewTools{display:flex;align-items:center;gap:1px;padding:0 4px;background:#1b1d20;border-bottom:1px solid var(--line);overflow:hidden}.vbtn{width:25px;height:25px;min-width:25px;background:transparent;border-radius:3px;color:#81868e;display:grid;place-items:center}.vbtn:hover,.vbtn.active{background:#2b2d32;color:#fff}.vbtn.active{box-shadow:inset 0 -2px var(--accent)}.mode{margin-left:auto;height:23px;padding:0 6px;border:1px solid var(--line);border-radius:3px;background:#131518;color:#999ea5;font-size:8px;white-space:nowrap}
.viewport{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(circle at 73% 18%,#56595e 0,#292c31 17%,#111316 52%,#0b0c0e 100%);touch-action:none}.viewport.mode2d{background-color:#111316;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:32px 32px}.gridPlane{position:absolute;left:8%;right:8%;bottom:9%;height:50%;opacity:.3;background:linear-gradient(90deg,transparent 49.7%,#9da2aa55 50%,transparent 50.3%),linear-gradient(0deg,transparent 49.7%,#9da2aa55 50%,transparent 50.3%);background-size:70px 70px;transform:perspective(500px) rotateX(56deg);transform-origin:center bottom}.cube{position:absolute;left:50%;top:53%;width:112px;height:112px;transform:translate(-50%,-50%) rotateX(-12deg) rotateY(25deg) rotateZ(-3deg);background:linear-gradient(135deg,#ed4149,#97171d 72%);border:2px solid #ff777aaa;border-radius:8px;box-shadow:0 20px 40px #000b,0 0 28px #d92e3530}.cube:before{content:"";position:absolute;inset:9px;border:1px solid #fff4;border-radius:4px}.sun{position:absolute;right:12%;top:11%;width:23px;height:23px;border-radius:50%;background:#fff6c9;box-shadow:0 0 17px 7px #fff3a955,0 0 50px 16px #fff5}.axis{position:absolute;right:10px;top:10px;width:52px;height:52px;border:1px solid #fff2;border-radius:50%;display:grid;place-items:center;color:#9da2aa;background:#0003;font-size:8px}.axis:after{content:"X  Y  Z";letter-spacing:4px}.info{position:absolute;left:7px;top:7px;padding:4px 6px;border:1px solid #fff2;border-radius:3px;background:#101215cc;color:#bfc3c9;font-size:8px}.status{position:absolute;right:7px;bottom:6px;color:#aeb3ba99;font-size:8px}
.insHead{height:30px;min-height:30px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:#1e2024}.insTab{height:30px;padding:0 8px;background:transparent;color:#777c84;font-size:9px}.insTab.active{color:#fff;box-shadow:inset 0 -2px var(--accent)}.insContent{min-height:0;overflow:auto}.selected{display:flex;align-items:center;gap:7px;padding:7px;border-bottom:1px solid var(--line)}.glyph{width:27px;height:27px;border:1px solid var(--line2);border-radius:4px;display:grid;place-items:center;background:#25272b;color:#d84950}.selected b{display:block;font-size:9px}.selected small{display:block;color:#7e838b;font-size:7px;margin-top:2px}.section{border-bottom:1px solid var(--line)}.sectionTitle{height:25px;display:flex;align-items:center;padding:0 7px;color:#bfc2c8;font-size:8px;font-weight:700}.sectionTitle:before{content:"⌄";margin-right:4px;color:#858a92}.sectionBody{padding:2px 7px 7px}.prop{margin:5px 0}.prop label{display:block;color:#7f848c;font-size:7px;margin-bottom:2px}.field{width:100%;height:22px;border:1px solid var(--line);border-radius:3px;background:#141518;color:#ddd;padding:0 5px;font-size:8px}.vec{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.vf{height:22px;display:flex;align-items:center;border:1px solid var(--line);border-radius:3px;background:#141518}.vf span{width:13px;text-align:center;font-size:7px;color:#d65a61}.vf.y span{color:#73bd69}.vf.z span{color:#6698d2}.vf input{width:100%;border:0;outline:0;background:transparent;color:#ddd;font-size:7px}.check{display:flex;align-items:center;gap:4px;color:#aaa;font-size:8px}.check input{accent-color:var(--accent)}
.bottomRail{grid-column:1/6;grid-row:3;background:#17181b;border-top:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 4px;z-index:15;overflow:hidden}.bottomTab{height:22px;padding:0 7px;border-radius:3px;background:transparent;color:#7f848c;font-size:8px;display:flex;align-items:center;gap:4px}.bottomTab:hover{background:#292b30;color:#fff}.bottomTab.active{background:#302023;color:#fff}.bottomSpacer{flex:1}.bottomPanel{grid-column:1/6;grid-row:4;min-height:0;background:#101114;border-top:1px solid var(--line);display:grid;grid-template-rows:29px minmax(0,1fr);overflow:hidden}.app.bottom-closed .bottomPanel{display:none}.bottomHead{display:flex;align-items:center;padding:0 6px;border-bottom:1px solid var(--line);background:#1b1d20}.bottomHead b{font-size:8px}.bottomActions{margin-left:auto;display:flex}.output{min-height:0;overflow:auto;padding:6px 8px;color:#8f959e;font:8px ui-monospace,SFMono-Regular,Consolas,monospace}.log{padding:2px 0}.ok{color:#aeb5bd}.warn{color:#c8ad73}.err{color:#d8666d}
.openDock{position:absolute;z-index:40;top:42px;width:25px;height:28px;border:1px solid var(--line);background:#1b1d20;color:#999;display:none}.openLeft{left:0;border-radius:0 4px 4px 0}.openRight{right:0;border-radius:4px 0 0 4px}.app.left-closed .openLeft,.app.right-closed .openRight{display:block}.openBottom{height:21px;padding:0 7px;border:1px solid var(--line);border-radius:3px;background:#23252a;color:#999;display:none;font-size:8px}.app.bottom-closed .openBottom{display:block}
.modal{position:fixed;inset:0;background:#0009;z-index:100;display:none;place-items:center}.dialog{width:min(360px,90vw);height:min(480px,80vh);display:grid;grid-template-rows:34px 30px minmax(0,1fr) 36px;background:#1b1d20;border:1px solid var(--line);border-radius:6px;box-shadow:0 20px 60px #000c}.dialogHead{display:flex;align-items:center;padding:0 9px;border-bottom:1px solid var(--line);font-size:10px;font-weight:700}.dialogHead button{margin-left:auto;background:transparent;color:#888;width:24px;height:24px}.dialogSearch{margin:5px}.nodeList{overflow:auto;padding:3px}.groupTitle{padding:6px;color:#777c84;font-size:7px;text-transform:uppercase;letter-spacing:.08em}.nodeOption{height:25px;display:flex;align-items:center;gap:7px;padding:0 8px;border-radius:3px;color:#b8bbc2;cursor:pointer;font-size:9px}.nodeOption:hover,.nodeOption.sel{background:#302023;color:#fff}.dialogFoot{display:flex;justify-content:flex-end;align-items:center;gap:5px;padding:0 7px;border-top:1px solid var(--line)}.dialogFoot button{height:24px;padding:0 9px;border-radius:3px;background:#292b30;color:#bbb}.dialogFoot .primary{background:#a91f27;color:#fff}
@media(max-width:850px){:root{--left:155px;--right:170px}.brand b,.menus{display:none}.top{padding:0 3px}.iconBtn{width:25px;min-width:25px;height:25px}.group .iconBtn{width:25px;min-width:25px}.save{width:25px}.bottomTab{padding:0 6px}.leftDock .head,.rightDock .head{height:27px;min-height:27px}.search{height:21px;min-height:21px;margin:3px}.row{height:21px}.selected{padding:5px}}
@media(max-width:600px){:root{--left:125px;--right:145px;--bottom:120px}.app{grid-template-rows:33px minmax(0,1fr) 23px var(--bottom)}.brand img{width:23px;height:23px}.toolbarHide{display:none}.bottomTab{font-size:7px;padding:0 5px}.bottomTab .btText{display:none}.bottomRail{padding:0 2px}.viewTools{padding:0 2px}.vbtn{width:23px;min-width:23px}.mode{font-size:7px}.cube{width:88px;height:88px}.axis{width:44px;height:44px}.viewportInfo{font-size:7px}.panelTitle{font-size:8px}.row{font-size:8px}.insTab{font-size:8px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top">
  <div class="brand"><img src="images/logo.png" alt="Axilort"><b>AXILORT</b></div>
  <nav class="menus"><button class="menu">File</button><button class="menu">Edit</button><button class="menu">Project</button><button class="menu">Scene</button><button class="menu">Tools</button><button class="menu">Help</button></nav>
  <div class="spacer"></div>
  <div class="group">
    <button class="iconBtn" data-tip="Undo" id="undo"><svg class="svg" viewBox="0 0 24 24"><path d="M9 8 4 12l5 4"/><path d="M4 12h9a6 6 0 0 1 6 6"/></svg></button>
    <button class="iconBtn" data-tip="Redo" id="redo"><svg class="svg" viewBox="0 0 24 24"><path d="m15 8 5 4-5 4"/><path d="M20 12h-9a6 6 0 0 0-6 6"/></svg></button>
  </div>
  <div class="group">
    <button class="iconBtn" data-tip="Run Project" id="play"><svg class="svg" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg></button>
    <button class="iconBtn" data-tip="Pause" id="pause"><svg class="svg" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    <button class="iconBtn" data-tip="Stop" id="stop"><svg class="svg" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/></svg></button>
  </div>
  <div class="group">
    <button class="iconBtn active" data-tip="3D View" id="mode3d"><b>3D</b></button>
    <button class="iconBtn" data-tip="2D View" id="mode2d"><b>2D</b></button>
    <button class="iconBtn" data-tip="Script Editor" id="script"><svg class="svg" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg></button>
  </div>
  <button class="iconBtn" data-tip="Scene / FileSystem" id="leftToggle"><svg class="svg" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M10 5v14"/></svg></button>
  <button class="iconBtn" data-tip="Inspector" id="rightToggle"><svg class="svg" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 8h8M8 12h6M8 16h4"/></svg></button>
  <button class="iconBtn" data-tip="Output Panel" id="bottomToggle"><svg class="svg" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/><path d="m17 16 2 2 2-2"/></svg></button>
  <button class="save" data-tip="Save Project" id="save"><svg class="svg" viewBox="0 0 24 24"><path d="M5 4h12l3 3v13H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg></button>
</header>
<section class="leftDock" id="leftDock">
  <div class="panel"><div class="head"><b>Scene</b><div class="actions"><button class="mini" id="add" title="Add Element">＋</button><button class="mini" id="leftClose" title="Close panel">‹</button></div></div><div class="search">⌕<input id="filter" placeholder="Filter elements"></div><div class="scroll" id="tree"></div></div>
  <div class="split" id="leftSplit"></div>
  <div class="panel"><div class="head"><b>FileSystem</b></div><div class="search">⌕<input id="fileFilter" placeholder="Search files"></div><div class="scroll" id="fs"></div></div>
</section>
<div class="resizeV leftResize" id="leftResize"></div>
<main class="center">
  <div class="tabs"><button class="tab">◇ Main Scene ×</button><button class="tabAdd">＋</button></div>
  <div class="viewTools">
    <button class="vbtn" data-tip="Select" id="select"><svg class="svg" viewBox="0 0 24 24"><path d="m6 4 5 15 3-6 6-3z"/></svg></button>
    <button class="vbtn active" data-tip="Move" id="move"><svg class="svg" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
    <button class="vbtn" data-tip="Rotate" id="rotate"><svg class="svg" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2-5"/><path d="M5 5v5h5"/></svg></button>
    <button class="vbtn" data-tip="Scale" id="scale"><svg class="svg" viewBox="0 0 24 24"><path d="M7 3H3v4M17 3h4v4M3 17v4h4M21 17v4h-4"/></svg></button>
    <button class="vbtn" data-tip="Frame All" id="frameAll">⊞</button><button class="vbtn" data-tip="Frame Selected" id="frameSelected">✥</button>
    <div class="mode" id="modeLabel">3D • Perspective</div>
  </div>
  <div class="viewport" id="viewport"><div class="gridPlane"></div><div class="cube"></div><div class="sun"></div><div class="axis"></div><div class="info" id="info">3D • Perspective</div><div class="status"><span id="fps">60 FPS</span> · <span id="objects">Objects: 0</span></div></div>
</main>
<div class="resizeV rightResize" id="rightResize"></div>
<aside class="rightDock" id="rightDock">
  <div class="insHead"><button class="insTab active">Inspector</button><button class="insTab">Element</button><div class="spacer"></div><button class="mini" id="rightClose" title="Close panel">›</button></div>
  <div class="search">⌕<input placeholder="Filter properties"></div><div class="insContent" id="inspector"></div>
</aside>
<button class="openDock openLeft" id="openLeft">›</button><button class="openDock openRight" id="openRight">‹</button>
<section class="bottomRail">
  <button class="bottomTab" data-panel="output">▤ <span class="btText">Output</span></button><button class="bottomTab" data-panel="console">›_ <span class="btText">Console</span></button><button class="bottomTab" data-panel="script">⌘ <span class="btText">Script</span></button><button class="bottomTab" data-panel="animation">◫ <span class="btText">Animation</span></button><button class="bottomTab" data-panel="debugger">⚠ <span class="btText">Debugger</span></button><button class="bottomTab" data-panel="audio">♫ <span class="btText">Audio</span></button><div class="bottomSpacer"></div><button class="openBottom" id="openBottom">▲ Output</button></section>
<section class="bottomPanel" id="bottomPanel"><div class="bottomHead"><b id="bottomTitle">Output</b><div class="bottomActions"><button class="mini" id="clearOutput" title="Clear">⌫</button><button class="mini" id="bottomClose" title="Close panel">⌄</button></div></div><div class="output" id="output"></div></section>
<div class="modal" id="modal"><div class="dialog"><div class="dialogHead">Add Element <button id="modalClose">×</button></div><div class="search dialogSearch">⌕<input id="nodeSearch" placeholder="Search elements"></div><div class="nodeList" id="nodeList"></div><div class="dialogFoot"><button id="cancel">Cancel</button><button class="primary" id="confirm">Add Element</button></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id),app=$("app");
let scene=[],selected=null,view="3d",bottomOpen=false;
const groups={Core:["Element","Element2D","Element3D","SceneInstance","SubViewport","Marker2D","Marker3D"],Rendering2D:["Sprite2D","AnimatedSprite2D","Polygon2D","Line2D","TileMap","TileMapLayer","PointLight2D","GPUParticles2D"],Rendering3D:["MeshElement3D","MultiMeshElement3D","CSGBox3D","CSGSphere3D","CSGCylinder3D","CSGTorus3D","Decal","FogVolume","VoxelGI","LightmapGI","ReflectionProbe","GPUParticles3D","GridMap","WorldEnvironment"],CamerasLighting:["Camera2D","Camera3D","DirectionalLight3D","OmniLight3D","SpotLight3D","AreaLight3D","AudioListener3D"],Physics2D:["StaticBody2D","RigidBody2D","CharacterBody2D","Area2D","CollisionShape2D","CollisionPolygon2D","RayCast2D","ShapeCast2D","PinJoint2D"],Physics3D:["StaticBody3D","RigidBody3D","CharacterBody3D","Area3D","CollisionShape3D","RayCast3D","ShapeCast3D","HingeJoint3D","VehicleBody3D","VehicleWheel3D"],Navigation:["NavigationRegion2D","NavigationAgent2D","NavigationRegion3D","NavigationAgent3D","NavigationLink3D"],Animation:["AnimationPlayer","AnimationTree","Skeleton2D","Bone2D","Skeleton3D","BoneAttachment3D","BlendSpace1D","StateMachine"],Audio:["AudioStreamPlayer","AudioStreamPlayer2D","AudioStreamPlayer3D","AudioEffectReverb","AudioEffectDelay","AudioEffectChorus"],UI:["Control","Panel","PanelContainer","HBoxContainer","VBoxContainer","GridContainer","CenterContainer","ScrollContainer","TextureRect","ColorRect","TextureButton","Button","CheckBox","CheckButton","OptionButton","MenuButton","Slider","ProgressBar","LineEdit","CodeEdit","ItemList","Tree","TabBar","Separator","ColorPicker","FileDialog","Window","GraphEdit","GraphNode"],Gameplay:["Timer","Path2D","Path3D","PathFollow3D","SpringArm3D","TriggerVolume","DamageVolume","SpawnPoint","Checkpoint","InteractionArea","Interactable","Collectible","Trigger","EventEmitter"],DataLogic:["Expression","Variable","ArrayStore","DictionaryStore","State","Condition","Branch","Sequence","Parallel","Delay","Loop","Counter","Randomizer","DataBinding","PropertyBinding"],Networking:["MultiplayerSpawner","MultiplayerSynchronizer","WebSocketPeer","HTTPRequest","TCPServer","PacketPeerUDP","NetworkManager"],World:["World2D","World3D","Terrain3D","Water3D","Ocean3D","River3D","CloudLayer3D","TimeOfDay","WorldStreamer","LevelStreamer","ObjectPool"]};
const types=[...new Set(Object.values(groups).flat())];
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem("axilort.scene.v7",JSON.stringify(scene));log("Project saved.","ok")}
function load(){try{scene=JSON.parse(localStorage.getItem("axilort.scene.v7")||"[]")}catch{scene=[]}scene.forEach(n=>{n.id=n.id||uid();n.p=n.p||[0,0,0];n.r=n.r||[0,0,0];n.s=n.s||[1,1,1];n.visible=n.visible!==false});selected=scene[0]?.id||null}
function glyph(t){return /Camera|Light/.test(t)?"☼":/Physics|Collision|Body/.test(t)?"◈":/Audio/.test(t)?"♫":/Mesh|Sprite|Polygon/.test(t)?"◇":"◆"}
function renderTree(){let q=$("filter").value.toLowerCase(),b=$("tree");b.innerHTML="";let a=scene.filter(n=>(n.name+" "+n.type).toLowerCase().includes(q));if(!a.length){b.innerHTML='<div class="empty">No elements</div>';return}a.forEach(n=>{let r=document.createElement("div");r.className="row"+(n.id===selected?" selected":"");r.innerHTML=`<span class=rowIcon>${glyph(n.type)}</span><span class=rowName>${esc(n.name)}</span><span class=eye>${n.visible?"●":"○"}</span>`;r.onclick=()=>{selected=n.id;renderAll()};r.ondblclick=()=>{let v=prompt("Element name",n.name);if(v){n.name=v;save();renderAll()}};b.appendChild(r)})}
function renderFS(){let q=$("fileFilter").value.toLowerCase();$("fs").innerHTML=["res://","scenes/","scripts/","assets/","textures/","models/","materials/","project.axilort"].filter(x=>x.toLowerCase().includes(q)).map(x=>`<div class=row><span class=rowIcon>${x.endsWith("/")||x==="res://"?"▰":"▧"}</span><span class=rowName>${x}</span></div>`).join("")||'<div class="empty">No files</div>'}
function vec(label,k,v){return `<div class=prop><label>${label}</label><div class=vec><div class=vf><span>X</span><input id="${k}x" type=number value="${v[0]}"></div><div class="vf y"><span>Y</span><input id="${k}y" type=number value="${v[1]}"></div><div class="vf z"><span>Z</span><input id="${k}z" type=number value="${v[2]}"></div></div></div>`}
function renderInspector(){let b=$("inspector"),n=scene.find(x=>x.id===selected);if(!n){b.innerHTML='<div class="empty">Select an element</div>';return}b.innerHTML=`<div class=selected><div class=glyph>${glyph(n.type)}</div><div><b>${esc(n.name)}</b><small>${esc(n.type)}</small></div></div><div class=section><div class=sectionTitle>Element</div><div class=sectionBody><div class=prop><label>Name</label><input class=field id=inName value="${esc(n.name)}"></div><label class=check><input id=vis type=checkbox ${n.visible?'checked':''}> Visible</label></div></div><div class=section><div class=sectionTitle>Transform</div><div class=sectionBody>${vec("Position","p",n.p)}${vec("Rotation","r",n.r)}${vec("Scale","s",n.s)}</div></div>`;$("inName").onchange=e=>{n.name=e.target.value||n.name;save();renderAll()};$("vis").onchange=e=>{n.visible=e.target.checked;save();renderAll()};["p","r","s"].forEach(k=>"xyz".split("").forEach((a,i)=>$(k+a).onchange=e=>{n[k][i]=Number(e.target.value)||0;save();renderAll()}))}
function renderAll(){renderTree();renderFS();renderInspector();$("objects").textContent="Objects: "+scene.length}
function panel(k,open){app.classList.toggle(k+"-closed",!open);if(k==="bottom")bottomOpen=open;localStorage.setItem("axilort.panel."+k,open?"1":"0")}
function setView(v){view=v;$("mode3d").classList.toggle("active",v==="3d");$("mode2d").classList.toggle("active",v==="2d");$("viewport").classList.toggle("mode2d",v==="2d");$("modeLabel").textContent=v==="3d"?"3D • Perspective":"2D • Orthographic";$("info").textContent=$("modeLabel").textContent}
function log(t,c=""){let d=document.createElement("div");d.className="log "+c;d.textContent="["+new Date().toLocaleTimeString()+"] "+t;$("output").appendChild(d);$("output").scrollTop=$("output").scrollHeight}
function openModal(){ $("modal").style.display="grid";renderNodes() }function closeModal(){$("modal").style.display="none"}
function renderNodes(){let q=$("nodeSearch").value.toLowerCase(),b=$("nodeList");b.innerHTML="";for(const[g,a]of Object.entries(groups)){let m=a.filter(t=>t.toLowerCase().includes(q));if(!m.length)continue;b.innerHTML+=`<div class=groupTitle>${g}</div>`;m.forEach(t=>b.innerHTML+=`<div class=nodeOption data-type="${esc(t)}">${glyph(t)} ${esc(t)}</div>`)}b.querySelectorAll(".nodeOption").forEach(x=>x.onclick=()=>{b.dataset.type=x.dataset.type;b.querySelectorAll(".nodeOption").forEach(y=>y.classList.remove("sel"));x.classList.add("sel")})}
function addElement(t){if(!t)return;let n={id:uid(),name:t,type:t,parent:selected,p:[0,0,0],r:[0,0,0],s:[1,1,1],visible:true};scene.push(n);selected=n.id;save();closeModal();renderAll();log("Added "+t,"ok")}
function bottom(kind){panel("bottom",true);document.querySelectorAll(".bottomTab").forEach(x=>x.classList.toggle("active",x.dataset.panel===kind));$("bottomTitle").textContent=kind.charAt(0).toUpperCase()+kind.slice(1);if(kind==="output"||kind==="console")$("output").innerHTML="";if(kind==="script")$("output").innerHTML='<div class="log">Script workspace ready.</div><div class="log">Select a script from the FileSystem to edit it.</div>';if(kind==="animation")$("output").innerHTML='<div class="log">Animation workspace ready.</div><div class="log">AnimationPlayer and AnimationTree controls will appear here.</div>';if(kind==="debugger")$("output").innerHTML='<div class="log ok">Debugger ready — no errors.</div>';if(kind==="audio")$("output").innerHTML='<div class="log">Audio monitor ready.</div>'}
$("add").onclick=openModal;$("modalClose").onclick=closeModal;$("cancel").onclick=closeModal;$("confirm").onclick=()=>addElement($("nodeList").dataset.type||types[0]);$("nodeSearch").oninput=renderNodes;$("filter").oninput=renderTree;$("fileFilter").oninput=renderFS;
$("leftClose").onclick=()=>panel("left",false);$("openLeft").onclick=()=>panel("left",true);$("rightClose").onclick=()=>panel("right",false);$("openRight").onclick=()=>panel("right",true);$("leftToggle").onclick=()=>panel("left",app.classList.contains("left-closed"));$("rightToggle").onclick=()=>panel("right",app.classList.contains("right-closed"));$("bottomToggle").onclick=()=>bottom("output");$("openBottom").onclick=()=>bottom("output");$("bottomClose").onclick=()=>panel("bottom",false);document.querySelectorAll(".bottomTab").forEach(x=>x.onclick=()=>bottom(x.dataset.panel));$("clearOutput").onclick=()=>$("output").innerHTML="";
$("save").onclick=save;$("mode3d").onclick=()=>setView("3d");$("mode2d").onclick=()=>setView("2d");$("script").onclick=()=>bottom("script");$("play").onclick=()=>log("Run project requested.","ok");$("pause").onclick=()=>log("Game paused.");$("stop").onclick=()=>log("Game stopped.");$("undo").onclick=()=>log("Undo.");$("redo").onclick=()=>log("Redo.");
["select","move","rotate","scale"].forEach(id=>$(id).onclick=()=>{document.querySelectorAll(".vbtn").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")});
function resizer(el,side,min,max){let down=false,start=0,base=0;el.onpointerdown=e=>{down=true;start=e.clientX;base=side==="left"?parseInt(getComputedStyle(app).getPropertyValue("--left")):parseInt(getComputedStyle(app).getPropertyValue("--right"));el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!down)return;let v=side==="left"?base+e.clientX-start:base-(e.clientX-start);v=Math.max(min,Math.min(max,v));app.style.setProperty(side==="left"?"--left":"--right",v+"px")};el.onpointerup=()=>{down=false;localStorage.setItem("axilort.size."+side,app.style.getPropertyValue(side==="left"?"--left":"--right"))}}
resizer($("leftResize"),"left",100,320);resizer($("rightResize"),"right",120,330);
$("leftSplit").onpointerdown=e=>{let box=$("leftDock").getBoundingClientRect(),move=x=>{let p=Math.max(.2,Math.min(.8,(x.clientY-box.top)/box.height));$("leftDock").style.gridTemplateRows=`${p*100}% 4px ${(1-p)*100}%`};let up=()=>{document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up)};document.addEventListener("pointermove",move);document.addEventListener("pointerup",up)};
load();panel("left",localStorage.getItem("axilort.panel.left")!=="0");panel("right",localStorage.getItem("axilort.panel.right")!=="0");panel("bottom",false);renderAll();log("Axilort Engine editor ready.","ok");
</script>
</body>
</html>
