els(){panel('left',true);panel('right',true);panel('bottom',false)}function add(t){const n={id:crypto.randomUUID(),name:t.replace(/(2D|3D)$/,''),type:t,parent:selected,p:[0,0,0],r:[0,0,0],s:[1,1,1],visible:true,mesh:/Mesh|CSG|Sprite|Polygon|Terrain|Water|Ocean/.test(t),color:'#b51d25'};scene.push(n);selected=n.id;save();closeModal();renderAll();log('Added '+t)}function renderNodes(){const q=$("nodeFilter").value.toLowerCase(),b=$("nodeList");b.innerHTML='';for(const[g,a]of Object.entries(groups)){const m=a.filter(t=>t.toLowerCase().includes(q));if(!m.length)continue;b.innerHTML+=`<div class=group>${g}</div>`;m.forEach(t=>b.innerHTML+=`<div class=option data-type="${t}">${icon(t)} ${t}</div>`)}b.querySelectorAll('.option').forEach(x=>x.onclick=()=>{b.dataset.type=x.dataset.type;b.querySelectorAll('.option').forEach(y=>y.classList.remove('sel'));x.classList.add('sel')})}function openModal(){$("modal").style.display='grid';renderNodes()}function closeModal(){$("modal").style.display='none'}$("add").onclick=openModal;$("close").onclick=closeModal;$("cancel").onclick=closeModal;$("confirm").onclick=()=>add($("nodeList").dataset.type||types[0]);$("nodeFilter").oninput=renderNodes;$("filter").oninput=renderTree;$("leftCollapse").onclick=()=>panel('left',false);$("openLeft").onclick=()=>panel('left',true);$("insCollapse").onclick=()=>panel('right',false);$("openRight").onclick=()=>panel('right',true);$("bottomCollapse").onclick=()=>panel('bottom',false);$("openBottom").onclick=()=>panel('bottom',true);$("toggleLeft").onclick=()=>panel('left',app.classList.contains('left-closed'));$("toggleInspector").onclick=()=>panel('right',app.classList.contains('right-closed'));$("toggleBottom").onclick=()=>panel('bottom',app.classList.contains('bottom-closed'));$("save").onclick=save;$("topSave").onclick=save;$("mode3d").onclick=()=>setView('3d');$("mode2d").onclick=()=>setView('2d');$("selectTool").onclick=()=>tool='select';$("moveTool").onclick=()=>tool='move';$("rotateTool").onclick
