<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Settings — Axilort Engine</title>
<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
a,button,input{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}a{text-decoration:none}
.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}
@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;inset-inline:auto;inset-block:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}}
.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column;z-index:3}
.brand{display:flex;align-items:center;justify-content:center;padding:0 0 clamp(9px,1.5vw,22px)}
.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain;flex:none}.brand-text{display:none}
.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}
.nav a{border:1px solid transparent;background:transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;text-align:left;cursor:pointer;white-space:nowrap}
.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}
.ico{width:clamp(14px,1.7vw,21px);height:clamp(14px,1.7vw,21px);display:grid;place-items:center;color:#eee;flex:0 0 auto;font-size:clamp(11px,1.35vw,18px)}.active .ico{color:var(--red)}
.version{margin-top:auto;padding:clamp(7px,1vw,13px) clamp(6px,.8vw,11px);color:#66666b;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);flex:0 0 clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}
.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center;cursor:pointer;text-decoration:none}.top-action:hover{background:#111112}.gear{font-size:clamp(17px,2.25vw,25px);line-height:1;color:#ededee}
.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px) clamp(8px,1.7vw,24px);overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}
.heading{margin-bottom:clamp(7px,1.15vw,17px)}.heading h1{font-size:clamp(15px,2.55vw,27px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}.heading h1 span{color:var(--red)}.heading p{margin:3px 0 0;color:#929297;font-size:clamp(7px,1.05vw,13px)}
.card{border:1px solid var(--border);background:linear-gradient(145deg,#0c0c0d,#080809);border-radius:clamp(9px,1.2vw,15px);padding:clamp(9px,1.5vw,18px);max-width:760px}
.section-title{font-size:clamp(9px,1.25vw,14px);font-weight:750;margin:0 0 3px}.section-sub{font-size:clamp(7px,.9vw,11px);color:#77777d;margin-bottom:clamp(6px,1vw,11px)}
.row{min-height:clamp(42px,5.5vw,58px);display:flex;align-items:center;justify-content:space-between;gap:15px;border-top:1px solid var(--border2);font-size:clamp(8px,1.05vw,12px)}.row:first-of-type{border-top:0}.row span{color:var(--muted)}
.save{margin-top:clamp(8px,1.2vw,14px);border:1px solid #ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);color:#fff;border-radius:7px;padding:clamp(6px,1vw,10px) clamp(9px,1.5vw,16px);font-size:clamp(7px,1vw,11px);font-weight:750;cursor:pointer;box-shadow:0 6px 18px rgba(255,32,40,.16)}.save:hover{filter:brightness(1.08)}
.message{display:block;margin-top:7px;min-height:13px;color:#16e56d;font-size:clamp(7px,.85vw,10px)}
@media(max-height:360px){.sidebar{width:clamp(86px,16vw,145px);flex-basis:clamp(86px,16vw,145px)}.nav a{height:29px}.brand img{width:34px;height:34px}.content{padding:7px 9px}.card{padding:9px 11px}.row{min-height:39px}}
@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:7px 9px}.heading{margin-bottom:7px}.heading h1{font-size:17px}.heading p{font-size:8px}.card{padding:9px}.row{min-height:38px;font-size:8px}.save{padding:7px 10px;font-size:8px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div>
<nav class="nav" aria-label="Engine navigation">
<a href="home.html"><span class="ico">⌂</span>Home</a>
<a href="projects.html"><span class="ico">□</span>Projects</a>
<a href="assets.html"><span class="ico">◇</span>Assets</a>
<a class="active" href="settings.html"><span class="ico">⚙</span>Settings</a>
<a href="team.html"><span class="ico">♙</span>Team</a>
</nav>
<div class="version">Axilort Engine v1.0.0</div>
</aside>
<main class="main">
<header class="topbar"><a class="top-action" href="settings.html" aria-label="Open settings"><span class="gear">⚙</span></a></header>
<div class="content">
<div class="heading"><h1><span>Settings</span></h1><p>Configure your Axilort Engine preferences.</p></div>
<div class="card">
<div class="section-title">Engine Settings</div>
<div class="section-sub">These settings are stored in the real Axilort Engine setting.json storage.</div>
<div class="row"><b>Engine</b><span id="engineValue">Axilort Engine</span></div>
<div class="row"><b>Interface</b><span id="interfaceValue">Landscape UI</span></div>
<div class="row"><b>System Status</b><span id="systemValue">Operational</span></div>
<button class="save" id="save">Save Settings</button>
<small class="message" id="message"></small>
</div>
</div>
</main>
</div>
<script>
(function(){
const DB="axilort-engine-data",STORE="setting.json",$=id=>document.getElementById(id);
function exists(){return indexedDB.databases?indexedDB.databases().then(a=>a.some(x=>x.name===DB)):Promise.resolve(localStorage.getItem(DB+"/setting.json")!==null)}
function open(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB);r.onupgradeneeded=()=>{try{r.transaction.abort()}catch(e){}};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error("Storage unavailable"))})}
function load(){exists().then(ok=>{if(!ok)return;return open().then(db=>{if(!db.objectStoreNames.contains(STORE)){db.close();return}return new Promise((resolve,reject)=>{const t=db.transaction(STORE,"readonly"),s=t.objectStore(STORE),q=s.get("settings");q.onsuccess=()=>{const v=q.result;if(v&&v.value){const x=v.value;$("engineValue").textContent=x.engine||"Axilort Engine";$("interfaceValue").textContent=x.interface==="landscape"?"Landscape UI":(x.interface||"Landscape UI");$("systemValue").textContent="Operational"}resolve()};q.onerror=()=>reject(q.error);t.oncomplete=()=>db.close()})})}).catch(()=>{})}
function save(){exists().then(ok=>{if(!ok)throw new Error("Axilort Engine storage has not been created yet. Open Axilort Engine first.");return open()}).then(db=>{if(!db.objectStoreNames.contains(STORE)){db.close();throw new Error("setting.json storage is not available.")}return new Promise((resolve,reject)=>{const value={engine:"Axilort Engine",interface:"landscape",systemStatus:"Operational",updatedAt:new Date().toISOString()};const t=db.transaction(STORE,"readwrite");t.objectStore(STORE).put({key:"settings",value});t.oncomplete=()=>{db.close();resolve()};t.onerror=()=>{db.close();reject(t.error)}})}).then(()=>{$("message").textContent="Settings saved to setting.json";$("message").style.color="#16e56d";setTimeout(()=>$("message").textContent="",1800)}).catch(e=>{$("message").textContent=e.message;$("message").style.color="#ff5b62"})}
load();$("save").addEventListener("click",save);
})();
</script>
</body>
</html>
