<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><title>Projects — Axilort Engine</title><style>:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}a,button{font:inherit;color:inherit;touch-action:manipulation}.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}}.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;justify-content:center;padding:0 0 clamp(9px,1.5vw,22px)}.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain;flex:none}.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}.nav a{border:1px solid transparent;background:transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;text-align:left;cursor:pointer;white-space:nowrap;text-decoration:none}.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}.ico{width:clamp(14px,1.7vw,21px);height:clamp(14px,1.7vw,21px);display:grid;place-items:center;color:#eee;flex:0 0 auto;font-size:clamp(11px,1.35vw,18px)}.active .ico{color:var(--red)}.version{margin-top:auto;padding:clamp(7px,1vw,13px) clamp(6px,.8vw,11px);color:#66666b;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);flex:0 0 clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center;cursor:pointer;text-decoration:none}.top-action:hover{background:#111112}.gear{font-size:clamp(17px,2.25vw,25px);line-height:1;color:#ededee}.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px) clamp(8px,1.7vw,24px);overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}.welcome{margin-bottom:clamp(7px,1.15vw,17px)}.welcome h1{font-size:clamp(15px,2.55vw,27px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}.welcome h1 span{color:var(--red)}.welcome p{margin:3px 0 0;color:#929297;font-size:clamp(7px,1.05vw,13px)}.project-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:clamp(8px,1.2vw,15px)}.project-toolbar h2{font-size:clamp(11px,1.55vw,17px);margin:0;font-weight:750}.primary{border:1px solid #ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);border-radius:7px;padding:clamp(6px,1vw,11px) clamp(9px,1.5vw,17px);font-size:clamp(7px,1vw,12px);font-weight:750;cursor:pointer;box-shadow:0 6px 18px rgba(255,32,40,.16);text-decoration:none;display:inline-block}.primary:hover{filter:brightness(1.08)}.projects-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1.1vw,14px)}.project-card{min-width:0;border:1px solid var(--border);background:linear-gradient(145deg,#0c0c0d,#080809);border-radius:clamp(8px,1.2vw,15px);padding:clamp(9px,1.25vw,16px);min-height:clamp(85px,12vw,145px);display:flex;flex-direction:column;justify-content:space-between}.project-card strong{font-size:clamp(8px,1.15vw,13px)}.project-card small{display:block;color:#777;font-size:clamp(7px,.9vw,10px);margin-top:4px}.project-actions{display:flex;gap:6px;margin-top:10px}.project-actions button{border:1px solid #29292b;background:#101011;border-radius:6px;padding:5px 8px;font-size:clamp(6px,.85vw,10px);cursor:pointer}.project-actions button:hover{border-color:#8e161b}.empty{border:1px solid var(--border);background:linear-gradient(145deg,#0b0b0c,#080809);border-radius:clamp(9px,1.2vw,15px);min-height:clamp(90px,13vw,150px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px}.empty-icon{width:clamp(22px,3.2vw,40px);height:clamp(22px,3.2vw,40px);border:1px solid #2a2a2d;border-radius:8px;display:grid;place-items:center;color:#777;margin-bottom:6px;font-size:clamp(9px,1.3vw,15px)}.empty strong{font-size:clamp(8px,1.05vw,12px)}.empty span{font-size:clamp(7px,.85vw,10px);color:#777;margin-top:2px}@media(max-height:360px){.sidebar{width:clamp(86px,16vw,145px);flex-basis:clamp(86px,16vw,145px)}.nav a{height:29px}.brand img{width:34px;height:34px}.content{padding:7px 9px}.project-card{min-height:70px}}@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:7px 9px}.project-toolbar{margin-bottom:7px}.projects-grid{grid-template-columns:repeat(3,1fr);gap:6px}.project-card{min-height:65px;padding:7px}.project-actions{margin-top:6px}.project-actions button{padding:4px 6px}.empty{min-height:75px}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a class="active" href="projects.html"><span class="ico">□</span>Projects</a><a href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a><a href="docs.html"><span class="ico">▤</span>Docs</a></nav><div class="version">Axilort Engine v1.0.0</div></aside><main class="main"><header class="topbar"><a class="top-action" href="settings.html" aria-label="Open settings"><span class="gear">⚙</span></a></header><div class="content"><div class="welcome"><h1><span>Projects</span></h1><p>Create and manage your Axilort Engine projects.</p></div><div class="project-toolbar"><h2>Your Projects</h2><button class="primary" id="create">＋ New Project</button></div><div id="projectArea"></div></div></main></div><script>const KEY="axilort-projects";const area=document.getElementById("projectArea");function getProjects(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}}function save(p){localStorage.setItem(KEY,JSON.stringify(p));render()}function render(){const p=getProjects();if(!p.length){area.innerHTML='<div class="empty"><div class="empty-icon">□</div><strong>No projects yet</strong><span>No local projects created yet.</span></div>';return}area.innerHTML='<div class="projects-grid">'+p.map((x,i)=>'<article class="project-card"><div><strong>'+escapeHTML(x.name)+'</strong><small>'+escapeHTML(x.date||"Axilort Project")+'</small></div><div class="project-actions"><button onclick="openProject('+i+')">Open</button><button onclick="deleteProject('+i+')">Delete</button></div></article>').join('')+'</div>'}function escapeHTML(s){return String(s).replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function createProject(){const name=prompt("Project name");if(!name||!name.trim())return;const p=getProjects();p.push({name:name.trim(),date:new Date().toLocaleDateString()});save(p)}function deleteProject(i){const p=getProjects();p.splice(i,1);save(p)}function openProject(i){const p=getProjects()[i];if(p)alert("Opening "+p.name)}document.getElementById("create").onclick=createProject;render();</script></body></html>
