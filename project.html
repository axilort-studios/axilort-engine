<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Axilort Engine — Projects</title>
<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit;color:inherit;touch-action:manipulation}.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}}.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;justify-content:center;padding:0 0 clamp(9px,1.5vw,22px)}.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain}.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}.nav a{border:1px solid transparent;background:transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;text-align:left;cursor:pointer;white-space:nowrap;text-decoration:none}.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}.ico{width:clamp(14px,1.7vw,21px);height:clamp(14px,1.7vw,21px);display:grid;place-items:center;color:#eee;flex:0 0 auto;font-size:clamp(11px,1.35vw,18px)}.active .ico{color:var(--red)}.version{margin-top:auto;padding:clamp(7px,1vw,13px) clamp(6px,.8vw,11px);color:#66666b;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);flex:0 0 clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center;cursor:pointer;text-decoration:none}.top-action:hover{background:#111112}.gear{font-size:clamp(17px,2.25vw,25px);line-height:1}.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px);overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}.heading{margin-bottom:clamp(10px,1.6vw,20px)}.heading h1{font-size:clamp(18px,2.8vw,30px);margin:0;font-weight:800;letter-spacing:-.035em}.heading h1 span{color:var(--red)}.heading p{margin:4px 0 0;color:var(--muted);font-size:clamp(7px,1.05vw,13px)}.actions{display:flex;gap:8px;margin-bottom:clamp(10px,1.5vw,18px)}.primary{border:1px solid #ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);border-radius:7px;padding:clamp(7px,1vw,11px) clamp(10px,1.5vw,17px);font-size:clamp(7px,1vw,12px);font-weight:750;cursor:pointer}.secondary{border:1px solid var(--border);background:#0b0b0c;border-radius:7px;padding:clamp(7px,1vw,11px) clamp(10px,1.5vw,17px);font-size:clamp(7px,1vw,12px);font-weight:700;cursor:pointer}.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:clamp(7px,1.1vw,14px)}.empty{min-height:clamp(150px,25vw,280px);border:1px solid var(--border);background:linear-gradient(145deg,#0b0b0c,#080809);border-radius:clamp(9px,1.2vw,15px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;grid-column:1/-1}.empty-icon{width:42px;height:42px;border:1px solid #2a2a2d;border-radius:9px;display:grid;place-items:center;color:#777;margin-bottom:8px}.empty strong{font-size:clamp(9px,1.2vw,14px)}.empty span{font-size:clamp(7px,.9vw,11px);color:#777;margin-top:3px}.project-card{border:1px solid var(--border);background:#0b0b0c;border-radius:12px;padding:13px;min-height:100px}.project-card strong{font-size:12px}.project-card small{display:block;color:#777;margin-top:5px}.project-card button{margin-top:12px}.delete{border:0;background:transparent;color:#777;font-size:10px;cursor:pointer}
@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:7px 9px}.projects{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a class="active" href="project.html"><span class="ico">□</span>Projects</a><a href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a><a href="docs.html"><span class="ico">▤</span>Docs</a></nav><div class="version">Axilort Engine v1.0.0</div></aside>
<main class="main"><header class="topbar"><a class="top-action" href="settings.html" aria-label="Open settings"><span class="gear">⚙</span></a></header><div class="content"><div class="heading"><h1>Your <span>Projects</span></h1><p>Projects are stored locally on this computer.</p></div><div class="actions"><button class="primary" id="newProject">＋ New Project</button><button class="secondary" id="clearProjects">Clear Projects</button></div><section class="projects" id="projects"></section></div></main>
</div>
<script>
const KEY="axilort.projects.v1";
const projectsEl=document.getElementById("projects");
function getProjects(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}}
function saveProjects(items){localStorage.setItem(KEY,JSON.stringify(items));render()}
function render(){const items=getProjects();if(!items.length){projectsEl.innerHTML='<div class="empty"><div class="empty-icon">□</div><strong>No projects yet</strong><span>Create a project and it will stay saved on this computer.</span></div>';return}projectsEl.innerHTML=items.map((p,i)=>`<article class="project-card"><strong>${escapeHTML(p.name)}</strong><small>Local project</small><button class="delete" data-index="${i}">Delete</button></article>`).join("")}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.getElementById("newProject").onclick=()=>{const name=prompt("Project name:");if(!name||!name.trim())return;const items=getProjects();items.push({name:name.trim(),created:Date.now()});saveProjects(items)};
document.getElementById("clearProjects").onclick=()=>{if(confirm("Delete all locally stored projects?")){localStorage.removeItem(KEY);render()}};
projectsEl.onclick=e=>{if(e.target.classList.contains("delete")){const items=getProjects();items.splice(Number(e.target.dataset.index),1);saveProjects(items)}};
render();
</script>
</body>
</html>
