<style>
:root{--bg:#050505;--panel:#0b0b0c;--panel2:#101011;--line:#252527;--line2:#18181a;--text:#f4f4f5;--muted:#85858b;--red:#ff2028;--green:#52d273}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.app{position:fixed;inset:0;display:flex;background:var(--bg);overflow:hidden}.sidebar{width:105px;flex:none;border-right:1px solid var(--line2);padding:9px 7px;display:flex;flex-direction:column;background:linear-gradient(#080809,#050505)}.brand{text-align:center;margin-bottom:13px}.brand img{width:38px;height:38px;object-fit:contain}.nav{display:flex;flex-direction:column;gap:3px}.nav a{height:32px;border:1px solid transparent;border-radius:8px;display:flex;align-items:center;gap:7px;padding:0 7px;font-size:8px;font-weight:700;color:#c8c8cb}.nav a:hover{background:#111}.nav a.active{background:rgba(255,32,40,.10);border-color:#76171b;box-shadow:inset 2px 0 var(--red);color:#fff}.ico{width:15px;text-align:center;font-size:12px}.active .ico{color:var(--red)}.version{margin-top:auto;text-align:center;color:#55555b;font-size:7px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:45px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line2)}.title{font-weight:800;font-size:13px}.title span{color:var(--red)}.topright{display:flex;align-items:center;gap:6px}.storage{font-size:8px;color:#66666c}.content{min-height:0;flex:1;padding:10px 12px;overflow:auto}.bar{display:flex;align-items:center;gap:6px;margin-bottom:9px}.crumb{min-width:0;flex:1;color:#8a8a90;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tools{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.btn{height:30px;border:1px solid #29292d;border-radius:7px;background:#111112;padding:0 9px;font-size:8px;font-weight:750}.btn:hover{border-color:#8e161b}.btn.primary{background:linear-gradient(#ff3038,#d7151d);border-color:#ff454b;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.searchrow{display:flex;gap:6px;margin-bottom:8px}.search{height:31px;min-width:0;flex:1;border:1px solid #29292d;border-radius:7px;background:#09090a;padding:0 10px;outline:0;font-size:9px}.search:focus{border-color:#8e161b}.select{height:31px;border:1px solid #29292d;border-radius:7px;background:#09090a;padding:0 7px;font-size:8px;outline:0}.list{display:grid;grid-template-columns:1fr;gap:5px}.list.grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}.item{position:relative;min-height:47px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(145deg,#0d0d0e,#080809);display:flex;align-items:center;gap:8px;padding:6px;user-select:none}.grid .item{min-height:105px;display:flex;flex-direction:column;align-items:stretch;padding:7px}.item:hover{border-color:#7d191d;background:#101011}.item.selected{border-color:var(--red);box-shadow:0 0 0 1px rgba(255,32,40,.18)}.icon{width:30px;height:30px;flex:none;border:1px solid #29292d;border-radius:7px;background:#0a0a0b;display:grid;place-items:center;color:var(--red);font-size:8px;font-weight:850;overflow:hidden}.grid .icon{width:100%;height:58px}.icon img{width:100%;height:100%;object-fit:cover}.info{min-width:0;flex:1}.info b{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{display:block;margin-top:3px;color:#68686e;font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{width:25px;height:27px;flex:none;border:0;background:transparent;border-radius:6px;color:#aaa;font-size:15px}.more:hover{background:#1a1a1b;color:#fff}.grid .more{position:absolute;right:5px;top:5px}.empty{border:1px dashed #29292d;border-radius:9px;min-height:120px;display:grid;place-items:center;text-align:center;color:#777;font-size:9px;padding:15px}.empty b{display:block;color:#ddd;margin-bottom:4px}.menu{position:absolute;right:6px;top:37px;z-index:20;min-width:135px;padding:4px;border:1px solid #303034;border-radius:8px;background:#0b0b0c;box-shadow:0 20px 60px #000;display:none}.menu.show{display:block}.menu button{display:block;width:100%;height:29px;text-align:left;border:0;border-radius:5px;background:transparent;padding:0 9px;font-size:8px;color:#ccc}.menu button:hover{background:#171718}.menu .danger:hover{background:#3b1114;color:#ff686e}.modalbg{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:12px;background:#000c;backdrop-filter:blur(7px)}.modalbg.show{display:flex}.modal{width:min(510px,94vw);max-height:92vh;border:1px solid var(--line);border-radius:12px;background:#0b0b0c;box-shadow:0 30px 100px #000;overflow:hidden;display:flex;flex-direction:column}.head{padding:13px 15px;border-bottom:1px solid var(--line2)}.head h2{margin:0;font-size:14px}.head p{margin:4px 0 0;color:#707077;font-size:8px}.body{padding:13px 15px;overflow:auto}.field label{display:block;color:#aaa;font-size:8px;font-weight:750;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #2b2b2f;border-radius:7px;background:#070708;outline:0;padding:9px;font-size:9px}.field input{height:37px}.field textarea{height:360px;resize:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5}.foot{display:flex;justify-content:flex-end;gap:6px;padding:10px 14px;border-top:1px solid var(--line2)}.foot button{height:31px;border-radius:7px;padding:0 11px;border:1px solid #29292d;background:#111;font-size:8px;font-weight:750}.foot .primary{background:linear-gradient(#ff3038,#d7151d);border-color:#ff454b}.details{display:grid;grid-template-columns:100px 1fr;gap:7px;font-size:9px}.details span:nth-child(odd){color:#777}.preview{width:min(900px,96vw);height:min(680px,92vh)}.previewbody{flex:1;min-height:0;display:grid;place-items:center;padding:10px;background:#050505;overflow:auto}.previewbody img,.previewbody video{max-width:100%;max-height:100%;object-fit:contain}.previewbody audio{width:min(600px,90%)}.previewbody iframe{width:100%;height:100%;border:0;background:#fff}.toast{position:fixed;z-index:500;left:50%;bottom:18px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#111;border:1px solid #333;border-radius:8px;padding:8px 12px;font-size:9px;transition:.2s;box-shadow:0 15px 50px #000}.toast.show{opacity:1;transform:translate(-50%,0)}.status{font-size:8px;color:#666}.status.ok{color:var(--green)}.hidden{display:none!important}@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}.sidebar{width:95px}}@media(max-width:600px) and (orientation:landscape){.sidebar{width:95px}.top{height:39px}.content{padding:7px 9px}.btn{height:29px}.search{height:29px}.select{height:29px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a href="projects.html"><span class="ico">□</span>Projects</a><a class="active" href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a></nav><div class="version">Axilort Engine v1.0.0</div></aside>
<main class="main"><header class="top"><div class="title"><span>Axilort</span> Assets</div><div class="topright"><span class="storage" id="storageInfo">App storage</span><button class="btn" id="refresh">↻ Refresh</button></div></header>
<div class="content"><div class="bar"><div class="crumb" id="crumb">axilort-engine-data/</div><div class="tools" id="tools"></div></div><div class="searchrow"><input class="search" id="search" placeholder="Search files, folders and assets…"><select class="select" id="sort"><option value="name">Name</option><option value="new">Newest</option><option value="old">Oldest</option><option value="size">Size</option><option value="type">Type</option></select><button class="btn" id="view">▦ Grid</button></div><div class="status" id="status"></div><div class="list" id="list"></div></div></main></div>
<input id="upload" type="file" multiple class="hidden">
<div class="modalbg" id="nameModal"><div class="modal"><div class="head"><h2 id="nameTitle">Create folder</h2><p id="nameHelp"></p></div><div class="body"><div class="field"><label>NAME</label><input id="nameInput" maxlength="160" autocomplete="off"></div><div class="status" id="nameError"></div></div><div class="foot"><button id="nameCancel">Cancel</button><button class="primary" id="nameSave">Save</button></div></div></div>
<div class="modalbg" id="editorModal"><div class="modal"><div class="head"><h2 id="editorTitle">Edit file</h2><p>Read and write the stored file.</p></div><div class="body"><div class="field"><label>CONTENT</label><textarea id="editor"></textarea><div class="status" id="editorError"></div></div></div><div class="foot"><button id="editorCancel">Close</button><button class="primary" id="editorSave">Save</button></div></div></div>
<div class="modalbg" id="detailsModal"><div class="modal"><div class="head"><h2>Item details</h2><p>Stored in Axilort Engine app storage.</p></div><div class="body"><div class="details" id="details"></div></div><div class="foot"><button id="detailsClose">Close</button></div></div></div>
<div class="modalbg" id="previewModal"><div class="modal preview"><div class="head"><h2 id="previewTitle">Preview</h2><p id="previewMeta"></p></div><div class="previewbody" id="previewBody"></div><div class="foot"><button id="previewClose">Close</button><button class="primary" id="previewExport">Export</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const DB="axilort-engine-data",PROJECTS="projects",FILES="assetFiles";let db=null,currentProject=null,currentParent=null,pending=null,editing=null,preview=null,previewUrl=null,grid=false,selected=new Set();const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=s=>s.trim().replace(/[\\/:*?"<>|]/g,"-");
function toast(s){const t=$("toast");t.textContent=s;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),2200)}
function setupStores(d){if(!d.objectStoreNames.contains(PROJECTS))d.createObjectStore(PROJECTS,{keyPath:"id"});if(!d.objectStoreNames.contains(FILES)){const s=d.createObjectStore(FILES,{keyPath:"id"});s.createIndex("projectId","projectId");s.createIndex("parentId","parentId")}}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB);r.onerror=()=>reject(r.error);r.onupgradeneeded=e=>setupStores(e.target.result);r.onsuccess=()=>{db=r.result;db.onversionchange=()=>db.close();resolve(db)}})}
function tx(store,mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction(store,mode),s=t.objectStore(store);let out;try{out=fn(s)}catch(e){reject(e);return}t.oncomplete=()=>resolve(out);t.onerror=()=>reject(t.error)})}
const getAll=store=>new Promise((res,rej)=>{const r=db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});const put=(store,x)=>tx(store,"readwrite",s=>s.put(x));const del=(store,id)=>tx(store,"readwrite",s=>s.delete(id));
const files=async()=>currentProject?(await getAll(FILES)).filter(x=>x.projectId===currentProject.id):[];const projects=()=>getAll(PROJECTS);
function bytes(n){if(!n)return"0 B";if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";if(n<1073741824)return(n/1048576).toFixed(1)+" MB";return(n/1073741824).toFixed(1)+" GB"}function ext(n){const a=n.toLowerCase().split(".");return a.length>1?a.pop():""}function image(x){return x.mimeType?.startsWith("image/")||["png","jpg","jpeg","gif","webp","svg","bmp","avif","ico","heic","heif"].includes(ext(x.name))}function video(x){return x.mimeType?.startsWith("video/")||["mp4","webm","ogg","mov","m4v","avi","mkv","3gp"].includes(ext(x.name))}function audio(x){return x.mimeType?.startsWith("audio/")||["mp3","wav","ogg","m4a","aac","flac","weba"].includes(ext(x.name))}function text(x){return x.mimeType?.startsWith("text/")||x.mimeType?.includes("json")||x.mimeType?.includes("javascript")||["html","htm","css","js","json","txt","md","xml","csv","shader","glsl","gd","ts","tsx","jsx"].includes(ext(x.name))}function model(x){return["glb","gltf","obj","stl","fbx","dae","3ds","blend","ply"].includes(ext(x.name))}
function glyph(x){if(x.kind==="folder"||x.kind==="project")return"▰";if(image(x))return"IMG";if(video(x))return"▶";if(audio(x))return"♪";if(model(x))return"3D";if(["html","htm"].includes(ext(x.name)))return"&lt;/&gt;";if(["js","json","ts"].includes(ext(x.name)))return"JS";if(ext(x.name)==="css")return"#";return"FILE"}
function icon(x){if(image(x)&&x.content instanceof Blob){const u=URL.createObjectURL(x.content);setTimeout(()=>URL.revokeObjectURL(u),4000);return'<div class="icon"><img src="'+u+'"></div>'}return'<div class="icon">'+glyph(x)+'</div>'}
function menu(){return'<div class="menu"><button data-a="open">Open</button><button data-a="rename">Rename</button><button data-a="details">Details</button><button data-a="duplicate">Duplicate</button><button data-a="export">Export</button><button class="danger" data-a="delete">Delete</button></div>'}
function row(x,menus=true){const sel=selected.has(x.id)?" selected":"";return'<div class="item'+sel+'" data-id="'+esc(x.id)+'" data-kind="'+esc(x.kind)+'">'+icon(x)+'<div class="info"><b>'+esc(x.name)+'</b><small>'+esc(x.kind==="folder"||x.kind==="project"?"Folder":(x.mimeType||"File"))+((x.size)?" • "+bytes(x.size):"")+'</small></div>'+(menus?'<button class="more" aria-label="More">⋮</button>'+menu():"")+'</div>'}
function closeMenus(){document.querySelectorAll(".menu.show").forEach(x=>x.classList.remove("show"))}
function toolbar(){const t=$("tools");if(!currentProject){t.innerHTML="";return}t.innerHTML='<button class="btn" id="back">← Back</button><button class="btn" id="newFolder">+ Folder</button><button class="btn" id="newFile">+ File</button><button class="btn primary" id="uploadBtn">Upload</button><button class="btn" id="selectAll">Select all</button><button class="btn" id="clearSel">Clear</button>';$('back').onclick=()=>{if(currentParent){const f=cache.find(x=>x.id===currentParent);currentParent=f?.parentId||null}else{currentProject=null;currentParent=null}selected.clear();render()};$('newFolder').onclick=()=>openName("folder");$('newFile').onclick=()=>openName("file");$('uploadBtn').onclick=()=>$('upload').click();$('selectAll').onclick=()=>{cache.filter(x=>(x.parentId||null)===(currentParent||null)).forEach(x=>selected.add(x.id));renderList()};$('clearSel').onclick=()=>{selected.clear();renderList()}}
let cache=[];
async function render(){closeMenus();toolbar();if(!currentProject){$("crumb").textContent="axilort-engine-data/";$("storageInfo").textContent="App storage";const ps=(await projects()).sort((a,b)=>a.name.localeCompare(b.name));cache=ps;renderList();updateStorage();return}cache=await files();$("crumb").textContent="axilort-engine-data/"+currentProject.name+(currentParent?"/…":"/");$("storageInfo").textContent="App storage • "+currentProject.name;renderList();updateStorage()}
function renderList(){let arr=cache.filter(x=>(x.parentId||null)===(currentParent||null));const q=$("search").value.trim().toLowerCase();if(q)arr=arr.filter(x=>x.name.toLowerCase().includes(q));const s=$("sort").value;arr.sort((a,b)=>s==="new"?String(b.createdAt).localeCompare(String(a.createdAt)):s==="old"?String(a.createdAt).localeCompare(String(b.createdAt)):s==="size"?(b.size||0)-(a.size||0):s==="type"?String(a.mimeType||a.kind).localeCompare(String(b.mimeType||b.kind)):a.name.localeCompare(b.name));const l=$("list");l.classList.toggle("grid",grid);l.innerHTML=arr.length?arr.map(x=>row(x,!!currentProject||x.kind==="project")).join(""):currentProject?'<div class="empty"><div><b>Folder is empty</b>Create a folder, create a file, or upload assets.</div></div>':'<div class="empty"><div><b>No projects</b>Create a project from the Projects page.</div></div>';$("status").textContent=arr.length+" item"+(arr.length===1?"":"s")+" • "+(grid?"Grid":"List")+" view"}
async function updateStorage(){try{const e=await navigator.storage?.estimate?.();if(e)$("storageInfo").textContent+=(e.usage?" • "+bytes(e.usage):"")}catch{}}
async function same(name,parent,ignore=null){return cache.some(x=>(x.parentId||null)===(parent||null)&&x.id!==ignore&&x.name.toLowerCase()===name.toLowerCase())}
function openName(kind,item=null){pending={kind,item};$("nameTitle").textContent=item?"Rename item":kind==="folder"?"Create folder":"Create file";$("nameHelp").textContent=item?"Rename the selected item.":"Stored directly inside Axilort Engine app storage.";$("nameInput").value=item?.name||"";$("nameError").textContent="";$("nameModal").classList.add("show");setTimeout(()=>$('nameInput').focus(),30)}
async function saveName(){const n=safe($("nameInput").value);if(!n){$("nameError").textContent="Name is required.";return}const parent=currentParent||null;if(await same(n,parent,pending.item?.id)){ $("nameError").textContent="An item with this name already exists.";return}if(pending.item){pending.item.name=n;pending.item.updatedAt=new Date().toISOString();await put(FILES,pending.item);toast("Renamed")}else{await put(FILES,{id:uid(),projectId:currentProject.id,parentId:parent,name:n,kind:pending.kind,content:pending.kind==="file"?"":undefined,mimeType:pending.kind==="file"?"text/plain":"application/octet-stream",size:0,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});toast(pending.kind==="folder"?"Folder created":"File created")}$("nameModal").classList.remove("show");render()}
async function descendants(root){const fs=cache,ids=[root.id];let changed=true;while(changed){changed=false;for(const f of fs)if(ids.includes(f.parentId)&&!ids.includes(f.id)){ids.push(f.id);changed=true}}return fs.filter(f=>ids.includes(f.id))}
async function removeItem(x){const items=x.kind==="folder"?await descendants(x):[x];if(!confirm("Delete "+x.name+"?"+(items.length>1?" This deletes "+items.length+" items.":"")))return;for(const f of items)await del(FILES,f.id);selected.clear();toast("Deleted");render()}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}
async function exportItem(x){if(x.kind==="folder"){const items=await descendants(x);download(new Blob([JSON.stringify({name:x.name,items:items.map(f=>({name:f.name,kind:f.kind,parentId:f.parentId,mimeType:f.mimeType,size:f.size,content:typeof f.content==="string"?f.content:null}))},null,2)],{type:"application/json"}),x.name+".axilort-folder.json");return}if(x.content instanceof Blob)download(x.content,x.name);else download(new Blob([String(x.content??"")],{type:x.mimeType||"text/plain"}),x.name)}
function details(x){$("details").innerHTML='<span>Name</span><span>'+esc(x.name)+'</span><span>Type</span><span>'+esc(x.mimeType||x.kind)+'</span><span>Size</span><span>'+bytes(x.size||0)+'</span><span>Created</span><span>'+esc(new Date(x.createdAt||Date.now()).toLocaleString())+'</span><span>Updated</span><span>'+esc(new Date(x.updatedAt||Date.now()).toLocaleString())+'</span><span>Storage</span><span>axilort-engine-data/'+esc(currentProject?.name||"")+'</span>';$('detailsModal').classList.add('show')}
async function duplicate(x){const nameBase=x.name.replace(/(\.[^.]+)$/,'');const suffix=x.name.match(/(\.[^.]+)$/)?.[1]||"";let n=nameBase+" copy"+suffix,i=2;while(await same(n,x.parentId))n=nameBase+" copy "+i+++suffix;const y={...x,id:uid(),name:n,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};await put(FILES,y);toast("Duplicated");render()}
function showEditor(x){editing=x;$("editorTitle").textContent=x.name;$("editor").value=typeof x.content==="string"?x.content:"";$("editorModal").classList.add("show")}
async function saveEditor(){if(!editing)return;editing.content=$("editor").value;editing.size=new Blob([editing.content]).size;editing.mimeType=editing.mimeType||"text/plain";editing.updatedAt=new Date().toISOString();await put(FILES,editing);$("editorModal").classList.remove("show");toast("File saved");render()}
function showPreview(x){preview=x;$("previewTitle").textContent=x.name;$("previewMeta").textContent=(x.mimeType||"Asset")+" • "+bytes(x.size||0);const b=$("previewBody");b.innerHTML="";if(!(x.content instanceof Blob)){b.innerHTML='<div class="empty"><div><b>No binary preview</b>The file is stored safely and can be exported.</div></div>';$('previewModal').classList.add('show');return}previewUrl=URL.createObjectURL(x.content);if(image(x)){const e=document.createElement('img');e.src=previewUrl;b.appendChild(e)}else if(video(x)){const e=document.createElement('video');e.src=previewUrl;e.controls=true;b.appendChild(e)}else if(audio(x)){const e=document.createElement('audio');e.src=previewUrl;e.controls=true;b.appendChild(e)}else{b.innerHTML='<div class="empty"><div><b>3D/unsupported preview</b>This asset is stored locally. Use Export to open it in a compatible editor.</div></div>'}$('previewModal').classList.add('show')}
async function openItem(x){if(x.kind==="folder"){currentParent=x.id;selected.clear();render();return}if(text(x)&&typeof x.content==="string"){showEditor(x);return}if(image(x)||video(x)||audio(x)||model(x)){showPreview(x);return}exportItem(x)}
$("upload").addEventListener("change",async e=>{if(!currentProject){toast("Open a project first");e.target.value="";return}let count=0;for(const f of e.target.files){if(await same(f.name,currentParent||null))continue;await put(FILES,{id:uid(),projectId:currentProject.id,parentId:currentParent||null,name:f.name,kind:"file",content:f,mimeType:f.type||"application/octet-stream",size:f.size,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});count++}e.target.value="";toast(count+" asset(s) uploaded");render()});
$("list").addEventListener("dblclick",async e=>{const it=e.target.closest('.item');if(!it)return;const x=cache.find(a=>a.id===it.dataset.id);if(!x)return;if(x.kind==="project"){currentProject=x;currentParent=null;selected.clear();render();return}openItem(x)});
$("list").addEventListener("click",async e=>{const more=e.target.closest('.more');if(more){e.stopPropagation();closeMenus();more.parentElement.querySelector('.menu').classList.add('show');return}const b=e.target.closest('.menu button');if(b){e.stopPropagation();const it=b.closest('.item'),x=cache.find(a=>a.id===it.dataset.id);closeMenus();if(!x)return;const a=b.dataset.a;if(a==='open')openItem(x);else if(a==='rename')openName(x.kind,x);else if(a==='details')details(x);else if(a==='duplicate')duplicate(x);else if(a==='export')exportItem(x);else if(a==='delete')removeItem(x);return}const it=e.target.closest('.item');if(it){const id=it.dataset.id;if(e.ctrlKey||e.metaKey||e.shiftKey){selected.has(id)?selected.delete(id):selected.add(id);it.classList.toggle('selected',selected.has(id));return}}});
document.addEventListener('click',e=>{if(!e.target.closest('.more')&&!e.target.closest('.menu'))closeMenus()});$("search").oninput=renderList;$("sort").onchange=renderList;$("view").onclick=()=>{grid=!grid;$("view").textContent=grid?"☷ List":"▦ Grid";renderList()};$("refresh").onclick=()=>render();$("nameCancel").onclick=()=>$("nameModal").classList.remove("show");$("nameSave").onclick=saveName;$("nameInput").onkeydown=e=>{if(e.key==='Enter')saveName();if(e.key==='Escape')$("nameModal").classList.remove('show')};$("editorCancel").onclick=()=>$("editorModal").classList.remove("show");$("editorSave").onclick=saveEditor;$("editor").onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveEditor()}};$("detailsClose").onclick=()=>$("detailsModal").classList.remove('show');$("previewClose").onclick=()=>{$("previewModal").classList.remove('show');if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null};$("previewExport").onclick=()=>preview&&exportItem(preview);
(async()=>{try{await openDB();await render()}catch(e){console.error(e);$("list").innerHTML='<div class="empty"><div><b>Axilort app storage unavailable</b>'+esc(e.message||e)+'</div></div>'}})();
</script>
