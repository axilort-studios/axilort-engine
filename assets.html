<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Assets — Axilort Engine</title>
<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}a,button,input{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}a{text-decoration:none}.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;inset-inline:auto;inset-block:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}}.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;justify-content:center;padding:0 0 clamp(9px,1.5vw,22px)}.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain}.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}.nav a{border:1px solid transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;white-space:nowrap}.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}.ico{width:clamp(14px,1.7vw,21px);height:clamp(14px,1.7vw,21px);display:grid;place-items:center;color:#eee;flex:none;font-size:clamp(11px,1.35vw,18px)}.active .ico{color:var(--red)}.version{margin-top:auto;padding:clamp(7px,1vw,13px) clamp(6px,.8vw,11px);color:#66666b;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);flex:0 0 clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center}.top-action:hover{background:#111112}.gear{font-size:clamp(17px,2.25vw,25px);line-height:1;color:#fff}.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px) clamp(8px,1.7vw,24px);overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}.heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:clamp(7px,1.15vw,17px)}.heading h1{font-size:clamp(15px,2.55vw,27px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}.heading h1 span{color:var(--red)}.heading p{margin:3px 0 0;color:var(--muted);font-size:clamp(7px,1.05vw,13px)}.toolbar{display:flex;align-items:center;gap:6px;margin-bottom:10px}.path{min-width:0;flex:1;color:#77777d;font-size:clamp(7px,.95vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.action{height:clamp(30px,3.8vw,40px);padding:0 10px;border:1px solid #29292d;border-radius:7px;background:#111112;color:#ddd;font-size:clamp(7px,1vw,11px);font-weight:700}.action:hover{border-color:#8e161b;background:#151516}.action.primary{border-color:#ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);color:#fff}.file-list{display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px)}.file-bar{position:relative;min-height:clamp(45px,7vw,72px);display:flex;align-items:center;gap:clamp(7px,1.2vw,15px);padding:clamp(7px,1.25vw,13px);border:1px solid var(--border);border-radius:clamp(8px,1.2vw,15px);background:linear-gradient(145deg,#0c0c0d,#080809)}.file-bar:hover{border-color:#8e161b;background:#101011}.file-icon{width:clamp(27px,3.5vw,43px);height:clamp(27px,3.5vw,43px);flex:none;display:grid;place-items:center;border:1px solid #2a2a2d;border-radius:8px;background:#0b0b0c;color:var(--red);font-size:clamp(10px,1.3vw,15px);font-weight:800}.file-info{min-width:0;flex:1}.file-info strong{display:block;font-size:clamp(8px,1.15vw,13px);font-weight:750;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-info small{display:block;margin-top:3px;color:#77777d;font-size:clamp(7px,.9vw,11px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{width:clamp(27px,3.5vw,40px);height:clamp(27px,3.5vw,40px);flex:none;border:1px solid transparent;border-radius:8px;background:transparent;color:#aaa;font-size:clamp(16px,2vw,22px);line-height:1;display:grid;place-items:center}.more:hover,.more.open{background:#111;border-color:#29292b;color:#fff}.menu{position:absolute;right:clamp(7px,1vw,11px);top:calc(100% + 5px);z-index:50;min-width:145px;padding:4px;border:1px solid var(--border);border-radius:9px;background:#0b0b0c;box-shadow:0 18px 50px #000d;display:none}.menu.show{display:block}.menu button{width:100%;height:34px;border:0;border-radius:6px;background:transparent;color:#ddd;text-align:left;padding:0 10px;font-size:11px}.menu button:hover{background:#151516}.menu .danger{color:#ff5960}.empty{min-height:clamp(65px,8vw,115px);border:1px dashed #29292b;border-radius:clamp(8px,1.2vw,15px);display:flex;align-items:center;justify-content:center;flex-direction:column;background:#080809;text-align:center;padding:8px}.empty-icon{width:clamp(22px,3.2vw,40px);height:clamp(22px,3.2vw,40px);border:1px solid #2a2a2d;border-radius:8px;display:grid;place-items:center;color:#777;margin-bottom:5px;font-size:clamp(9px,1.3vw,15px)}.empty strong{font-size:clamp(8px,1.05vw,12px);color:#bdbdc1}.empty span{font-size:clamp(7px,.85vw,10px);color:#777;margin-top:2px}.backdrop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:12px;background:#000c;backdrop-filter:blur(7px)}.backdrop.show{display:flex}.modal{width:min(470px,94vw);border:1px solid var(--border);border-radius:14px;background:linear-gradient(145deg,#0c0c0d,#080809);box-shadow:0 30px 100px #000;overflow:hidden}.modal-head{padding:clamp(13px,1.7vw,18px);border-bottom:1px solid var(--border2)}.modal-head h2{margin:0;font-size:clamp(13px,1.5vw,17px)}.modal-head p{margin:4px 0 0;color:#777;font-size:clamp(8px,1vw,11px);line-height:1.4}.modal-body{padding:clamp(13px,1.7vw,18px)}.field label{display:block;color:#aaa;font-size:clamp(8px,.95vw,11px);font-weight:750;margin-bottom:5px}.field input{width:100%;height:clamp(36px,3.5vw,42px);border:1px solid #2b2b2f;border-radius:7px;outline:0;background:#070708;padding:0 10px;font-size:clamp(9px,1vw,12px)}.field input:focus{border-color:#8e161b;box-shadow:0 0 0 3px #ff202814}.error{display:none;color:#ff5b61;font-size:clamp(7px,.85vw,10px);margin-top:5px}.error.show{display:block}.confirm-text{color:#aaa;font-size:clamp(8px,.95vw,11px);line-height:1.55}.confirm-text b{color:#fff}.foot{display:flex;justify-content:flex-end;gap:6px;padding:clamp(8px,1vw,12px) clamp(13px,1.7vw,18px);border-top:1px solid var(--border2);background:#080809}.foot button{height:clamp(31px,3vw,36px);border-radius:7px;padding:0 clamp(10px,1.2vw,14px);font-size:clamp(8px,.95vw,11px);font-weight:750}.cancel{border:1px solid #29292d;background:#111;color:#aaa}.danger-btn{border:1px solid #ff4148;background:linear-gradient(#ff3038,#d9141b);color:#fff}@media(max-height:360px){.sidebar{width:clamp(86px,16vw,145px);flex-basis:clamp(86px,16vw,145px)}.nav a{height:29px}.brand img{width:34px;height:34px}.content{padding:7px 9px}.file-bar{min-height:44px}}@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:7px 9px}.heading{margin-bottom:7px}.heading h1{font-size:17px}.heading p{font-size:8px}.action{height:30px;padding:0 8px;font-size:8px}.file-bar{min-height:45px;padding:7px}.file-icon{width:28px;height:28px}.file-info strong{font-size:9px}.file-info small{font-size:7px}.more{width:28px;height:28px}.menu{top:40px}.modal{width:min(410px,90vw)}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a href="projects.html"><span class="ico">□</span>Projects</a><a class="active" href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a></nav><div class="version">Axilort Engine v1.0.0</div></aside><main class="main"><header class="topbar"><a class="top-action" href="settings.html" aria-label="Settings"><span class="gear">⚙</span></a></header><section class="content"><div class="heading"><div><h1><span>Assets</span></h1><p>Project folders are managed from Projects.</p></div></div><div class="toolbar"><div class="path" id="path">axilort-engine-data/</div><div class="actions" id="actions"></div></div><div class="file-list" id="list"></div><input id="picker" type="file" multiple hidden></section></main></div>
<div class="backdrop" id="renameModal"><div class="modal"><div class="modal-head"><h2>Rename project folder</h2><p>The project name and its IndexedDB record will be updated.</p></div><div class="modal-body"><div class="field"><label>PROJECT NAME</label><input id="renameInput" maxlength="80" autocomplete="off"><div class="error" id="renameError"></div></div></div><div class="foot"><button class="cancel" id="renameCancel">Cancel</button><button class="danger-btn" id="renameSave">Rename</button></div></div></div>
<div class="backdrop" id="deleteModal"><div class="modal"><div class="modal-head"><h2>Delete project folder?</h2><p>This removes the project record from IndexedDB.</p></div><div class="modal-body"><div class="confirm-text">Delete <b id="deleteName"></b>?</div><div class="error" id="deleteError"></div></div><div class="foot"><button class="cancel" id="deleteCancel">Cancel</button><button class="danger-btn" id="deleteConfirm">Delete Project</button></div></div></div>
<script>
const DB="axilort-engine-data",STORE="projects",FILES="assetFiles";const $=id=>document.getElementById(id);let db=null,currentProject=null,pendingProject=null;
function openDB(){return new Promise((resolve,reject)=>{if(db&&db.objectStoreNames.contains(STORE)){resolve(db);return}const r=indexedDB.open(DB);r.onerror=()=>reject(r.error||new Error("IndexedDB could not be opened."));r.onsuccess=()=>{db=r.result;db.onversionchange=()=>{db.close();db=null};if(!db.objectStoreNames.contains(STORE))return reject(new Error("Projects storage is unavailable."));resolve(db)}})}
function readProjects(){return openDB().then(d=>new Promise((resolve,reject)=>{const r=d.transaction(STORE,"readonly").objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)}))}
function updateProject(p,name){return openDB().then(d=>new Promise((resolve,reject)=>{const tx=d.transaction(STORE,"readwrite"),s=tx.objectStore(STORE),g=s.get(p.id);g.onsuccess=()=>{const v=g.result;if(!v)return reject(new Error("Project not found."));v.name=name;v.path=DB+"/projects/"+name;s.put(v)};g.onerror=()=>reject(g.error);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("Could not rename project."))}))}
function deleteProject(p){return openDB().then(d=>new Promise((resolve,reject)=>{const names=[STORE];if(d.objectStoreNames.contains(FILES))names.push(FILES);const tx=d.transaction(names,"readwrite");tx.objectStore(STORE).delete(p.id);if(d.objectStoreNames.contains(FILES)){const s=tx.objectStore(FILES),q=s.getAll();q.onsuccess=()=>{for(const f of q.result||[])if(f&&f.path&&isProjectFile(f,p))s.delete(f.path)}}tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("Could not delete project."))}))}
function isProjectFile(f,p){const n=String(p.name).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return new RegExp("^"+DB+"/(?:project|projects)/"+n+"(?:/|$)","i").test(String(f.path||""))}
function readFiles(p){if(!db||!db.objectStoreNames.contains(FILES))return Promise.resolve([]);return new Promise((resolve,reject)=>{const r=db.transaction(FILES,"readonly").objectStore(FILES).getAll();r.onsuccess=()=>resolve((r.result||[]).filter(f=>isProjectFile(f,p)));r.onerror=()=>reject(r.error)})}
function size(n){if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";return(n/1048576).toFixed(1)+" MB"}
function closeMenus(){document.querySelectorAll(".menu.show").forEach(x=>x.classList.remove("show"));document.querySelectorAll(".more.open").forEach(x=>x.classList.remove("open"))}
function render(items){const a=$("actions");a.innerHTML="";$("path").textContent=currentProject?DB+"/projects/"+currentProject.name+"/":DB+"/";if(currentProject){const back=document.createElement("button");back.className="action";back.textContent="← Back";back.onclick=()=>{currentProject=null;renderCurrent()};a.appendChild(back)}const list=$("list");list.innerHTML="";if(!items.length){list.innerHTML='<div class="empty"><div class="empty-icon">'+(currentProject?"□":"◇")+'</div><strong>'+(currentProject?"Project folder is empty":"No projects yet")+'</strong><span>'+(currentProject?"Folder creation and file uploading are disabled here.":"Create a project from Projects to see its folder here.")+'</span></div>';return}items.forEach(item=>{const row=document.createElement("div");row.className="file-bar";const icon=document.createElement("div");icon.className="file-icon";icon.textContent=item.kind==="folder"?"□":"◇";const info=document.createElement("div");info.className="file-info";const strong=document.createElement("strong");strong.textContent=item.name;const small=document.createElement("small");small.textContent=item.kind==="folder"?"Project folder · "+DB+"/projects/"+item.name:"File · "+size(item.size||0);info.append(strong,small);const more=document.createElement("button");more.className="more";more.type="button";more.textContent="⋮";const menu=document.createElement("div");menu.className="menu";const open=document.createElement("button");open.textContent="Open folder";const rename=document.createElement("button");rename.textContent="Rename";const del=document.createElement("button");del.textContent="Delete";del.className="danger";menu.append(open,rename,del);row.append(icon,info,more,menu);if(item.kind==="folder")row.ondblclick=e=>{if(!e.target.closest("button")){currentProject=item;renderCurrent()}};more.onclick=e=>{e.stopPropagation();closeMenus();menu.classList.add("show");more.classList.add("open")};open.onclick=()=>{closeMenus();if(item.kind==="folder"){currentProject=item;renderCurrent()}else{openFile(item)}};rename.onclick=()=>{closeMenus();if(item.kind==="folder"){pendingProject=item;$("renameInput").value=item.name;$("renameError").classList.remove("show");$("renameModal").classList.add("show");setTimeout(()=>$("renameInput").focus(),50)}else renameFile(item)};del.onclick=()=>{closeMenus();if(item.kind==="folder"){pendingProject=item;$("deleteName").textContent=item.name;$("deleteError").classList.remove("show");$("deleteModal").classList.add("show")}else deleteFile(item)};list.appendChild(row)})}
async function renderCurrent(){try{const projects=await readProjects();if(currentProject){const fresh=projects.find(p=>p.id===currentProject.id);if(!fresh){currentProject=null;return render(projects.map(p=>({kind:"folder",...p})))}currentProject=fresh;render((await readFiles(fresh)).map(f=>({kind:"file",...f})))}else render(projects.map(p=>({kind:"folder",...p})))}catch(e){$("list").innerHTML='<div class="empty"><div class="empty-icon">!</div><strong>Storage unavailable</strong><span>'+String(e.message||e)+'</span></div>"}}function openFile(item){if(!item.blob)return alert("This file has no stored data.");const u=URL.createObjectURL(item.blob);window.open(u,"_blank","noopener");setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function renameFile(item){const name=prompt("Rename file",item.name);if(!name||!name.trim()||name.trim()===item.name)return;if(!db||!db.objectStoreNames.contains(FILES))return;try{const tx=db.transaction(FILES,"readwrite"),s=tx.objectStore(FILES),g=s.get(item.path);g.onsuccess=()=>{const v=g.result;if(!v)return;const next=v.path.slice(0,v.path.lastIndexOf("/")+1)+name.trim();v.name=name.trim();v.path=next;s.put(v);s.delete(item.path)};tx.oncomplete=renderCurrent;tx.onerror=()=>alert(tx.error?.message||"Could not rename file.")}catch(e){alert(e.message||e)}}
async function deleteFile(item){if(!confirm("Delete "+item.name+"?"))return;try{const tx=db.transaction(FILES,"readwrite");tx.objectStore(FILES).delete(item.path);tx.oncomplete=renderCurrent;tx.onerror=()=>alert(tx.error?.message||"Could not delete file.")}catch(e){alert(e.message||e)}}
$("renameCancel").onclick=()=>{$("renameModal").classList.remove("show");pendingProject=null};$("renameSave").onclick=async()=>{if(!pendingProject)return;const name=$("renameInput").value.trim();if(!name)return $("renameError").textContent="Enter a project name.",$("renameError").classList.add("show");try{const projects=await readProjects();if(projects.some(p=>p.id!==pendingProject.id&&String(p.name).toLowerCase()===name.toLowerCase()))return $("renameError").textContent="A project with this name already exists.",$("renameError").classList.add("show");await updateProject(pendingProject,name);$("renameModal").classList.remove("show");pendingProject=null;await renderCurrent()}catch(e){$("renameError").textContent=e.message||"Rename failed.";$("renameError").classList.add("show")}};
$("renameInput").onkeydown=e=>{if(e.key==="Enter")$("renameSave").click();if(e.key==="Escape")$("renameCancel").click()};$("deleteCancel").onclick=()=>{$("deleteModal").classList.remove("show");pendingProject=null};$("deleteConfirm").onclick=async()=>{if(!pendingProject)return;try{await deleteProject(pendingProject);if(currentProject&&currentProject.id===pendingProject.id)currentProject=null;pendingProject=null;$("deleteModal").classList.remove("show");await renderCurrent()}catch(e){$("deleteError").textContent=e.message||"Delete failed.";$("deleteError").classList.add("show")}};["renameModal","deleteModal"].forEach(id=>$(id).onclick=e=>{if(e.target.id===id){$(id).classList.remove("show");pendingProject=null}});document.addEventListener("click",e=>{if(!e.target.closest(".more,.menu"))closeMenus()});renderCurrent();
</script>
</body>
</html>
