<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}a,button,input{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}a{text-decoration:none}.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;inset-inline:auto;inset-block:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}}.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;justify-content:center;padding:0 0 clamp(9px,1.5vw,22px)}.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain}.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}.nav a{border:1px solid transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;white-space:nowrap}.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}.ico{width:clamp(14px,1.7vw,21px);height:clamp(14px,1.7vw,21px);display:grid;place-items:center;color:#eee;flex:none;font-size:clamp(11px,1.35vw,18px)}.active .ico{color:var(--red)}.version{margin-top:auto;padding:clamp(7px,1vw,13px) clamp(6px,.8vw,11px);color:#66666b;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);flex:0 0 clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center}.top-action:hover{background:#111112}.gear{font-size:clamp(17px,2.25vw,25px);line-height:1;color:#fff;filter:drop-shadow(0 0 4px #ffffff33)}.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px) clamp(8px,1.7vw,24px);overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:clamp(8px,1.15vw,17px)}.heading h1{font-size:clamp(15px,2.55vw,27px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}.heading h1 span{color:var(--red)}.heading p{margin:3px 0 0;color:var(--muted);font-size:clamp(7px,1.05vw,13px)}.toolbar{display:flex;align-items:center;gap:6px;margin-bottom:10px}.path{min-width:0;flex:1;color:#77777d;font-size:clamp(7px,.95vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.action{height:clamp(30px,3.8vw,40px);padding:0 10px;border:1px solid #29292d;border-radius:7px;background:#111112;color:#ddd;font-size:clamp(7px,1vw,11px);font-weight:700}.action:hover{border-color:#8e161b;background:#151516}.action.primary{border-color:#ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);color:#fff}.file-list{display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px)}.file-bar{position:relative;min-height:clamp(45px,7vw,72px);display:flex;align-items:center;gap:clamp(7px,1.2vw,15px);padding:clamp(7px,1.25vw,13px);border:1px solid var(--border);border-radius:clamp(8px,1.2vw,15px);background:linear-gradient(145deg,#0c0c0d,#080809)}.file-bar:hover{border-color:#8e161b;background:#101011}.file-icon{width:clamp(27px,3.5vw,43px);height:clamp(27px,3.5vw,43px);flex:none;display:grid;place-items:center;border:1px solid #2a2a2d;border-radius:8px;background:#0b0b0c;color:var(--red);font-size:clamp(10px,1.3vw,15px);font-weight:800}.file-info{min-width:0;flex:1}.file-info strong{display:block;font-size:clamp(8px,1.15vw,13px);font-weight:750;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-info small{display:block;margin-top:3px;color:#77777d;font-size:clamp(7px,.9vw,11px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{width:clamp(27px,3.5vw,40px);height:clamp(27px,3.5vw,40px);flex:none;border:1px solid transparent;border-radius:8px;background:transparent;color:#aaa;font-size:clamp(16px,2vw,22px);display:grid;place-items:center}.more:hover,.more.open{background:#111;border-color:#29292b;color:#fff}.menu{position:absolute;right:clamp(7px,1vw,11px);top:calc(100% + 5px);z-index:50;min-width:clamp(145px,16vw,180px);padding:4px;border:1px solid var(--border);border-radius:9px;background:#0b0b0c;box-shadow:0 18px 50px #000d;display:none}.menu.show{display:block}.menu button{width:100%;height:clamp(29px,3.5vw,37px);border:0;border-radius:6px;background:transparent;color:#ddd;text-align:left;padding:0 10px;font-size:clamp(8px,1vw,11px)}.menu button:hover{background:#151516}.menu .danger{color:#ff5960}.empty{min-height:clamp(65px,8vw,115px);border:1px dashed #29292b;border-radius:clamp(8px,1.2vw,15px);display:flex;align-items:center;justify-content:center;flex-direction:column;background:#080809;text-align:center;padding:8px}.empty-icon{width:clamp(22px,3.2vw,40px);height:clamp(22px,3.2vw,40px);border:1px solid #2a2a2d;border-radius:8px;display:grid;place-items:center;color:#777;margin-bottom:5px}.empty strong{font-size:clamp(8px,1.05vw,12px);color:#bdbdc1}.empty span{font-size:clamp(7px,.85vw,10px);color:#777;margin-top:2px}.backdrop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:12px;background:#000c;backdrop-filter:blur(7px)}.backdrop.show{display:flex}.modal{width:min(470px,94vw);border:1px solid var(--border);border-radius:14px;background:linear-gradient(145deg,#0c0c0d,#080809);box-shadow:0 30px 100px #000;overflow:hidden}.modal-head{padding:clamp(13px,1.7vw,18px);border-bottom:1px solid var(--border2)}.modal-head h2{margin:0;font-size:clamp(13px,1.5vw,17px)}.modal-head p{margin:4px 0 0;color:#777;font-size:clamp(8px,1vw,11px);line-height:1.4}.modal-body{padding:clamp(13px,1.7vw,18px)}.field label{display:block;color:#aaa;font-size:clamp(8px,.95vw,11px);font-weight:750;margin-bottom:5px}.field input{width:100%;height:clamp(36px,3.5vw,42px);border:1px solid #2b2b2f;border-radius:7px;outline:0;background:#070708;padding:0 10px;font-size:clamp(9px,1vw,12px)}.field input:focus{border-color:#8e161b;box-shadow:0 0 0 3px #ff202814}.error{display:none;color:#ff5b61;font-size:clamp(7px,.85vw,10px);margin-top:5px}.error.show{display:block}.confirm-text{color:#aaa;font-size:clamp(8px,.95vw,11px);line-height:1.55}.confirm-text b{color:#fff}.foot{display:flex;justify-content:flex-end;gap:6px;padding:clamp(8px,1vw,12px) clamp(13px,1.7vw,18px);border-top:1px solid var(--border2);background:#080809}.foot button{height:clamp(31px,3vw,36px);border-radius:7px;padding:0 clamp(10px,1.2vw,14px);font-size:clamp(8px,.95vw,11px);font-weight:750}.cancel{border:1px solid #29292d;background:#111;color:#aaa}.danger-btn{border:1px solid #ff4148;background:linear-gradient(#ff3038,#d9141b);color:#fff}.status{position:fixed;right:14px;bottom:12px;z-index:150;max-width:min(420px,88vw);padding:9px 12px;border:1px solid #29292d;border-radius:8px;background:#0b0b0c;color:#bbb;font-size:11px;box-shadow:0 15px 40px #000;display:none}.status.show{display:block}.status.bad{border-color:#7f1b20;color:#ff777c}@media(max-height:360px){.sidebar{width:clamp(86px,16vw,145px);flex-basis:clamp(86px,16vw,145px)}.nav a{height:29px}.brand img{width:34px;height:34px}.content{padding:7px 9px}.file-bar{min-height:44px}}@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:7px 9px}.heading{margin-bottom:7px}.heading h1{font-size:17px}.heading p{font-size:8px}.action{height:30px;padding:0 8px;font-size:8px}.file-bar{min-height:45px;padding:7px}.file-icon{width:28px;height:28px}.file-info strong{font-size:9px}.file-info small{font-size:7px}.more{width:28px;height:28px}.menu{top:40px}.modal{width:min(410px,90vw)}}
</style>

<body>
<div class="app"><aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a href="projects.html"><span class="ico">□</span>Projects</a><a class="active" href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a></nav><div class="version">Axilort Engine v1.0.0</div></aside><main class="main"><header class="topbar"><a class="top-action" href="settings.html" aria-label="Settings"><span class="gear">⚙</span></a></header><section class="content"><div class="heading"><div><h1><span>Assets</span></h1><p>Real project files and folders stored in IndexedDB.</p></div></div><div class="toolbar"><div class="path" id="path">axilort-engine-data/</div><div class="actions"><button class="action" id="back" hidden>← Back</button><button class="action" id="newFolder">＋ Folder</button><button class="action" id="uploadFolder">＋ Folder Upload</button><button class="action" id="extract">Extract ZIP</button><button class="action primary" id="upload">＋ Upload</button></div></div><div class="file-list" id="list"></div><input id="picker" type="file" multiple hidden><input id="folderPicker" type="file" webkitdirectory directory multiple hidden><input id="zipPicker" type="file" accept=".zip,application/zip" hidden></section></main></div>
<div class="backdrop" id="nameModal"><div class="modal"><div class="modal-head"><h2 id="nameTitle">Create folder</h2><p id="nameSubtitle">Create a real folder entry in Axilort Engine storage.</p></div><div class="modal-body"><div class="field"><label id="nameLabel">FOLDER NAME</label><input id="nameInput" maxlength="120" autocomplete="off" placeholder="New Folder"><div class="error" id="nameError"></div></div></div><div class="foot"><button class="cancel" id="nameCancel">Cancel</button><button class="danger-btn" id="nameSave">Save</button></div></div></div>
<div class="backdrop" id="confirmModal"><div class="modal"><div class="modal-head"><h2 id="confirmTitle">Delete?</h2><p id="confirmSubtitle">This action cannot be undone.</p></div><div class="modal-body"><div class="confirm-text" id="confirmText"></div><div class="error" id="confirmError"></div></div><div class="foot"><button class="cancel" id="confirmCancel">Cancel</button><button class="danger-btn" id="confirmOk">Delete</button></div></div></div>
<div class="status" id="status"></div>
<script>
const DB="axilort-engine-data",PROJECTS="projects",FOLDERS="assetFolders",FILES="assetFiles";const $=id=>document.getElementById(id);let db=null,current={type:"root",id:null,name:"",parentId:null},modalMode=null,modalItem=null,confirmItem=null;
function showStatus(msg,bad=false){const s=$("status");s.textContent=msg;s.className="status show"+(bad?" bad":"");clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>s.className="status",3200)}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error("IndexedDB request failed"))})}
async function openDB(){if(db)return db;return new Promise((resolve,reject)=>{let r;try{r=indexedDB.open(DB)}catch(e){reject(e);return}r.onerror=()=>reject(r.error||new Error("IndexedDB unavailable"));r.onblocked=()=>reject(new Error("Storage is busy. Close other Axilort Engine tabs."));r.onsuccess=()=>{db=r.result;db.onversionchange=()=>{db.close();db=null};const missing=[FOLDERS,FILES].filter(x=>!db.objectStoreNames.contains(x));if(!missing.length){resolve(db);return}const v=db.version+1;db.close();db=null;const u=indexedDB.open(DB,v);u.onupgradeneeded=()=>{if(!u.result.objectStoreNames.contains(FOLDERS))u.result.createObjectStore(FOLDERS,{keyPath:"id"});if(!u.result.objectStoreNames.contains(FILES))u.result.createObjectStore(FILES,{keyPath:"id"})};u.onerror=()=>reject(u.error||new Error("Could not create asset storage"));u.onblocked=()=>reject(new Error("Storage is busy. Close other Axilort Engine tabs."));u.onsuccess=()=>{db=u.result;db.onversionchange=()=>{db.close();db=null};resolve(db)}}})}
async function getAll(store){const d=await openDB();return req(d.transaction(store,"readonly").objectStore(store).getAll())}async function getOne(store,key){const d=await openDB();return req(d.transaction(store,"readonly").objectStore(store).get(key))}async function put(store,value){const d=await openDB();return req(d.transaction(store,"readwrite").objectStore(store).put(value))}async function del(store,key){const d=await openDB();return req(d.transaction(store,"readwrite").objectStore(store).delete(key))}
async function projects(){try{return await getAll(PROJECTS)}catch(e){return[]}}function uid(p){try{return p+"_"+Date.now().toString(36)+"_"+crypto.getRandomValues(new Uint32Array(1))[0].toString(36)}catch(e){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2)}}function cleanName(n){return String(n||"").replace(/[\\/]/g,"_").replace(/\0/g,"").trim().slice(0,120)}function parentKey(){return current.type==="root"?null:current.type==="project"?"project:"+current.projectId:current.id}
async function visible(){const ps=await projects(),fs=await getAll(FOLDERS),files=await getAll(FILES);if(current.type==="root"){const out=ps.map(p=>({kind:"project",id:"project:"+p.id,name:p.name||"Untitled Project",path:DB+"/projects/"+(p.name||p.id)+"/",project:p}));for(const f of fs.filter(x=>x.parentId===null))out.push({kind:"folder",id:f.id,name:f.name,path:DB+"/assets/"+f.name+"/",folder:f});for(const f of files.filter(x=>x.parentId===null))out.push({kind:"file",id:f.id,name:f.name,path:DB+"/assets/"+f.name,size:f.size||0,file:f});return out}const pid=current.type==="project"?"project:"+current.projectId:current.id;const out=fs.filter(x=>x.parentId===pid).map(f=>({kind:"folder",id:f.id,name:f.name,path:DB+"/assets/"+f.name+"/",folder:f}));for(const f of files.filter(x=>x.parentId===pid))out.push({kind:"file",id:f.id,name:f.name,path:DB+"/assets/"+f.name,size:f.size||0,file:f});return out}
function formatSize(n){n=Number(n)||0;if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";if(n<1073741824)return(n/1048576).toFixed(1)+" MB";return(n/1073741824).toFixed(1)+" GB"}function icon(n,folder){if(folder)return"□";const x=n.split(".").pop().toLowerCase();if(["png","jpg","jpeg","gif","webp","svg"].includes(x))return"▧";if(["mp3","wav","ogg","m4a"].includes(x))return"♪";if(["mp4","webm","mov"].includes(x))return"▶";if(["js","ts","html","css","json","gd","py","lua","cs"].includes(x))return"</>";return"◇"}
function render(items){$("list").innerHTML="";$("path").textContent=current.type==="root"?DB+"/":DB+"/"+current.name+"/";$("back").hidden=current.type==="root";if(!items.length){$("list").innerHTML='<div class="empty"><div class="empty-icon">◇</div><strong>No files or folders</strong><span>Use Folder or Upload to add real data.</span></div>';return}items.sort((a,b)=>(a.kind==="file")-(b.kind==="file")||a.name.localeCompare(b.name));for(const item of items){const row=document.createElement("div");row.className="file-bar";row.innerHTML='<div class="file-icon"></div><div class="file-info"><strong></strong><small></small></div><button class="more" aria-label="More">⋮</button><div class="menu"></div>';row.querySelector(".file-icon").textContent=icon(item.name,item.kind!=="file");row.querySelector("strong").textContent=item.name;row.querySelector("small").textContent=item.kind==="project"?"Project · IndexedDB / projects":item.kind==="folder"?"Folder · IndexedDB asset storage":"File · "+formatSize(item.size);const menu=row.querySelector(".menu"),more=row.querySelector(".more");let opts=item.kind==="file"?["open","download","rename","copy","delete"]:["open","rename","delete"];for(const act of opts){const b=document.createElement("button");b.dataset.act=act;b.textContent={open:item.kind==="file"?"Open / Preview":"Open Folder",download:"Download File",rename:"Rename",copy:"Copy Path",delete:"Delete"}[act];if(act==="delete")b.className="danger";menu.appendChild(b)}more.onclick=e=>{e.stopPropagation();document.querySelectorAll(".menu.show").forEach(x=>x.classList.remove("show"));document.querySelectorAll(".more.open").forEach(x=>x.classList.remove("open"));menu.classList.toggle("show");more.classList.toggle("open")};row.ondblclick=e=>{if(!e.target.closest("button")&&item.kind!=="file")openItem(item)};menu.onclick=e=>{const b=e.target.closest("button");if(b)action(item,b.dataset.act)};$("list").appendChild(row)}}
async function refresh(){try{render(await visible())}catch(e){showStatus(e.message||"Could not load assets",true)}}async function openItem(item){if(item.kind==="project")current={type:"project",id:item.id,name:item.name,parentId:null,projectId:item.project.id};else if(item.kind==="folder")current={type:"folder",id:item.id,name:item.name,parentId:item.folder.parentId};else return previewFile(item.file);await refresh()}
function closeMenus(){document.querySelectorAll(".menu.show").forEach(x=>x.classList.remove("show"));document.querySelectorAll(".more.open").forEach(x=>x.classList.remove("open"))}async function action(item,act){closeMenus();if(act==="open")return openItem(item);if(act==="download")return downloadFile(item.file);if(act==="copy"){try{await navigator.clipboard.writeText(item.path);showStatus("Path copied")}catch(e){showStatus("Clipboard permission denied",true)}return}if(act==="rename")return showName("rename",item);if(act==="delete")return askDelete(item)}
function showName(mode,item=null){modalMode=mode;modalItem=item;$("nameTitle").textContent=mode==="create"?"Create folder":"Rename";$("nameSubtitle").textContent=mode==="create"?"Create a real folder in IndexedDB asset storage.":"Rename the selected folder or project without losing its stored data.";$("nameLabel").textContent=mode==="create"?"FOLDER NAME":"NEW NAME";$("nameInput").value=item?item.name:"";$("nameInput").placeholder=mode==="create"?"New Folder":"New name";$("nameError").classList.remove("show");$("nameModal").classList.add("show");setTimeout(()=>{$("nameInput").focus();$("nameInput").select()},30)}function hideName(){$("nameModal").classList.remove("show");modalMode=null;modalItem=null}
async function saveName(){const n=cleanName($("nameInput").value);if(!n){$("nameError").textContent="Enter a name.";$("nameError").classList.add("show");return}try{if(modalMode==="create"){const all=await getAll(FOLDERS);if(all.some(f=>f.parentId===parentKey()&&f.name.toLowerCase()===n.toLowerCase())){throw new Error("A folder with this name already exists here.")}await put(FOLDERS,{id:uid("folder"),name:n,parentId:parentKey(),createdAt:new Date().toISOString()});showStatus("Folder created")}else if(modalItem.kind==="project"){const p=await getOne(PROJECTS,modalItem.project.id);if(!p)throw new Error("Project no longer exists");p.name=n;p.updatedAt=new Date().toISOString();await put(PROJECTS,p);current.name=n;showStatus("Project renamed")}else{const f=await getOne(FOLDERS,modalItem.id);if(!f)throw new Error("Folder no longer exists");const all=await getAll(FOLDERS);if(all.some(x=>x.parentId===f.parentId&&x.id!==f.id&&x.name.toLowerCase()===n.toLowerCase()))throw new Error("A folder with this name already exists here.");f.name=n;f.updatedAt=new Date().toISOString();await put(FOLDERS,f);if(current.id===f.id)current.name=n;showStatus("Folder renamed")}hideName();await refresh()}catch(e){$("nameError").textContent=e.message||"Operation failed";$("nameError").classList.add("show")}}
function askDelete(item){confirmItem=item;$("confirmTitle").textContent=item.kind==="file"?"Delete file?":"Delete folder?";$("confirmSubtitle").textContent=item.kind==="project"?"The project record and its asset data will be removed.":"All files and subfolders inside this folder will also be removed.";$("confirmText").textContent="Delete "+item.name+"? This cannot be undone.";$("confirmError").classList.remove("show");$("confirmModal").classList.add("show")}
async function removeFolderData(id){const fs=await getAll(FOLDERS),files=await getAll(FILES),ids=new Set([id]);let changed=true;while(changed){changed=false;for(const f of fs)if(ids.has(f.parentId)&&!ids.has(f.id)){ids.add(f.id);changed=true}}for(const f of fs)if(ids.has(f.id))await del(FOLDERS,f.id);for(const f of files)if(ids.has(f.parentId))await del(FILES,f.id)}async function removeProjectData(projectId){const fs=await getAll(FOLDERS),files=await getAll(FILES),ids=new Set(["project:"+projectId]);let changed=true;while(changed){changed=false;for(const f of fs)if(ids.has(f.parentId)&&!ids.has(f.id)){ids.add(f.id);changed=true}}for(const f of fs)if(ids.has(f.id))await del(FOLDERS,f.id);for(const f of files)if(ids.has(f.parentId))await del(FILES,f.id)}
async function confirmDelete(){const item=confirmItem;if(!item)return;try{if(item.kind==="file")await del(FILES,item.id);else if(item.kind==="project"){const p=await getOne(PROJECTS,item.project.id);if(p)await del(PROJECTS,p.id);await removeProjectData(item.project.id);if(current.projectId===item.project.id)goBack()}else{await removeFolderData(item.id);if(current.id===item.id)goBack()}$("confirmModal").classList.remove("show");confirmItem=null;showStatus("Deleted");await refresh()}catch(e){$("confirmError").textContent=e.message||"Delete failed";$("confirmError").classList.add("show")}}
function goBack(){current={type:"root",id:null,name:"",parentId:null};refresh()}function targetParent(){return parentKey()}
async function ensureFolder(name,parentId){const fs=await getAll(FOLDERS),found=fs.find(f=>f.parentId===parentId&&f.name.toLowerCase()===name.toLowerCase());if(found)return found.id;const id=uid("folder");await put(FOLDERS,{id,name,parentId,createdAt:new Date().toISOString()});return id}
async function saveFiles(fileList){const files=Array.from(fileList||[]);if(!files.length)return;const parent=targetParent();let count=0;for(const file of files){let rel=file.webkitRelativePath||file.name;rel=rel.replace(/^\/+/,"");const parts=rel.split("/").filter(Boolean);let pid=parent;for(let i=0;i<parts.length-1;i++)pid=await ensureFolder(cleanName(parts[i]),pid);const name=cleanName(parts[parts.length-1]);if(!name)continue;const existing=(await getAll(FILES)).find(x=>x.parentId===pid&&x.name.toLowerCase()===name.toLowerCase());await put(FILES,{id:existing?.id||uid("file"),name,parentId:pid,size:file.size,type:file.type||"application/octet-stream",lastModified:file.lastModified,blob:file,createdAt:existing?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()});count++}showStatus(count+" file"+(count===1?"":"s")+" saved");await refresh()}
function downloadFile(f){if(!f?.blob)return showStatus("File data is unavailable",true);const url=URL.createObjectURL(f.blob),a=document.createElement("a");a.href=url;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showStatus("Download started")}
function textFile(n){return /\.(txt|md|json|js|ts|html|css|xml|csv|gd|py|lua|cs|shader|glsl|vert|frag)$/i.test(n)}async function previewFile(f){if(!f?.blob)return showStatus("File data is unavailable",true);if(textFile(f.name)){const text=await f.blob.text();const w=window.open("","_blank");if(w){w.document.write("<pre style=\"white-space:pre-wrap;background:#050505;color:#eee;padding:20px;font-family:monospace\">"+String(text).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+"</pre>");w.document.close();return}}const url=URL.createObjectURL(f.blob),w=window.open(url,"_blank");if(!w)showStatus("Popup blocked. Use Download File.",true);setTimeout(()=>URL.revokeObjectURL(url),60000)}
function u16(a,o){return a[o]|a[o+1]<<8}function u32(a,o){return(a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}function parseZip(buf){const a=new Uint8Array(buf);let end=-1;for(let i=a.length-22;i>=Math.max(0,a.length-65558);i--)if(u32(a,i)===0x06054b50){end=i;break}if(end<0)throw new Error("Invalid ZIP file");const count=u16(a,end+10),offset=u32(a,end+16);let p=offset,out=[];for(let i=0;i<count&&p+46<=a.length;i++){if(u32(a,p)!==0x02014b50)break;const flags=u16(a,p+8),method=u16(a,p+10),csize=u32(a,p+20),nlen=u16(a,p+28),elen=u16(a,p+30),clen=u16(a,p+32),loff=u32(a,p+42);let name=new TextDecoder(flags&0x800?"utf-8":"latin1").decode(a.slice(p+46,p+46+nlen));out.push({name:name.replace(/\\/g,"/"),method,csize,loff,dir:name.endsWith("/")});p+=46+nlen+elen+clen}return out}
async function unzipEntry(buf,e){const a=new Uint8Array(buf),p=e.loff;if(u32(a,p)!==0x04034b50)throw new Error("Invalid ZIP entry: "+e.name);const nlen=u16(a,p+26),elen=u16(a,p+28),compressed=a.slice(p+30+nlen+elen,p+30+nlen+elen+e.csize);if(e.method===0)return compressed;if(e.method!==8)throw new Error("Unsupported ZIP compression: "+e.name);if(typeof DecompressionStream==="undefined")throw new Error("This browser cannot extract deflated ZIP files");const ds=new DecompressionStream("deflate-raw");return new Uint8Array(await new Response(new Blob([compressed]).stream().pipeThrough(ds)).arrayBuffer())}
async function importZip(file){try{const buf=await file.arrayBuffer(),entries=parseZip(buf);if(!entries.length)throw new Error("ZIP contains no files");let count=0;for(const e of entries){if(e.dir)continue;const data=await unzipEntry(buf,e),parts=e.name.split("/").filter(Boolean),parent=targetParent();let pid=parent;for(let i=0;i<parts.length-1;i++)pid=await ensureFolder(cleanName(parts[i]),pid);const blob=new Blob([data],{type:"application/octet-stream"});await put(FILES,{id:uid("file"),name:cleanName(parts[parts.length-1]),parentId:pid,size:blob.size,type:blob.type,blob,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});count++}showStatus(count+" file"+(count===1?"":"s")+" extracted");await refresh()}catch(e){showStatus(e.message||"ZIP extraction failed",true)}}
$("newFolder").onclick=()=>showName("create");$("upload").onclick=()=>$("picker").click();$("uploadFolder").onclick=()=>$("folderPicker").click();$("extract").onclick=()=>$("zipPicker").click();$("back").onclick=goBack;$("picker").onchange=e=>{saveFiles(e.target.files);e.target.value=""};$("folderPicker").onchange=e=>{saveFiles(e.target.files);e.target.value=""};$("zipPicker").onchange=e=>{if(e.target.files[0])importZip(e.target.files[0]);e.target.value=""};$("nameCancel").onclick=hideName;$("nameSave").onclick=saveName;$("nameInput").onkeydown=e=>{if(e.key==="Enter")saveName();if(e.key==="Escape")hideName()};$("confirmCancel").onclick=()=>$("confirmModal").classList.remove("show");$("confirmOk").onclick=confirmDelete;document.addEventListener("click",e=>{if(!e.target.closest(".file-bar"))closeMenus()});document.addEventListener("keydown",e=>{if(e.key==="Escape"){hideName();$("confirmModal").classList.remove("show");closeMenus()}});openDB().then(refresh).catch(e=>showStatus(e.message||"Open Axilort Engine first to initialize storage",true));
