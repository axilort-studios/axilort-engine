<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><title>Assets — Axilort Engine</title>
<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a,button,input{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}a{text-decoration:none}.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}}.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column}.brand{display:flex;justify-content:center;padding-bottom:clamp(9px,1.5vw,22px)}.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain}.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}.nav a{border:1px solid transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;white-space:nowrap}.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}.ico{width:clamp(14px,1.7vw,21px);display:grid;place-items:center}.active .ico{color:var(--red)}.version{margin-top:auto;padding:clamp(7px,1vw,13px);color:#666;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center}.top-action:hover{background:#111}.gear{font-size:clamp(17px,2.25vw,25px)}.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px);overflow:auto;height:100%}.heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:clamp(7px,1.15vw,17px)}h1{font-size:clamp(15px,2.55vw,27px);margin:0;font-weight:800;letter-spacing:-.035em}h1 span{color:var(--red)}.heading p{margin:3px 0 0;color:#929297;font-size:clamp(7px,1.05vw,13px)}.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.path{min-width:0;flex:1;color:#777;font-size:clamp(7px,.95vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.action{height:clamp(30px,3.8vw,40px);padding:0 11px;border:1px solid #29292d;border-radius:7px;background:#111;color:#ddd;font-size:clamp(7px,1vw,11px);font-weight:700}.action:hover{border-color:#8e161b}.primary{border-color:#ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);color:#fff}.list{display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px)}.row{position:relative;min-height:clamp(45px,7vw,72px);display:flex;align-items:center;gap:clamp(7px,1.2vw,15px);padding:clamp(7px,1.25vw,13px);border:1px solid var(--border);border-radius:clamp(8px,1.2vw,15px);background:linear-gradient(145deg,#0c0c0d,#080809)}.row:hover{border-color:#8e161b;background:#101011}.icon{width:clamp(27px,3.5vw,43px);height:clamp(27px,3.5vw,43px);flex:0 0 auto;display:grid;place-items:center;border:1px solid #2a2a2d;border-radius:8px;background:#0b0b0c;color:var(--red);font-weight:800}.info{min-width:0;flex:1}.info strong{display:block;font-size:clamp(8px,1.15vw,13px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{display:block;margin-top:3px;color:#777;font-size:clamp(7px,.9vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{width:clamp(27px,3.5vw,40px);height:clamp(27px,3.5vw,40px);border:1px solid transparent;border-radius:8px;background:transparent;color:#aaa;font-size:20px}.more:hover,.more.open{background:#111;border-color:#29292b;color:#fff}.menu{position:absolute;right:8px;top:calc(100% + 5px);z-index:20;min-width:145px;padding:4px;border:1px solid var(--border);border-radius:9px;background:#0b0b0c;box-shadow:0 18px 50px #000d;display:none}.menu.show{display:block}.menu button{width:100%;height:34px;border:0;border-radius:6px;background:transparent;text-align:left;padding:0 10px;font-size:10px}.menu button:hover{background:#151516}.menu .danger{color:#ff5960}.empty{min-height:100px;border:1px dashed #29292b;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#080809;text-align:center;padding:10px}.empty-icon{width:34px;height:34px;border:1px solid #2a2a2d;border-radius:8px;display:grid;place-items:center;color:#777;margin-bottom:6px}.empty strong{font-size:11px;color:#bdbdc1}.empty span{font-size:9px;color:#777;margin-top:3px}.backdrop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.76);backdrop-filter:blur(10px)}.backdrop.show{display:flex}.modal{width:min(430px,92vw);border:1px solid #303034;border-radius:16px;background:linear-gradient(145deg,#111113,#080809);box-shadow:0 35px 100px #000;overflow:hidden}.modal-head{padding:18px 20px 15px;border-bottom:1px solid #202023}.modal-head h2{margin:0;font-size:15px}.modal-head p{margin:7px 0 0;color:#777;font-size:9px;line-height:1.45}.modal-body{padding:17px 20px}.field label{display:flex;justify-content:space-between;margin-bottom:7px;color:#aaa;font-size:9px;font-weight:800}.field input{width:100%;height:42px;border:1px solid #303035;border-radius:9px;outline:0;background:#070708;color:#fff;padding:0 12px;font-size:11px}.field input:focus{border-color:#a51b21;box-shadow:0 0 0 3px rgba(255,32,40,.08)}.error{display:none;margin-top:7px;padding:7px 9px;border:1px solid #4b171b;border-radius:7px;background:#19090b;color:#ff666c;font-size:8px}.error.show{display:block}.foot{display:flex;justify-content:flex-end;gap:7px;padding:12px 20px;border-top:1px solid #202023;background:#09090a}.foot button{height:36px;border-radius:8px;padding:0 14px;font-size:10px;font-weight:800}.cancel{border:1px solid #29292d;background:#111;color:#aaa}.create-btn{border:1px solid #ff3b42;background:linear-gradient(180deg,#ff3038,#d9141b);color:#fff}.foot button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px}.content{padding:7px 9px}.heading h1{font-size:17px}.heading p{font-size:8px}.action{height:30px;padding:0 8px;font-size:8px}.row{min-height:45px;padding:7px}.icon{width:28px;height:28px}.info strong{font-size:9px}.info small{font-size:7px}.more{width:28px;height:28px}.modal{width:min(390px,90vw)}.modal-head{padding:14px}.modal-body{padding:13px 14px}.foot{padding:9px 14px}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a href="projects.html"><span class="ico">□</span>Projects</a><a class="active" href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a></nav><div class="version">Axilort Engine v1.0.0</div></aside><main class="main"><header class="topbar"><a class="top-action" href="settings.html"><span class="gear">⚙</span></a></header><section class="content"><div class="heading"><div><h1><span>Assets</span></h1><p>Real storage from <b>axilort-engine-data / projects</b>.</p></div></div><div class="toolbar"><button class="action" id="back" type="button" hidden>← Back</button><div class="path" id="path">axilort-engine-data/projects/</div><button class="action" id="refresh" type="button">Refresh</button><button class="action" id="extract" type="button">Extract</button><button class="action primary" id="upload" type="button" disabled>＋ Upload</button></div><div class="list" id="list"></div><input id="picker" type="file" multiple hidden></section></main></div>
<div class="backdrop" id="renameModal"><div class="modal"><div class="modal-head"><h2>Rename file</h2><p>Rename the real file stored in the selected project.</p></div><div class="modal-body"><div class="field"><label>FILE NAME</label><input id="renameInput" maxlength="120" autocomplete="off"><div class="error" id="renameError"></div></div></div><div class="foot"><button class="cancel" id="renameCancel" type="button">Cancel</button><button class="create-btn" id="renameSave" type="button">Save Name</button></div></div></div>
<script>
(()=>{const DB="axilort-engine-data",PROJECTS="projects",FILES="asset-files",ROOT="axilort-engine-data/projects/";const $=id=>document.getElementById(id);let db=null,current=null,renameId=null;
const esc=s=>String(s).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const fmt=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB";
function openDB(){if(db)return Promise.resolve(db);return new Promise((resolve,reject)=>{const r=indexedDB.open(DB);r.onerror=()=>reject(r.error||new Error("Could not open axilort-engine-data."));r.onblocked=()=>reject(new Error("Close other Axilort Engine tabs and try again."));r.onsuccess=()=>{const d=r.result;if(!d.objectStoreNames.contains(FILES)){const v=d.version;d.close();const u=indexedDB.open(DB,v+1);u.onupgradeneeded=()=>{if(!u.result.objectStoreNames.contains(FILES)){const s=u.result.createObjectStore(FILES,{keyPath:"id"});s.createIndex("projectId","projectId",{unique:false})}};u.onerror=()=>reject(u.error);u.onblocked=()=>reject(new Error("Close other Axilort Engine tabs and try again."));u.onsuccess=()=>{db=u.result;db.onversionchange=()=>db.close();resolve(db)};return}db=d;d.onversionchange=()=>d.close();resolve(d)}}})}
function all(store){return openDB().then(d=>new Promise((res,rej)=>{const r=d.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)}))}function put(store,v){return openDB().then(d=>new Promise((res,rej)=>{const r=d.transaction(store,"readwrite").objectStore(store).put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)}))}function del(store,id){return openDB().then(d=>new Promise((res,rej)=>{const r=d.transaction(store,"readwrite").objectStore(store).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)}))}
async function projects(){const d=await openDB();if(!d.objectStoreNames.contains(PROJECTS))return[];return all(PROJECTS)}async function files(){return all(FILES)}
function closeMenu(){document.querySelectorAll('.menu.show').forEach(x=>x.classList.remove('show'));document.querySelectorAll('.more.open').forEach(x=>x.classList.remove('open'))}
async function render(){closeMenu();const list=$("list");list.innerHTML='<div class="empty"><div class="empty-icon">◇</div><strong>Loading real storage…</strong><span>Reading IndexedDB.</span></div>';try{const ps=await projects();if(!current){$("path").textContent=ROOT;$("upload").disabled=true;$("back").hidden=true;if(!ps.length){list.innerHTML='<div class="empty"><div class="empty-icon">□</div><strong>No project folders</strong><span>Create folders only from Projects → New Project.</span></div>';return}list.innerHTML=ps.filter(p=>p&&p.id&&p.name).map(p=>'<div class="row" data-open="'+esc(p.id)+'"><div class="icon">□</div><div class="info"><strong>'+esc(p.name)+'</strong><small>Folder · '+ROOT+esc(p.name)+'/</small></div><button class="more" type="button" aria-label="Folder options">⋮</button><div class="menu"><button type="button" data-folder-open="'+esc(p.id)+'">Open</button><button type="button" data-folder-info="'+esc(p.id)+'">Storage Info</button></div></div>').join('');return}const p=ps.find(x=>x.id===current);if(!p){current=null;return render()}$("path").textContent=ROOT+p.name+"/";$("upload").disabled=false;$("back").hidden=false;const fs=(await files()).filter(f=>f&&f.projectId===current);if(!fs.length){list.innerHTML='<div class="empty"><div class="empty-icon">◇</div><strong>This project is empty</strong><span>Upload real files into '+esc(p.name)+'.</span></div>';return}list.innerHTML=fs.map(f=>'<div class="row"><div class="icon">◇</div><div class="info"><strong>'+esc(f.name)+'</strong><small>File · '+fmt(f.size||0)+' · '+esc(f.path||ROOT+p.name+'/'+f.name)+'</small></div><button class="more" type="button" data-file-menu="'+esc(f.id)+'">⋮</button><div class="menu" data-file-panel="'+esc(f.id)+'"><button type="button" data-download="'+esc(f.id)+'">Download</button><button type="button" data-rename="'+esc(f.id)+'">Rename</button><button class="danger" type="button" data-delete="'+esc(f.id)+'">Delete</button></div></div>').join('')}catch(e){list.innerHTML='<div class="empty"><div class="empty-icon">!</div><strong>Storage error</strong><span>'+esc(e.message||"IndexedDB is unavailable.")+'</span></div>'}}
$("refresh").onclick=render;$("back").onclick=()=>{current=null;render()};$("upload").onclick=()=>current&&$("picker").click();$("picker").onchange=async()=>{if(!current)return;try{const ps=await projects(),p=ps.find(x=>x.id===current);if(!p)return;for(const f of Array.from($("picker").files||[])){await put(FILES,{id:uid(),projectId:p.id,name:f.name,size:f.size,type:f.type||"application/octet-stream",path:ROOT+p.name+"/"+f.name,blob:f,created:Date.now()})}$("picker").value="";await render()}catch(e){alert(e.message||"Could not store the file.")}};
$("list").ondblclick=e=>{const row=e.target.closest('[data-open]');if(row){current=row.dataset.open;render()}};$("list").onclick=async e=>{const fm=e.target.closest('[data-file-menu]');if(fm){closeMenu();const p=document.querySelector('[data-file-panel="'+CSS.escape(fm.dataset.fileMenu)+'"]');if(p){p.classList.add('show');fm.classList.add('open')}return}const fo=e.target.closest('[data-folder-open]');if(fo){current=fo.dataset.folderOpen;render();return}const fi=e.target.closest('[data-folder-info]');if(fi){const p=(await projects()).find(x=>x.id===fi.dataset.folderInfo);if(p)alert('Real IndexedDB folder\\n\\n'+ROOT+p.name+'/\\n\\nFolder creation, rename and deletion are controlled from Projects.');return}const rn=e.target.closest('[data-rename]');if(rn){renameId=rn.dataset.rename;const f=(await files()).find(x=>x.id===renameId);if(!f)return;$("renameInput").value=f.name;$("renameError").classList.remove('show');$("renameModal").classList.add('show');setTimeout(()=>$("renameInput").focus(),50);return}const dl=e.target.closest('[data-delete]');if(dl){const f=(await files()).find(x=>x.id===dl.dataset.delete);if(f&&confirm('Delete '+f.name+' from this project?')){await del(FILES,f.id);await render()}return}const down=e.target.closest('[data-download]');if(down){const f=(await files()).find(x=>x.id===down.dataset.download);if(!f||!f.blob)return;const u=URL.createObjectURL(f.blob),a=document.createElement('a');a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}const more=e.target.closest('.more');if(more){closeMenu();const panel=more.parentElement.querySelector('.menu');if(panel){panel.classList.add('show');more.classList.add('open')}}};
$("renameCancel").onclick=()=>{$("renameModal").classList.remove('show');renameId=null};$("renameSave").onclick=async()=>{if(!renameId)return;const n=$("renameInput").value.trim();if(!n){$("renameError").textContent='Enter a file name.';$("renameError").classList.add('show');return}try{const fs=await files(),f=fs.find(x=>x.id===renameId);if(!f)return;const ps=await projects(),p=ps.find(x=>x.id===f.projectId);if(fs.some(x=>x.projectId===f.projectId&&x.id!==f.id&&String(x.name).toLowerCase()===n.toLowerCase())){$("renameError").textContent='A file with this name already exists.';$("renameError").classList.add('show');return}f.name=n;f.path=ROOT+(p?p.name:'')+'/'+n;await put(FILES,f);$("renameModal").classList.remove('show');renameId=null;await render()}catch(e){$("renameError").textContent=e.message||'Could not rename the file.';$("renameError").classList.add('show')}};
$("extract").onclick=async()=>{try{const ps=await projects(),fs=await files(),out={database:DB,store:PROJECTS,projects:ps.map(p=>({id:p.id,name:p.name,created:p.created||null})),assetFiles:fs.filter(f=>!current||f.projectId===current).map(f=>({id:f.id,projectId:f.projectId,name:f.name,size:f.size||0,path:f.path||''}))};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='axilort-engine-storage.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){alert(e.message||'Could not extract storage.')}};
document.addEventListener('click',e=>{if(!e.target.closest('.row'))closeMenu();if(e.target.classList.contains('backdrop'))$("renameCancel").click()});render();})();
</script></body></html>
