<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Assets — Axilort Engine</title>
<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
a,button,input{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}a{text-decoration:none}
.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}
@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;inset-inline:auto;inset-block:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}}
.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column;z-index:3}
.brand{display:flex;align-items:center;justify-content:center;padding:0 0 clamp(9px,1.5vw,22px)}
.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain;flex:none}.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}
.nav a{border:1px solid transparent;background:transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;text-align:left;cursor:pointer;white-space:nowrap}
.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}
.ico{width:clamp(14px,1.7vw,21px);height:clamp(14px,1.7vw,21px);display:grid;place-items:center;color:#eee;flex:0 0 auto;font-size:clamp(11px,1.35vw,18px)}.active .ico{color:var(--red)}
.version{margin-top:auto;padding:clamp(7px,1vw,13px) clamp(6px,.8vw,11px);color:#66666b;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);flex:0 0 clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}
.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center;cursor:pointer;text-decoration:none}.top-action:hover{background:#111112}.gear{font-size:clamp(17px,2.25vw,25px);line-height:1;color:#ededee}
.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px) clamp(8px,1.7vw,24px);overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}
.heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:clamp(7px,1.15vw,17px)}.heading h1{font-size:clamp(15px,2.55vw,27px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}.heading h1 span{color:var(--red)}.heading p{margin:3px 0 0;color:#929297;font-size:clamp(7px,1.05vw,13px)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.path{min-width:0;flex:1;color:#77777d;font-size:clamp(7px,.95vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:5px}.action{height:clamp(30px,3.8vw,40px);padding:0 11px;border:1px solid #29292d;border-radius:7px;background:#111112;color:#ddd;font-size:clamp(7px,1vw,11px);font-weight:700}.action:hover{border-color:#8e161b;background:#151516}.action.primary{border-color:#ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);color:#fff}
.file-list{display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px)}.file-bar{position:relative;min-height:clamp(45px,7vw,72px);display:flex;align-items:center;gap:clamp(7px,1.2vw,15px);padding:clamp(7px,1.25vw,13px);border:1px solid var(--border);border-radius:clamp(8px,1.2vw,15px);background:linear-gradient(145deg,#0c0c0d,#080809)}.file-bar:hover{border-color:#8e161b;background:#101011}.file-icon{width:clamp(27px,3.5vw,43px);height:clamp(27px,3.5vw,43px);flex:0 0 auto;display:grid;place-items:center;border:1px solid #2a2a2d;border-radius:8px;background:#0b0b0c;color:var(--red);font-size:clamp(10px,1.3vw,15px);font-weight:800}.file-info{min-width:0;flex:1}.file-info strong{display:block;font-size:clamp(8px,1.15vw,13px);font-weight:750;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-info small{display:block;margin-top:3px;color:#77777d;font-size:clamp(7px,.9vw,11px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{width:clamp(27px,3.5vw,40px);height:clamp(27px,3.5vw,40px);flex:0 0 auto;border:1px solid transparent;border-radius:8px;background:transparent;color:#aaa;font-size:clamp(16px,2vw,22px);line-height:1;display:grid;place-items:center}.more:hover,.more.open{background:#111112;border-color:#29292b;color:#fff}.menu{position:absolute;right:clamp(7px,1vw,11px);top:calc(100% + 5px);z-index:20;min-width:clamp(125px,14vw,160px);padding:4px;border:1px solid var(--border);border-radius:9px;background:#0b0b0c;box-shadow:0 18px 50px #000d;display:none}.menu.show{display:block}.menu button{width:100%;height:clamp(29px,3.5vw,37px);border:0;border-radius:6px;background:transparent;color:#ddd;text-align:left;padding:0 10px;font-size:clamp(8px,1vw,11px)}.menu button:hover{background:#151516}.menu .danger{color:#ff5960}
.empty{min-height:clamp(65px,8vw,115px);border:1px dashed #29292b;border-radius:clamp(8px,1.2vw,15px);display:flex;align-items:center;justify-content:center;flex-direction:column;background:#080809;text-align:center;padding:8px}.empty-icon{width:clamp(22px,3.2vw,40px);height:clamp(22px,3.2vw,40px);border:1px solid #2a2a2d;border-radius:8px;display:grid;place-items:center;color:#777;margin-bottom:5px;font-size:clamp(9px,1.3vw,15px)}.empty strong{font-size:clamp(8px,1.05vw,12px);color:#bdbdc1}.empty span{font-size:clamp(7px,.85vw,10px);color:#777;margin-top:2px}
@media(max-height:360px){.sidebar{width:clamp(86px,16vw,145px);flex-basis:clamp(86px,16vw,145px)}.nav a{height:29px}.brand img{width:34px;height:34px}.content{padding:7px 9px}.file-bar{min-height:44px}}
@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:7px 9px}.heading{margin-bottom:7px}.heading h1{font-size:17px}.heading p{font-size:8px}.action{height:30px;padding:0 8px;font-size:8px}.file-bar{min-height:45px;padding:7px}.file-icon{width:28px;height:28px}.file-info strong{font-size:9px}.file-info small{font-size:7px}.more{width:28px;height:28px}.menu{top:40px}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a href="projects.html"><span class="ico">□</span>Projects</a><a class="active" href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a><a href="docs.html"><span class="ico">▤</span>Docs</a></nav><div class="version">Axilort Engine v1.0.0</div></aside><main class="main"><header class="topbar"><a class="top-action" href="settings.html" aria-label="Settings"><span class="gear">⚙</span></a></header><section class="content"><div class="heading"><div><h1><span>Assets</span></h1><p>Manage your engine assets.</p></div></div><div class="toolbar"><div class="path" id="path">axilort-engine-data/</div><div class="actions"><button class="action" id="extract">Extract</button><button class="action primary" id="upload">＋ Upload</button></div></div><div class="file-list" id="list"><div class="empty"><div class="empty-icon">◇</div><strong>No files or folders yet</strong><span>Files and folders in axilort-engine-data will appear here.</span></div></div><input id="picker" type="file" multiple hidden></section></main></div>
<script>
const ROOT="axilort-engine-data",list=document.getElementById("list"),picker=document.getElementById("picker"),upload=document.getElementById("upload"),extract=document.getElementById("extract"),path=document.getElementById("path");
let dbPromise=null;
function openDB(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open(ROOT,1);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains("files"))db.createObjectStore("files",{keyPath:"path"});if(!db.objectStoreNames.contains("setting.json"))db.createObjectStore("setting.json");if(!db.objectStoreNames.contains("user-data.json"))db.createObjectStore("user-data.json");if(!db.objectStoreNames.contains("project"))db.createObjectStore("project")};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbPromise}
async function allFiles(){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction("files","readonly").objectStore("files").getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
async function putFile(file,pathName){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction("files","readwrite").objectStore("files").put({path:pathName,name:file.name,size:file.size,type:file.type||"application/octet-stream",blob:file,lastModified:file.lastModified});r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function removeFile(p){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction("files","readwrite").objectStore("files").delete(p);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function size(n){if(n<1024)return n+" B";if(n<1048576)return (n/1024).toFixed(1)+" KB";return (n/1048576).toFixed(1)+" MB"}
function render(items){list.innerHTML="";if(!items.length){list.innerHTML='<div class="empty"><div class="empty-icon">◇</div><strong>No files or folders yet</strong><span>Files and folders in axilort-engine-data will appear here.</span></div>';return}items.sort((a,b)=>a.path.localeCompare(b.path));for(const item of items){const row=document.createElement("div");row.className="file-bar";const icon=item.kind==="folder"?"□":"◇";row.innerHTML='<div class="file-icon">'+icon+'</div><div class="file-info"><strong></strong><small></small></div><button class="more" aria-label="More">⋮</button><div class="menu"><button data-act="edit">Edit / Rename</button><button data-act="delete" class="danger">Delete</button></div>';row.querySelector("strong").textContent=item.name;row.querySelector("small").textContent=(item.kind==="folder"?"Folder":"File")+" · "+(item.kind==="folder"?item.path:size(item.size||0));const menu=row.querySelector(".menu"),more=row.querySelector(".more");more.onclick=e=>{e.stopPropagation();document.querySelectorAll(".menu.show").forEach(x=>x.classList.remove("show"));menu.classList.toggle("show");more.classList.toggle("open")};menu.onclick=async e=>{const b=e.target.closest("button");if(!b)return;menu.classList.remove("show");if(b.dataset.act==="delete"){if(confirm("Delete "+item.name+"?")){await removeFile(item.path);render(await allFiles())}}else{const n=prompt("Rename",item.name);if(n&&n.trim()&&n!==item.name){const np=item.path.slice(0,item.path.lastIndexOf("/")+1)+n.trim();await removeFile(item.path);item.name=n.trim();item.path=np;const db=await openDB();await new Promise((resolve,reject)=>{const r=db.transaction("files","readwrite").objectStore("files").put(item);r.onsuccess=resolve;r.onerror=()=>reject(r.error)});render(await allFiles())}}};list.appendChild(row)}}
upload.onclick=()=>picker.click();picker.onchange=async()=>{for(const f of picker.files)await putFile(f,ROOT+"/"+f.name);picker.value="";render(await allFiles())};extract.onclick=async()=>{const items=await allFiles();if(!items.length)return alert("No files to extract.");for(const item of items){if(item.blob){const a=document.createElement("a");a.href=URL.createObjectURL(item.blob);a.download=item.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}};document.addEventListener("click",()=>document.querySelectorAll(".menu.show").forEach(x=>x.classList.remove("show")));(async()=>{try{render(await allFiles())}catch(e){render([])}})();
</script></body></html>
