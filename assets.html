<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Assets — Axilort Engine</title>
<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}a,button,input{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}a{text-decoration:none}.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;inset-inline:auto;inset-block:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}}
.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;justify-content:center;padding:0 0 clamp(9px,1.5vw,22px)}.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain;flex:none}.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}.nav a{border:1px solid transparent;background:transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;text-align:left;cursor:pointer;white-space:nowrap}.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}.ico{width:clamp(14px,1.7vw,21px);height:clamp(14px,1.7vw,21px);display:grid;place-items:center;color:#eee;flex:0 0 auto;font-size:clamp(11px,1.35vw,18px)}.active .ico{color:var(--red)}.version{margin-top:auto;padding:clamp(7px,1vw,13px) clamp(6px,.8vw,11px);color:#66666b;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);flex:0 0 clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center;cursor:pointer;text-decoration:none}.top-action:hover{background:#111112}.gear{font-size:clamp(17px,2.25vw,25px);line-height:1;color:#ededee}.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px) clamp(8px,1.7vw,24px);overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}.heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:clamp(7px,1.15vw,17px)}.heading h1{font-size:clamp(15px,2.55vw,27px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}.heading h1 span{color:var(--red)}.heading p{margin:3px 0 0;color:#929297;font-size:clamp(7px,1.05vw,13px)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.path{min-width:0;flex:1;color:#77777d;font-size:clamp(7px,.95vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:5px}.action{height:clamp(30px,3.8vw,40px);padding:0 11px;border:1px solid #29292d;border-radius:7px;background:#111112;color:#ddd;font-size:clamp(7px,1vw,11px);font-weight:700}.action:hover{border-color:#8e161b;background:#151516}.action.primary{border-color:#ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);color:#fff}.action:disabled{opacity:.45;cursor:not-allowed}.file-list{display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px)}.file-bar{position:relative;min-height:clamp(45px,7vw,72px);display:flex;align-items:center;gap:clamp(7px,1.2vw,15px);padding:clamp(7px,1.25vw,13px);border:1px solid var(--border);border-radius:clamp(8px,1.2vw,15px);background:linear-gradient(145deg,#0c0c0d,#080809)}.file-bar:hover{border-color:#8e161b;background:#101011}.file-icon{width:clamp(27px,3.5vw,43px);height:clamp(27px,3.5vw,43px);flex:0 0 auto;display:grid;place-items:center;border:1px solid #2a2a2d;border-radius:8px;background:#0b0b0c;color:var(--red);font-size:clamp(10px,1.3vw,15px);font-weight:800}.file-info{min-width:0;flex:1}.file-info strong{display:block;font-size:clamp(8px,1.15vw,13px);font-weight:750;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-info small{display:block;margin-top:3px;color:#77777d;font-size:clamp(7px,.9vw,11px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{width:clamp(27px,3.5vw,40px);height:clamp(27px,3.5vw,40px);flex:0 0 auto;border:1px solid transparent;border-radius:8px;background:transparent;color:#aaa;font-size:clamp(16px,2vw,22px);line-height:1;display:grid;place-items:center}.more:hover,.more.open{background:#111112;border-color:#29292b;color:#fff}.menu{position:absolute;right:clamp(7px,1vw,11px);top:calc(100% + 5px);z-index:20;min-width:clamp(135px,15vw,175px);padding:4px;border:1px solid var(--border);border-radius:9px;background:#0b0b0c;box-shadow:0 18px 50px #000d;display:none}.menu.show{display:block}.menu button{width:100%;height:clamp(29px,3.5vw,37px);border:0;border-radius:6px;background:transparent;color:#ddd;text-align:left;padding:0 10px;font-size:clamp(8px,1vw,11px)}.menu button:hover{background:#151516}.menu .danger{color:#ff5960}.empty{min-height:clamp(65px,8vw,115px);border:1px dashed #29292b;border-radius:clamp(8px,1.2vw,15px);display:flex;align-items:center;justify-content:center;flex-direction:column;background:#080809;text-align:center;padding:8px}.empty-icon{width:clamp(22px,3.2vw,40px);height:clamp(22px,3.2vw,40px);border:1px solid #2a2a2d;border-radius:8px;display:grid;place-items:center;color:#777;margin-bottom:5px;font-size:clamp(9px,1.3vw,15px)}.empty strong{font-size:clamp(8px,1.05vw,12px);color:#bdbdc1}.empty span{font-size:clamp(7px,.85vw,10px);color:#777;margin-top:2px}@media(max-height:360px){.sidebar{width:clamp(86px,16vw,145px);flex-basis:clamp(86px,16vw,145px)}.nav a{height:29px}.brand img{width:34px;height:34px}.content{padding:7px 9px}.file-bar{min-height:44px}}@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:7px 9px}.heading{margin-bottom:7px}.heading h1{font-size:17px}.heading p{font-size:8px}.action{height:30px;padding:0 8px;font-size:8px}.file-bar{min-height:45px;padding:7px}.file-icon{width:28px;height:28px}.file-info strong{font-size:9px}.file-info small{font-size:7px}.more{width:28px;height:28px}.menu{top:40px}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a href="projects.html"><span class="ico">□</span>Projects</a><a class="active" href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a></nav><div class="version">Axilort Engine v1.0.0</div></aside><main class="main"><header class="topbar"><a class="top-action" href="settings.html" aria-label="Settings"><span class="gear">⚙</span></a></header><section class="content"><div class="heading"><div><h1><span>Assets</span></h1><p>Manage your real engine storage.</p></div></div><div class="toolbar"><div class="path" id="path">axilort-engine-data/projects/</div><div class="actions"><button class="action" id="newFolder" type="button">＋ Folder</button><button class="action" id="extract" type="button">Extract</button><button class="action primary" id="upload" type="button">＋ Upload</button></div></div><div class="file-list" id="list"><div class="empty"><div class="empty-icon">◇</div><strong>Loading real storage…</strong><span>Reading IndexedDB.</span></div></div><input id="picker" type="file" multiple hidden></section></main></div>
<script>
(()=>{
"use strict";
const DB="axilort-engine-data",PROJECTS="projects",FILES="asset-files",ROOT="axilort-engine-data/projects/";
const list=document.getElementById("list"),picker=document.getElementById("picker"),upload=document.getElementById("upload"),newFolder=document.getElementById("newFolder"),extract=document.getElementById("extract"),pathEl=document.getElementById("path"),actions=document.querySelector(".actions");
let db=null,currentId=null,currentName=null,back=null;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const clean=s=>s.trim().replace(/[\\/:*?"<>|]/g,"-").replace(/\s+/g," ").slice(0,100);
const size=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB";
const err=m=>alert(m);
function openDB(){
 if(db)return Promise.resolve(db);
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB);
  r.onerror=()=>reject(r.error||new Error("Unable to open axilort-engine-data."));
  r.onsuccess=()=>{
   const d=r.result;
   if(d.objectStoreNames.contains(FILES)){db=d;d.onversionchange=()=>d.close();return resolve(d)}
   const v=d.version+1;d.close();
   const u=indexedDB.open(DB,v);
   u.onupgradeneeded=e=>{const x=e.target.result;if(!x.objectStoreNames.contains(FILES)){const s=x.createObjectStore(FILES,{keyPath:"id"});s.createIndex("projectId","projectId",{unique:false})}};
   u.onsuccess=()=>{db=u.result;db.onversionchange=()=>db.close();resolve(db)};
   u.onerror=()=>reject(u.error||new Error("Unable to create real asset storage."));
   u.onblocked=()=>reject(new Error("Close other Axilort Engine tabs and open Assets again."));
  };
 });
}
function read(store,key){return openDB().then(d=>new Promise((resolve,reject)=>{const r=d.transaction(store,"readonly").objectStore(store).get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)}))}
function all(store){return openDB().then(d=>new Promise((resolve,reject)=>{const r=d.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)}))}
function put(store,value){return openDB().then(d=>new Promise((resolve,reject)=>{const r=d.transaction(store,"readwrite").objectStore(store).put(value);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}))}
function del(store,key){return openDB().then(d=>new Promise((resolve,reject)=>{const r=d.transaction(store,"readwrite").objectStore(store).delete(key);r.onsuccess=resolve;r.onerror=()=>reject(r.error)}))}
function deleteProjectFiles(id){return openDB().then(d=>new Promise((resolve,reject)=>{const tx=d.transaction(FILES,"readwrite"),s=tx.objectStore(FILES),c=s.index("projectId").openCursor(IDBKeyRange.only(id));c.onsuccess=e=>{const x=e.target.result;if(x){x.delete();x.continue()}};c.onerror=()=>reject(c.error);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)}))}
async function projects(){if(!openDB){}const d=await openDB();if(!d.objectStoreNames.contains(PROJECTS))return[];return (await all(PROJECTS)).filter(x=>x&&x.id&&x.name)}
async function items(){
 const ps=await projects();
 if(!currentId)return ps.map(p=>({kind:"folder",id:p.id,name:p.name,path:ROOT+p.name+"/"}));
 return (await all(FILES)).filter(f=>f&&f.projectId===currentId).map(f=>({kind:"file",id:f.id,name:f.name,path:f.path,size:f.size||0,mime:f.mime||"",blob:f.blob}));
}
function closeMenus(){document.querySelectorAll(".menu.show").forEach(x=>x.classList.remove("show"));document.querySelectorAll(".more.open").forEach(x=>x.classList.remove("open"))}
function updateBack(){if(currentId){if(!back){back=document.createElement("button");back.type="button";back.className="action";back.textContent="← Back";back.onclick=()=>{currentId=null;currentName=null;renderCurrent()}}if(!back.isConnected)actions.prepend(back)}else if(back&&back.isConnected)back.remove()}
async function renderCurrent(){updateBack();try{const data=await items();render(data)}catch(e){list.innerHTML="<div class=\"empty\"><div class=\"empty-icon\">!</div><strong>Storage unavailable</strong><span></span></div>";list.querySelector("span").textContent=e.message||"Unable to read IndexedDB."}}
function render(data){
 closeMenus();pathEl.textContent=currentId?ROOT+currentName+"/":ROOT;list.innerHTML="";
 if(!data.length){list.innerHTML='<div class="empty"><div class="empty-icon">◇</div><strong>'+(currentId?"This project is empty":"No projects found")+'</strong><span>'+(currentId?"Upload files to this real project folder.":"Create a project from Projects or use ＋ Folder here.")+'</span></div>';return}
 data.sort((a,b)=>a.kind===b.kind?a.name.localeCompare(b.name):a.kind==="folder"?-1:1);
 for(const item of data){
  const row=document.createElement("div");row.className="file-bar";
  row.innerHTML='<div class="file-icon">'+(item.kind==="folder"?"□":"◇")+'</div><div class="file-info"><strong></strong><small></small></div><button class="more" type="button" aria-label="More">⋮</button><div class="menu"><button type="button" data-act="rename">Rename</button><button type="button" data-act="open">Open</button><button type="button" data-act="download">Download</button><button type="button" data-act="delete" class="danger">Delete</button></div>';
  row.querySelector("strong").textContent=item.name;row.querySelector("small").textContent=item.kind==="folder"?"Folder · "+item.path:"File · "+size(item.size)+(item.mime?" · "+item.mime:"");
  const more=row.querySelector(".more"),menu=row.querySelector(".menu");
  if(item.kind==="folder")row.ondblclick=e=>{if(!e.target.closest("button")){currentId=item.id;currentName=item.name;renderCurrent()}};
  more.onclick=e=>{e.stopPropagation();closeMenus();menu.classList.add("show");more.classList.add("open")};
  menu.onclick=async e=>{
   const b=e.target.closest("button");if(!b)return;closeMenus();
   try{
    if(b.dataset.act==="open"&&item.kind==="folder"){currentId=item.id;currentName=item.name;await renderCurrent();return}
    if(b.dataset.act==="download"&&item.kind==="file"&&item.blob){const u=URL.createObjectURL(item.blob),a=document.createElement("a");a.href=u;a.download=item.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
    if(b.dataset.act==="rename"){
     const value=prompt("Rename "+(item.kind==="folder"?"folder":"file"),item.name);if(value===null)return;const name=clean(value);if(!name)return err("Enter a valid name.");
     if(item.kind==="folder"){
      const p=await read(PROJECTS,item.id);if(!p)return err("Project no longer exists.");
      const old=p.name;await put(PROJECTS,{...p,name,path:ROOT+name+"/",kind:"folder"});
      const fs=await all(FILES);for(const f of fs.filter(x=>x.projectId===item.id))await put(FILES,{...f,path:ROOT+name+"/"+f.name});
      if(currentId===item.id)currentName=name;
     }else{const f=await read(FILES,item.id);if(!f)return err("File no longer exists.");await put(FILES,{...f,name,path:ROOT+currentName+"/"+name})}
     await renderCurrent();return;
    }
    if(b.dataset.act==="delete"){
     if(item.kind==="folder"){if(!confirm("Delete project folder \""+item.name+"\" and all files inside it?"))return;await deleteProjectFiles(item.id);await del(PROJECTS,item.id);if(currentId===item.id){currentId=null;currentName=null}await renderCurrent()}
     else if(confirm("Delete file \""+item.name+"\"?")){await del(FILES,item.id);await renderCurrent()}
    }
   }catch(ex){err(ex.message||"Operation failed.")}
  };
  list.appendChild(row);
 }
}
newFolder.onclick=async()=>{const v=prompt("New project folder name");if(v===null)return;const name=clean(v);if(!name)return err("Enter a valid folder name.");try{const ps=await projects();if(ps.some(p=>p.name.toLowerCase()===name.toLowerCase()))return err("A project with this name already exists.");await put(PROJECTS,{id:uid(),name,created:Date.now(),data:{name},kind:"folder",path:ROOT+name+"/"});await renderCurrent()}catch(e){err(e.message||"Unable to create folder.")}};
upload.onclick=()=>{if(!currentId)return err("Open a project folder first, then upload files into it.");picker.value="";picker.click()};
picker.onchange=async()=>{if(!picker.files.length||!currentId)return;try{for(const f of Array.from(picker.files))await put(FILES,{id:uid(),projectId:currentId,name:f.name,path:ROOT+currentName+"/"+f.name,size:f.size,mime:f.type,blob:f,created:Date.now()});await renderCurrent()}catch(e){err(e.message||"Unable to save file.")}};
extract.onclick=async()=>{try{const data=await items();const manifest=JSON.stringify({path:pathEl.textContent,entries:data.map(x=>({name:x.name,type:x.kind,path:x.path,size:x.size||0,mime:x.mime||""}))},null,2);const u=URL.createObjectURL(new Blob([manifest],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download=currentId?"project-manifest.json":"axilort-engine-storage.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){err(e.message||"Unable to extract storage.")}};
document.addEventListener("click",e=>{if(!e.target.closest(".file-bar"))closeMenus()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenus()});renderCurrent();
})();
</script>
</body>
</html>
