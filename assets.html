<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Assets — Axilort Engine</title>
<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}a{text-decoration:none;color:inherit}.app{position:fixed;inset:0;display:flex;overflow:hidden;background:#050505}@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;inset:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}}.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;justify-content:center;padding-bottom:clamp(9px,1.5vw,22px)}.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain}.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}.nav a{border:1px solid transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;white-space:nowrap}.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}.ico{width:clamp(14px,1.7vw,21px);height:clamp(14px,1.7vw,21px);display:grid;place-items:center;color:#eee;flex:none;font-size:clamp(11px,1.35vw,18px)}.active .ico{color:var(--red)}.version{margin-top:auto;padding:clamp(7px,1vw,13px) 6px;color:#66666b;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);flex:0 0 clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center}.top-action:hover{background:#111112}.gear{font-size:clamp(17px,2.25vw,25px);line-height:1;color:#fff}.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px) 24px;overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}.heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:clamp(7px,1.15vw,17px)}.heading h1{font-size:clamp(15px,2.55vw,27px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}.heading h1 span{color:var(--red)}.heading p{margin:3px 0 0;color:var(--muted);font-size:clamp(7px,1.05vw,13px)}.toolbar{display:flex;align-items:center;gap:7px;margin-bottom:10px}.path{min-width:0;flex:1;color:#77777d;font-size:clamp(7px,.95vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.action{height:clamp(30px,3.8vw,40px);padding:0 10px;border:1px solid #29292d;border-radius:7px;background:#111112;color:#ddd;font-size:clamp(7px,1vw,11px);font-weight:700}.action:hover{border-color:#8e161b;background:#151516}.action.primary{border-color:#ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);color:#fff}.file-list{display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px)}.file-bar{position:relative;min-height:clamp(45px,7vw,72px);display:flex;align-items:center;gap:clamp(7px,1.2vw,15px);padding:clamp(7px,1.25vw,13px);border:1px solid var(--border);border-radius:clamp(8px,1.2vw,15px);background:linear-gradient(145deg,#0c0c0d,#080809);user-select:none}.file-bar:hover{border-color:#8e161b;background:#101011}.file-icon{width:clamp(27px,3.5vw,43px);height:clamp(27px,3.5vw,43px);flex:none;display:grid;place-items:center;border:1px solid #2a2a2d;border-radius:8px;background:#0b0b0c;color:var(--red);font-size:clamp(10px,1.3vw,15px);font-weight:800}.file-info{min-width:0;flex:1}.file-info strong{display:block;font-size:clamp(8px,1.15vw,13px);font-weight:750;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-info small{display:block;margin-top:3px;color:#77777d;font-size:clamp(7px,.9vw,11px)}.more{width:clamp(27px,3.5vw,40px);height:clamp(27px,3.5vw,40px);flex:none;border:1px solid transparent;border-radius:8px;background:transparent;color:#aaa;font-size:clamp(16px,2vw,22px);line-height:1;display:grid;place-items:center}.more:hover,.more.open{background:#111;border-color:#29292b;color:#fff}.menu{position:absolute;right:7px;top:calc(100% + 5px);z-index:50;min-width:150px;padding:4px;border:1px solid var(--border);border-radius:9px;background:#0b0b0c;box-shadow:0 18px 50px #000d;display:none}.menu.show{display:block}.menu button{width:100%;height:34px;border:0;border-radius:6px;background:transparent;color:#ddd;text-align:left;padding:0 10px;font-size:11px}.menu button:hover{background:#151516}.menu .danger{color:#ff5960}.empty{min-height:clamp(65px,8vw,115px);border:1px dashed #29292b;border-radius:clamp(8px,1.2vw,15px);display:flex;align-items:center;justify-content:center;flex-direction:column;background:#080809;text-align:center;padding:8px}.empty-icon{width:clamp(22px,3.2vw,40px);height:clamp(22px,3.2vw,40px);border:1px solid #2a2a2d;border-radius:8px;display:grid;place-items:center;color:#777;margin-bottom:5px}.empty strong{font-size:clamp(8px,1.05vw,12px);color:#bdbdc1}.empty span{font-size:clamp(7px,.85vw,10px);color:#777;margin-top:2px}.backdrop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:12px;background:#000c;backdrop-filter:blur(7px)}.backdrop.show{display:flex}.modal{width:min(500px,94vw);border:1px solid var(--border);border-radius:14px;background:linear-gradient(145deg,#0c0c0d,#080809);box-shadow:0 30px 100px #000;overflow:hidden}.modal-head{padding:clamp(13px,1.7vw,18px);border-bottom:1px solid var(--border2)}.modal-head h2{margin:0;font-size:clamp(13px,1.5vw,17px)}.modal-head p{margin:4px 0 0;color:#777;font-size:clamp(8px,1vw,11px)}.modal-body{padding:clamp(13px,1.7vw,18px)}.field label{display:block;color:#aaa;font-size:clamp(8px,.95vw,11px);font-weight:750;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #2b2b2f;border-radius:7px;outline:0;background:#070708;padding:9px 10px;font-size:clamp(9px,1vw,12px)}.field input{height:clamp(36px,3.5vw,42px)}.field textarea{height:100%;min-height:220px;resize:none;line-height:1.5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.field input:focus,.field textarea:focus{border-color:#8e161b}.error{display:none;color:#ff5b61;font-size:10px;margin-top:5px}.error.show{display:block}.foot{display:flex;justify-content:flex-end;gap:6px;padding:10px 14px;border-top:1px solid var(--border2)}.foot button{height:34px;border-radius:7px;padding:0 13px;font-size:11px;font-weight:750}.cancel{border:1px solid #29292d;background:#111;color:#aaa}.primary-btn,.danger-btn{border:1px solid #ff4148;background:linear-gradient(#ff3038,#d9141b);color:#fff}.editor{width:min(850px,96vw);height:min(650px,92vh);display:flex;flex-direction:column}.editor .modal-body{flex:1;display:flex;min-height:0}.editor .field{width:100%;display:flex;flex-direction:column}.toast{position:fixed;left:50%;bottom:20px;z-index:300;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111;border:1px solid #333;border-radius:9px;padding:9px 13px;font-size:11px;box-shadow:0 15px 50px #000;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:7px 9px}.heading{margin-bottom:7px}.heading h1{font-size:17px}.heading p{font-size:8px}.action{height:30px;padding:0 8px;font-size:8px}.file-bar{min-height:45px;padding:7px}.file-icon{width:28px;height:28px}.file-info strong{font-size:9px}.file-info small{font-size:7px}.more{width:28px;height:28px}.menu{top:40px}.modal{width:min(410px,90vw)}.editor{height:90vh}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a href="projects.html"><span class="ico">□</span>Projects</a><a class="active" href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a></nav><div class="version">Axilort Engine v1.0.0</div></aside><main class="main"><header class="topbar"><a class="top-action" href="settings.html"><span class="gear">⚙</span></a></header><section class="content"><div class="heading"><div><h1><span>Assets</span></h1><p id="subtitle">Project folders and their files.</p></div></div><div class="toolbar"><div class="path" id="path">axilort-engine-data/</div><div class="actions" id="actions"></div></div><div class="file-list" id="list"></div></section></main></div>
<div class="backdrop" id="nameModal"><div class="modal"><div class="modal-head"><h2 id="nameTitle">Create folder</h2><p id="nameHint"></p></div><div class="modal-body"><div class="field"><label id="nameLabel">NAME</label><input id="nameInput" maxlength="120" autocomplete="off"><div class="error" id="nameError"></div></div></div><div class="foot"><button class="cancel" id="nameCancel">Cancel</button><button class="primary-btn" id="nameSave">Create</button></div></div></div>
<div class="backdrop" id="deleteModal"><div class="modal"><div class="modal-head"><h2>Delete item?</h2><p>This permanently removes the selected item and its children.</p></div><div class="modal-body"><div class="error" id="deleteError"></div></div><div class="foot"><button class="cancel" id="deleteCancel">Cancel</button><button class="danger-btn" id="deleteConfirm">Delete</button></div></div></div>
<div class="backdrop" id="editorModal"><div class="modal editor"><div class="modal-head"><h2 id="editorTitle">Open file</h2><p>Edit the stored project file.</p></div><div class="modal-body"><div class="field"><label>FILE CONTENT</label><textarea id="editorInput" spellcheck="false"></textarea><div class="error" id="editorError"></div></div></div><div class="foot"><button class="cancel" id="editorCancel">Close</button><button class="primary-btn" id="editorSave">Save File</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const DB="axilort-engine-data",STORE="projects",FILES="assetFiles",$=id=>document.getElementById(id);let db,currentProject=null,currentParent=null,pending=null,editingFile=null;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(36).slice(2);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const clean=s=>s.trim().replace(/[\\/:*?"<>|]/g,"-");
function toast(x){const t=$("toast");t.textContent=x;t.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove("show"),2000)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB);r.onerror=()=>rej(r.error);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:"id"});if(!d.objectStoreNames.contains(FILES)){const s=d.createObjectStore(FILES,{keyPath:"id"});s.createIndex("projectId","projectId");s.createIndex("parentId","parentId")}};r.onsuccess=()=>{db=r.result;db.onversionchange=()=>db.close();res(db)}})}
async function all(store){const d=await openDB();return new Promise((res,rej)=>{const r=d.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}async function put(store,x){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,"readwrite");t.objectStore(store).put(x);t.oncomplete=()=>res(x);t.onerror=()=>rej(t.error)})}async function del(store,id){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,"readwrite");t.objectStore(store).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function projectFiles(){return (await all(FILES)).filter(x=>x.projectId===currentProject.id)}
function icon(x){if(x.kind==='folder')return '▰';const e=x.name.split('.').pop().toLowerCase();return e==='html'||e==='htm'?'&lt;/&gt;':e==='css'?'#':e==='js'||e==='json'?'JS':e==='png'||e==='jpg'||e==='jpeg'||e==='webp'||e==='svg'?'IMG':'FILE'}
async function root(){currentProject=null;currentParent=null;$("path").textContent='axilort-engine-data/';$("subtitle").textContent='Project folders and their files.';$("actions").innerHTML='';const ps=await all(STORE);ps.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));render(ps.map(p=>({kind:'folder',id:p.id,name:p.name,project:p})),true)}
async function inside(){const fs=await projectFiles(),items=fs.filter(x=>(x.parentId||null)===(currentParent||null)).sort((a,b)=>a.kind!==b.kind?(a.kind==='folder'?-1:1):a.name.localeCompare(b.name));const names=[];let p=currentParent;while(p){const x=fs.find(v=>v.id===p);if(!x)break;names.unshift(x.name);p=x.parentId||null}$("path").textContent=['axilort-engine-data','projects',currentProject.name,...names].join('/')+'/';$("subtitle").textContent='Files and folders in this project.';$("actions").innerHTML=(currentParent?'<button class="action" id="back">← Back</button>':'')+'<button class="action" id="folder">+ Folder</button><button class="action primary" id="file">+ File</button><button class="action" id="export">Export</button>';$('back')?.addEventListener('click',()=>{const x=fs.find(v=>v.id===currentParent);currentParent=x?.parentId||null;inside()});$('folder')?.addEventListener('click',()=>nameBox('folder'));$('file')?.addEventListener('click',()=>nameBox('file'));$('export').onclick=()=>exportProject();render(items,false)}
function render(items,isRoot){const l=$("list");if(!items.length){l.innerHTML='<div class="empty"><div class="empty-icon">◇</div><strong>'+ (isRoot?'No projects yet':'Empty folder') +'</strong><span>'+ (isRoot?'Create a project from Projects to see it here.':'Create a folder or file here.') +'</span></div>';return}l.innerHTML=items.map(x=>'<div class="file-bar" data-id="'+esc(x.id)+'" data-kind="'+x.kind+'"><div class="file-icon">'+icon(x)+'</div><div class="file-info"><strong>'+esc(x.name)+'</strong><small>'+ (x.kind==='folder'?'Folder':'File') +'</small></div><button class="more" type="button">⋮</button><div class="menu">'+(x.kind==='folder'?'<button data-a="open">Open</button>':'<button data-a="open">Open</button>')+'<button data-a="rename">Rename</button><button data-a="export">Export</button><button data-a="delete" class="danger">Delete</button></div></div>').join('');l.querySelectorAll('.file-bar').forEach(row=>{let timer;row.addEventListener('dblclick',e=>{if(e.target.closest('.more,.menu'))return;openItem(row.dataset.id,row.dataset.kind)});row.querySelector('.more').addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.menu.show').forEach(m=>m.classList.remove('show'));row.querySelector('.menu').classList.toggle('show');row.querySelector('.more').classList.toggle('open')});row.querySelectorAll('.menu button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();row.querySelector('.menu').classList.remove('show');const a=b.dataset.a,id=row.dataset.id,k=row.dataset.kind;if(a==='open')openItem(id,k);if(a==='rename')nameBox('rename',id,k);if(a==='export')exportItem(id,k);if(a==='delete')deleteBox(id,k)}));row.addEventListener('click',e=>{if(e.target.closest('.more,.menu'))return;clearTimeout(timer);timer=setTimeout(()=>{},200)})})}
function openItem(id,k){if(k==='folder'){currentParent=id;inside()}else openEditor(id)}
async function nameBox(mode,id,kind){pending={mode,id,kind};$("nameTitle").textContent=mode==='file'?'Create file':mode==='folder'?'Create folder':'Rename';$("nameHint").textContent=mode==='rename'?'Rename this item.':'Create inside the current project folder.';$("nameSave").textContent=mode==='rename'?'Rename':'Create';$("nameInput").value='';$("nameError").classList.remove('show');if(mode==='rename'){const x=(await projectFiles()).find(v=>v.id===id);if(x)$("nameInput").value=x.name}$("nameModal").classList.add('show');setTimeout(()=>{$("nameInput").focus();$("nameInput").select()},30)}
async function saveName(){if(!pending)return;const n=clean($("nameInput").value);if(!n){$("nameError").textContent='Enter a name.';$("nameError").classList.add('show');return}try{const fs=await projectFiles();if(fs.some(x=>(x.parentId||null)===(currentParent||null)&&x.name.toLowerCase()===n.toLowerCase()&&x.id!==pending.id))throw Error('An item with this name already exists here.');if(pending.mode==='rename'){const x=fs.find(v=>v.id===pending.id);x.name=n;x.updatedAt=new Date().toISOString();await put(FILES,x);toast('Renamed')}else{const x={id:uid(),projectId:currentProject.id,parentId:currentParent||null,kind:pending.mode,name:n,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};if(pending.mode==='file')x.content='';await put(FILES,x);toast(pending.mode==='file'?'File created':'Folder created')}closeName();inside()}catch(e){$("nameError").textContent=e.message;$("nameError").classList.add('show')}}
function closeName(){$("nameModal").classList.remove('show');pending=null}async function deleteBox(id,k){pending={id,kind:k};const x=(await projectFiles()).find(v=>v.id===id);$("deleteName")?.remove();$("deleteError").textContent='Delete '+(x?.name||'item')+'?';$("deleteError").classList.add('show');$("deleteModal").classList.add('show')}
async function removeTree(id,fs){for(const x of fs.filter(v=>v.parentId===id))await removeTree(x.id,fs);await del(FILES,id)}async function confirmDelete(){try{const fs=await projectFiles();await removeTree(pending.id,fs);$("deleteModal").classList.remove('show');pending=null;toast('Deleted');inside()}catch(e){$("deleteError").textContent=e.message}}
async function openEditor(id){const x=(await projectFiles()).find(v=>v.id===id);if(!x)return;editingFile=x;$("editorTitle").textContent=x.name;$("editorInput").value=x.content||'';$("editorModal").classList.add('show');setTimeout(()=>$("editorInput").focus(),30)}async function saveEditor(){if(!editingFile)return;editingFile.content=$("editorInput").value;editingFile.updatedAt=new Date().toISOString();await put(FILES,editingFile);$("editorModal").classList.remove('show');toast('File saved');inside()}
function download(data,name,type='application/json'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function exportProject(){const fs=await projectFiles();download(JSON.stringify({format:'Axilort Project',version:2,exportedAt:new Date().toISOString(),project:currentProject,files:fs},null,2),currentProject.name+'.axilort-project.json');toast('Project exported')}async function exportItem(id,k){const fs=await projectFiles(),x=fs.find(v=>v.id===id);if(!x)return;if(k==='folder'){const ids=[];(function walk(pid){ids.push(pid);fs.filter(v=>v.parentId===pid).forEach(v=>walk(v.id))})(id);download(JSON.stringify({format:'Axilort Folder',version:1,folder:x.name,files:fs.filter(v=>ids.includes(v.id))},null,2),x.name+'.axilort-folder.json')}else download(x.content||'',x.name,'text/plain;charset=utf-8');toast('Exported')}
document.addEventListener('click',e=>{if(!e.target.closest('.menu,.more'))document.querySelectorAll('.menu.show').forEach(m=>m.classList.remove('show'))});$("nameCancel").onclick=closeName;$("nameSave").onclick=saveName;$("deleteCancel").onclick=()=>{$("deleteModal").classList.remove('show');pending=null};$("deleteConfirm").onclick=confirmDelete;$("editorCancel").onclick=()=>$("editorModal").classList.remove('show');$("editorSave").onclick=saveEditor;$("nameInput").onkeydown=e=>{if(e.key==='Enter')saveName();if(e.key==='Escape')closeName()};$("editorInput").onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveEditor()}};window.addEventListener('pageshow',()=>root());root();
</script>
</body>
</html>
