<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Assets — Axilort Engine</title>
<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}a{text-decoration:none;color:inherit}.app{position:fixed;inset:0;display:flex;overflow:hidden;background:#050505}@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;inset:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}}.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;justify-content:center;padding-bottom:clamp(9px,1.5vw,22px)}.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain}.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}.nav a{border:1px solid transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;white-space:nowrap}.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}.ico{width:clamp(14px,1.7vw,21px);height:clamp(14px,1.7vw,21px);display:grid;place-items:center;color:#eee;flex:none;font-size:clamp(11px,1.35vw,18px)}.active .ico{color:var(--red)}.version{margin-top:auto;padding:clamp(7px,1vw,13px) 6px;color:#66666b;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);flex:0 0 clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center}.top-action:hover{background:#111112}.gear{font-size:clamp(17px,2.25vw,25px);line-height:1;color:#fff}.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px) 24px;overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}.heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:clamp(7px,1.15vw,17px)}.heading h1{font-size:clamp(15px,2.55vw,27px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}.heading h1 span{color:var(--red)}.heading p{margin:3px 0 0;color:var(--muted);font-size:clamp(7px,1.05vw,13px)}.toolbar{display:flex;align-items:center;gap:7px;margin-bottom:10px}.path{min-width:0;flex:1;color:#77777d;font-size:clamp(7px,.95vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.action{height:clamp(30px,3.8vw,40px);padding:0 10px;border:1px solid #29292d;border-radius:7px;background:#111112;color:#ddd;font-size:clamp(7px,1vw,11px);font-weight:700}.action:hover{border-color:#8e161b;background:#151516}.action.primary{border-color:#ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);color:#fff}.file-list{display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px)}.file-bar{min-height:clamp(45px,7vw,72px);display:flex;align-items:center;gap:clamp(7px,1.2vw,15px);padding:clamp(7px,1.25vw,13px);border:1px solid var(--border);border-radius:clamp(8px,1.2vw,15px);background:linear-gradient(145deg,#0c0c0d,#080809);user-select:none}.file-bar:hover{border-color:#8e161b;background:#101011}.file-icon{width:clamp(27px,3.5vw,43px);height:clamp(27px,3.5vw,43px);flex:none;display:grid;place-items:center;border:1px solid #2a2a2d;border-radius:8px;background:#0b0b0c;color:var(--red);font-size:clamp(10px,1.3vw,15px);font-weight:800}.file-info{min-width:0;flex:1}.file-info strong{display:block;font-size:clamp(8px,1.15vw,13px);font-weight:750;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-info small{display:block;margin-top:3px;color:#77777d;font-size:clamp(7px,.9vw,11px)}.empty{min-height:clamp(65px,8vw,115px);border:1px dashed #29292b;border-radius:clamp(8px,1.2vw,15px);display:flex;align-items:center;justify-content:center;flex-direction:column;background:#080809;text-align:center;padding:8px}.empty-icon{width:clamp(22px,3.2vw,40px);height:clamp(22px,3.2vw,40px);border:1px solid #2a2a2d;border-radius:8px;display:grid;place-items:center;color:#777;margin-bottom:5px}.empty strong{font-size:clamp(8px,1.05vw,12px);color:#bdbdc1}.empty span{font-size:clamp(7px,.85vw,10px);color:#777;margin-top:2px}.backdrop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:12px;background:#000c;backdrop-filter:blur(7px)}.backdrop.show{display:flex}.modal{width:min(500px,94vw);border:1px solid var(--border);border-radius:14px;background:linear-gradient(145deg,#0c0c0d,#080809);box-shadow:0 30px 100px #000;overflow:hidden}.modal-head{padding:clamp(13px,1.7vw,18px);border-bottom:1px solid var(--border2)}.modal-head h2{margin:0;font-size:clamp(13px,1.5vw,17px)}.modal-head p{margin:4px 0 0;color:#777;font-size:clamp(8px,1vw,11px)}.modal-body{padding:clamp(13px,1.7vw,18px)}.field label{display:block;color:#aaa;font-size:clamp(8px,.95vw,11px);font-weight:750;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #2b2b2f;border-radius:7px;outline:0;background:#070708;padding:9px 10px;font-size:clamp(9px,1vw,12px)}.field input{height:clamp(36px,3.5vw,42px)}.field textarea{height:100%;min-height:220px;resize:none;line-height:1.5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.field input:focus,.field textarea:focus{border-color:#8e161b}.error{display:none;color:#ff5b61;font-size:10px;margin-top:5px}.error.show{display:block}.foot{display:flex;justify-content:flex-end;gap:6px;padding:10px 14px;border-top:1px solid var(--border2)}.foot button{height:34px;border-radius:7px;padding:0 13px;font-size:11px;font-weight:750}.cancel{border:1px solid #29292d;background:#111;color:#aaa}.primary-btn{border:1px solid #ff4148;background:linear-gradient(#ff3038,#d9141b);color:#fff}.editor{width:min(850px,96vw);height:min(650px,92vh);display:flex;flex-direction:column}.editor .modal-body{flex:1;display:flex;min-height:0}.editor .field{width:100%;display:flex;flex-direction:column}.upload-input{display:none}.toast{position:fixed;left:50%;bottom:20px;z-index:300;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111;border:1px solid #333;border-radius:9px;padding:9px 13px;font-size:11px;box-shadow:0 15px 50px #000;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:7px 9px}.heading{margin-bottom:7px}.heading h1{font-size:17px}.heading p{font-size:8px}.action{height:30px;padding:0 8px;font-size:8px}.file-bar{min-height:45px;padding:7px}.file-icon{width:28px;height:28px}.file-info strong{font-size:9px}.file-info small{font-size:7px}.modal{width:min(410px,90vw)}.editor{height:90vh}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a href="projects.html"><span class="ico">□</span>Projects</a><a class="active" href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a></nav><div class="version">Axilort Engine v1.0.0</div></aside><main class="main"><header class="topbar"><a class="top-action" href="settings.html"><span class="gear">⚙</span></a></header><section class="content"><div class="heading"><div><h1><span>Assets</span></h1><p id="subtitle">Project folders and their files.</p></div></div><div class="toolbar"><div class="path" id="path">axilort-engine-data/</div><div class="actions" id="actions"></div></div><div class="file-list" id="list"></div></section></main></div>
<input class="upload-input" id="uploadInput" type="file" multiple>
<div class="backdrop" id="nameModal"><div class="modal"><div class="modal-head"><h2 id="nameTitle">Create folder</h2><p id="nameHelp">Create an item inside the current project folder.</p></div><div class="modal-body"><div class="field"><label>NAME</label><input id="nameInput" maxlength="120" autocomplete="off"><div class="error" id="nameError"></div></div></div><div class="foot"><button class="cancel" id="nameCancel">Cancel</button><button class="primary-btn" id="nameSave">Create</button></div></div></div>
<div class="backdrop" id="editorModal"><div class="modal editor"><div class="modal-head"><h2 id="editorTitle">Open file</h2><p>Edit the stored project file.</p></div><div class="modal-body"><div class="field"><label>FILE CONTENT</label><textarea id="editorInput" spellcheck="false"></textarea><div class="error" id="editorError"></div></div></div><div class="foot"><button class="cancel" id="editorCancel">Close</button><button class="primary-btn" id="editorSave">Save File</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const DB="axilort-engine-data",STORE="projects",FILES="assetFiles",$=id=>document.getElementById(id);let db,currentProject=null,currentParent=null,pending=null,editingFile=null;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(36).slice(2);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const clean=s=>s.trim().replace(/[\\/:*?"<>|]/g,"-");
function toast(x){const t=$("toast");t.textContent=x;t.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove("show"),2000)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB);r.onerror=()=>rej(r.error);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:"id"});if(!d.objectStoreNames.contains(FILES)){const s=d.createObjectStore(FILES,{keyPath:"id"});s.createIndex("projectId","projectId");s.createIndex("parentId","parentId")}};r.onsuccess=()=>{db=r.result;db.onversionchange=()=>db.close();res(db)}})}
async function all(store){const d=await openDB();return new Promise((res,rej)=>{const r=d.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function put(store,x){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,"readwrite");t.objectStore(store).put(x);t.oncomplete=()=>res(x);t.onerror=()=>rej(t.error)})}
async function remove(store,id){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,"readwrite");t.objectStore(store).delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function projectFiles(){return currentProject?(await all(FILES)).filter(x=>x.projectId===currentProject.id):[]}
function icon(x){if(x.kind==='folder'||x.kind==='project')return '▰';const e=x.name.split('.').pop().toLowerCase();return e==='html'||e==='htm'?'&lt;/&gt;':e==='css'?'#':e==='js'||e==='json'?'JS':['png','jpg','jpeg','webp','gif','svg'].includes(e)?'IMG':e==='mp3'||e==='wav'||e==='ogg'?'♪':e==='mp4'||e==='webm'?'▶':'FILE'}
function bytes(n){if(!n)return '';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
async function root(){currentProject=null;currentParent=null;$("path").textContent='axilort-engine-data/';$("subtitle").textContent='Project folders and their files.';$("actions").innerHTML='';const ps=await all(STORE);ps.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));render(ps.map(p=>({kind:'project',id:p.id,name:p.name,project:p})),true)}
async function inside(){if(!currentProject)return;const fs=await projectFiles(),items=fs.filter(x=>(x.parentId||null)===(currentParent||null)).sort((a,b)=>a.kind!==b.kind?(a.kind==='folder'?-1:1):a.name.localeCompare(b.name));const trail=currentParent?(findPath(fs,currentParent)||currentProject.name):currentProject.name;$("path").textContent='axilort-engine-data/'+currentProject.name+'/'+(trail===currentProject.name?'':trail.replace(currentProject.name+'/',''));$("subtitle").textContent=currentParent?'Folder contents.':'Project assets.';$("actions").innerHTML='<button class="action" id="backBtn">Back</button><button class="action" id="folderBtn">+ Folder</button><button class="action" id="fileBtn">+ File</button><button class="action" id="uploadBtn">Upload Asset</button>';$("backBtn").onclick=()=>{if(currentParent){const f=fs.find(x=>x.id===currentParent);currentParent=f?(f.parentId||null):null;inside()}else root()};$("folderBtn").onclick=()=>openName('folder');$("fileBtn").onclick=()=>openName('file');$("uploadBtn").onclick=()=>$("uploadInput").click();render(items,false)}
function findPath(fs,id){const chain=[];let x=fs.find(a=>a.id===id);while(x){chain.unshift(x.name);x=fs.find(a=>a.id===x.parentId)}return [currentProject.name,...chain].join('/')}
function render(items,isRoot){const list=$("list");if(!items.length){list.innerHTML='<div class="empty"><div class="empty-icon">◇</div><strong>'+ (isRoot?'No projects yet.':'This folder is empty.')+'</strong><span>'+ (isRoot?'Create a project first.':'Create a folder, file, or upload an asset.')+'</span></div>';return}list.innerHTML=items.map(x=>'<div class="file-bar" data-id="'+esc(x.id)+'" data-kind="'+esc(x.kind)+'"><div class="file-icon">'+icon(x)+'</div><div class="file-info"><strong>'+esc(x.name)+'</strong><small>'+ (x.kind==='project'?'Project folder':x.kind==='folder'?'Folder':(x.size?bytes(x.size)+' • ':'')+'File')+'</small></div></div>').join('');list.querySelectorAll('.file-bar').forEach(el=>el.addEventListener('dblclick',()=>openItem(el.dataset.id,el.dataset.kind)))}
async function openItem(id,kind){if(kind==='project'){const ps=await all(STORE);currentProject=ps.find(p=>p.id===id)||null;currentParent=null;if(currentProject)inside();return}const fs=await projectFiles(),x=fs.find(f=>f.id===id);if(!x)return;if(x.kind==='folder'){currentParent=x.id;inside()}else openEditor(x)}
function openName(kind){pending=kind;$("nameTitle").textContent=kind==='folder'?'Create folder':'Create file';$("nameHelp").textContent=kind==='folder'?'Create a folder inside the current folder.':'Create a file inside the current folder.';$("nameInput").value='';$("nameError").classList.remove('show');$("nameError").textContent='';$("nameSave").textContent='Create';$("nameModal").classList.add('show');setTimeout(()=>$("nameInput").focus(),30)}
$("nameCancel").onclick=()=>$("nameModal").classList.remove('show');$("nameSave").onclick=createNamed;$("nameInput").addEventListener('keydown',e=>{if(e.key==='Enter')createNamed();if(e.key==='Escape')$("nameModal").classList.remove('show')});
async function createNamed(){if(!currentProject)return;const name=clean($("nameInput").value);if(!name){showNameError('Enter a name.');return}const fs=await projectFiles();if(fs.some(x=>x.parentId===currentParent&&x.name.toLowerCase()===name.toLowerCase())){showNameError('An item with this name already exists.');return}const now=new Date().toISOString();await put(FILES,{id:uid(),projectId:currentProject.id,parentId:currentParent||null,kind:pending,name,createdAt:now,updatedAt:now,size:pending==='file'?0:undefined,content:pending==='file'?'':''});$("nameModal").classList.remove('show');toast((pending==='folder'?'Folder':'File')+' created');inside()}
function showNameError(x){$("nameError").textContent=x;$("nameError").classList.add('show')}
$("uploadInput").addEventListener('change',async e=>{const files=[...e.target.files];if(!files.length||!currentProject)return;const fs=await projectFiles();let count=0;for(const file of files){let name=clean(file.name)||'asset';let base=name,dot=name.lastIndexOf('.');let stem=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';let n=1;while(fs.some(x=>x.parentId===currentParent&&x.name.toLowerCase()===name.toLowerCase()))name=stem+' ('+(n++)+')'+ext;let content='';if(file.type.startsWith('text/')||/\.(html?|css|js|json|xml|svg|txt|md|csv)$/i.test(name)){try{content=await file.text()}catch{content=''}}await put(FILES,{id:uid(),projectId:currentProject.id,parentId:currentParent||null,kind:'file',name,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),size:file.size,mime:file.type||'application/octet-stream',content,blob:file});count++}e.target.value='';toast(count+' asset'+(count===1?'':'s')+' uploaded');inside()});
function openEditor(f){editingFile=f;$("editorTitle").textContent=f.name;$("editorInput").value=f.content||'';$("editorError").classList.remove('show');$("editorModal").classList.add('show')}
$("editorCancel").onclick=()=>{$("editorModal").classList.remove('show');editingFile=null};$("editorSave").onclick=async()=>{if(!editingFile)return;editingFile.content=$("editorInput").value;editingFile.updatedAt=new Date().toISOString();await put(FILES,editingFile);$("editorModal").classList.remove('show');toast('File saved');inside()};
$("editorInput").addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$("editorSave").click()}if(e.key==='Escape')$("editorCancel").click()});
window.addEventListener('pageshow',()=>{currentProject?inside():root()});window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')currentProject?inside():root()});root();
</script>
</body>
</html>
