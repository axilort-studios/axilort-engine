<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="description" content="Axilort Engine assets.">
<title>Assets — Axilort Engine</title>
<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
a,button,input{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}a{text-decoration:none}
.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}
@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;inset-inline:auto;inset-block:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}}
.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column;z-index:3}
.brand{display:flex;align-items:center;justify-content:center;padding:0 0 clamp(9px,1.5vw,22px)}
.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain;flex:none}.brand-text{display:none}
.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}
.nav a{border:1px solid transparent;background:transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;text-align:left;cursor:pointer;white-space:nowrap;text-decoration:none}
.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}
.ico{width:clamp(14px,1.7vw,21px);height:clamp(14px,1.7vw,21px);display:grid;place-items:center;color:#eee;flex:0 0 auto;font-size:clamp(11px,1.35vw,18px)}.active .ico{color:var(--red)}
.version{margin-top:auto;padding:clamp(7px,1vw,13px) clamp(6px,.8vw,11px);color:#66666b;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);flex:0 0 clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}
.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center;cursor:pointer;text-decoration:none}.top-action:hover{background:#111112}.gear{font-size:clamp(17px,2.25vw,25px);line-height:1;color:#ededee}
.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px) clamp(8px,1.7vw,24px);overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}
.welcome{margin-bottom:clamp(7px,1.15vw,17px)}.welcome h1{font-size:clamp(15px,2.55vw,27px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}.welcome h1 span{color:var(--red)}.welcome p{margin:3px 0 0;color:#929297;font-size:clamp(7px,1.05vw,13px)}
.toolbar{display:flex;align-items:center;gap:7px;margin-bottom:clamp(7px,1vw,11px)}.path{min-width:0;flex:1;color:#77777d;font-size:clamp(7px,.95vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.action{height:clamp(30px,3.8vw,40px);padding:0 clamp(8px,1.2vw,14px);border:1px solid #29292d;border-radius:7px;background:#111112;color:#ddd;font-size:clamp(7px,1vw,11px);font-weight:700}.action:hover{border-color:#8e161b;background:#151516}.action.primary{border-color:#ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);color:#fff}
.file-list{display:flex;flex-direction:column;gap:clamp(4px,.7vw,7px)}.file-bar{min-height:clamp(42px,5.5vw,58px);display:flex;align-items:center;gap:clamp(7px,1vw,12px);padding:clamp(6px,1vw,10px);border:1px solid var(--border);border-radius:8px;background:linear-gradient(145deg,#0c0c0d,#080809);user-select:none;position:relative}.file-bar:hover{border-color:#8e161b;background:#101011}
.file-icon{width:clamp(26px,3vw,36px);height:clamp(26px,3vw,36px);flex:none;display:grid;place-items:center;border:1px solid #2a2a2d;border-radius:7px;background:#0b0b0c;color:var(--red);font-size:clamp(9px,1.15vw,13px);font-weight:800;overflow:hidden}.file-icon img{width:100%;height:100%;object-fit:cover}.file-info{min-width:0;flex:1}.file-info strong{display:block;font-size:clamp(8px,1.05vw,12px);font-weight:750;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-info small{display:block;margin-top:3px;color:#77777d;font-size:clamp(7px,.82vw,10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:#aaa;font-size:17px;display:grid;place-items:center;flex:none}.more:hover{background:#181819;color:#fff}.menu{position:absolute;right:7px;top:39px;z-index:20;min-width:120px;padding:4px;border:1px solid #303034;border-radius:8px;background:#0c0c0d;box-shadow:0 15px 40px #000;display:none}.menu.show{display:block}.menu button{width:100%;height:29px;text-align:left;padding:0 9px;border:0;border-radius:5px;background:transparent;color:#ccc;font-size:10px}.menu button:hover{background:#171718;color:#fff}.menu .danger:hover{background:#3a1113;color:#ff666c}
.empty{min-height:clamp(58px,8vw,115px);border:1px dashed #29292b;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;background:#080809}.empty-icon{width:clamp(22px,3.2vw,40px);height:clamp(22px,3.2vw,40px);border:1px solid #2a2a2d;border-radius:8px;display:grid;place-items:center;color:#777;margin-bottom:5px;font-size:clamp(9px,1.3vw,15px)}.empty strong{font-size:clamp(8px,1.05vw,12px)}.empty span{font-size:clamp(7px,.85vw,10px);color:#777;margin-top:2px}
.backdrop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:12px;background:#000c;backdrop-filter:blur(7px)}.backdrop.show{display:flex}.modal{width:min(500px,94vw);border:1px solid var(--border);border-radius:12px;background:linear-gradient(145deg,#0c0c0d,#080809);box-shadow:0 30px 100px #000;overflow:hidden}.modal-head{padding:13px 15px;border-bottom:1px solid var(--border2)}.modal-head h2{margin:0;font-size:clamp(13px,1.5vw,17px)}.modal-head p{margin:4px 0 0;color:#777;font-size:clamp(8px,1vw,11px)}.modal-body{padding:13px 15px}.field label{display:block;color:#aaa;font-size:clamp(8px,.95vw,11px);font-weight:750;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #2b2b2f;border-radius:7px;outline:0;background:#070708;padding:9px 10px;font-size:clamp(9px,1vw,12px)}.field input{height:38px}.field textarea{height:100%;min-height:220px;resize:none;line-height:1.5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.field input:focus,.field textarea:focus{border-color:#8e161b}.error{display:none;color:#ff5b61;font-size:10px;margin-top:5px}.error.show{display:block}.foot{display:flex;justify-content:flex-end;gap:6px;padding:10px 14px;border-top:1px solid var(--border2)}.foot button{height:32px;border-radius:7px;padding:0 12px;font-size:10px;font-weight:750}.cancel{border:1px solid #29292d;background:#111;color:#aaa}.primary-btn{border:1px solid #ff4148;background:linear-gradient(#ff3038,#d9141b);color:#fff}.editor{width:min(850px,96vw);height:min(650px,92vh);display:flex;flex-direction:column}.editor .modal-body{flex:1;display:flex;min-height:0}.editor .field{width:100%;display:flex;flex-direction:column}.preview{width:min(900px,96vw);height:min(680px,92vh);display:flex;flex-direction:column}.preview-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;background:#050505;overflow:hidden}.preview-body img{max-width:100%;max-height:100%;object-fit:contain}.preview-body video{max-width:100%;max-height:100%}.preview-body audio{width:min(600px,90%)}.preview-body iframe{width:100%;height:100%;border:0;background:#fff}.preview-empty{text-align:center;color:#888;font-size:12px;line-height:1.5}.preview-empty b{color:#ddd;display:block;margin-bottom:5px}.upload-input{display:none}.toast{position:fixed;left:50%;bottom:20px;z-index:300;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111;border:1px solid #333;border-radius:8px;padding:8px 12px;font-size:10px;box-shadow:0 15px 50px #000;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-height:360px){.sidebar{width:clamp(86px,16vw,145px);flex-basis:clamp(86px,16vw,145px)}.nav a{height:29px}.brand img{width:34px;height:34px}.content{padding:7px 9px}}
@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:7px 9px}.welcome{margin-bottom:7px}.welcome h1{font-size:17px}.welcome p{font-size:8px}.action{height:30px;padding:0 8px;font-size:8px}.file-bar{min-height:42px;padding:6px}.file-icon{width:27px;height:27px}.file-info strong{font-size:9px}.file-info small{font-size:7px}.more{width:27px;height:27px}.modal{width:min(410px,90vw)}.editor,.preview{height:90vh}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a href="projects.html"><span class="ico">□</span>Projects</a><a class="active" href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a></nav><div class="version">Axilort Engine v1.0.0</div></aside>
<main class="main"><header class="topbar"><a class="top-action" href="settings.html" aria-label="Open settings"><span class="gear">⚙</span></a></header><div class="content"><div class="welcome"><h1><span>Assets</span></h1><p id="subtitle">Project folders and their files.</p></div><div class="toolbar"><div class="path" id="path">axilort-engine-data/</div><div class="actions" id="actions"></div></div><div class="file-list" id="list"></div></div></main></div>
<input class="upload-input" id="uploadInput" type="file" multiple>
<div class="backdrop" id="nameModal"><div class="modal"><div class="modal-head"><h2 id="nameTitle">Create folder</h2><p id="nameHelp">Create an item inside the current project folder.</p></div><div class="modal-body"><div class="field"><label>NAME</label><input id="nameInput" maxlength="120" autocomplete="off"><div class="error" id="nameError"></div></div></div><div class="foot"><button class="cancel" id="nameCancel">Cancel</button><button class="primary-btn" id="nameSave">Create</button></div></div></div>
<div class="backdrop" id="editorModal"><div class="modal editor"><div class="modal-head"><h2 id="editorTitle">Open file</h2><p>Edit the stored project file.</p></div><div class="modal-body"><div class="field"><label>FILE CONTENT</label><textarea id="editorInput" spellcheck="false"></textarea><div class="error" id="editorError"></div></div></div><div class="foot"><button class="cancel" id="editorCancel">Close</button><button class="primary-btn" id="editorSave">Save File</button></div></div></div>
<div class="backdrop" id="previewModal"><div class="modal preview"><div class="modal-head"><h2 id="previewTitle">Preview</h2><p id="previewMeta"></p></div><div class="preview-body" id="previewBody"></div><div class="foot"><button class="cancel" id="previewClose">Close</button><button class="primary-btn" id="previewDownload">Export</button></div></div></div><div class="toast" id="toast"></div>
<script>
const DB="axilort-engine-data",STORE="projects",FILES="assetFiles",$=id=>document.getElementById(id);let db,currentProject=null,currentParent=null,pending=null,editingFile=null,previewFile=null,previewUrl=null;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(36).slice(2);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const clean=s=>s.trim().replace(/[\\/:*?"<>|]/g,"-");
function toast(x){const t=$("toast");t.textContent=x;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),2000)}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB);r.onerror=()=>reject(r.error);r.onupgradeneeded=e=>ensureStores(e.target.result);r.onsuccess=()=>{db=r.result;db.onversionchange=()=>db.close();if(db.objectStoreNames.contains(STORE)&&db.objectStoreNames.contains(FILES))return resolve(db);const v=db.version+1;db.close();const u=indexedDB.open(DB,v);u.onerror=()=>reject(u.error);u.onupgradeneeded=e=>ensureStores(e.target.result);u.onsuccess=()=>{db=u.result;db.onversionchange=()=>db.close();resolve(db)}}})}
function ensureStores(d){if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:"id"});if(!d.objectStoreNames.contains(FILES)){const s=d.createObjectStore(FILES,{keyPath:"id"});s.createIndex("projectId","projectId");s.createIndex("parentId","parentId")}}
async function all(store){const d=await openDB();return new Promise((res,rej)=>{const r=d.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function put(store,x){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,"readwrite");t.objectStore(store).put(x);t.oncomplete=()=>res(x);t.onerror=()=>rej(t.error)})}
async function remove(store,id){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,"readwrite");t.objectStore(store).delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function projectFiles(){return currentProject?(await all(FILES)).filter(x=>x.projectId===currentProject.id):[]}
function bytes(n){if(!n)return "";if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";if(n<1073741824)return(n/1048576).toFixed(1)+" MB";return(n/1073741824).toFixed(1)+" GB"}
function ext(n){const a=n.split(".");return a.length>1?a.pop().toLowerCase():""}
function isImage(x){return!!(x.mimeType&&x.mimeType.startsWith("image/"))||["png","jpg","jpeg","gif","webp","svg","bmp","avif","ico","tif","tiff","apng","heic","heif"].includes(ext(x.name))}
function isVideo(x){return!!(x.mimeType&&x.mimeType.startsWith("video/"))||["mp4","webm","ogg","ogv","mov","m4v","avi","mkv","3gp","mpeg","mpg"].includes(ext(x.name))}
function isAudio(x){return!!(x.mimeType&&x.mimeType.startsWith("audio/"))||["mp3","wav","ogg","oga","m4a","aac","flac","weba"].includes(ext(x.name))}
function is3D(x){return["glb","gltf","obj","stl","fbx","dae","3ds","blend","ply","off"].includes(ext(x.name))}
function isText(x){return!!(x.mimeType&&(/text\//.test(x.mimeType)||x.mimeType.includes("json")||x.mimeType.includes("javascript")||x.mimeType.includes("xml")))||["html","htm","css","js","json","txt","md","xml","csv","shader","glsl","gd","ts","tsx","jsx"].includes(ext(x.name))}
function icon(x){if(x.kind==="folder"||x.kind==="project")return"▰";if(isImage(x))return"IMG";if(isVideo(x))return"▶";if(isAudio(x))return"♪";if(is3D(x))return"3D";const e=ext(x.name);return e==="html"||e==="htm"?"&lt;/&gt;":e==="css"?"#":e==="js"||e==="json"?"JS":"FILE"}
function renderIcon(x){if(x.kind==="folder"||x.kind==="project")return'<div class="file-icon">▰</div>';if(isImage(x)&&x.content instanceof Blob)return'<div class="file-icon"><img data-thumb="'+esc(x.id)+'"></div>';return'<div class="file-icon">'+icon(x)+"</div>"}
function menuHTML(x){return'<div class="menu"><button data-action="rename">Rename</button><button data-action="export">Export</button><button class="danger" data-action="delete">Delete</button></div>'}
function row(x,showMenu){return'<div class="file-bar" data-id="'+esc(x.id)+'" data-kind="'+esc(x.kind)+'">'+renderIcon(x)+'<div class="file-info"><strong>'+esc(x.name)+'</strong><small>'+((x.kind==="folder"||x.kind==="project")?"Folder":(x.mimeType||"File"))+((x.size)?" • "+bytes(x.size):"")+'</small></div>'+(showMenu?menuHTML(x):"")+"</div>"}
async function loadThumbs(){const fs=await projectFiles();for(const el of document.querySelectorAll("[data-thumb]")){const x=fs.find(a=>a.id===el.dataset.thumb);if(x&&x.content instanceof Blob){const u=URL.createObjectURL(x.content);el.src=u;el.onload=()=>URL.revokeObjectURL(u)}}}
async function render(){closeMenus();const list=$("list"),acts=$("actions");if(!currentProject){$("path").textContent="axilort-engine-data/";$("subtitle").textContent="Project folders and their files.";acts.innerHTML="";const ps=await all(STORE);ps.sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));list.innerHTML=ps.length?ps.map(p=>row({...p,kind:"project"},false)).join(""):empty("No projects yet","Create your first project to see it here.");return}const fs=await projectFiles();const visible=fs.filter(x=>(x.parentId||null)===(currentParent||null)).sort((a,b)=>a.kind.localeCompare(b.kind)||a.name.localeCompare(b.name));$("path").textContent="axilort-engine-data/"+currentProject.name+(currentParent?"/…":"/");$("subtitle").textContent="Assets in "+currentProject.name;acts.innerHTML='<button class="action" id="backBtn">Back</button><button class="action" id="folderBtn">+ Folder</button><button class="action" id="fileBtn">+ File</button><button class="action primary" id="uploadBtn">Upload Asset</button>';list.innerHTML=visible.length?visible.map(x=>row(x,true)).join(""):empty("Folder is empty","Create or upload an asset here.");$("backBtn").onclick=()=>{if(currentParent){const p=fs.find(x=>x.id===currentParent);currentParent=p?p.parentId||null:null}else{currentProject=null;currentParent=null}render()};$("folderBtn").onclick=()=>openName("folder");$("fileBtn").onclick=()=>openName("file");$("uploadBtn").onclick=()=>$("uploadInput").click();await loadThumbs()}
function empty(a,b){return'<div class="empty"><div class="empty-icon">◇</div><strong>'+esc(a)+'</strong><span>'+esc(b)+'</span></div>'}
function openName(type,item=null){pending={type,item};$("nameTitle").textContent=item?"Rename "+type:(type==="folder"?"Create folder":"Create file");$("nameHelp").textContent=item?"Choose a new name for this item.":"Create an item inside the current project folder.";$("nameInput").value=item?item.name:"";$("nameError").classList.remove("show");$("nameModal").classList.add("show");setTimeout(()=>$("nameInput").focus(),30)}
async function sameName(name,parent,ignore){const fs=await projectFiles();return fs.some(x=>(x.parentId||null)===parent&&x.name.toLowerCase()===name.toLowerCase()&&x.id!==ignore)}
async function saveName(){const v=clean($("nameInput").value);if(!v){$("nameError").textContent="Enter a name.";$("nameError").classList.add("show");return}const parent=currentParent||null;if(await sameName(v,parent,pending.item?.id)){ $("nameError").textContent="An item with this name already exists here.";$("nameError").classList.add("show");return}if(pending.item){pending.item.name=v;pending.item.updatedAt=new Date().toISOString();await put(FILES,pending.item);toast("Renamed")}else{await put(FILES,{id:uid(),projectId:currentProject.id,parentId:parent,name:v,kind:pending.type,content:pending.type==="file"?"":undefined,mimeType:pending.type==="file"?"text/plain":"",size:0,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});toast(pending.type==="folder"?"Folder created":"File created")}$("nameModal").classList.remove("show");render()}
async function deleteItem(x){if(!confirm('Delete "'+x.name+'"?'+(x.kind==="folder"?" This will delete everything inside it.":"")))return;const fs=await projectFiles(),ids=[x.id];if(x.kind==="folder"){let changed=true;while(changed){changed=false;for(const f of fs){if(ids.includes(f.parentId)&&!ids.includes(f.id)){ids.push(f.id);changed=true}}}}for(const id of ids)await remove(FILES,id);toast("Deleted");render()}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function exportItem(x){if(x.kind==="folder"){const fs=await projectFiles();const ids=[x.id];let changed=true;while(changed){changed=false;for(const f of fs){if(ids.includes(f.parentId)&&!ids.includes(f.id)){ids.push(f.id);changed=true}}}const items=fs.filter(f=>ids.includes(f.id)).map(f=>({name:f.name,kind:f.kind,parentId:f.parentId,size:f.size,mimeType:f.mimeType,content:typeof f.content==="string"?f.content:null}));downloadBlob(new Blob([JSON.stringify({name:x.name,type:"folder",items},null,2)],{type:"application/json"}),x.name+".json");return}if(x.content instanceof Blob){downloadBlob(x.content,x.name);return}downloadBlob(new Blob([String(x.content??"")],{type:x.mimeType||"text/plain"}),x.name)}
async function openFile(x){if(x.kind==="folder"){currentParent=x.id;render();return}if(isText(x)&&typeof x.content==="string"){editingFile=x;$("editorTitle").textContent=x.name;$("editorInput").value=x.content;$("editorError").classList.remove("show");$("editorModal").classList.add("show");return}if(isImage(x)||isVideo(x)||isAudio(x)||is3D(x)){showPreview(x);return}exportItem(x)}
function showPreview(x){previewFile=x;$("previewTitle").textContent=x.name;$("previewMeta").textContent=(x.mimeType||"Asset")+((x.size)?" • "+bytes(x.size):"");const b=$("previewBody");b.innerHTML="";if(!(x.content instanceof Blob)){b.innerHTML='<div class="preview-empty"><b>No binary preview available</b>This file is stored and can still be exported.</div>';$("previewModal").classList.add("show");return}previewUrl=URL.createObjectURL(x.content);if(isImage(x)){const img=document.createElement("img");img.src=previewUrl;b.appendChild(img)}else if(isVideo(x)){const v=document.createElement("video");v.src=previewUrl;v.controls=true;b.appendChild(v)}else if(isAudio(x)){const a=document.createElement("audio");a.src=previewUrl;a.controls=true;b.appendChild(a)}else if(["glb","gltf"].includes(ext(x.name))){const mv=document.createElement("model-viewer");mv.setAttribute("src",previewUrl);mv.setAttribute("camera-controls","");mv.setAttribute("auto-rotate","");mv.style.width="100%";mv.style.height="100%";b.appendChild(mv);if(!document.querySelector("script[data-model-viewer]")){const s=document.createElement("script");s.type="module";s.dataset.modelViewer="1";s.src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js";document.head.appendChild(s)}}else{b.innerHTML='<div class="preview-empty"><b>3D asset stored successfully</b>Browser preview is not available for this 3D format. Use Export to open it in a compatible application.</div>'}$("previewModal").classList.add("show")}
async function saveEditor(){if(!editingFile)return;editingFile.content=$("editorInput").value;editingFile.mimeType=editingFile.mimeType||"text/plain";editingFile.size=new Blob([editingFile.content]).size;editingFile.updatedAt=new Date().toISOString();await put(FILES,editingFile);$("editorModal").classList.remove("show");toast("File saved");render()}
function closeMenus(){document.querySelectorAll(".menu.show").forEach(x=>x.classList.remove("show"))}
$("nameCancel").onclick=()=>$("nameModal").classList.remove("show");$("nameSave").onclick=saveName;$("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")saveName()});$("editorCancel").onclick=()=>$("editorModal").classList.remove("show");$("editorSave").onclick=saveEditor;$("editorInput").addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();saveEditor()}});$("previewClose").onclick=()=>{$("previewModal").classList.remove("show");if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null};$("previewDownload").onclick=()=>previewFile&&exportItem(previewFile);
$("uploadInput").addEventListener("change",async e=>{const files=[...e.target.files];if(!currentProject){e.target.value="";return}let count=0;for(const f of files){if(await sameName(f.name,currentParent||null,null))continue;await put(FILES,{id:uid(),projectId:currentProject.id,parentId:currentParent||null,name:f.name,kind:"file",content:f,mimeType:f.type||"application/octet-stream",size:f.size,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});count++}e.target.value="";toast(count+" asset(s) uploaded");render()});
$("list").addEventListener("dblclick",async e=>{const bar=e.target.closest(".file-bar");if(!bar)return;if(bar.dataset.kind==="project"){const p=(await all(STORE)).find(x=>x.id===bar.dataset.id);if(p){currentProject=p;currentParent=null;render()}return}const x=(await all(FILES)).find(f=>f.id===bar.dataset.id);if(x)openFile(x)});
$("list").addEventListener("click",async e=>{const more=e.target.closest(".more");if(more){e.stopPropagation();closeMenus();more.parentElement.querySelector(".menu")?.classList.add("show");return}const btn=e.target.closest(".menu button");if(!btn)return;e.stopPropagation();const bar=btn.closest(".file-bar"),x=(await all(FILES)).find(f=>f.id===bar.dataset.id);closeMenus();if(!x)return;const a=btn.dataset.action;if(a==="rename")openName(x.kind,x);if(a==="export")exportItem(x);if(a==="delete")deleteItem(x)});
document.addEventListener("click",e=>{if(!e.target.closest(".more")&&!e.target.closest(".menu"))closeMenus()});
(async()=>{try{await openDB();await render()}catch(e){console.error(e);$("list").innerHTML=empty("Storage unavailable","Unable to open Axilort Engine storage.")}})();
</script>
