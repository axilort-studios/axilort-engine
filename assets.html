<!doctype html>
<html lang="en">
<head>

<title>Assets — Axilort Engine</title>
<style>
:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}a,button,input,textarea,select{font:inherit;color:inherit}button{touch-action:manipulation;cursor:pointer}a{text-decoration:none}.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;inset-inline:auto;inset-block:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}}.sidebar{width:clamp(94px,15vw,205px);flex:0 0 clamp(94px,15vw,205px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(7px,1.25vw,20px) clamp(6px,1vw,15px);display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;justify-content:center;padding:0 0 clamp(9px,1.5vw,22px)}.brand img{width:clamp(35px,5vw,80px);height:clamp(35px,5vw,80px);object-fit:contain;flex:none}.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}.nav a{border:1px solid transparent;background:transparent;border-radius:clamp(7px,1vw,12px);height:clamp(31px,4vw,50px);display:flex;align-items:center;gap:clamp(5px,.8vw,12px);padding:0 clamp(6px,.9vw,13px);font-weight:600;font-size:clamp(8px,1.05vw,14px);color:#ccc;text-align:left;cursor:pointer;white-space:nowrap}.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}.ico{width:clamp(14px,1.7vw,21px);height:clamp(14px,1.7vw,21px);display:grid;place-items:center;color:#eee;flex:0 0 auto;font-size:clamp(11px,1.35vw,18px)}.active .ico{color:var(--red)}.version{margin-top:auto;padding:clamp(7px,1vw,13px) clamp(6px,.8vw,11px);color:#66666b;font-size:clamp(7px,.8vw,10px);font-weight:600;text-align:center;white-space:nowrap}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(39px,5.5vw,68px);flex:0 0 clamp(39px,5.5vw,68px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(8px,1.7vw,24px)}.top-action{width:clamp(28px,3.8vw,42px);height:clamp(28px,3.8vw,42px);border:0;border-radius:9px;background:transparent;display:grid;place-items:center;cursor:pointer}.top-action:hover{background:#111112}.gear{font-size:clamp(17px,2.25vw,25px);line-height:1;color:#ededee}.content{padding:clamp(8px,1.7vw,25px) clamp(10px,2vw,28px) clamp(8px,1.7vw,24px);overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}.welcome{margin-bottom:clamp(7px,1.15vw,17px)}.welcome h1{font-size:clamp(15px,2.55vw,27px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}.welcome h1 span{color:var(--red)}.welcome p{margin:3px 0 0;color:#929297;font-size:clamp(7px,1.05vw,13px)}.panel{border:1px solid var(--border);border-radius:clamp(9px,1.5vw,17px);background:linear-gradient(145deg,#0c0c0d,#080809);overflow:visible}.panelhead{height:clamp(38px,5vw,58px);padding:0 clamp(9px,1.3vw,16px);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border2)}.panelhead strong{font-size:clamp(9px,1.3vw,15px)}.crumb{flex:1;min-width:0;color:#929297;font-size:clamp(7px,1vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.btn{height:clamp(28px,3.5vw,39px);border:1px solid #29292d;border-radius:7px;background:#111112;padding:0 clamp(7px,1vw,12px);font-size:clamp(7px,1vw,12px);font-weight:750}.btn:hover{border-color:#8e161b}.primary{border:1px solid #ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);border-radius:7px;padding:0 clamp(8px,1.2vw,15px);font-size:clamp(7px,1vw,12px);font-weight:750;height:clamp(28px,3.5vw,39px)}.searchrow{display:flex;gap:6px;padding:clamp(8px,1vw,13px);border-bottom:1px solid var(--border2)}.search{height:clamp(29px,3.5vw,39px);min-width:0;flex:1;border:1px solid #29292d;border-radius:7px;background:#09090a;padding:0 10px;outline:0;font-size:clamp(7px,1vw,11px)}.search:focus{border-color:#8e161b}.select{height:clamp(29px,3.5vw,39px);border:1px solid #29292d;border-radius:7px;background:#09090a;padding:0 7px;font-size:clamp(7px,1vw,11px);outline:0}.list{padding:clamp(8px,1vw,13px);display:grid;grid-template-columns:1fr;gap:5px}.list.grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}.item{position:relative;min-height:47px;border:1px solid var(--border);border-radius:8px;background:linear-gradient(145deg,#0d0d0e,#080809);display:flex;align-items:center;gap:8px;padding:6px;user-select:none}.item:hover{border-color:#8e161b;background:#101011}.icon{width:30px;height:30px;flex:none;border:1px solid #29292d;border-radius:7px;background:#0a0a0b;display:grid;place-items:center;color:var(--red);font-size:8px;font-weight:850;overflow:hidden}.info{min-width:0;flex:1}.info b{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{display:block;margin-top:3px;color:#68686e;font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{width:25px;height:27px;flex:none;border:0;background:transparent;border-radius:6px;color:#aaa;font-size:15px}.more:hover{background:#1a1a1b;color:#fff}.menu{position:absolute;right:6px;top:37px;z-index:20;min-width:135px;padding:4px;border:1px solid #303034;border-radius:8px;background:#0b0b0c;box-shadow:0 20px 60px #000;display:none}.menu.show{display:block}.menu button{display:block;width:100%;height:29px;text-align:left;border:0;border-radius:5px;background:transparent;padding:0 9px;font-size:8px;color:#ccc}.menu button:hover{background:#171718}.menu .danger:hover{background:#3b1114;color:#ff686e}.empty{padding:35px 15px;text-align:center;color:#777;font-size:9px}.empty b{display:block;color:#ddd;margin-bottom:4px}.modalbg{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:12px;background:#000c;backdrop-filter:blur(7px)}.modalbg.show{display:flex}.modal{width:min(510px,94vw);max-height:92vh;border:1px solid var(--border);border-radius:12px;background:#0b0b0c;box-shadow:0 30px 100px #000;overflow:hidden;display:flex;flex-direction:column}.head{padding:13px 15px;border-bottom:1px solid var(--border2)}.head h2{margin:0;font-size:14px}.head p{margin:4px 0 0;color:#707077;font-size:8px}.body{padding:13px 15px;overflow:auto}.field label{display:block;color:#aaa;font-size:8px;font-weight:750;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #2b2b2f;border-radius:7px;background:#070708;outline:0;padding:9px;font-size:9px}.field input{height:37px}.field textarea{height:360px;resize:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5}.foot{display:flex;justify-content:flex-end;gap:6px;padding:10px 14px;border-top:1px solid var(--border2)}.foot button{height:31px;border-radius:7px;padding:0 11px;border:1px solid #29292d;background:#111;font-size:8px;font-weight:750}.foot .primary{background:linear-gradient(#ff3038,#d7151d);border-color:#ff454b}.hidden{display:none!important}.status{font-size:8px;color:#666}.toast{position:fixed;z-index:500;left:50%;bottom:18px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#111;border:1px solid #333;border-radius:8px;padding:8px 12px;font-size:9px;transition:.2s;box-shadow:0 15px 50px #000}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-height:360px){.sidebar{width:clamp(86px,16vw,145px);flex-basis:clamp(86px,16vw,145px)}.nav a{height:29px}.brand img{width:34px;height:34px}.content{padding:7px 9px}}@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:7px 9px}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a href="projects.html"><span class="ico">□</span>Projects</a><a class="active" href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a></nav><div class="version">Axilort Engine v1.0.0</div></aside><main class="main"><header class="topbar"><a class="top-action" href="settings.html" aria-label="Open settings"><span class="gear">⚙</span></a></header><div class="content"><div class="welcome"><h1>Axilort <span>Assets</span></h1><p>Manage your projects, files and game assets.</p></div><section class="panel"><div class="panelhead"><strong id="heading">Projects</strong><div class="crumb" id="crumb">axilort-engine-data/projects/</div><div class="actions" id="actions"></div></div><div class="searchrow"><input class="search" id="search" placeholder="Search projects, folders and files…"><select class="select" id="sort"><option value="name">Name</option><option value="new">Newest</option><option value="old">Oldest</option><option value="size">Size</option><option value="type">Type</option></select><button class="btn" id="view">▦ Grid</button></div><div class="list" id="list"></div></section></div></main></div>
<input id="upload" type="file" multiple class="hidden">
<div class="modalbg" id="nameModal"><div class="modal"><div class="head"><h2 id="nameTitle">Create folder</h2><p id="nameHelp"></p></div><div class="body"><div class="field"><label>NAME</label><input id="nameInput" maxlength="160" autocomplete="off"></div><div class="status" id="nameError"></div></div><div class="foot"><button id="nameCancel">Cancel</button><button class="primary" id="nameSave">Save</button></div></div></div>
<div class="modalbg" id="editorModal"><div class="modal"><div class="head"><h2 id="editorTitle">Edit file</h2><p>Read and write the stored file.</p></div><div class="body"><div class="field"><label>CONTENT</label><textarea id="editor"></textarea></div></div><div class="foot"><button id="editorCancel">Close</button><button class="primary" id="editorSave">Save</button></div></div></div>
<div class="modalbg" id="detailsModal"><div class="modal"><div class="head"><h2>Item details</h2><p>Stored in Axilort Engine app storage.</p></div><div class="body"><div id="details"></div></div><div class="foot"><button id="detailsClose">Close</button></div></div></div><div class="toast" id="toast"></div>
<script>
const DB='axilort-engine-data',PS='projects',FS='assetFiles';let db,project=null,parent=null,cache=[],pending=null,editing=null,grid=false;const $=x=>document.getElementById(x),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ext=n=>{let a=n.toLowerCase().split('.');return a.length>1?a.pop():''},isText=x=>x.mimeType?.startsWith('text/')||x.mimeType?.includes('json')||['html','htm','css','js','json','txt','md','xml','csv','ts','tsx','jsx','gd','shader','glsl'].includes(ext(x.name));
function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),2200)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains(PS))d.createObjectStore(PS,{keyPath:'id'});if(!d.objectStoreNames.contains(FS)){let s=d.createObjectStore(FS,{keyPath:'id'});s.createIndex('projectId','projectId');s.createIndex('parentId','parentId')}};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}function all(s){return new Promise((r,j)=>{let q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>j(q.error)})}function put(s,x){return new Promise((r,j)=>{let t=db.transaction(s,'readwrite');t.objectStore(s).put(x);t.oncomplete=r;t.onerror=()=>j(t.error)})}function del(s,id){return new Promise((r,j)=>{let t=db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=r;t.onerror=()=>j(t.error)})}function bytes(n){if(!n)return'0 B';if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(1)+' GB'}
function menu(x){if(x.kind==='project')return'<div class="menu"><button data-a="export">Export</button></div>';return'<div class="menu"><button data-a="open">Open</button><button data-a="rename">Rename</button><button data-a="duplicate">Duplicate</button><button data-a="export">Export</button><button data-a="details">Details</button><button class="danger" data-a="delete">Delete</button></div>'}function icon(x){return'<div class="icon">'+(x.kind==='project'||x.kind==='folder'?'▰':isText(x)?'&lt;/&gt;':ext(x.name).toUpperCase().slice(0,4)||'FILE')+'</div>'}
function row(x){return'<div class="item" data-id="'+esc(x.id)+'">'+icon(x)+'<div class="info"><b>'+esc(x.name)+'</b><small>'+((x.kind==='project'||x.kind==='folder')?'Folder':esc(x.mimeType||'File'))+(x.size?' • '+bytes(x.size):'')+'</small></div><button class="more">⋮</button>'+menu(x)+'</div>'}
async function render(){let a;if(!project){$('heading').textContent='Projects';$('crumb').textContent='axilort-engine-data/projects/';$('actions').innerHTML='';a=await all(PS)}else{$('heading').textContent=project.name;$('crumb').textContent='axilort-engine-data/projects/'+project.name+'/'+(parent?'…':'');$('actions').innerHTML='<button class="btn" id="back">← Back</button><button class="btn" id="folder">+ Folder</button><button class="btn" id="file">+ File</button><button class="primary" id="uploadBtn">Upload</button>';a=(await all(FS)).filter(x=>x.projectId===project.id)}cache=a;renderList();if(project){$('back').onclick=()=>{if(parent){let f=cache.find(x=>x.id===parent);parent=f?.parentId||null}else{project=null;parent=null}render()};$('folder').onclick=()=>openName('folder');$('file').onclick=()=>openName('file');$('uploadBtn').onclick=()=>$('upload').click()}}
function renderList(){let a=cache.filter(x=>(x.parentId||null)===(parent||null));let q=$('search').value.trim().toLowerCase();if(q)a=a.filter(x=>x.name.toLowerCase().includes(q));let s=$('sort').value;a.sort((x,y)=>s==='size'?(y.size||0)-(x.size||0):s==='new'?String(y.createdAt).localeCompare(String(x.createdAt)):s==='old'?String(x.createdAt).localeCompare(String(y.createdAt)):s==='type'?String(x.mimeType||x.kind).localeCompare(String(y.mimeType||y.kind)):x.name.localeCompare(y.name));$('list').classList.toggle('grid',grid);$('list').innerHTML=a.length?a.map(row).join(''):'<div class="empty"><b>'+(!project?'No projects':'Folder is empty')+'</b>'+(!project?'Create your first project from the Projects page.':'Create a folder, create a file, or upload assets.')+'</div>'}
function openName(kind,item=null){pending={kind,item};$('nameTitle').textContent=item?'Rename item':kind==='folder'?'Create folder':'Create file';$('nameInput').value=item?.name||'';$('nameError').textContent='';$('nameModal').classList.add('show');setTimeout(()=>$('nameInput').focus(),30)}
async function saveName(){let n=$('nameInput').value.trim().replace(/[\\/:*?"<>|]/g,'-');if(!n)return;$('nameModal').classList.remove('show');if(pending.item){pending.item.name=n;pending.item.updatedAt=new Date().toISOString();await put(FS,pending.item);toast('Renamed')}else{await put(FS,{id:uid(),projectId:project.id,parentId:parent||null,name:n,kind:pending.kind,mimeType:pending.kind==='file'?'text/plain':'application/octet-stream',content:pending.kind==='file'?'':'',size:0,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});toast(pending.kind==='folder'?'Folder created':'File created')}render()}
function descendants(root){let a=cache.filter(x=>x.projectId===project.id),ids=[root.id],change=true;while(change){change=false;a.forEach(x=>{if(ids.includes(x.parentId)&&!ids.includes(x.id)){ids.push(x.id);change=true}})}return a.filter(x=>ids.includes(x.id))}function download(x){let c=x.content instanceof Blob?x.content:new Blob([String(x.content??'')],{type:x.mimeType||'application/octet-stream'}),u=URL.createObjectURL(c),a=document.createElement('a');a.href=u;a.download=x.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function exportProject(p){let items=(await all(FS)).filter(x=>x.projectId===p.id);download({name:p.name+'.axilort-project.json',content:JSON.stringify({project:p,items:items.map(x=>({id:x.id,parentId:x.parentId,name:x.name,kind:x.kind,mimeType:x.mimeType,size:x.size,content:typeof x.content==='string'?x.content:null}))},null,2),mimeType:'application/json'})}
async function remove(x){let a=x.kind==='folder'?descendants(x):[x];if(!confirm('Delete '+x.name+'?'))return;for(let y of a)await del(FS,y.id);toast('Deleted');render()}async function duplicate(x){let y={...x,id:uid(),name:x.name.replace(/(\.[^.]+)$/,'')+' copy'+(x.name.match(/\.[^.]+$/)||''),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};await put(FS,y);toast('Duplicated');render()}
$('list').onclick=async e=>{let more=e.target.closest('.more');if(more){document.querySelectorAll('.menu.show').forEach(x=>x.classList.remove('show'));more.parentElement.querySelector('.menu').classList.add('show');return}let b=e.target.closest('.menu button');if(!b)return;let it=b.closest('.item'),x=cache.find(y=>y.id===it.dataset.id),a=b.dataset.a;document.querySelectorAll('.menu.show').forEach(y=>y.classList.remove('show'));if(a==='export'){x.kind==='project'?exportProject(x):download(x)}else if(a==='open')open(x);else if(a==='rename')openName(x.kind,x);else if(a==='duplicate')duplicate(x);else if(a==='details'){let d=$('details');d.innerHTML='<p><b>Name:</b> '+esc(x.name)+'</p><p><b>Type:</b> '+esc(x.mimeType||x.kind)+'</p><p><b>Size:</b> '+bytes(x.size||0)+'</p><p><b>Storage:</b> axilort-engine-data/projects/'+esc(project?.name||x.name)+'</p>';$('detailsModal').classList.add('show')}else if(a==='delete')remove(x)};
$('list').ondblclick=e=>{let it=e.target.closest('.item');if(!it)return;let x=cache.find(y=>y.id===it.dataset.id);if(x)open(x)};async function open(x){if(x.kind==='project'){project=x;parent=null;render()}else if(x.kind==='folder'){parent=x.id;render()}else if(isText(x)){editing=x;$('editorTitle').textContent=x.name;$('editor').value=typeof x.content==='string'?x.content:'';$('editorModal').classList.add('show')}else download(x)}
$('upload').onchange=async e=>{if(!project)return;for(let f of e.target.files){await put(FS,{id:uid(),projectId:project.id,parentId:parent||null,name:f.name,kind:'file',content:f,mimeType:f.type||'application/octet-stream',size:f.size,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()})}e.target.value='';toast('Files uploaded');render()};$('search').oninput=renderList;$('sort').onchange=renderList;$('view').onclick=()=>{grid=!grid;$('view').textContent=grid?'☷ List':'▦ Grid';renderList()};$('refresh').onclick=render;$('nameCancel').onclick=()=>$('nameModal').classList.remove('show');$('nameSave').onclick=saveName;$('nameInput').onkeydown=e=>{if(e.key==='Enter')saveName();if(e.key==='Escape')$('nameModal').classList.remove('show')};$('editorCancel').onclick=()=>$('editorModal').classList.remove('show');$('editorSave').onclick=async()=>{if(!editing)return;editing.content=$('editor').value;editing.size=new Blob([editing.content]).size;editing.updatedAt=new Date().toISOString();await put(FS,editing);$('editorModal').classList.remove('show');toast('File saved');render()};$('detailsClose').onclick=()=>$('detailsModal').classList.remove('show');document.addEventListener('click',e=>{if(!e.target.closest('.more')&&!e.target.closest('.menu'))document.querySelectorAll('.menu.show').forEach(x=>x.classList.remove('show'))});openDB().then(render).catch(e=>{$('list').innerHTML='<div class="empty"><b>App storage unavailable</b>'+esc(e.message||e)+'</div>'});
</script></body></html>
