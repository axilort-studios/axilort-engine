<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><meta name="description" content="Axilort Engine assets."><title>Assets — Axilort Engine</title><style>:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a,button,input,textarea,select{font:inherit;color:inherit}button{touch-action:manipulation;cursor:pointer}a{text-decoration:none}.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}}.sidebar{width:clamp(100px,15vw,215px);flex:0 0 clamp(100px,15vw,215px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(8px,1.25vw,21px) clamp(7px,1vw,16px);display:flex;flex-direction:column}.brand{display:flex;justify-content:center;padding-bottom:clamp(10px,1.5vw,23px)}.brand img{width:clamp(38px,5vw,84px);height:clamp(38px,5vw,84px);object-fit:contain}.nav{display:flex;flex-direction:column;gap:5px}.nav a{border:1px solid transparent;border-radius:13px;height:clamp(33px,4vw,52px);display:flex;align-items:center;gap:10px;padding:0 12px;font-weight:600;font-size:clamp(9px,1.05vw,15px);color:#ccc;white-space:nowrap}.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}.ico{width:22px;display:grid;place-items:center;color:#eee}.active .ico{color:var(--red)}.version{margin-top:auto;padding:12px;color:#666;font-size:11px;font-weight:600;text-align:center}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:70px;display:flex;align-items:center;justify-content:flex-end;padding:0 25px}.top-action{width:44px;height:44px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center}.top-action:hover{background:#111112}.gear{font-size:26px}.content{padding:27px 30px;overflow:auto;height:100%;scrollbar-width:thin}.welcome{margin-bottom:18px}.welcome h1{font-size:29px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}.welcome h1 span{color:var(--red)}.welcome p{margin:4px 0;color:var(--muted);font-size:14px}.panel{border:1px solid var(--border);border-radius:18px;background:linear-gradient(145deg,#0c0c0d,#080809);overflow:visible}.panelhead{min-height:62px;padding:13px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border2)}.panelhead strong{font-size:17px}.crumb{flex:1;min-width:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.btn,.primary{height:39px;border:1px solid #29292d;border-radius:8px;background:#111;padding:0 15px;font-size:12px;font-weight:750}.primary{border-color:#ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);box-shadow:0 6px 18px rgba(255,32,40,.14)}.btn:hover{background:#171718;border-color:#3b3b40}.searchrow{display:flex;gap:7px;padding:14px;border-bottom:1px solid var(--border2)}.search{height:40px;min-width:0;flex:1;border:1px solid #29292d;border-radius:8px;background:#09090a;padding:0 15px;outline:0;font-size:12px}.search:focus{border-color:#8e161b}.select{height:40px;border:1px solid #29292d;border-radius:8px;background:#09090a;padding:0 12px;font-size:12px}.list{padding:15px;display:grid;grid-template-columns:1fr;gap:9px}.list.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.item{position:relative;min-height:78px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(145deg,#0d0d0e,#080809);display:flex;align-items:center;gap:13px;padding:11px;user-select:none;transition:.15s}.item:hover{border-color:#8e161b;background:#101011;transform:translateY(-1px)}.icon{width:47px;height:47px;flex:none;border:1px solid #29292d;border-radius:11px;background:#0a0a0b;display:grid;place-items:center;color:var(--red);font-size:13px;font-weight:850}.info{min-width:0;flex:1}.info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{display:block;margin-top:4px;color:#68686e;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{width:36px;height:37px;flex:none;border:0;background:transparent;border-radius:7px;color:#aaa;font-size:22px}.more:hover{background:#171718;color:#fff}.menu{position:absolute;right:9px;top:calc(100% - 1px);z-index:20;min-width:180px;padding:5px;border:1px solid #303034;border-radius:10px;background:#0b0b0c;box-shadow:0 20px 60px #000;display:none}.menu.show{display:block}.menu button{display:block;width:100%;height:38px;text-align:left;border:0;border-radius:6px;background:transparent;padding:0 10px;font-size:12px}.menu button:hover{background:#171718}.menu .danger:hover{background:#3b1114;color:#ff686e}.empty{min-height:210px;padding:35px 15px;text-align:center;color:#777;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center}.empty b{color:#ddd;margin-bottom:4px}.hidden{display:none!important}.toast{position:fixed;z-index:500;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;background:#111;border:1px solid #333;border-radius:9px;padding:10px 14px;font-size:10px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px}.content{padding:8px 10px}.welcome{margin-bottom:8px}.welcome h1{font-size:19px}.welcome p{font-size:8px}.panelhead{min-height:43px;padding:6px 8px}.panelhead strong{font-size:11px}.crumb{font-size:8px}.btn,.primary{height:29px;font-size:8px}.searchrow{padding:8px}.search,.select{height:29px;font-size:8px}.list{padding:8px;gap:5px}.item{min-height:46px;padding:6px}.icon{width:29px;height:29px;font-size:7px}.info b{font-size:8px}.info small{font-size:6px}.more{width:25px;height:27px}.empty{min-height:100px;font-size:8px}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a href="projects.html"><span class="ico">□</span>Projects</a><a class="active" href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a></nav><div class="version">Axilort Engine v1.0.0</div></aside><main class="main"><header class="topbar"><a class="top-action" href="settings.html"><span class="gear">⚙</span></a></header><div class="content"><div class="welcome"><h1>Axilort <span>Assets</span></h1><p>Manage your projects, files and game assets.</p></div><section class="panel"><div class="panelhead"><strong id="heading">Projects</strong><div class="crumb" id="crumb">axilort-studios-data/projects/</div><div class="actions" id="actions"></div></div><div class="searchrow"><input class="search" id="search" placeholder="Search files and folders…"><select class="select" id="sort"><option value="name">Name</option><option value="new">Newest</option><option value="old">Oldest</option><option value="size">Size</option><option value="type">Type</option></select><button class="btn" id="view">▦ Grid</button></div><div class="list" id="list"></div></section></div></main></div><input id="upload" type="file" multiple class="hidden"><div class="toast" id="toast"></div><script>const REPO='axilort-studios/axilort-engine',ROOT='axilort-studios-data/projects',DEVICE_ROOT='projects';let project=null,currentPath='',cache=[],grid=false,mode='web';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ext=n=>{let a=n.toLowerCase().split('.');return a.length>1?a.pop():''},bytes=n=>{if(!n)return'0 B';if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(1)+' GB'},isNative=()=>!!window.AxilortStorage,toast=s=>{let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),2200)};async function api(path){let r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path);if(!r.ok)throw Error('GitHub storage error: '+r.status);return r.json()}async function listPath(path){if(mode==='native'){let a=await window.AxilortStorage.list(path||DEVICE_ROOT);return Array.isArray(a)?a:[]}return await api(path||ROOT)}async function readNative(path){return await window.AxilortStorage.read(path)}function icon(x){return'<div class="icon">'+(x.type==='dir'||x.kind==='folder'||x.kind==='project'?'▰':ext(x.name).toUpperCase().slice(0,4)||'FILE')+'</div>'}function row(x){let folder=x.type==='dir'||x.kind==='folder'||x.kind==='project';return'<div class="item" data-path="'+esc(x.path||'')+'" data-name="'+esc(x.name)+'" data-dir="'+(folder?'1':'0')+'">'+icon(x)+'<div class="info"><b>'+esc(x.name)+'</b><small>'+(folder?'Folder':(x.size?bytes(x.size):'File'))+'</small></div><button class="more">⋮</button><div class="menu"><button data-a="open">Open</button><button data-a="export">Export</button><button data-a="details">Details</button></div></div>'}async function render(){try{let path=mode==='native'?(currentPath?DEVICE_ROOT+'/'+currentPath:DEVICE_ROOT):(currentPath?ROOT+'/'+currentPath:ROOT);cache=await listPath(path);$('heading').textContent=currentPath.split('/').filter(Boolean).pop()||'Projects';$('crumb').textContent=path+'/';$('actions').innerHTML=currentPath?'<button class="btn" id="back">← Back</button>':'';if(mode==='native'&&currentPath)$('actions').innerHTML+='<button class="btn" id="folder">+ Folder</button><button class="btn" id="file">+ File</button><button class="primary" id="uploadBtn">Upload</button>';if(currentPath)$('back').onclick=()=>{currentPath=currentPath.split('/').slice(0,-1).join('/');render()};if(mode==='native'&&currentPath){$('folder').onclick=()=>createNative('folder');$('file').onclick=()=>createNative('file');$('uploadBtn').onclick=()=>$('upload').click()}renderList()}catch(e){$('list').innerHTML='<div class="empty"><b>Storage unavailable</b><span>'+esc(e.message||e)+'</span></div>'}}function renderList(){let a=cache.slice();let q=$('search').value.trim().toLowerCase();if(q)a=a.filter(x=>String(x.name).toLowerCase().includes(q));let s=$('sort').value;a.sort((x,y)=>s==='size'?(y.size||0)-(x.size||0):s==='type'?String(x.type||'').localeCompare(String(y.type||'')):String(x.name).localeCompare(String(y.name)));$('list').classList.toggle('grid',grid);$('list').innerHTML=a.length?a.map(row).join(''):'<div class="empty"><b>'+(!currentPath?'No projects':'Folder is empty')+'</b><span>'+(mode==='web'?'Read from axilort-studios-data/projects/.':'Create or upload assets into this project.')+'</span></div>'}async function createNative(kind){let n=prompt('Enter '+kind+' name');if(!n)return;n=n.trim().replace(/[\\/:*?"<>|]/g,'-');if(!n)return;let base=DEVICE_ROOT+'/'+currentPath;if(kind==='folder')await window.AxilortStorage.mkdir(base+'/'+n);else await window.AxilortStorage.write(base+'/'+n,'');toast(kind==='folder'?'Folder created':'File created');render()}async function exportItem(x){if(mode==='web'){if(x.download_url){let r=await fetch(x.download_url);let b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=x.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}else toast('Folder cannot be exported');return}try{let d=await readNative(x.path);let b=d instanceof Blob?d:new Blob([d]);let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=x.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){toast(e.message||'Export failed')}}async function openItem(x){let dir=x.type==='dir'||x.kind==='folder'||x.kind==='project';if(dir){currentPath=x.path?(mode==='web'?x.path.replace(ROOT+'/',''):x.path.replace(DEVICE_ROOT+'/','')):x.name;render()}else exportItem(x)}$('list').onclick=e=>{let m=e.target.closest('.more');if(m){document.querySelectorAll('.menu.show').forEach(x=>x.classList.remove('show'));m.parentElement.querySelector('.menu').classList.add('show');return}let b=e.target.closest('.menu button');if(!b)return;let it=b.closest('.item'),x=cache.find(y=>(y.path||'')===it.dataset.path||y.name===it.dataset.name),a=b.dataset.a;document.querySelectorAll('.menu.show').forEach(y=>y.classList.remove('show'));if(a==='open')openItem(x);else if(a==='export')exportItem(x);else if(a==='details')alert('Name: '+x.name+'\nPath: '+(x.path||'')+'\nType: '+(x.type||x.kind||'file')+'\nSize: '+bytes(x.size||0))};$('list').ondblclick=e=>{let it=e.target.closest('.item');if(it){let x=cache.find(y=>(y.path||'')===it.dataset.path||y.name===it.dataset.name);if(x)openItem(x)}};$('upload').onchange=async e=>{if(mode!=='native'||!currentPath)return;let base=DEVICE_ROOT+'/'+currentPath;for(const f of e.target.files){let data=await f.arrayBuffer();await window.AxilortStorage.write(base+'/'+f.name,new Uint8Array(data))}e.target.value='';toast('Files uploaded');render()};$('search').oninput=renderList;$('sort').onchange=renderList;$('view').onclick=()=>{grid=!grid;$('view').textContent=grid?'☷ List':'▦ Grid';renderList()};document.addEventListener('click',e=>{if(!e.target.closest('.more')&&!e.target.closest('.menu'))document.querySelectorAll('.menu.show').forEach(x=>x.classList.remove('show'))});function enterFullscreen(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{})}catch(e){}try{if(screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}document.addEventListener('pointerdown',enterFullscreen,{once:true,passive:true});window.addEventListener('load',async()=>{mode=isNative()?'native':'web';try{if(mode==='native'&&window.AxilortStorage.mkdir)await window.AxilortStorage.mkdir(DEVICE_ROOT)}catch(e){}try{if(screen.orientation?.type?.startsWith('portrait')&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}render()});</script></body></html>
