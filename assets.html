<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><meta name="description" content="Axilort Engine assets."><title>Assets — Axilort Engine</title><style>:root{--bg:#050505;--panel:#0b0b0c;--border:#242426;--border2:#18181a;--text:#f2f2f3;--muted:#929297;--red:#ff2028}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}a,button,input,textarea,select{font:inherit;color:inherit}button{touch-action:manipulation;cursor:pointer}a{text-decoration:none}.app{position:fixed;inset:0;width:100vw;height:100vh;display:flex;overflow:hidden;background:#050505}@media(orientation:portrait){.app{width:100vh;height:100vw;left:50%;top:50%;right:auto;bottom:auto;inset-inline:auto;inset-block:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}}.sidebar{width:clamp(100px,15vw,215px);flex:0 0 clamp(100px,15vw,215px);border-right:1px solid var(--border2);background:linear-gradient(180deg,#070708,#050505);padding:clamp(8px,1.25vw,21px) clamp(7px,1vw,16px);display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;justify-content:center;padding:0 0 clamp(10px,1.5vw,23px)}.brand img{width:clamp(38px,5vw,84px);height:clamp(38px,5vw,84px);object-fit:contain;flex:none}.nav{display:flex;flex-direction:column;gap:clamp(2px,.4vw,6px)}.nav a{border:1px solid transparent;background:transparent;border-radius:clamp(8px,1vw,13px);height:clamp(33px,4vw,52px);display:flex;align-items:center;gap:clamp(6px,.8vw,13px);padding:0 clamp(7px,.9vw,14px);font-weight:600;font-size:clamp(9px,1.05vw,15px);color:#ccc;text-align:left;cursor:pointer;white-space:nowrap}.nav a:hover{background:#101011}.nav a.active{background:linear-gradient(90deg,rgba(255,32,40,.15),rgba(255,32,40,.055));border-color:#8e161b;color:#fff;box-shadow:inset 2px 0 0 var(--red)}.ico{width:clamp(15px,1.7vw,22px);height:clamp(15px,1.7vw,22px);display:grid;place-items:center;color:#eee;flex:0 0 auto;font-size:clamp(12px,1.35vw,19px)}.active .ico{color:var(--red)}.version{margin-top:auto;padding:clamp(8px,1vw,14px) clamp(7px,.8vw,12px);color:#66666b;font-size:clamp(7px,.8vw,11px);font-weight:600;text-align:center;white-space:nowrap}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:clamp(42px,5.5vw,70px);flex:0 0 clamp(42px,5.5vw,70px);display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(9px,1.7vw,25px)}.top-action{width:clamp(30px,3.8vw,44px);height:clamp(30px,3.8vw,44px);border:0;border-radius:10px;background:transparent;display:grid;place-items:center;cursor:pointer}.top-action:hover{background:#111112}.gear{font-size:clamp(18px,2.25vw,26px);line-height:1;color:#ededee}.content{padding:clamp(9px,1.7vw,27px) clamp(11px,2vw,30px) clamp(9px,1.7vw,26px);overflow:auto;height:100%;scrollbar-width:thin;scrollbar-color:#29292b transparent}.welcome{margin-bottom:clamp(8px,1.15vw,18px)}.welcome h1{font-size:clamp(17px,2.55vw,29px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.035em}.welcome h1 span{color:var(--red)}.welcome p{margin:4px 0 0;color:#929297;font-size:clamp(8px,1.05vw,14px)}.panel{border:1px solid var(--border);border-radius:clamp(10px,1.5vw,18px);background:linear-gradient(145deg,#0c0c0d,#080809);overflow:visible}.panelhead{min-height:clamp(52px,4.5vw,62px);padding:clamp(8px,1vw,13px) clamp(11px,1.3vw,18px);display:flex;align-items:center;gap:clamp(8px,1vw,12px);border-bottom:1px solid var(--border2)}.panelhead strong{font-size:clamp(12px,1.4vw,17px);letter-spacing:-.02em}.crumb{flex:1;min-width:0;color:#929297;font-size:clamp(9px,1vw,12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.btn,.primary{height:clamp(32px,3vw,39px);border:1px solid #29292d;border-radius:8px;background:#111;padding:0 clamp(10px,1.2vw,15px);font-size:clamp(8px,1vw,12px);font-weight:750}.primary{border-color:#ff3b42;background:linear-gradient(180deg,#ff3038,#d9151c);box-shadow:0 6px 18px rgba(255,32,40,.14)}.btn:hover{background:#171718;border-color:#3b3b40}.primary:hover{filter:brightness(1.08)}.searchrow{display:flex;gap:7px;padding:clamp(10px,1.1vw,14px);border-bottom:1px solid var(--border2)}.search{height:clamp(32px,3vw,40px);min-width:0;flex:1;border:1px solid #29292d;border-radius:8px;background:#09090a;padding:0 clamp(10px,1.2vw,15px);outline:0;font-size:clamp(9px,1vw,12px)}.search:focus{border-color:#8e161b;box-shadow:0 0 0 2px rgba(255,32,40,.08)}.select{height:clamp(32px,3vw,40px);border:1px solid #29292d;border-radius:8px;background:#09090a;padding:0 clamp(8px,.9vw,12px);font-size:clamp(9px,1vw,12px);outline:0}.list{padding:clamp(10px,1.1vw,15px);display:grid;grid-template-columns:1fr;gap:clamp(6px,.7vw,9px)}.list.grid{grid-template-columns:repeat(auto-fill,minmax(clamp(150px,17vw,220px),1fr))}.item{position:relative;min-height:clamp(54px,6vw,78px);border:1px solid var(--border);border-radius:clamp(9px,1.2vw,14px);background:linear-gradient(145deg,#0d0d0e,#080809);display:flex;align-items:center;gap:clamp(9px,1vw,13px);padding:clamp(7px,.9vw,11px);user-select:none;transition:.15s}.item:hover{border-color:#8e161b;background:#101011;transform:translateY(-1px)}.icon{width:clamp(34px,3.5vw,47px);height:clamp(34px,3.5vw,47px);flex:none;border:1px solid #29292d;border-radius:clamp(8px,1vw,11px);background:#0a0a0b;display:grid;place-items:center;color:var(--red);font-size:clamp(9px,1vw,13px);font-weight:850}.info{min-width:0;flex:1}.info b{display:block;font-size:clamp(10px,1.15vw,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{display:block;margin-top:4px;color:#68686e;font-size:clamp(8px,.95vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{width:clamp(28px,2.7vw,36px);height:clamp(29px,2.8vw,37px);flex:none;border:0;background:transparent;border-radius:7px;color:#aaa;font-size:clamp(16px,1.7vw,22px)}.more:hover{background:#171718;color:#fff}.menu{position:absolute;right:clamp(6px,.7vw,9px);top:calc(100% - 1px);z-index:20;min-width:clamp(145px,14vw,180px);padding:5px;border:1px solid #303034;border-radius:10px;background:#0b0b0c;box-shadow:0 20px 60px #000;display:none}.menu.show{display:block}.menu button{display:block;width:100%;height:clamp(31px,2.8vw,38px);text-align:left;border:0;border-radius:6px;background:transparent;padding:0 10px;font-size:clamp(9px,.95vw,12px)}.menu button:hover{background:#171718}.menu .danger:hover{background:#3b1114;color:#ff686e}.empty{min-height:clamp(130px,16vw,210px);padding:35px 15px;text-align:center;color:#777;font-size:clamp(9px,1vw,12px);display:flex;flex-direction:column;align-items:center;justify-content:center}.empty b{display:block;color:#ddd;margin-bottom:4px}.hidden{display:none!important}.toast{position:fixed;z-index:500;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;background:#111;border:1px solid #333;border-radius:9px;padding:10px 14px;font-size:10px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-height:360px){.sidebar{width:clamp(90px,16vw,150px);flex-basis:clamp(90px,16vw,150px)}.nav a{height:31px}.brand img{width:36px;height:36px}.content{padding:8px 10px}.item{min-height:50px}.empty{min-height:105px}}@media(max-width:600px) and (orientation:landscape){.sidebar{width:100px;flex-basis:100px}.brand img{width:34px;height:34px}.nav a{height:30px;font-size:8px;gap:5px;padding:0 6px}.version{font-size:7px}.topbar{height:38px;flex-basis:38px}.content{padding:8px 10px}.welcome{margin-bottom:8px}.welcome h1{font-size:19px}.welcome p{font-size:8px}.panelhead{min-height:43px;padding:6px 8px}.panelhead strong{font-size:11px}.crumb{font-size:8px}.btn,.primary{height:29px;font-size:8px}.searchrow{padding:8px}.search,.select{height:29px;font-size:8px}.list{padding:8px;gap:5px}.item{min-height:46px;padding:6px;border-radius:9px}.icon{width:29px;height:29px;font-size:7px}.info b{font-size:8px}.info small{font-size:6px}.more{width:25px;height:27px}.empty{min-height:100px;font-size:8px}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><img src="images/logo.png" alt="Axilort Engine"></div><nav class="nav"><a href="home.html"><span class="ico">⌂</span>Home</a><a href="projects.html"><span class="ico">□</span>Projects</a><a class="active" href="assets.html"><span class="ico">◇</span>Assets</a><a href="settings.html"><span class="ico">⚙</span>Settings</a><a href="team.html"><span class="ico">♙</span>Team</a></nav><div class="version">Axilort Engine v1.0.0</div></aside><main class="main"><header class="topbar"><a class="top-action" href="settings.html"><span class="gear">⚙</span></a></header><div class="content"><div class="welcome"><h1>Axilort <span>Assets</span></h1><p>Manage your projects, files and game assets.</p></div><section class="panel"><div class="panelhead"><strong id="heading">Projects</strong><div class="crumb" id="crumb">axilort-engine-data/projects/</div><div class="actions" id="actions"></div></div><div class="searchrow"><input class="search" id="search" placeholder="Search files and folders…"><select class="select" id="sort"><option value="name">Name</option><option value="new">Newest</option><option value="old">Oldest</option><option value="size">Size</option><option value="type">Type</option></select><button class="btn" id="view">▦ Grid</button></div><div class="list" id="list"></div></section></div></main></div><input id="upload" type="file" multiple class="hidden"><div class="toast" id="toast"></div><script>const DB='axilort-engine-data',PS='projects',FS='assetFiles';let db,project=null,parent=null,cache=[],grid=false;const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ext=n=>{let a=n.toLowerCase().split('.');return a.length>1?a.pop():''},isText=x=>x.mimeType?.startsWith('text/')||x.mimeType?.includes('json')||['html','htm','css','js','json','txt','md','xml','csv','ts','tsx','jsx','gd','shader','glsl'].includes(ext(x.name));function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),2200)}function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains(PS))d.createObjectStore(PS,{keyPath:'id'});if(!d.objectStoreNames.contains(FS)){let s=d.createObjectStore(FS,{keyPath:'id'});s.createIndex('projectId','projectId');s.createIndex('parentId','parentId')}};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}function all(s){return new Promise((r,j)=>{let q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>j(q.error)})}function put(s,x){return new Promise((r,j)=>{let t=db.transaction(s,'readwrite');t.objectStore(s).put(x);t.oncomplete=r;t.onerror=()=>j(t.error)})}function del(s,id){return new Promise((r,j)=>{let t=db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=r;t.onerror=()=>j(t.error)})}function bytes(n){if(!n)return'0 B';if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(1)+' GB'}function icon(x){return'<div class="icon">'+(x.kind==='project'||x.kind==='folder'?'▰':isText(x)?'&lt;/&gt;':ext(x.name).toUpperCase().slice(0,4)||'FILE')+'</div>'}function menu(x){return'<div class="menu"><button data-a="open">Open</button><button data-a="export">Export</button><button data-a="details">Details</button><button class="danger" data-a="delete">Delete</button></div>'}function row(x){return'<div class="item" data-id="'+esc(x.id)+'" data-source="'+esc(x.source||'project')+'">'+icon(x)+'<div class="info"><b>'+esc(x.name)+'</b><small>Folder'+(x.size?' • '+bytes(x.size):'')+'</small></div><button class="more">⋮</button>'+menu(x)+'</div>'}async function render(){let projects=await all(PS),files=await all(FS);if(!project){$('heading').textContent='Projects';$('crumb').textContent='axilort-engine-data/projects/';$('actions').innerHTML='';cache=projects.map(p=>({...p,kind:'project',source:'project'})).concat(files.filter(x=>!x.projectId).map(x=>({...x,source:'file'})));}else{$('heading').textContent=project.name;$('crumb').textContent='axilort-engine-data/projects/'+project.name+'/' + (parent?'…':'');$('actions').innerHTML='<button class="btn" id="back">← Back</button><button class="btn" id="folder">+ Folder</button><button class="btn" id="file">+ File</button><button class="primary" id="uploadBtn">Upload</button>';cache=files.filter(x=>x.projectId===project.id);$('back').onclick=()=>{if(parent){let f=cache.find(x=>x.id===parent);parent=f?.parentId||null}else{project=null;parent=null}render()};$('folder').onclick=()=>create('folder');$('file').onclick=()=>create('file');$('uploadBtn').onclick=()=>$('upload').click()}renderList()}function renderList(){let a=cache.filter(x=>(x.parentId||null)===(parent||null));let q=$('search').value.trim().toLowerCase();if(q)a=a.filter(x=>x.name.toLowerCase().includes(q));let s=$('sort').value;a.sort((x,y)=>s==='size'?(y.size||0)-(x.size||0):s==='new'?String(y.createdAt).localeCompare(String(x.createdAt)):s==='old'?String(x.createdAt).localeCompare(String(y.createdAt)):s==='type'?String(x.mimeType||x.kind).localeCompare(String(y.mimeType||y.kind)):x.name.localeCompare(y.name));$('list').classList.toggle('grid',grid);$('list').innerHTML=a.length?a.map(row).join(''):'<div class="empty"><b>'+(!project?'No files or folders':'Folder is empty')+'</b><span>'+(!project?'No entries exist in axilort-engine-data/projects/.':'Create a folder, file, or upload an asset.')+'</span></div>'}async function create(kind){if(!project)return;let n=prompt('Enter '+kind+' name');if(!n)return;n=n.trim().replace(/[\\/:*?"<>|]/g,'-');if(!n)return;await put(FS,{id:uid(),projectId:project.id,parentId:parent||null,name:n,kind,mimeType:kind==='file'?'text/plain':'application/octet-stream',content:'',size:0,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});toast(kind==='folder'?'Folder created':'File created');render()}function download(x){let c=x.content instanceof Blob?x.content:new Blob([String(x.content??'')],{type:x.mimeType||'application/octet-stream'}),u=URL.createObjectURL(c),a=document.createElement('a');a.href=u;a.download=x.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function descendants(root){let a=cache,ids=[root.id],change=true;while(change){change=false;a.forEach(x=>{if(ids.includes(x.parentId)&&!ids.includes(x.id)){ids.push(x.id);change=true}})}return a.filter(x=>ids.includes(x.id))}async function remove(x){if(x.kind==='project'){if(!confirm('Delete project '+x.name+'?'))return;for(const y of descendants(x))await del(FS,y.id);await del(PS,x.id);toast('Project deleted');return render()}if(!confirm('Delete '+x.name+'?'))return;for(const y of x.kind==='folder'?descendants(x):[x])await del(FS,y.id);toast('Deleted');render()}async function duplicate(x){if(x.kind==='project')return;await put(FS,{...x,id:uid(),name:x.name.replace(/(\.[^.]+)$/,'')+' copy'+(x.name.match(/\.[^.]+$/)||''),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});toast('Duplicated');render()}async function open(x){if(x.kind==='project'){project=x;parent=null;return render()}if(x.kind==='folder'){parent=x.id;return render()}download(x)}$('list').onclick=e=>{let m=e.target.closest('.more');if(m){document.querySelectorAll('.menu.show').forEach(x=>x.classList.remove('show'));m.parentElement.querySelector('.menu').classList.add('show');return}let b=e.target.closest('.menu button');if(!b)return;let it=b.closest('.item'),x=cache.find(y=>y.id===it.dataset.id),a=b.dataset.a;document.querySelectorAll('.menu.show').forEach(y=>y.classList.remove('show'));if(a==='open')open(x);else if(a==='export')download(x);else if(a==='details')alert('Name: '+x.name+'\nPath: axilort-engine-data/projects/'+(project?project.name+'/':'')+x.name+'\nType: '+(x.kind==='project'||x.kind==='folder'?'Folder':x.mimeType||'File')+'\nSize: '+bytes(x.size||0));else if(a==='delete')remove(x)};$('list').ondblclick=e=>{let it=e.target.closest('.item');if(it){let x=cache.find(y=>y.id===it.dataset.id);if(x)open(x)}};$('upload').onchange=async e=>{if(!project)return;for(const f of e.target.files)await put(FS,{id:uid(),projectId:project.id,parentId:parent||null,name:f.name,kind:'file',content:f,mimeType:f.type||'application/octet-stream',size:f.size,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});e.target.value='';toast('Files uploaded');render()};$('search').oninput=renderList;$('sort').onchange=renderList;$('view').onclick=()=>{grid=!grid;$('view').textContent=grid?'☷ List':'▦ Grid';renderList()};document.addEventListener('click',e=>{if(!e.target.closest('.more')&&!e.target.closest('.menu'))document.querySelectorAll('.menu.show').forEach(x=>x.classList.remove('show'))});function enterFullscreen(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{})}catch(e){}try{if(screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}document.addEventListener('pointerdown',enterFullscreen,{once:true,passive:true});window.addEventListener('load',()=>{try{if(screen.orientation?.type?.startsWith('portrait')&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}});openDB().then(render).catch(e=>$('list').innerHTML='<div class="empty"><b>App storage unavailable</b>'+esc(e.message||e)+'</div>');</script></body></html>
