<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Axilort Engine — Assets</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070708;color:#f2f2f3;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-columns:52px 245px 1fr;grid-template-rows:46px 1fr}.sidebar{grid-row:1/3;border-right:1px solid #242426;background:#080809;display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:7px}.logo{width:34px;height:34px;border:1px solid #2b2b2e;border-radius:9px;display:grid;place-items:center;font-weight:900;color:#ff2028;margin-bottom:10px}.nav{width:36px;height:36px;border:1px solid transparent;border-radius:8px;background:transparent;color:#888}.nav:hover,.nav.active{background:#151517;border-color:#29292c;color:#fff}.nav.active{box-shadow:inset 2px 0 #ff2028}.top{grid-column:2/4;border-bottom:1px solid #242426;background:#09090a;display:flex;align-items:center;padding:0 11px;gap:8px}.brand{font-size:12px;font-weight:800;white-space:nowrap}.crumb{font-size:11px;color:#777}.spacer{flex:1}.top button,.toolbar button{background:#111113;border:1px solid #29292c;color:#ddd;border-radius:6px;padding:6px 9px;font-size:11px}.top button:hover,.toolbar button:hover{border-color:#555;color:#fff}.left{grid-column:2;border-right:1px solid #242426;background:#0b0b0c;display:flex;flex-direction:column;min-width:0}.panel-head{height:35px;flex:none;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #202023;text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:800;color:#aaa}.panel-head button{border:0;background:transparent;color:#999;font-size:16px}.search{padding:7px;border-bottom:1px solid #202023}.search input{width:100%;background:#111113;border:1px solid #29292c;color:#ddd;border-radius:6px;padding:7px 8px;font-size:11px;outline:0}.list{padding:6px;overflow:auto;flex:1}.item{display:flex;align-items:center;gap:8px;min-height:34px;padding:5px 7px;border-radius:6px;color:#bbb;font-size:11px;user-select:none}.item:hover,.item.selected{background:#171719;color:#fff}.icon{width:18px;text-align:center}.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.more{border:0;background:transparent;color:#777;opacity:0}.item:hover .more{opacity:1}.empty{padding:30px 12px;text-align:center;color:#666;font-size:11px}.center{grid-column:3;min-width:0;display:grid;grid-template-rows:38px 38px 1fr}.bar{display:flex;align-items:center;padding:0 10px;gap:7px;border-bottom:1px solid #242426;background:#0b0b0c}.path{font:11px monospace;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.content{padding:14px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.card{min-height:105px;border:1px solid #252528;background:#0d0d0f;border-radius:9px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}.card:hover,.card.selected{border-color:#555;background:#141416}.card-icon{font-size:30px}.card-name{font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.editor{position:fixed;inset:0;background:#070708;display:none;z-index:30;grid-template-rows:45px 1fr}.editor.show{display:grid}.editor-head{display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #242426}.editor-title{font-size:11px;font-weight:700;flex:1}.code{width:100%;height:100%;border:0;outline:0;resize:none;background:#080809;color:#ddd;padding:15px;font:12px/1.7 monospace}.toast{position:fixed;bottom:15px;right:15px;background:#171719;border:1px solid #303034;border-radius:8px;padding:8px 11px;font-size:11px;display:none;z-index:80}@media(max-width:700px){.app{grid-template-columns:44px 1fr}.top{grid-column:2}.left{position:fixed;left:44px;top:46px;bottom:0;width:220px;z-index:20;display:none;box-shadow:15px 0 35px #0009}.left.show{display:flex}.brand,.crumb{display:none}.center{grid-column:2}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="logo">A</div><button class="nav" onclick="location.href='home.html'">⌂</button><button class="nav" onclick="location.href='projects.html'">▦</button><button class="nav active">◫</button><button class="nav" onclick="location.href='settings.html'">⚙</button></aside>
<header class="top"><span class="brand">AXILORT ENGINE</span><span class="crumb"> / Assets / <b id="heading">Projects</b></span><span class="spacer"></span><button id="mobileBtn">☰</button></header>
<section class="left" id="left"><div class="panel-head"><span>Project Files</span><button id="newFolder">+</button></div><div class="search"><input id="search" placeholder="Search files and folders"></div><div class="list" id="sideList"></div></section>
<main class="center"><div class="bar"><button id="back">←</button><button id="folderBtn">+ Folder</button><button id="fileBtn">+ File</button><button id="uploadBtn">Upload</button><span class="path" id="path">axilort-engine-data/projects/</span><input id="upload" type="file" multiple hidden></div><div class="content"><div class="grid" id="grid"></div></div></main>
</div>
<div class="editor" id="editor"><div class="editor-head"><button id="closeEditor">← Back</button><span class="editor-title" id="editorTitle"></span><button id="saveFile">Save</button></div><textarea class="code" id="code" spellcheck="false"></textarea></div>
<div class="toast" id="toast"></div>
<script>
/* Device-only storage. The packaged Axilort app supplies window.AxilortStorage.
   It must expose: list(path), read(path), write(path,data), mkdir(path), remove(path).
   All paths are app-private and rooted at axilort-engine-data. No IndexedDB. */
const ROOT='axilort-engine-data/projects/';let current=ROOT,stack=[],entries=[],selected=null,editing=null;
const $=id=>document.getElementById(id),toast=t=>{const x=$("toast");x.textContent=t;x.style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>x.style.display='none',1800)};
function storage(){if(window.AxilortStorage)return window.AxilortStorage;throw new Error('Axilort device storage is unavailable. This page must run inside the packaged Axilort Engine app.');}
function clean(p){return p.replace(/\\/g,'/').replace(/\/+/g,'/').replace(/^\/+|\/+$/g,'')+'/'}
async function list(path){let a=await storage().list(clean(path));return Array.isArray(a)?a:[]}
function normalize(e,parent){if(typeof e==='string')return {name:e,path:clean(parent)+e,type:'file'};return {...e,name:e.name||e.path?.split('/').filter(Boolean).pop()||'Unnamed',path:e.path||clean(parent)+(e.name||''),type:e.type||e.kind||(e.isDirectory?'directory':'file')};}
function isDir(e){return ['directory','dir','folder'].includes(String(e.type).toLowerCase())||e.isDirectory===true}
async function refresh(){try{entries=(await list(current)).map(e=>normalize(e,current));render()}catch(e){toast(e.message)}}
function render(){const q=$("search").value.trim().toLowerCase();const shown=entries.filter(e=>(e.name||'').toLowerCase().includes(q));$("path").textContent=current;$("heading").textContent=current===ROOT?'Projects':current.split('/').filter(Boolean).pop();const html=shown.map((e,i)=>`<div class="card ${selected===e.path?'selected':''}" data-i="${i}" data-path="${esc(e.path)}"><div class="card-icon">${isDir(e)?'▰':'▤'}</div><div class="card-name">${esc(e.name)}</div></div>`).join('');$("grid").innerHTML=html||'<div class="empty">This folder is empty</div>';$("sideList").innerHTML=shown.map((e,i)=>`<div class="item ${selected===e.path?'selected':''}" data-i="${i}" data-path="${esc(e.path)}"><span class="icon">${isDir(e)?'▰':'▤'}</span><span class="name">${esc(e.name)}</span></div>`).join('')||'<div class="empty">No files</div>';document.querySelectorAll('[data-path]').forEach(x=>{x.ondblclick=()=>openEntry(shown[+x.dataset.i]);x.onclick=()=>{selected=x.dataset.path;render()}})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function openEntry(e){if(!e)return;if(isDir(e)){stack.push(current);current=clean(e.path);selected=null;await refresh();return}await openFile(e)}
async function openFile(e){try{const data=await storage().read(e.path);let text=typeof data==='string'?data:new TextDecoder().decode(data instanceof ArrayBuffer?new Uint8Array(data):data);editing=e.path;$("editorTitle").textContent=e.name;$("code").value=text;$("editor").classList.add('show')}catch(err){toast('Cannot read file: '+err.message)}}
$("saveFile").onclick=async()=>{if(!editing)return;try{await storage().write(editing,$("code").value);toast('Saved');}catch(e){toast('Save failed: '+e.message)}};
$("closeEditor").onclick=()=>{$("editor").classList.remove('show');editing=null;refresh()};
$("back").onclick=async()=>{if(current===ROOT){toast('Already at projects');return}current=stack.pop()||ROOT;selected=null;await refresh()};
$("search").oninput=render;
$("newFolder").onclick=async()=>{const name=prompt('Folder name');if(!name)return;try{await storage().mkdir(clean(current)+name);toast('Folder created');refresh()}catch(e){toast('Create failed: '+e.message)}};
$("folderBtn").onclick=()=>$("newFolder").click();
$("fileBtn").onclick=async()=>{const name=prompt('File name');if(!name)return;try{const p=clean(current)+name;await storage().write(p,'');toast('File created');refresh()}catch(e){toast('Create failed: '+e.message)}};
$("uploadBtn").onclick=()=>$("upload").click();
$("upload").onchange=async ev=>{try{for(const f of ev.target.files){const p=clean(current)+f.name;await storage().write(p,await f.arrayBuffer())}toast('Uploaded');refresh()}catch(e){toast('Upload failed: '+e.message)}ev.target.value=''};
$("mobileBtn").onclick=()=>$("left").classList.toggle('show');
refresh();
</script>
</body>
</html>
